:67.57,"i":12},{"t":73.16,"i":13},{"t":75.56,"i":14},{"t":82.32,"i":15},{"t":90.08,"i":16},{"t":95.14,"i":17},{"t":101.3,"i":18},{"t":106.08,"i":19},{"t":113.08,"i":20},{"t":118.82,"i":21},{"t":123.88,"i":22},{"t":131.29,"i":23},{"t":137.96,"i":24},{"t":144.54,"i":39},{"t":151.31,"i":0},{"t":159.7,"i":1},{"t":165.11,"i":2},{"t":172.64,"i":5},{"t":178.99,"i":6},{"t":186.46,"i":7},{"t":190.7,"i":8},{"t":194.69,"i":9},{"t":201.67,"i":10},{"t":210.92,"i":11},{"t":218.27,"i":12},{"t":225.37,"i":13},{"t":228.52,"i":14},{"t":237.05,"i":16},{"t":243.5,"i":17},{"t":251.31,"i":18},{"t":257.39,"i":19},{"t":266.21,"i":20},{"t":273.47,"i":21},{"t":279.92,"i":22},{"t":289.24,"i":23},{"t":297.65,"i":25},{"t":303.21,"i":26},{"t":307.81,"i":27},{"t":313.35,"i":28},{"t":318.55,"i":29},{"t":325.2,"i":30},{"t":332.23,"i":31},{"t":340.85,"i":32},{"t":347.47,"i":33},{"t":354.65,"i":34},{"t":360.72,"i":35},{"t":367.87,"i":36},{"t":373.87,"i":37},{"t":383.02,"i":38}],"count":40},{"id":29,"title":"换座位","sub":"Changing Seats","desc":"老师宣布换座位，有人欢喜有人愁","audio":"audio/talk29.mp3","duration":380.2,"size":2281628,"lines":[{"en":"Big news, Mia. Mr. Lee announced a seat change. My whole world is about to end.","zh":"大新闻，Mia。李老师宣布要换座位。我的整个世界都要塌了。","w":"A"},{"en":"A seat change? That's not world-ending. That's... Tuesday.","zh":"换座位？那不至于世界末日。那只是……一个普通周二。","w":"B"},{"en":"You don't understand. I've had the corner seat by the window for two months. Two months!","zh":"你不懂。靠窗的角落座位我坐两个月了。两个月！","w":"A"},{"en":"Seat changes. The teacher calls it 'a fresh start'. The students call it 'the end of civilization'. Today, Jake's precious window seat is on the line.","zh":"换座位。老师管这叫'重新开始'。同学们管这叫'文明终结'。今天，Jake 心爱的靠窗座位岌岌可危。","w":"H"},{"en":"But as it turns out, the new arrangement has a surprise in store.","zh":"不过事实证明，新座位安排藏着个惊喜。","w":"H"},{"en":"Why are you so attached to that seat anyway?","zh":"你怎么那么舍不得那个座位？","w":"B"},{"en":"The light is perfect for napping — I mean, studying. And I can see the sports field.","zh":"那里的光线特别适合打盹——我是说学习。而且能看见操场。","w":"A"},{"en":"You can see the sports field from a window seat in the back corner? During class?","zh":"上课时，你从后排靠窗的座位能看见操场？","w":"B"},{"en":"I said I can see it. I didn't say I look at it. Much.","zh":"我说的是能看见。没说我老看。没怎么看。","w":"A"},{"en":"Right. Well, maybe the new seat will be good for you.","zh":"行。也许新座位对你有好处。","w":"B"},{"en":"Unless it's front row center. Then it's over for me and my quiet napping career.","zh":"除非是正中间第一排。那我的安静打盹生涯就彻底完了。","w":"A"},{"en":"Front row is actually great for grades. You can't zone out when the teacher is two feet away.","zh":"第一排其实对成绩特别好。老师就在两尺外，你想走神都难。","w":"B"},{"en":"Exactly my point. That's the problem.","zh":"这正是问题所在。","w":"A"},{"en":"The new seating chart went up. Here's where everyone landed.","zh":"新座位表贴出来了。看看大家都坐哪儿。","w":"H"},{"en":"So? Where did they put you?","zh":"所以呢？把你分到哪儿了？","w":"B"},{"en":"Window seat. Still. Different window, but still a window.","zh":"靠窗。还是靠窗。换了扇窗，但还是窗。","w":"A"},{"en":"See? Not world-ending. Now, who's next to you?","zh":"看吧？不是世界末日。那你旁边是谁？","w":"B"},{"en":"That's the surprise. It's you. They put us together.","zh":"惊喜就在这。是你。咱俩被分到一起了。","w":"A"},{"en":"Me? We're desk mates now?","zh":"我？咱俩现在是同桌了？","w":"B"},{"en":"Desk mates. Front of the class is safe, my napping days are not over, and my desk mate is my best friend.","zh":"同桌。讲台前安全了，我的打盹生涯保住了，同桌还是我最好的朋友。","w":"A"},{"en":"That's suspiciously lucky. Did you bribe someone?","zh":"这也太走运了。你是不是贿赂谁了？","w":"B"},{"en":"I'd never. Though I did help Mr. Lee carry some books yesterday, completely by coincidence.","zh":"我才不会。虽然昨天我'碰巧'帮李老师搬了几本书，纯属巧合。","w":"A"},{"en":"Jake. What did you do?","zh":"Jake。你干了什么？","w":"B"},{"en":"Nothing! I just... mentioned how well we study together. As friends. For science.","zh":"没什么！我只是……提了提咱俩一起学习效率多高。作为朋友。为了学习。","w":"A"},{"en":"Slow down. Here are the lines that come with every new seating chart.","zh":"放慢。来听几句每次换座位都会出现的表达。","w":"H"},{"en":"Mr. Lee announced a seat change.","zh":"李老师宣布要换座位。","w":"H"},{"en":"Why are you so attached to that seat?","zh":"你怎么那么舍不得那个座位？","w":"H"},{"en":"Where did they put you?","zh":"把你分到哪儿了？","w":"H"},{"en":"We're desk mates now.","zh":"咱俩现在是同桌了。","w":"H"},{"en":"My whole world is about to end.","zh":"我的整个世界都要塌了（夸张）。","w":"H"},{"en":"That's just Tuesday.","zh":"那只是个普通周二。","w":"H"},{"en":"The light is perfect for napping.","zh":"那光线特别适合打盹。","w":"H"},{"en":"Unless it's front row center.","zh":"除非是正中间第一排。","w":"H"},{"en":"You can't zone out when...","zh":"当……的时候你想走神都难。","w":"H"},{"en":"That's suspiciously lucky.","zh":"这也太走运了。","w":"H"},{"en":"Completely by coincidence.","zh":"纯属巧合。","w":"H"},{"en":"For science.","zh":"为了学习（开玩笑）。","w":"H"},{"en":"Your turn: in English, describe your ideal seat in a classroom, and give one reason why it's the best spot.","zh":"轮到你了：用英语描述你在教室里理想的位置，并给出一个它是最好的理由。","w":"H"},{"en":"Tomorrow, we go to the quietest place in school — and try very hard not to get kicked out of it. See you on the next walk!","zh":"明天，我们走进学校最安静的地方——然后拼命不让自己被赶出来。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.19,"i":1},{"t":12.48,"i":2},{"t":18.71,"i":3},{"t":31.77,"i":4},{"t":37.25,"i":5},{"t":40.58,"i":6},{"t":46.43,"i":7},{"t":52.02,"i":8},{"t":56.51,"i":9},{"t":61.09,"i":10},{"t":66.85,"i":11},{"t":73.52,"i":12},{"t":76.83,"i":13},{"t":82.64,"i":14},{"t":85.83,"i":15},{"t":90.89,"i":16},{"t":96.19,"i":17},{"t":100.34,"i":18},{"t":103.49,"i":19},{"t":111.57,"i":20},{"t":115.82,"i":21},{"t":122.56,"i":22},{"t":125.58,"i":23},{"t":132.32,"i":24},{"t":138.81,"i":39},{"t":145.58,"i":0},{"t":153.39,"i":1},{"t":161.32,"i":2},{"t":169.18,"i":5},{"t":173.49,"i":6},{"t":180.89,"i":7},{"t":187.96,"i":8},{"t":193.69,"i":9},{"t":199.53,"i":10},{"t":206.81,"i":11},{"t":215.25,"i":12},{"t":219.53,"i":14},{"t":223.65,"i":15},{"t":230.07,"i":16},{"t":236.8,"i":17},{"t":242.12,"i":18},{"t":246.19,"i":19},{"t":256.35,"i":20},{"t":261.76,"i":21},{"t":270.27,"i":22},{"t":274.22,"i":23},{"t":282.73,"i":25},{"t":288.57,"i":26},{"t":294.45,"i":27},{"t":299.17,"i":28},{"t":304.13,"i":29},{"t":311.81,"i":30},{"t":318.5,"i":31},{"t":326.42,"i":32},{"t":333.96,"i":33},{"t":340.61,"i":34},{"t":348.14,"i":35},{"t":355.68,"i":36},{"t":361.85,"i":37},{"t":370.33,"i":38}],"count":40},{"id":30,"title":"图书馆借书","sub":"The Library","desc":"在图书馆找书、借书，还差点闹笑话","audio":"audio/talk30.mp3","duration":383.0,"size":2298620,"lines":[{"en":"Okay, Mia. The library. I'm here. What am I supposed to be looking for again?","zh":"好，Mia。图书馆。我到了。我到底要找什么来着？","w":"A"},{"en":"A book. For the English report. You said you'd start today, remember?","zh":"一本书。为了英语报告。你说今天开始，记得吗？","w":"B"},{"en":"I remember saying it. I didn't remember it being today.","zh":"我记得我说过。我不记得是今天。","w":"A"},{"en":"The school library. Rows of books, soft whispers, and that one librarian who can hear a candy wrapper from across the room. Today, Jake has a report to write.","zh":"学校图书馆。一排排书，轻声细语，还有一位隔着半个房间都能听见糖纸声的图书管理员。今天，Jake 有份报告要写。","w":"H"},{"en":"Mia is here to make sure he actually finds a book instead of just finding the comfy chair.","zh":"Mia 在这儿，是为了确保他真的找到一本书，而不是只找到那张舒服的椅子。","w":"H"},{"en":"First, what's your report about?","zh":"首先，你的报告写什么？","w":"B"},{"en":"Any book. The teacher said 'something you've actually read' — which is where it gets tricky.","zh":"随便什么书。老师说'得是你真读过的'——问题就出在这儿。","w":"A"},{"en":"So we need something short, interesting, and finishable in one week.","zh":"所以我们要找一本短的、有趣的、一周能读完的。","w":"B"},{"en":"Short, interesting, and doesn't make me fall asleep. That's the dream.","zh":"短、有趣、还不会让我睡着。这就是理想。","w":"A"},{"en":"Try the adventure section. Those books grab you fast.","zh":"去冒险类书架看看。那类书一开始就抓人。","w":"B"},{"en":"Adventure. Okay. Wait — is this one about a kid who finds a map? I think I've heard of it.","zh":"冒险类。好。等等——这本是讲一个孩子找到张地图的吗？我好像听说过。","w":"A"},{"en":"That sounds perfect. Read the back cover. It usually sells the whole book in two lines.","zh":"那太合适了。读读封底。封底两句话就能把整本书推销给你。","w":"B"},{"en":"'One ordinary boy. One impossible map. One summer to save a lost world.' Okay, I'm in.","zh":"'一个普通男孩。一张不可能的地图。一个夏天，拯救一个失落的世界。'好，我决定看这本。","w":"A"},{"en":"Told you. Back cover magic.","zh":"早跟你说了。封底的魔力。","w":"B"},{"en":"The hard part was next: actually checking the book out. Here's what happened at the desk.","zh":"接下来才是难点：真正把书借出去。听听在借阅台发生了什么。","w":"H"},{"en":"I'm at the desk. The librarian asked for my card, and I panicked. I think I gave her my bus card.","zh":"我到借阅台了。管理员问我要借书证，我一慌，好像把公交卡递过去了。","w":"A"},{"en":"Your bus card? To check out a library book?","zh":"公交卡？拿去借图书馆的书？","w":"B"},{"en":"In my defense, they're both blue. And rectangular. And I was nervous.","zh":"替自己说句公道话，两张都是蓝色的。都是长方形。而且我紧张。","w":"A"},{"en":"What did she say?","zh":"她说什么了？","w":"B"},{"en":"She didn't even blink. Just said, 'That won't get you on the number seven bus, dear. Library card, please.'","zh":"她眼睛都没眨一下。就说：'亲爱的，这个可上不了七路公交。请拿借书证。'","w":"A"},{"en":"She sounds great, honestly.","zh":"听起来这位管理员挺有意思。","w":"B"},{"en":"She's seen it all. Anyway, I got the book. Two weeks, she said. 'Bring it back or the fine finds you.'","zh":"她什么没见过。总之我借到了。两周，她说。'按时还，不然罚金会自己找上门。'","w":"A"},{"en":"I like her already. Now let's find a quiet corner and start chapter one.","zh":"我已经喜欢上她了。现在找个安静的角落，从第一章开始。","w":"B"},{"en":"Slow it down. Here are the phrases you'll need at your own library.","zh":"放慢。来听几句你在图书馆会需要的表达。","w":"H"},{"en":"What am I supposed to be looking for?","zh":"我到底要找什么？","w":"H"},{"en":"Try the adventure section.","zh":"去冒险类书架看看。","w":"H"},{"en":"Read the back cover.","zh":"读读封底。","w":"H"},{"en":"Checking out a book.","zh":"借一本书。","w":"H"},{"en":"What am I supposed to be looking for?","zh":"我到底要找什么？","w":"H"},{"en":"Where it gets tricky.","zh":"问题就出在这儿。","w":"H"},{"en":"Those books grab you fast.","zh":"那类书一开始就抓人。","w":"H"},{"en":"I'm in.","zh":"我决定看这个 / 我参加。","w":"H"},{"en":"Back cover magic.","zh":"封底的魔力。","w":"H"},{"en":"In my defense.","zh":"替自己说句公道话。","w":"H"},{"en":"She didn't even blink.","zh":"她眼睛都没眨一下。","w":"H"},{"en":"Bring it back or the fine finds you.","zh":"按时还，不然罚金找上门。","w":"H"},{"en":"Your turn: in English, describe a book you'd recommend, in two sentences, like you're reading its back cover.","zh":"轮到你了：用英语推荐一本书，用两句话，就像在念它的封底介绍。","w":"H"},{"en":"Tomorrow, it's your day to hold the chalk — and the whole class is watching. See you on the next walk!","zh":"明天，轮到你去擦黑板——全班都看着呢。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.05,"i":1},{"t":11.92,"i":2},{"t":15.98,"i":3},{"t":29.08,"i":4},{"t":35.73,"i":5},{"t":38.95,"i":6},{"t":45.04,"i":7},{"t":50.51,"i":8},{"t":55.93,"i":9},{"t":60.71,"i":10},{"t":67.95,"i":11},{"t":74.98,"i":12},{"t":82.3,"i":13},{"t":85.8,"i":14},{"t":93.65,"i":15},{"t":100.61,"i":16},{"t":104.52,"i":17},{"t":110.21,"i":18},{"t":112.2,"i":19},{"t":120.45,"i":20},{"t":123.4,"i":21},{"t":131.27,"i":22},{"t":137.53,"i":23},{"t":143.73,"i":38},{"t":150.5,"i":0},{"t":158.14,"i":1},{"t":165.57,"i":2},{"t":170.77,"i":5},{"t":174.93,"i":6},{"t":182.65,"i":7},{"t":189.57,"i":8},{"t":196.45,"i":9},{"t":202.53,"i":10},{"t":211.66,"i":11},{"t":220.53,"i":12},{"t":229.74,"i":13},{"t":234.24,"i":15},{"t":243.01,"i":16},{"t":248.04,"i":17},{"t":255.22,"i":18},{"t":257.9,"i":19},{"t":268.26,"i":20},{"t":272.08,"i":21},{"t":281.98,"i":22},{"t":289.92,"i":24},{"t":295.69,"i":25},{"t":300.99,"i":26},{"t":305.85,"i":27},{"t":310.62,"i":28},{"t":318.78,"i":29},{"t":325.36,"i":30},{"t":332.96,"i":31},{"t":338.2,"i":32},{"t":344.92,"i":33},{"t":351.23,"i":34},{"t":358.12,"i":35},{"t":366.37,"i":36},{"t":374.78,"i":37}],"count":39},{"id":31,"title":"值日生","sub":"On Duty","desc":"轮到值日，擦黑板、扫地、倒垃圾的日常","audio":"audio/talk31.mp3","duration":376.9,"size":2262188,"lines":[{"en":"Mia, remind me — whose turn is it to be on duty today?","zh":"Mia，提醒我一下——今天轮到谁值日？","w":"A"},{"en":"Yours, Jake. It's literally written on the board. In your handwriting.","zh":"你的，Jake。黑板上明明白白写着呢。还是你本人的笔迹。","w":"B"},{"en":"I wrote that last week. It felt like a future-me problem. Future-me is now current-me, and I regret everything.","zh":"那是我上周写的。当时觉得是'未来的我'的事。现在'未来的我'成了'现在的我'，我后悔极了。","w":"A"},{"en":"Being on duty. Someone has to wipe the board, sweep the floor, and take out the trash. Today, that someone is Jake — and he has a plan to make it painless.","zh":"值日。总得有人擦黑板、扫地、倒垃圾。今天，那个人是 Jake——而他有个让这事变轻松的计划。","w":"H"},{"en":"Spoiler: the plan involves a lot of complaining, and one very small epiphany.","zh":"剧透：这个计划包含大量抱怨，以及一个非常微小的顿悟。","w":"H"},{"en":"So what's the duty list today?","zh":"今天值日要干什么？","w":"B"},{"en":"Wipe the board, sweep, and empty the bins. The unholy trinity.","zh":"擦黑板、扫地、倒垃圾桶。噩梦三件套。","w":"A"},{"en":"That's like fifteen minutes of work. You're acting like it's a marathon.","zh":"那也就十五分钟的活儿。你搞得跟跑马拉松似的。","w":"B"},{"en":"Fifteen minutes? Have you ever swept this classroom? The dust here has its own zip code.","zh":"十五分钟？你扫过这间教室吗？这里的灰尘都有自己的邮编了。","w":"A"},{"en":"Okay, here's a trick. Do the board first, while everyone's packing up. By the time they leave, that's done.","zh":"行，教你一招。先擦黑板，趁大家收拾东西的时候。等他们走了，黑板也擦完了。","w":"B"},{"en":"That's... actually smart. Then the floor is empty and I can sweep in peace.","zh":"这……确实聪明。然后地上没人了，我可以安心扫地。","w":"A"},{"en":"Exactly. And the bins last, on your way out. No backtracking.","zh":"没错。垃圾桶最后倒，正好顺路出去。不用来回跑。","w":"B"},{"en":"You've clearly done this a thousand times.","zh":"你显然干过一千回了。","w":"A"},{"en":"I used to be on duty with my old desk mate, who vanished every single time. I learned to do it fast and alone.","zh":"我以前跟旧同桌一起值日，那人每次都溜号。我只好练出一手又快又独的活儿。","w":"B"},{"en":"Fifteen minutes later, the classroom is spotless, and Jake found his epiphany in a dustpan.","zh":"十五分钟后，教室一尘不染，而 Jake 在簸箕里找到了他的顿悟。","w":"H"},{"en":"See? All done. And you still made it home for dinner.","zh":"看吧？全干完了。你还赶得上回家吃晚饭。","w":"B"},{"en":"I hate to admit it, but doing it in the right order made it feel... easy.","zh":"我不想承认，但按正确顺序干，确实……挺轻松。","w":"A"},{"en":"Everything's easier with a plan. Even sweeping.","zh":"凡事有计划就轻松。连扫地都是。","w":"B"},{"en":"Okay, wise one. Next time it's my duty day, I'm using your system.","zh":"行，智者大人。下次我值日，就用你那套方法。","w":"A"},{"en":"Next time, just don't write your own name on the board in advance. That's how they get you.","zh":"下次，别提前把自己的名字写上黑板。他们就是这么逮住你的。","w":"B"},{"en":"Lesson learned. Future-me can take care of future-me.","zh":"教训记住了。'未来的我'就交给'未来的我'去操心吧。","w":"A"},{"en":"That's the spirit. Now help me push these chairs in.","zh":"就是这个劲儿。现在帮我把椅子推进去。","w":"B"},{"en":"Slow down. Here are the lines you'll use when it's your turn to be on duty.","zh":"放慢。来听几句轮到你值日时会用到的表达。","w":"H"},{"en":"Whose turn is it to be on duty?","zh":"今天轮到谁值日？","w":"H"},{"en":"Wipe the board first.","zh":"先擦黑板。","w":"H"},{"en":"Do the bins last, on your way out.","zh":"垃圾桶最后倒，顺路出去。","w":"H"},{"en":"Everything's easier with a plan.","zh":"凡事有计划就轻松。","w":"H"},{"en":"Whose turn is it?","zh":"轮到谁了？","w":"H"},{"en":"It's written on the board.","zh":"黑板上写着呢。","w":"H"},{"en":"A future-me problem.","zh":"一个'未来的我'的问题。","w":"H"},{"en":"The unholy trinity.","zh":"噩梦三件套（夸张）。","w":"H"},{"en":"You're acting like it's a marathon.","zh":"你搞得跟跑马拉松似的。","w":"H"},{"en":"No backtracking.","zh":"不用来回跑。","w":"H"},{"en":"That's how they get you.","zh":"他们就是这么逮住你的。","w":"H"},{"en":"That's the spirit.","zh":"就是这个劲儿。","w":"H"},{"en":"Your turn: in English, explain your plan for finishing a chore quickly, in three steps.","zh":"轮到你了：用英语分三步说明你快速完成一件杂务的计划。","w":"H"},{"en":"Tomorrow, we raise our hand, clear our throat, and actually say something in class. See you on the next walk!","zh":"明天，我们举起手、清清嗓子，在课堂上真的开口说点什么。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":4.8,"i":1},{"t":10.75,"i":2},{"t":19.0,"i":3},{"t":32.04,"i":4},{"t":38.76,"i":5},{"t":41.61,"i":6},{"t":47.25,"i":7},{"t":52.82,"i":8},{"t":58.98,"i":9},{"t":67.76,"i":10},{"t":73.62,"i":11},{"t":79.69,"i":12},{"t":83.07,"i":13},{"t":92.0,"i":14},{"t":99.34,"i":15},{"t":104.26,"i":16},{"t":109.44,"i":17},{"t":114.05,"i":18},{"t":119.37,"i":19},{"t":125.64,"i":20},{"t":129.91,"i":21},{"t":134.66,"i":22},{"t":141.23,"i":37},{"t":148.01,"i":0},{"t":154.11,"i":1},{"t":161.66,"i":2},{"t":172.02,"i":5},{"t":175.75,"i":6},{"t":182.89,"i":7},{"t":189.96,"i":8},{"t":197.77,"i":9},{"t":208.8,"i":10},{"t":216.2,"i":11},{"t":223.87,"i":12},{"t":228.25,"i":13},{"t":239.45,"i":15},{"t":245.72,"i":16},{"t":252.29,"i":17},{"t":258.15,"i":18},{"t":264.93,"i":19},{"t":272.84,"i":20},{"t":278.3,"i":21},{"t":284.36,"i":23},{"t":289.75,"i":24},{"t":294.81,"i":25},{"t":300.9,"i":26},{"t":306.48,"i":27},{"t":312.7,"i":28},{"t":319.2,"i":29},{"t":325.95,"i":30},{"t":332.76,"i":31},{"t":340.71,"i":32},{"t":347.14,"i":33},{"t":353.62,"i":34},{"t":359.91,"i":35},{"t":367.5,"i":36}],"count":38},{"id":32,"title":"课堂发言","sub":"Speaking Up in Class","desc":"想发言又不敢，最终鼓起勇气举手","audio":"audio/talk32.mp3","duration":378.2,"size":2269532,"lines":[{"en":"Mia, I have to answer a question in class today. In front of everyone. I'd rather fight a bear.","zh":"Mia，我今天上课得回答问题。当着所有人的面。我宁可去跟熊打架。","w":"A"},{"en":"A bear? That's your comparison? You'll survive one question, Jake.","zh":"熊？你就这么比喻？回答一个问题而已，你死不了的，Jake。","w":"B"},{"en":"You don't get it. When I know the answer and raise my hand, my brain goes completely blank.","zh":"你不懂。每当我知道答案、举起手，我的大脑就一片空白。","w":"A"},{"en":"Speaking up in class. For some students, it's the easiest thing in the world. For the rest of us, it feels like jumping off a high board. Today, Jake is about to jump.","zh":"课堂发言。对有些同学来说，这是世界上最简单的事。对我们其他人来说，像从高台跳水。今天，Jake 就要跳了。","w":"H"},{"en":"And he has a very specific reason to do it.","zh":"而且他有一个非常具体的理由。","w":"H"},{"en":"Okay, first question — why today? What changed?","zh":"好，先问一句——为什么是今天？什么变了？","w":"B"},{"en":"My English grade. It's... let's say it needs CPR. Participating in class is part of the score.","zh":"我的英语成绩。它……这么说吧，需要做心肺复苏了。课堂参与是评分的一部分。","w":"A"},{"en":"So you need the participation points.","zh":"所以你需要课堂参与分。","w":"B"},{"en":"Exactly. But every time I try, my hand feels like it weighs a hundred kilos.","zh":"没错。可每次我想举手，手就像有一百公斤重。","w":"A"},{"en":"Here's a trick. Don't aim for a perfect answer. Just aim to say one thing. Even a simple one.","zh":"教你一招。别追求完美答案。就想着说一句话。哪怕很简单的一句。","w":"B"},{"en":"One thing. Not the whole brilliant answer. Just... something.","zh":"一句话。不是整套精彩答案。就……说点什么。","w":"A"},{"en":"Right. The first time, you just open your mouth. That's the win.","zh":"对。第一次，你只需要开口。开口就是胜利。","w":"B"},{"en":"That actually helps. Lower the bar, and suddenly it's not so scary.","zh":"这还真有用。把目标放低，突然就没那么吓人了。","w":"A"},{"en":"Class started. The question came. And here's what Jake actually said.","zh":"上课了。问题来了。听听 Jake 到底说了什么。","w":"H"},{"en":"So? How did it go? Tell me everything.","zh":"所以呢？怎么样？快全告诉我。","w":"B"},{"en":"The teacher asked what the main idea of the story was. I knew it. My hand went up. My heart was pounding.","zh":"老师问这个故事的主旨是什么。我知道答案。我举起了手。心跳得厉害。","w":"A"},{"en":"And then?","zh":"然后呢？","w":"B"},{"en":"I said, 'It's about never giving up.' Not fancy. Just one sentence.","zh":"我说：'它是关于永不放弃。'不花哨。就一句话。","w":"A"},{"en":"Jake, that's a good answer! Simple and right.","zh":"Jake，这是个好答案！简单又正确。","w":"B"},{"en":"The teacher said, 'Exactly right, Jake.' And the world didn't end. My legs were shaking, but the world didn't end.","zh":"老师说：'完全正确，Jake。'而世界没有末日。我腿在抖，但世界没有末日。","w":"A"},{"en":"I told you. One thing. That's all it takes.","zh":"早跟你说了。一句话。就这么简单。","w":"B"},{"en":"Next class, I'm raising my hand again. Maybe even saying two sentences. Don't get too excited.","zh":"下节课，我还要举手。也许说两句话。别太激动。","w":"A"},{"en":"Slow it down. Here are the phrases that help when your hand is shaking.","zh":"放慢。来听几句当你手发抖时能帮上忙的表达。","w":"H"},{"en":"I have to answer a question in class.","zh":"我上课得回答问题。","w":"H"},{"en":"My brain goes completely blank.","zh":"我的大脑一片空白。","w":"H"},{"en":"Just aim to say one thing.","zh":"就想着说一句话。","w":"H"},{"en":"The world didn't end.","zh":"世界没有末日。","w":"H"},{"en":"I'd rather fight a bear.","zh":"我宁可去跟熊打架（夸张）。","w":"H"},{"en":"My brain goes blank.","zh":"我的大脑一片空白。","w":"H"},{"en":"It needs CPR.","zh":"它需要做心肺复苏了（夸张说成绩差）。","w":"H"},{"en":"Lower the bar.","zh":"把目标放低。","w":"H"},{"en":"That's the win.","zh":"那就是胜利。","w":"H"},{"en":"Tell me everything.","zh":"快全告诉我。","w":"H"},{"en":"Exactly right.","zh":"完全正确。","w":"H"},{"en":"Don't get too excited.","zh":"别太激动。","w":"H"},{"en":"Your turn: in English, say one sentence out loud that you'd feel proud to say in class. Then say it again, a little louder.","zh":"轮到你了：用英语大声说一句你在课堂上说出来会感到自豪的话。然后再大点声说一遍。","w":"H"},{"en":"Tomorrow, a brand-new face walks through the classroom door — and everyone wants to know their story. See you on the next walk!","zh":"明天，一张全新的面孔走进教室门——人人都想知道他们的故事。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.84,"i":1},{"t":12.55,"i":2},{"t":19.07,"i":3},{"t":33.31,"i":4},{"t":37.49,"i":5},{"t":42.04,"i":6},{"t":49.53,"i":7},{"t":52.67,"i":8},{"t":58.67,"i":9},{"t":66.35,"i":10},{"t":71.03,"i":11},{"t":76.88,"i":12},{"t":82.13,"i":13},{"t":89.86,"i":14},{"t":94.23,"i":15},{"t":101.62,"i":16},{"t":103.23,"i":17},{"t":109.25,"i":18},{"t":113.78,"i":19},{"t":122.4,"i":20},{"t":127.17,"i":21},{"t":134.34,"i":22},{"t":140.73,"i":37},{"t":147.5,"i":0},{"t":156.13,"i":1},{"t":163.39,"i":2},{"t":171.63,"i":5},{"t":177.45,"i":6},{"t":186.87,"i":7},{"t":190.94,"i":8},{"t":198.54,"i":9},{"t":208.2,"i":10},{"t":214.14,"i":11},{"t":221.54,"i":12},{"t":228.2,"i":14},{"t":233.81,"i":15},{"t":243.11,"i":16},{"t":245.3,"i":17},{"t":252.92,"i":18},{"t":258.69,"i":19},{"t":269.51,"i":20},{"t":275.59,"i":21},{"t":284.63,"i":23},{"t":290.62,"i":24},{"t":296.35,"i":25},{"t":301.62,"i":26},{"t":306.43,"i":27},{"t":313.35,"i":28},{"t":320.21,"i":29},{"t":326.71,"i":30},{"t":332.71,"i":31},{"t":338.67,"i":32},{"t":345.0,"i":33},{"t":351.46,"i":34},{"t":358.2,"i":35},{"t":368.39,"i":36}],"count":38},{"id":33,"title":"新来的转学生","sub":"The New Student","desc":"班里来了转学生，怎么帮他融入","audio":"audio/talk33.mp3","duration":364.2,"size":2186012,"lines":[{"en":"Did you see the new student? He was sitting in the back, looking at his desk like it was a map.","zh":"你看见那个新同学了吗？他坐在后排，盯着自己的课桌，像在看一张地图。","w":"A"},{"en":"Yeah, his name's David. Moved here last week from another city.","zh":"看见了，他叫 David。上周从另一个城市搬来的。","w":"B"},{"en":"I remember being that kid. You were the one who talked to me first.","zh":"我记得自己当年也是那样。你是第一个跟我说话的人。","w":"A"},{"en":"The new student. They walk in, everyone stares, and suddenly the classroom feels like a stage. Today, Jake remembers exactly how that felt — because he was that kid not long ago.","zh":"转学生。他们走进来，人人盯着看，教室突然变成了舞台。今天，Jake 清楚记得那是什么感受——因为不久前他自己就是那个孩子。","w":"H"},{"en":"And now, it's his turn to be the friendly face.","zh":"而现在，轮到他来做那张友善的面孔了。","w":"H"},{"en":"So what are you going to do about it?","zh":"那你打算怎么办？","w":"B"},{"en":"I'm going to talk to him at lunch. You know, like you did with me.","zh":"我打算午饭时去跟他聊聊。就像你当年对我那样。","w":"A"},{"en":"That's sweet, Jake. But don't just say hi and leave. Ask him something real.","zh":"挺暖的，Jake。但别打个招呼就走。问他点实在的。","w":"B"},{"en":"Like what? 'How do you like it here?' That's what everyone asks.","zh":"比如什么？'你觉得这儿怎么样？'人人都这么问。","w":"A"},{"en":"Then ask about him. What he likes. What he used to do. People love talking about themselves.","zh":"那就问他本人。他喜欢什么。他以前做什么。人都爱聊自己。","w":"B"},{"en":"What he likes. Okay. And maybe invite him to sit with us?","zh":"他喜欢什么。好。也许再邀请他跟我们一起坐？","w":"A"},{"en":"Exactly. A lunch invite is worth more than ten 'hi's in the hallway.","zh":"没错。一次午饭邀请，比走廊里十声'嗨'都值。","w":"B"},{"en":"I'll do it. Wish me luck — I'm about to be the friendly face I once needed.","zh":"我去做。祝我好运——我要成为当年我自己需要的那张友善面孔了。","w":"A"},{"en":"Lunchtime came. Here's how the conversation with David actually went.","zh":"午饭时间到了。听听跟 David 的对话实际是怎么进行的。","w":"H"},{"en":"So I sat down next to him and said, 'Hey, David. I'm Jake. This seat's free, and so is the spot next to me at lunch.'","zh":"于是我坐到他旁边说：'嘿，David，我是 Jake。这个位子是空的，我午饭旁边的位子也空着。'","w":"A"},{"en":"Bold opening. How did he react?","zh":"开场挺大胆。他什么反应？","w":"B"},{"en":"He looked surprised, then smiled. Said his old school had a football team he really missed.","zh":"他先是一愣，然后笑了。说他很想念以前学校的足球队。","w":"A"},{"en":"See? Now you know something about him. That's a start.","zh":"看吧？现在你了解他一点了。这就是个开始。","w":"B"},{"en":"Turns out he plays football. Guess what I do after school on Fridays?","zh":"原来他踢足球。猜我周五放学后干嘛？","w":"A"},{"en":"Basketball. But I bet you're about to change that.","zh":"打篮球。但我猜你要改主意了。","w":"B"},{"en":"I invited him to the field. He said yes. New kid's already got a Friday plan.","zh":"我约他去球场。他答应了。新同学周五已经有安排了。","w":"A"},{"en":"Look at you, being the welcoming committee.","zh":"瞧瞧你，当起迎新大使了。","w":"B"},{"en":"Slow down. Here are the phrases that turn a stranger into a friend.","zh":"放慢。来听几句能把陌生人变成朋友的表达。","w":"H"},{"en":"He's the new student.","zh":"他是新来的转学生。","w":"H"},{"en":"I was that kid.","zh":"我当年就是那个孩子。","w":"H"},{"en":"Ask him something real.","zh":"问他点实在的。","w":"H"},{"en":"This seat's free.","zh":"这个位子是空的。","w":"H"},{"en":"Looking at his desk like it was a map.","zh":"盯着课桌像在看地图。","w":"H"},{"en":"I remember being that kid.","zh":"我记得自己当年就是那样。","w":"H"},{"en":"Don't just say hi and leave.","zh":"别打个招呼就走。","w":"H"},{"en":"People love talking about themselves.","zh":"人都爱聊自己。","w":"H"},{"en":"A lunch invite is worth ten 'hi's.","zh":"一次午饭邀请胜过十声'嗨'。","w":"H"},{"en":"Wish me luck.","zh":"祝我好运。","w":"H"},{"en":"That's a start.","zh":"这就是个开始。","w":"H"},{"en":"Look at you.","zh":"瞧瞧你（夸奖）。","w":"H"},{"en":"Your turn: in English, plan what you'd say to a new student — a greeting, one question, and one invitation.","zh":"轮到你了：用英语准备你对新同学说的话——一句问候、一个问题、一个邀请。","w":"H"},{"en":"Tomorrow, the school clubs throw open their doors, and everyone's trying to recruit you. See you on the next walk!","zh":"明天，学校社团敞开大门，人人都想拉你入伙。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.05,"i":1},{"t":11.54,"i":2},{"t":16.24,"i":3},{"t":30.81,"i":4},{"t":35.3,"i":5},{"t":38.2,"i":6},{"t":42.69,"i":7},{"t":49.19,"i":8},{"t":53.82,"i":9},{"t":61.55,"i":10},{"t":66.2,"i":11},{"t":72.01,"i":12},{"t":77.57,"i":13},{"t":84.22,"i":14},{"t":93.51,"i":15},{"t":96.96,"i":16},{"t":103.47,"i":17},{"t":108.48,"i":18},{"t":113.18,"i":19},{"t":117.6,"i":20},{"t":123.43,"i":21},{"t":126.86,"i":22},{"t":133.24,"i":37},{"t":140.01,"i":0},{"t":147.66,"i":1},{"t":154.63,"i":2},{"t":160.62,"i":5},{"t":164.37,"i":6},{"t":170.12,"i":7},{"t":178.34,"i":8},{"t":184.23,"i":9},{"t":193.94,"i":10},{"t":199.88,"i":11},{"t":207.24,"i":12},{"t":214.31,"i":14},{"t":225.96,"i":15},{"t":230.41,"i":16},{"t":238.63,"i":17},{"t":245.0,"i":18},{"t":250.99,"i":19},{"t":256.64,"i":20},{"t":264.02,"i":21},{"t":268.45,"i":23},{"t":273.27,"i":24},{"t":278.03,"i":25},{"t":283.07,"i":26},{"t":287.69,"i":27},{"t":296.09,"i":28},{"t":303.48,"i":29},{"t":310.8,"i":30},{"t":319.56,"i":31},{"t":328.13,"i":32},{"t":334.2,"i":33},{"t":340.27,"i":34},{"t":346.01,"i":35},{"t":354.85,"i":36}],"count":38},{"id":34,"title":"社团招新","sub":"Club Fair","desc":"五花八门的社团，选哪个才好","audio":"audio/talk34.mp3","duration":371.4,"size":2229212,"lines":[{"en":"Mia, the club fair is today. There are forty clubs. Forty. How am I supposed to pick one?","zh":"Mia，今天社团招新。有四十个社团。四十个。我该怎么选？","w":"A"},{"en":"You don't pick forty. You pick one. Maybe two. What do you actually like doing?","zh":"你不用选四十个。选一个。最多两个。你到底喜欢做什么？","w":"B"},{"en":"That's the problem. I like doing a little of everything, and a lot of nothing.","zh":"问题就在这。我什么都喜欢一点点，又什么都没特别喜欢。","w":"A"},{"en":"The club fair. Every table has a poster, a smile, and a pitch that makes their club sound like the greatest thing since sliced bread. Today, Jake is drowning in choices.","zh":"社团招新。每张桌子都有海报、笑脸，还有一套话术，把他们的社团说得天上有地下无。今天，Jake 淹没在选择里。","w":"H"},{"en":"Mia has a simple rule to cut through the noise.","zh":"Mia 有一条简单的规则，帮你拨开噪音。","w":"H"},{"en":"Okay, my rule is this: ignore the posters. Talk to the people.","zh":"好，我的规则是：别看海报。跟人聊。","w":"B"},{"en":"Talk to the people? They're all standing there smiling like salespeople.","zh":"跟人聊？他们一个个站在那儿笑得跟销售似的。","w":"A"},{"en":"Exactly why it works. Ask them one thing: what do you actually do at meetings?","zh":"正因为这样才管用。问他们一个问题：你们活动时到底都干什么？","w":"B"},{"en":"That's... a good filter. The robot club guy was just showing me a video of a robot falling over.","zh":"这……是个好筛子。机器人社那哥们刚才给我看机器人摔倒的视频。","w":"A"},{"en":"Did he seem excited about it, or bored?","zh":"他看起来是兴奋还是无聊？","w":"B"},{"en":"Excited, actually. He kept laughing and said 'we're still fixing it'.","zh":"其实挺兴奋。他一直笑，说'我们还在修呢'。","w":"A"},{"en":"That's a real club. People who laugh at their own robot are people who love it.","zh":"这才是真社团。会笑话自己机器人的人，是真的热爱它。","w":"B"},{"en":"So by your logic, I should join the robot club because the guy laughed at a falling robot?","zh":"按你的逻辑，我该加入机器人社，就因为那哥们笑一个摔倒的机器人？","w":"A"},{"en":"I didn't say that. I said talk to the people. Now go talk to the basketball table — I know you're curious.","zh":"我可没这么说。我说的是跟人聊聊。现在去篮球社那桌——我知道你心里痒。","w":"B"},{"en":"After an hour, Jake made his choice. Here's how he decided.","zh":"一小时后，Jake 做出了选择。听听他是怎么决定的。","w":"H"},{"en":"So, final answer? Which club?","zh":"所以呢，最终答案？哪个社团？","w":"B"},{"en":"Basketball. But not because of the poster. Because the captain asked if I wanted to shoot around, not just sign up.","zh":"篮球社。但不是因为海报。是因为队长问我想不想先投会儿球，而不是只让我报名。","w":"A"},{"en":"A club that lets you try before you buy. Smart captain.","zh":"先让你试玩再决定。聪明的队长。","w":"B"},{"en":"And the robot club? I'll keep them on my list. That falling robot deserved better.","zh":"那机器人社呢？我先把他们放待选名单里。那个摔倒的机器人值得更好。","w":"A"},{"en":"See? You didn't pick forty. You picked one, with a maybe in your pocket.","zh":"看吧？你没选四十个。你选了一个，兜里还揣着个'待定'。","w":"B"},{"en":"That's the most decisive I've been all month.","zh":"这是我这个月最果断的一次了。","w":"A"},{"en":"Slow down. Here are the phrases to survive your own club fair.","zh":"放慢。来听几句帮你挺过自己那场社团招新的表达。","w":"H"},{"en":"How am I supposed to pick one?","zh":"我该怎么选？","w":"H"},{"en":"Ignore the posters, talk to the people.","zh":"别看海报，跟人聊。","w":"H"},{"en":"What do you actually do at meetings?","zh":"你们活动时到底都干什么？","w":"H"},{"en":"Let me try before I buy.","zh":"让我先试试再决定。","w":"H"},{"en":"A little of everything, a lot of nothing.","zh":"什么都喜欢一点点，又什么都没特别喜欢。","w":"H"},{"en":"The greatest thing since sliced bread.","zh":"天上有地下无（夸张）。","w":"H"},{"en":"Cut through the noise.","zh":"拨开噪音。","w":"H"},{"en":"That's a good filter.","zh":"这是个好筛子。","w":"H"},{"en":"Try before you buy.","zh":"先试再决定。","w":"H"},{"en":"Keep them on my list.","zh":"把他们放待选名单里。","w":"H"},{"en":"That's the most decisive I've been.","zh":"这是我最有主见的一次。","w":"H"},{"en":"A maybe in your pocket.","zh":"兜里揣着个'待定'。","w":"H"},{"en":"Your turn: in English, describe a club you'd join, and the one question you'd ask before signing up.","zh":"轮到你了：用英语描述你想加入的社团，以及报名前你会问的那个问题。","w":"H"},{"en":"Tomorrow, we take on the pile of homework that never seems to get smaller. See you on the next walk!","zh":"明天，我们对付那堆似乎永远不见少的作业。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.05,"i":1},{"t":13.94,"i":2},{"t":18.95,"i":3},{"t":32.88,"i":4},{"t":37.22,"i":5},{"t":43.22,"i":6},{"t":47.87,"i":7},{"t":54.16,"i":8},{"t":61.29,"i":9},{"t":64.69,"i":10},{"t":70.16,"i":11},{"t":75.87,"i":12},{"t":82.01,"i":13},{"t":90.34,"i":14},{"t":96.65,"i":15},{"t":100.18,"i":16},{"t":108.15,"i":17},{"t":113.02,"i":18},{"t":119.09,"i":19},{"t":125.16,"i":20},{"t":128.47,"i":21},{"t":134.73,"i":36},{"t":141.5,"i":0},{"t":150.4,"i":1},{"t":159.07,"i":2},{"t":165.47,"i":5},{"t":173.06,"i":6},{"t":179.0,"i":7},{"t":186.94,"i":8},{"t":195.9,"i":9},{"t":200.3,"i":10},{"t":207.23,"i":11},{"t":214.46,"i":12},{"t":222.23,"i":13},{"t":232.68,"i":15},{"t":237.25,"i":16},{"t":247.27,"i":17},{"t":253.48,"i":18},{"t":261.17,"i":19},{"t":268.84,"i":20},{"t":273.12,"i":22},{"t":278.49,"i":23},{"t":284.77,"i":24},{"t":290.59,"i":25},{"t":295.89,"i":26},{"t":304.98,"i":27},{"t":313.43,"i":28},{"t":319.94,"i":29},{"t":326.56,"i":30},{"t":333.21,"i":31},{"t":340.05,"i":32},{"t":348.06,"i":33},{"t":355.05,"i":34},{"t":363.0,"i":35}],"count":37},{"id":35,"title":"作业太多","sub":"Too Much Homework","desc":"作业堆成山，怎么安排时间","audio":"audio/talk35.mp3","duration":357.7,"size":2146700,"lines":[{"en":"Mia, I've been doing homework for two hours, and the pile has not moved. I think it's growing.","zh":"Mia，我写作业写了两小时了，那堆东西纹丝不动。我觉得它还在长。","w":"A"},{"en":"That's called 'Tuesday'. How many subjects do you have left?","zh":"那叫'周二'。你还有几科？","w":"B"},{"en":"Math, English, and a science report that's due tomorrow, which I have not started.","zh":"数学、英语，还有一份明天要交、我还没动笔的科学报告。","w":"A"},{"en":"Homework. It piles up, it never ends, and it has a special talent for being due at the same time. Today, Jake is buried under it.","zh":"作业。它越堆越多，永无止境，还特别擅长所有科目同时要交。今天，Jake 被它埋住了。","w":"H"},{"en":"Mia has a system that turns a mountain into a molehill.","zh":"Mia 有套方法，能把大山变成小土包。","w":"H"},{"en":"Okay, stop. What's due tomorrow?","zh":"好，停一下。明天要交什么？","w":"B"},{"en":"The science report. And it's the hardest one.","zh":"科学报告。而且是最难的那个。","w":"A"},{"en":"Then do the science report first. Not last.","zh":"那就先写科学报告。别放最后。","w":"B"},{"en":"First? But it's the worst. I'd rather start with the easy stuff to warm up.","zh":"先写？可它最难。我宁可先写简单的热热身。","w":"A"},{"en":"That's the trap. You warm up on the easy stuff, then you're tired for the hard stuff. Do the hard thing while your brain is fresh.","zh":"这就是陷阱。你先拿简单的热身，然后累得不行了才碰难的。趁脑子清醒时先啃硬的。","w":"B"},{"en":"Hardest first. That feels backwards, but it kind of makes sense.","zh":"先难后易。感觉反着来，但好像有道理。","w":"A"},{"en":"And break it into pieces. Report first: research, then write, then check. Three small wins instead of one giant wall.","zh":"再把任务切块。报告分三步：先查资料，再写，再检查。三个小胜利，而不是一堵大墙。","w":"B"},{"en":"Three small wins. Okay, I can do a small win.","zh":"三个小胜利。好，小胜利我做得到。","w":"A"},{"en":"Two hours later, the mountain was much smaller. Here's the payoff.","zh":"两小时后，那座山小多了。听听成果。","w":"H"},{"en":"Status report?","zh":"汇报一下进度？","w":"B"},{"en":"Science report: done. Math: done. English: half done, and I actually understood it this time.","zh":"科学报告：完成。数学：完成。英语：做了一半，而且这次我真看懂了。","w":"A"},{"en":"See? Hardest first, and suddenly the rest feels light.","zh":"看吧？先啃硬的，剩下的突然就轻了。","w":"B"},{"en":"I even have time to, like, breathe now. And maybe watch something before bed.","zh":"我甚至有时间喘口气了。睡前也许还能看点什么。","w":"A"},{"en":"Don't get carried away. But yeah — a finished pile beats a perfect plan that never starts.","zh":"别得意忘形。不过确实——写完的一堆，胜过一份永不开始的完美计划。","w":"B"},{"en":"That should be on a poster.","zh":"这话该印成海报。","w":"A"},{"en":"It probably is. Somewhere in the school hallway, next to the one about mornings.","zh":"大概真有。就在学校走廊，挨着讲早晨的那张。","w":"B"},{"en":"Slow down. Here are the phrases to tame your own homework pile.","zh":"放慢。来听几句帮你驯服自己作业堆的表达。","w":"H"},{"en":"How many subjects do you have left?","zh":"你还有几科？","w":"H"},{"en":"What's due tomorrow?","zh":"明天要交什么？","w":"H"},{"en":"Do the hard thing while your brain is fresh.","zh":"趁脑子清醒时先啃硬的。","w":"H"},{"en":"Break it into pieces.","zh":"把任务切成小块。","w":"H"},{"en":"The pile has not moved.","zh":"那堆东西纹丝不动。","w":"H"},{"en":"That's called 'Tuesday'.","zh":"那叫'周二'。","w":"H"},{"en":"Due tomorrow.","zh":"明天要交。","w":"H"},{"en":"That's the trap.","zh":"这就是陷阱。","w":"H"},{"en":"That feels backwards.","zh":"感觉反着来。","w":"H"},{"en":"Three small wins.","zh":"三个小胜利。","w":"H"},{"en":"Status report?","zh":"汇报一下进度？","w":"H"},{"en":"Don't get carried away.","zh":"别得意忘形。","w":"H"},{"en":"Your turn: in English, list your homework by difficulty, and say which one you'll do first and why.","zh":"轮到你了：用英语按难度列出你的作业，并说你打算先做哪一项、为什么。","w":"H"},{"en":"Tomorrow, we talk about the thing that steals our sleep — staying up too late, and the scroll that never ends. See you on the next walk!","zh":"明天，我们聊聊偷走睡眠的那件事——熬夜，和那刷不完的手机。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.86,"i":1},{"t":11.68,"i":2},{"t":17.78,"i":3},{"t":29.61,"i":4},{"t":34.25,"i":5},{"t":37.77,"i":6},{"t":41.35,"i":7},{"t":45.74,"i":8},{"t":51.52,"i":9},{"t":60.49,"i":10},{"t":65.58,"i":11},{"t":75.78,"i":12},{"t":80.24,"i":13},{"t":86.86,"i":14},{"t":88.95,"i":15},{"t":96.87,"i":16},{"t":102.27,"i":17},{"t":107.93,"i":18},{"t":115.51,"i":19},{"t":117.69,"i":20},{"t":124.15,"i":21},{"t":130.34,"i":36},{"t":137.11,"i":0},{"t":145.76,"i":1},{"t":151.9,"i":2},{"t":159.59,"i":5},{"t":164.16,"i":6},{"t":168.78,"i":7},{"t":174.38,"i":8},{"t":181.72,"i":9},{"t":192.96,"i":10},{"t":199.43,"i":11},{"t":212.16,"i":12},{"t":217.86,"i":14},{"t":220.63,"i":15},{"t":230.58,"i":16},{"t":237.43,"i":17},{"t":244.62,"i":18},{"t":254.16,"i":19},{"t":257.05,"i":20},{"t":265.2,"i":22},{"t":271.07,"i":23},{"t":275.86,"i":24},{"t":281.93,"i":25},{"t":287.06,"i":26},{"t":294.18,"i":27},{"t":300.76,"i":28},{"t":306.71,"i":29},{"t":312.78,"i":30},{"t":319.7,"i":31},{"t":326.3,"i":32},{"t":332.7,"i":33},{"t":339.5,"i":34},{"t":347.3,"i":35}],"count":37},{"id":36,"title":"晚睡习惯","sub":"Staying Up Late","desc":"晚上舍不得睡，早上起不来","audio":"audio/talk36.mp3","duration":369.6,"size":2217980,"lines":[{"en":"Mia, what time did you sleep last night? I need to feel better about my own choices.","zh":"Mia，你昨晚几点睡的？我需要用你来安慰一下自己的选择。","w":"A"},{"en":"Ten thirty. Like a normal human being. Why, what did you do?","zh":"十点半。像个正常人一样。怎么，你干了啥？","w":"B"},{"en":"I said 'one more video' at eleven. The video was forty minutes long. Then there was a sequel.","zh":"我十一点说'再看一个视频'。结果那视频四十分钟。然后还有续集。","w":"A"},{"en":"Staying up late. You tell yourself 'just one more', and suddenly it's midnight, then one, then your alarm is laughing at you. Today, Jake pays the price.","zh":"熬夜。你告诉自己'就再看一个'，突然就半夜了，一点了，然后闹钟开始嘲笑你。今天，Jake 尝到了苦果。","w":"H"},{"en":"Mia has heard this story before. Many, many times.","zh":"Mia 早就听过这个故事。很多很多次了。","w":"H"},{"en":"So what time did you actually go to sleep?","zh":"所以你到底是几点睡的？","w":"B"},{"en":"About one. Maybe one thirty. My phone says my screen time was six hours yesterday.","zh":"大概一点。也许一点半。手机说我昨天屏幕使用时间六小时。","w":"A"},{"en":"Six hours? Jake, that's a part-time job.","zh":"六小时？Jake，那都赶上兼职了。","w":"B"},{"en":"I know, I know. But at night, my brain says 'you finally have free time, don't waste it on sleep'.","zh":"我知道，我知道。可一到晚上，我的大脑就说：'你终于有空了，别把时间浪费在睡觉上。'","w":"A"},{"en":"That's the trap. Your brain is lying. Sleep is not wasted time — it's the thing that makes tomorrow work.","zh":"这就是陷阱。你的大脑在撒谎。睡觉不是浪费时间——它是让明天运转起来的东西。","w":"B"},{"en":"Logically, I agree. At eleven at night, logic leaves the building.","zh":"理性上，我同意。可到了晚上十一点，理性就下班走人了。","w":"A"},{"en":"So don't trust your night brain. Make the decision in the morning, when you're smart.","zh":"所以别信你'夜里的脑子'。趁早上清醒时就把决定做好。","w":"B"},{"en":"A morning me deciding for a night me? That might actually work.","zh":"让'早上的我'替'晚上的我'做决定？这招可能真管用。","w":"A"},{"en":"The plan was simple: a bedtime alarm, and one small rule. Here's how the first night went.","zh":"计划很简单：设一个'该睡觉'的闹钟，加上一条小规则。听听第一晚怎么样。","w":"H"},{"en":"So what's the new system?","zh":"新方案是什么？","w":"B"},{"en":"A bedtime alarm at ten forty-five. When it rings, the phone goes on the charger across the room. No more scrolling in bed.","zh":"十点四十五设个'该睡觉'闹钟。铃一响，手机就放到房间那头的充电器上。不再躺床上刷手机。","w":"A"},{"en":"Phone out of reach. Bold move. Did you survive?","zh":"手机放到够不着的地方。够狠。你熬过来了吗？","w":"B"},{"en":"It was hard for about ten minutes. Then... I just fell asleep. Like it was nothing.","zh":"前十分钟很难熬。然后……我就睡着了。跟没事一样。","w":"A"},{"en":"Ten forty-five beat your night brain. I'm honestly impressed.","zh":"十点四十五战胜了你的'夜里的脑子'。我真心佩服。","w":"B"},{"en":"Me too. I woke up today and I didn't hate the world. That's new for me.","zh":"我也佩服。今天醒来，我居然没恨这个世界。这对我可是头一回。","w":"A"},{"en":"That's called a good night's sleep, Jake. Welcome to the club.","zh":"那叫睡了个好觉，Jake。欢迎加入。","w":"B"},{"en":"Slow down. Here are the phrases for taming your own night brain.","zh":"放慢。来听几句帮你驯服自己'夜里脑子'的表达。","w":"H"},{"en":"What time did you sleep?","zh":"你几点睡的？","w":"H"},{"en":"One more video.","zh":"再看一个视频。","w":"H"},{"en":"Don't trust your night brain.","zh":"别信你'夜里的脑子'。","w":"H"},{"en":"Phone out of reach.","zh":"手机放到够不着的地方。","w":"H"},{"en":"I need to feel better about my choices.","zh":"我需要用你来安慰一下自己的选择。","w":"H"},{"en":"Like a normal human being.","zh":"像个正常人一样。","w":"H"},{"en":"That's a part-time job.","zh":"那都赶上兼职了。","w":"H"},{"en":"Logic leaves the building.","zh":"理性就下班走人了。","w":"H"},{"en":"Don't waste it on sleep.","zh":"别把时间浪费在睡觉上。","w":"H"},{"en":"Make the decision when you're smart.","zh":"趁清醒时把决定做好。","w":"H"},{"en":"Phone out of reach.","zh":"手机放到够不着的地方。","w":"H"},{"en":"Welcome to the club.","zh":"欢迎加入。","w":"H"},{"en":"Your turn: in English, describe one habit you'd change about your nights, and what you'd do instead.","zh":"轮到你了：用英语描述一个你想改变的夜间习惯，以及你会改成什么。","w":"H"},{"en":"That's batch one complete — sixteen more walks in the books. Next batch, we move to the kitchen, the shops, and the seasons. See you on the next walk!","zh":"第一批到此完成——又多了十六次散步。下一批，我们走进厨房、商店和四季。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.97,"i":1},{"t":12.16,"i":2},{"t":18.91,"i":3},{"t":32.01,"i":4},{"t":38.18,"i":5},{"t":41.71,"i":6},{"t":48.21,"i":7},{"t":52.48,"i":8},{"t":59.87,"i":9},{"t":68.12,"i":10},{"t":73.28,"i":11},{"t":79.04,"i":12},{"t":83.43,"i":13},{"t":91.5,"i read, noodles, or rice for energy. And fruit or vegetables.","zh":"简单。鸡蛋、牛奶或豆浆补蛋白质。面包、面条或米饭给能量。再来点水果或蔬菜。","w":"B"},{"en":"That's a lot of work for seven in the morning.","zh":"早上七点搞这些，太费劲了。","w":"A"},{"en":"Ten minutes, Jake. An egg takes six minutes to boil. Milk, you just pour it.","zh":"十分钟，Jake。鸡蛋煮六分钟。牛奶倒一下就完事。","w":"B"},{"en":"What about you, Christopher? Are you a breakfast person?","zh":"你呢，Christopher？你是吃早餐的人吗？","w":"A"},{"en":"I like a big bowl of noodles with an egg and some greens. Keeps me going till lunch.","zh":"我喜欢一大碗面条，加个蛋和一点青菜。能撑到中午。","w":"C"},{"en":"That sounds way better than my sad toast.","zh":"听起来比我那可怜的吐司强多了。","w":"A"},{"en":"Come over tomorrow, my dad makes the best noodles in town.","zh":"明天来我家，我爸做的面条是镇上最棒的。","w":"C"},{"en":"Now you've done it. Jake will never leave your house.","zh":"这下好了。Jake 再也不会离开你家了。","w":"B"},{"en":"Slow down. Here are some phrases to help you talk about breakfast.","zh":"放慢速度。来听几个帮你聊早餐的表达。","w":"H"},{"en":"What did you have for breakfast?","zh":"你早餐吃了什么？","w":"H"},{"en":"I was still hungry by nine o'clock.","zh":"结果九点我就又饿了。","w":"H"},{"en":"You need protein, not just sugar.","zh":"你需要蛋白质，不能光吃糖。","w":"H"},{"en":"Keeps me going till lunch.","zh":"能撑到中午。","w":"H"},{"en":"What did you have for breakfast?","zh":"你早餐吃了什么？","w":"H"},{"en":"A bowl of porridge.","zh":"一碗粥。","w":"H"},{"en":"staying power","zh":"持久的饱腹感","w":"H"},{"en":"Keeps me going.","zh":"让我撑得住。","w":"H"},{"en":"That's a lot of work.","zh":"那太费劲了。","w":"H"},{"en":"Your turn: in English, tell someone what you had for breakfast today and one thing you'd change.","zh":"轮到你了：用英语说说你今天早餐吃了什么，以及你想改掉的一点。","w":"H"},{"en":"That's it for today. Next, we talk about drinks — bubble tea or juice? See you on the next walk!","zh":"今天就到这里。下次我们聊聊饮品——奶茶还是果汁？下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":9.99,"i":1},{"t":14.42,"i":2},{"t":20.09,"i":3},{"t":24.38,"i":4},{" f sweet juice can be just as bad.","zh":"不一定。一瓶甜果汁可能一样糟。","w":"C"},{"en":"So what am I supposed to drink, plain water?","zh":"那我该喝啥，白开水？","w":"A"},{"en":"Water is great. But if you want a treat, get fresh fruit juice, no sugar added, or a smaller cup.","zh":"水就很好。但你想解馋的话，就点鲜榨果汁、不加糖，或者小杯。","w":"B"},{"en":"Or just enjoy the bubble tea and don't do it every day.","zh":"或者就好好享受奶茶，别天天喝就行。","w":"C"},{"en":"Now that's advice I can get behind.","zh":"这才是我听得进去的建议。","w":"A"},{"en":"Slow down. Here are some useful phrases.","zh":"放慢速度。来听几个有用的表达。","w":"H"},{"en":"Do we get bubble tea or fruit juice?","zh":"我们买奶茶还是果汁？","w":"H"},{"en":"Maybe get it half sweet.","zh":"最好点半糖。","w":"H"},{"en":"One bubble tea has more sugar than you think.","zh":"一杯奶茶的糖比你想象的多。","w":"H"},{"en":"Don't do it every day.","zh":"别天天喝。","w":"H"},{"en":"get it half sweet","zh":"点半糖","w":"H"},{"en":"The pearls are cooked in sugar.","zh":"珍珠是用糖煮的。","w":"H"},{"en":"just as bad","zh":"一样糟","w":"H"},{"en":"no sugar added","zh":"不加糖","w":"H"},{"en":"a treat","zh":"解馋的东西","w":"H"},{"en":"Your turn: in English, say which you'd choose — bubble tea or juice — and why.","zh":"轮到你了：用英语说说你会选奶茶还是果汁，以及为什么。","w":"H"},{"en":"That's it for today. Next, we roll up our sleeves and cook something together. See you on the next walk!","zh":"今天就到这里。下次我们挽起袖子，一起做点吃的。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.96,"i":1},{"t":12.72,"i":2},{"t":16.53,"i":3},{"t":19.56,"i":4},{"t":25.0,"i":5},{"t":28.19,"i":6},{"t":34.62,"i":7},{"t":41.54,"i":8},{"t":44.37,"i":9},{"t":50.53,"i":10},{"t":52.69,"i":11},{"t":59.05,"i":12},{"t":62.33,"i":13},{"t":70.66,"i":14},{"t":75.53,"i":15},{"t":78.38,"i":16},{"t":83.69,"i":28},{"t":90.46,"i":1},{"t":97.77,"i":2},{"t":102.68,"i":3},{"t":106.6,"i":4},{"t":113.5,"i":5},{"t":117.62,"i":6},{"t":125.72,"i":8},{"t":129.4,"i":9},{"t":137.21,"i":10},{"t":140.06,"i":11},{"t":148.11,"i":12},{"t":152.37,"i":13},{"t":162.82,"i":14},{"t":169.03,"i":15},{"t":172.73,"i":17},{"t":178.56,"i":18},{"t":183.76,"i":19},{"t":190.18,"i":20},{"t":195.14,"i":21},{"t":201.5,"i":22},{"t":209.01,"i":23},{"t":215.04,"i":24},{"t":221.21,"i":25},{"t":226.65,"i":26},{"t":233.96,"i":27}],"count":29},{"id":39,"title":"一起做饭","sub":"Let's Cook","desc":"学做一道简单的家常菜，用英语说步骤","audio":"audio/talk39.mp3","duration":270.1,"size":1621244,"lines":[{"en":"Welcome back. Today, we cook. Grab your apron — this one's hands-on.","zh":"欢迎回来。今天我们做饭。系上围裙——这集是实操课。","w":"H"},{"en":"Mia, I told my mom I'd cook dinner tonight. I'm scared.","zh":"Mia，我跟我妈说我今晚做饭。我有点慌。","w":"A"},{"en":"First time cooking?","zh":"第一次做饭？","w":"B"},{"en":"I once burned water. I don't want to talk about it.","zh":"我有一次把水烧糊了。我不想聊这事。","w":"A"},{"en":"How do you burn water?","zh":"水怎么能烧糊？","w":"B"},{"en":"I said I don't want to talk about it.","zh":"我说了不想聊。","w":"A"},{"en":"Okay, okay. What are we making?","zh":"好好好。那我们做什么？","w":"B"},{"en":"Something simple. Fried rice with egg? My grandma's recipe.","zh":"简单点的。蛋炒饭？我奶奶的拿手菜。","w":"A"},{"en":"Perfect. Egg fried rice is easy and hard to mess up.","zh":"完美。蛋炒饭简单，又不容易翻车。","w":"B"},{"en":"Egg fried rice is a great first dish. Let's hear the steps.","zh":"蛋炒饭是很棒的第一道菜。来听听步骤。","w":"H"},{"en":"First, get your rice ready. Cold leftover rice is best — it doesn't stick.","zh":"首先，把米饭准备好。隔夜的冷饭最好——不粘锅。","w":"B"},{"en":"Got it. Then?","zh":"明白。然后呢？","w":"A"},{"en":"Beat two eggs in a bowl. Chop some green onion and any veggies you like.","zh":"碗里打两个鸡蛋。切点葱和你喜欢的蔬菜。","w":"B"},{"en":"I can chop. I have not chopped off a finger in weeks.","zh":"我会切菜。我这几周都没切到过手指。","w":"A"},{"en":"That's the spirit. Heat the pan, add oil, scramble the eggs. Take them out.","zh":"就是这个劲头。热锅，倒油，把鸡蛋炒散。盛出来。","w":"B"},{"en":"Wait, take the eggs out? Why?","zh":"等等，鸡蛋要盛出来？为什么？","w":"C"},{"en":"So they stay soft. Then fry the rice, add the eggs back, toss in the onion, and season with salt and a little soy sauce.","zh":"这样鸡蛋才嫩。然后炒饭，把鸡蛋倒回去，加葱，放盐和一点点酱油调味。","w":"B"},{"en":"That's it? No magic wok skills?","zh":"就这？不需要什么颠锅神功？","w":"A"},{"en":"That's it. Two minutes on high heat, and you're a chef.","zh":"就这。大火两分钟，你就是大厨。","w":"B"},{"en":"Slow down. Here are the cooking words you'll need.","zh":"放慢速度。来听几个做饭要用到的词。","w":"H"},{"en":"Cold leftover rice is best.","zh":"隔夜的冷饭最好。","w":"H"},{"en":"Beat two eggs in a bowl.","zh":"碗里打两个鸡蛋。","w":"H"},{"en":"Heat the pan and add oil.","zh":"热锅，倒油。","w":"H"},{"en":"Season with salt and a little soy sauce.","zh":"放盐和一点酱油调味。","w":"H"},{"en":"leftover rice","zh":"剩饭","w":"H"},{"en":"scramble the eggs","zh":"把鸡蛋炒散","w":"H"},{"en":"toss in the onion","zh":"把葱放进去","w":"H"},{"en":"season with","zh":"用……调味","w":"H"},{"en":"hard to mess up","zh":"不容易搞砸","w":"H"},{"en":"Your turn: in English, describe how to make your favorite simple dish in three steps.","zh":"轮到你了：用英语分三步说说你最爱的一道简单菜怎么做。","w":"H"},{"en":"That's it for today. Next, we order in — takeout and snacks. See you on the next walk!","zh":"今天就到这里。下次我们点外卖——外卖和零食。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":8.16,"i":1},{"t":12.91,"i":2},{"t":15.07,"i":3},{"t":18.86,"i":4},{"t":20.97,"i":5},{"t":23.56,"i":6},{"t":26.85,"i":7},{"t":31.64,"i":8},{"t":36.87,"i":9},{"t":43.26,"i":10},{"t":49.5,"i":11},{"t":51.58,"i":12},{"t":57.29,"i":13},{"t":61.44,"i":14},{"t":68.81,"i":15},{"t":73.66,"i":16},{"t":82.99,"i":17},{"t":86.13,"i":18},{"t":90.79,"i":19},{"t":96.07,"i":31},{"t":102.84,"i":1},{"t":108.88,"i":2},{"t":111.72,"i":3},{"t":116.58,"i":4},{"t":119.4,"i":5},{"t":122.8,"i":6},{"t":127.06,"i":7},{"t":133.16,"i":8},{"t":139.8,"i":10},{"t":147.66,"i":11},{"t":150.43,"i":12},{"t":157.67,"i":13},{"t":162.96,"i":14},{"t":172.21,"i":15},{"t":178.39,"i":16},{"t":190.09,"i":17},{"t":194.18,"i":18},{"t":200.12,"i":20},{"t":205.8,"i":21},{"t":210.96,"i":22},{"t":216.3,"i":23},{"t":222.46,"i":24},{"t":228.89,"i":25},{"t"

C"},{"en":"Camping is an adventure, but a little prep makes it fun instead of stressful.","zh":"露营是冒险，但提前准备能让你玩得开心而不是手忙脚乱。来听听。","w":"H"},{"en":"Okay, tent, sleeping bag, food. What else?","zh":"好，帐篷、睡袋、吃的。还有呢？","w":"A"},{"en":"A headlamp, not just a phone light. And bug spray. Trust me.","zh":"头灯，不能只有手机灯。还有防虫喷雾。信我。","w":"B"},{"en":"Bug spray. Noted. What's the best part of camping?","zh":"防虫喷雾。记下了。露营最棒的是啥？","w":"A"},{"en":"The stars. Away from city lights, the sky is full of them.","zh":"星星。远离城市灯光，满天都是。","w":"C"},{"en":"And the quiet. You don't realize how loud the city is until you leave it.","zh":"还有安静。不离开城市，你都不知道它有多吵。","w":"B"},{"en":"Okay, now I'm actually looking forward to it.","zh":"好，我现在真的期待起来了。","w":"A"},{"en":"Slow down. Here are some camping phrases.","zh":"放慢速度。来听几个露营的表达。","w":"H"},{"en":"I'm going camping for the first time.","zh":"我第一次去露营。","w":"H"},{"en":"Set up the tent.","zh":"搭帐篷。","w":"H"},{"en":"Nights get cold, even in summer.","zh":"夜里会冷，夏天也是。","w":"H"},{"en":"The sky is full of stars.","zh":"满天都是星星。","w":"H"},{"en":"a sleeping bag","zh":"睡袋","w":"H"},{"en":"set up the tent","zh":"搭帐篷","w":"H"},{"en":"a headlamp","zh":"头灯","w":"H"},{"en":"bug spray","zh":"防虫喷雾","w":"H"},{"en":"away from city lights","zh":"远离城市灯光","w":"H"},{"en":"Your turn: in English, list three things to bring on a camping trip.","zh":"轮到你了：用英语列出露营要带的三样东西。","w":"H"},{"en":"That's it for today. Next, we head to the beach. See you on the next walk!","zh":"今天就到这里。下次我们去海边。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.63,"i":1},{"t":11.21,"i":2},{"t":16.7,"i":3},{"t":22.8,"i":4},{"t":26.51,"i":5},{"t":31.07,"i":6},{"t":33.95,"i":7},{"t":40.96,"i":8},{"t":47.05,"i":9},{"t":51.85,"i":10},{"t":58.11,"i":11},{"t":62.5,"i":12},{"t":69.25,"i":13},{"t":74.91,"i":14},{"t":78.39,"i":15},{"t":83.69,"i":27},{"t":90.46,"i":1},{"t":96.33,"i":2},{"t":103.28,"i":3},{"t":111.0,"i":4},{"t":115.78,"i":5},{"t":121.6,"i":6},{"t":125.36,"i":7},{"t":134.2,"i":9},{"t":140.31,"i":10},{"t":148.22,"i":11},{"t":153.82,"i":12},{"t":162.33,"i":13},{"t":169.5,"i":14},{"t":174.0,"i":16},{"t":179.8,"i":17},{"t":184.59,"i":18},{"t":190.46,"i":19},{"t":195.88,"i":20},{"t":202.12,"i":21},{"t":208.5,"i":22},{"t":214.26,"i":23},{"t":220.02,"i":24},{"t":227.2,"i":25},{"t":233.16,"i":26}],"count":28},{"id":66,"title":"海边度假","sub":"Beach Vacation","desc":"阳光沙滩海浪，海边度假的正确打开方式","audio":"audio/talk66.mp3","duration":216.2,"size":1297676,"lines":[{"en":"Welcome back. Today, we hit the beach.","zh":"欢迎回来。今天我们去海边。","w":"H"},{"en":"Summer plan: beach trip! Sand, sea, and zero homework.","zh":"夏日计划：海边游！沙滩、大海、零作业。","w":"A"},{"en":"You'll come back sunburned. I guarantee it.","zh":"你会晒伤回来的。我保证。","w":"B"},{"en":"Not this time. I bought sunscreen with the highest number.","zh":"这次不会。我买了最高倍数的防晒霜。","w":"A"},{"en":"Sunscreen only works if you reapply it. Every two hours.","zh":"防晒得补涂才管用。每两小时一次。","w":"C"},{"en":"Reapply? It's not makeup, Leo.","zh":"补涂？这又不是化妆，Leo。","w":"A"},{"en":"Doesn't matter. Sweat and water wash it off.","zh":"不管。汗和水会把它冲掉。","w":"C"},{"en":"A beach day is pure joy, if you're ready for the sun and water. Here's how.","zh":"海边的一天是纯粹的快乐，只要你对阳光和水有准备。来听听。","w":"H"},{"en":"What's on your beach list?","zh":"你的海边清单是啥？","w":"B"},{"en":"Swimsuit, towel, flip-flops, and a big hat.","zh":"泳衣、毛巾、人字拖，还有大帽子。","w":"A"},{"en":"Add water and shade. An umbrella or a beach tent.","zh":"加上水和遮阴。一把伞或沙滩帐篷。","w":"C"},{"en":"And don't swim alone or too far, right?","zh":"还有别一个人游、别游太远，对吧？","w":"A"},{"en":"Exactly. Watch the flags, and swim where the lifeguard can see you.","zh":"没错。看旗帜，在有救生员能看到的区域游。","w":"B"},{"en":"Got it. Sun, sea, and safety.","zh":"明白。阳光、大海、安全。","w":"A"},{"en":"Slow down. Here are some beach phrases.","zh":"放慢速度。来听几个海边的表达。","w":"H"},{"en":"We're going on a beach trip.","zh":"我们去海边游。","w":"H"},{"en":"Reapply sunscreen every two hours.","zh":"每两小时补涂防晒。","w":"H"},{"en":"Bring a swimsuit and a towel.","zh":"带泳衣和毛巾。","w":"H"},{"en":"Swim where the lifeguard can see you.","zh":"在有救生员能看到的区域游。","w":"H"},{"en":"sunburned","zh":"晒伤","w":"H"},{"en":"reapply sunscreen","zh":"补涂防晒","w":"H"},{"en":"flip-flops","zh":"人字拖","w":"H"},{"en":"shade","zh":"遮阴","w":"H"},{"en":"the lifeguard","zh":"救生员","w":"H"},{"en":"Your turn: in English, describe your perfect beach day in three sentences.","zh":"轮到你了：用英语三句话描述你完美的海边一天。","w":"H"},{"en":"That's it for today. Next, we pack for a trip. See you on the next walk!","zh":"今天就到这里。下次我们收拾行李。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.28,"i":1},{"t":11.11,"i":2},{"t":15.24,"i":3},{"t":19.53,"i":4},{"t":25.94,"i":5},{"t":29.15,"i":6},{"t":34.5,"i":7},{"t":41.7,"i":8},{"t":44.1,"i":9},{"t":48.47,"i":10},{"t":54.51,"i":11},{"t":57.85,"i":12},{"t":63.99,"i":13},{"t":67.49,"i":14},{"t":72.65,"i":26},{"t":79.43,"i":1},{"t":86.78,"i":2},{"t":92.07,"i":3},{"t":97.58,"i":4},{"t":105.66,"i":5},{"t":109.82,"i":6},{"t":116.6,"i":8},{"t":119.78,"i":9},{"t":125.36,"i":10},{"t":133.01,"i":11},{"t":137.34,"i":12},{"t":145.1,"i":13},{"t":149.63,"i":15},{"t":154.87,"i":16},{"t":161.13,"i":17},{"t":166.55,"i":18},{"t":172.32,"i":19},{"t":177.84,"i":20},{"t":184.56,"i":21},{"t":190.56,"i":22},{"t":195.72,"i":23},{"t":201.53,"i":24},{"t":207.97,"i":25}],"count":27},{"id":67,"title":"收拾行李","sub":"Packing for a Trip","desc":"出门前怎么打包，不遗漏不多带","audio":"audio/talk67.mp3","duration":227.4,"size":1365212,"lines":[{"en":"Welcome back. Today, we pack for a trip.","zh":"欢迎回来。今天我们收拾行李。","w":"H"},{"en":"I leave tomorrow and I haven't packed a single thing.","zh":"我明天出发，一样东西都还没收拾。","w":"A"},{"en":"Classic Jake. What kind of trip is it?","zh":"典型的 Jake。是什么旅行？","w":"B"},{"en":"Three days with my grandparents. Not too cold, not too hot.","zh":"去爷爷奶奶家住三天。不冷不热。","w":"A"},{"en":"Then make a list first. Don't just throw things in.","zh":"那先列清单。别一股脑乱塞。","w":"C"},{"en":"A list? That's so... organized.","zh":"清单？这也太……有条理了。","w":"A"},{"en":"Which is why you never forget things, unlike some people.","zh":"所以你从不忘东西，不像某些人。","w":"B"},{"en":"Packing well means less stress later. Here's a simple method.","zh":"收拾好行李，之后少操心。来听个简单方法。","w":"H"},{"en":"The rule is: clothes for each day, plus one extra set.","zh":"规则是：每天的衣服，再加一套备用。","w":"C"},{"en":"How many pairs of socks?","zh":"几双袜子？","w":"A"},{"en":"Days plus one. Same for underwear.","zh":"天数加一。内衣也一样。","w":"C"},{"en":"Roll your clothes instead of folding. Saves space and fewer wrinkles.","zh":"衣服卷起来而不是叠。省空间还少皱。","w":"B"},{"en":"Rolling, really?","zh":"卷起来，真的？","w":"A"},{"en":"Try it. You'll fit twice as much.","zh":"试试看。能多装一倍。","w":"B"},{"en":"And what about the 'I might need this' pile?","zh":"那'我可能用得上'那一堆呢？","w":"A"},{"en":"Leave it. If you really need it, you can usually buy it there.","zh":"别带。真需要的话，到那儿一般也能买。","w":"C"},{"en":"Slow down. Here are some packing phrases.","zh":"放慢速度。来听几个收拾行李的表达。","w":"H"},{"en":"I haven't packed a single thing.","zh":"我一样东西都还没收拾。","w":"H"},{"en":"Make a list first.","zh":"先列清单。","w":"H"},{"en":"Roll your clothes instead of folding.","zh":"衣服卷起来而不是叠。","w":"H"},{"en":"Clothes for each day, plus one extra set.","zh":"每天的衣服，再加一套备用。","w":"H"},{"en":"pack","zh":"收拾行李","w":"H"},{"en":"make a list","zh":"列清单","w":"H"},{"en":"one extra set","zh":"一套备用","w":"H"},{"en":"roll your clothes","zh":"卷衣服","w":"H"},{"en":"fit twice as much","zh":"多装一倍","w":"H"},{"en":"Your turn: in English, describe what you'd pack for a three-day trip.","zh":"轮到你了：用英语描述三天旅行你会带什么。","w":"H"},{"en":"That's it for today. Next, we take travel photos. See you on the next walk!","zh":"今天就到这里。下次我们拍旅行照。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.47,"i":1},{"t":9.26,"i":2},{"t":13.03,"i":3},{"t":18.02,"i":4},{"t":23.56,"i":5},{"t":26.85,"i":6},{"t":31.14,"i":7},{"t":37.22,"i":8},{"t":43.02,"i":9},{"t":45.32,"i":10},{"t":50.39,"i":11},{"t":56.19,"i":12},{"t":57.89,"i":13},{"t":61.66,"i":14},{"t":64.73,"i":15},{"t":70.92,"i":16},{"t":76.23,"i":28},{"t":83.0,"i":1},{"t":87.86,"i":2},{"t":92.69,"i":3},{"t":99.04,"i":4},{"t":106.06,"i":5},{"t":110.32,"i":6},{"t":115.83,"i":8},{"t":123.19,"i":9},{"t":126.25,"i":10},{"t":132.69,"i":11},{"t":140.05,"i":12},{"t":142.34,"i":13},{"t":147.17,"i":14},{"t":151.17,"i":15},{"t":158.98,"i":17},{"t":164.47,"i":18},{"t":169.38,"i":19},{"t":175.23,"i":20},{"t":182.06,"i":21},{"t":187.25,"i":22},{"t":193.17,"i":23},{"t":199.73,"i":24},{"t":206.16,"i":25},{"t":213.0,"i":26},{"t":218.96,"i":27}],"count":29},{"id":68,"title":"旅行拍照","sub":"Travel Photos","desc":"拍出好看的旅行照，留住美好回忆","audio":"audio/talk68.mp3","duration":226.1,"size":1357148,"lines":[{"en":"Welcome back. Today, we capture the trip — travel photos.","zh":"欢迎回来。今天我们记录旅行——旅行照。","w":"H"},{"en":"I take a hundred photos on every trip, but they all look the same.","zh":"我每次旅行拍一百张，但张张都一样。","w":"A"},{"en":"Are you always in the center, making a peace sign?","zh":"你是不是总站在中间，比个剪刀手？","w":"B"},{"en":"...Maybe.","zh":"……可能吧。","w":"A"},{"en":"That's your problem. Try different angles, not just different places.","zh":"这就是问题所在。试试不同的角度，而不是不同的地方。","w":"C"},{"en":"And use the light. Morning and evening light makes everything look better.","zh":"还要用光。清晨和傍晚的光让一切都更好看。","w":"B"},{"en":"A good travel photo is more than just standing somewhere. Here are the tips.","zh":"一张好的旅行照不只是站在某处。来听技巧。","w":"H"},{"en":"Okay, teach me. How do I stop making boring photos?","zh":"好，教我。怎么才能不拍出无聊的照片？","w":"A"},{"en":"Get closer to your subject, or shoot from low or high.","zh":"靠近你的主体，或者蹲低、举高拍。","w":"C"},{"en":"Look for a detail — a window, a shadow, a plate of food — not just the whole view.","zh":"找细节——一扇窗、一道影子、一盘食物——而不是只拍全景。","w":"B"},{"en":"What about people? My mom always blinks.","zh":"那人像呢？我妈拍照总眨眼。","w":"A"},{"en":"Take a few in a row, and catch people doing something, not just posing.","zh":"连拍几张，抓拍人在做事的样子，而不是摆拍。","w":"C"},{"en":"So it's about moments, not poses.","zh":"所以是拍瞬间，不是摆姿势。","w":"A"},{"en":"Exactly. Now you sound like a photographer.","zh":"没错。这下你像个摄影师了。","w":"B"},{"en":"Slow down. Here are some photo phrases.","zh":"放慢速度。来听几个拍照的表达。","w":"H"},{"en":"Try different angles.","zh":"试试不同的角度。","w":"H"},{"en":"Morning light makes everything look better.","zh":"清晨的光让一切都更好看。","w":"H"},{"en":"Get closer to your subject.","zh":"靠近你的主体。","w":"H"},{"en":"Catch people doing something.","zh":"抓拍人在做事的样子。","w":"H"},{"en":"a peace sign","zh":"剪刀手","w":"H"},{"en":"different angles","zh":"不同的角度","w":"H"},{"en":"shoot from low","zh":"蹲低拍","w":"H"},{"en":"a detail","zh":"细节","w":"H"},{"en":"catch people doing something","zh":"抓拍","w":"H"},{"en":"Your turn: in English, describe how you'd take a great photo of a place you like.","zh":"轮到你了：用英语描述你会怎么给一个你喜欢的地方拍张好照片。","w":"H"},{"en":"That's it for today — batch three complete! Next batch, we take care of our health and the planet. See you on the next walk!","zh":"今天就到这里——第三批完成！下一批，我们关注健康和地球。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.63,"i":1},{"t":11.66,"i":2},{"t":15.33,"i":3},{"t":16.77,"i":4},{"t":23.47,"i":5},{"t":29.44,"i":6},{"t":36.4,"i":7},{"t":40.79,"i":8},{"t":46.17,"i":9},{"t":53.32,"i":10},{"t":57.01,"i":11},{"t":63.25,"i":12},{"t":66.53,"i":13},{"t":70.61,"i":14},{"t":75.85,"i":26},{"t":82.62,"i":1},{"t":89.01,"i":2},{"t":93.75,"i":3},{"t":95.73,"i":4},{"t":104.17,"i":5},{"t":111.72,"i":7},{"t":117.35,"i":8},{"t":124.15,"i":9},{"t":133.16,"i":10},{"t":137.93,"i":11},{"t":145.81,"i":12},{"t":150.05,"i":13},{"t":155.27,"i":15},{"t":160.27,"i":16},{"t":166.36,"i":17},{"t":171.85,"i":18},{"t":177.1,"i":19},{"t":183.1,"i":20},{"t":189.36,"i":21},{"t":195.53,"i":22},{"t":201.22,"i":23},{"t":208.42,"i":24},{"t":215.19,"i":25}],"count":27},{"id":69,"title":"感冒了","sub":"Catching a Cold","desc":"感冒了怎么办，学会描述身体不适","audio":"audio/talk69.mp3","duration":223.5,"size":1341452,"lines":[{"en":"Welcome back. Today, we're under the weather — catching a cold.","zh":"欢迎回来。今天我们不舒——感冒了。","w":"H"},{"en":"I feel awful. My head hurts and my nose won't stop running.","zh":"我好难受。头疼，鼻涕止不住。","w":"A"},{"en":"You look pale. Did you sleep at all last night?","zh":"你脸色发白。昨晚睡了吗？","w":"B"},{"en":"Barely. I kept sneezing every five minutes.","zh":"几乎没睡。每五分钟打一个喷嚏。","w":"A"},{"en":"Sounds like a cold. You should go home and rest.","zh":"听着像感冒。你应该回家休息。","w":"C"},{"en":"But we have a math test tomorrow.","zh":"可明天有数学考试。","w":"A"},{"en":"You can't study when you're sick. Rest today, catch up tomorrow.","zh":"生病时学不进去。今天休息，明天再补。","w":"B"},{"en":"A cold is common, but you can make it pass faster. Here's how.","zh":"感冒很常见，但你能让它快点好。来听听怎么做。","w":"H"},{"en":"First, drink plenty of warm water. It soothes your throat.","zh":"首先，多喝温水。能舒缓嗓子。","w":"C"},{"en":"What about medicine?","zh":"那吃药呢？","w":"A"},{"en":"If it's bad, see a doctor. Don't just grab any pills.","zh":"如果严重，去看医生。别乱吃药。","w":"C"},{"en":"And rest. Your body fights the cold while you sleep.","zh":"还有休息。你睡觉时身体在跟感冒作战。","w":"B"},{"en":"So basically — water, rest, and maybe a doctor?","zh":"所以就是——喝水、休息，可能再看医生？","w":"A"},{"en":"Exactly. And cover your mouth when you sneeze, so you don't share it.","zh":"没错。打喷嚏要捂住嘴，别传染给别人。","w":"B"},{"en":"Got it. Sorry if I already shared it.","zh":"明白。抱歉，我可能已经传染了。","w":"A"},{"en":"Slow down. Here are some phrases about feeling sick.","zh":"放慢速度。来听几个描述生病的表达。","w":"H"},{"en":"My head hurts.","zh":"我头疼。","w":"H"},{"en":"My nose won't stop running.","zh":"鼻涕止不住。","w":"H"},{"en":"You should go home and rest.","zh":"你应该回家休息。","w":"H"},{"en":"Drink plenty of warm water.","zh":"多喝温水。","w":"H"},{"en":"feel awful","zh":"很难受","w":"H"},{"en":"a running nose","zh":"流鼻涕","w":"H"},{"en":"sneeze","zh":"打喷嚏","w":"H"},{"en":"soothe your throat","zh":"舒缓嗓子","w":"H"},{"en":"catch up","zh":"补上","w":"H"},{"en":"Your turn: in English, describe how you feel when you have a cold.","zh":"轮到你了：用英语描述你感冒时的感受。","w":"H"},{"en":"That's it for today. Next, we visit the dentist. See you on the next walk!","zh":"今天就到这里。下次我们去看牙医。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.48,"i":1},{"t":11.18,"i":2},{"t":15.12,"i":3},{"t":19.12,"i":4},{"t":24.74,"i":5},{"t":27.35,"i":6},{"t":32.37,"i":7},{"t":38.9,"i":8},{"t":45.47,"i":9},{"t":47.39,"i":10},{"t":53.79,"i":11},{"t":58.38,"i":12},{"t":62.96,"i":13},{"t":68.52,"i":14},{"t":71.83,"i":15},{"t":77.67,"i":27},{"t":84.44,"i":1},{"t":90.43,"i":2},{"t":95.46,"i":3},{"t":100.6,"i":4},{"t":107.72,"i":5},{"t":111.14,"i":6},{"t":117.51,"i":8},{"t":125.8,"i":9},{"t":128.38,"i":10},{"t":136.48,"i":11},{"t":142.35,"i":12},{"t":148.22,"i":13},{"t":155.26,"i":14},{"t":159.55,"i":16},{"t":164.17,"i":17},{"t":169.37,"i":18},{"t":174.67,"i":19},{"t":180.01,"i":20},{"t":185.82,"i":21},{"t":192.16,"i":22},{"t":197.68,"i":23},{"t":203.99,"i":24},{"t":209.44,"i":25},{"t":215.18,"i":26}],"count":28},{"id":70,"title":"牙疼看牙医","sub":"The Dentist","desc":"牙疼不是病，疼起来要命，别怕看牙医","audio":"audio/talk70.mp3","duration":221.0,"size":1326332,"lines":[{"en":"Welcome back. Today, we sit in the dentist's chair.","zh":"欢迎回来。今天我们坐在牙医的椅子上。","w":"H"},{"en":"My tooth has been hurting for two days. I think I have to go to the dentist.","zh":"我的牙疼了两天了。我觉得得去看牙医。","w":"A"},{"en":"Two days? You should've gone right away.","zh":"两天了？你早该去了。","w":"B"},{"en":"I know, but... the drill. I'm scared of the drill.","zh":"我知道，但是……那个钻头。我怕钻头。","w":"A"},{"en":"The longer you wait, the worse it gets. A tiny hole becomes a big one.","zh":"越拖越糟。小洞会变成大洞。","w":"C"},{"en":"You sound like my mom.","zh":"你说话跟我妈一样。","w":"A"},{"en":"Because she's right. Go today.","zh":"因为她是对的。今天就去。","w":"B"},{"en":"Going to the dentist isn't fun, but it stops a small problem from growing. Here's what to expect.","zh":"看牙医不好玩，但它能阻止小问题变大。来听听会经历什么。","w":"H"},{"en":"Okay, I'm going. What should I say when I get there?","zh":"好，我去。到了该说啥？","w":"A"},{"en":"Tell them where it hurts and how long. 'My back tooth hurts, for two days.'","zh":"告诉他们哪里疼、疼了多久。'我后边的牙疼，两天了。'","w":"C"},{"en":"And the drill... does it hurt?","zh":"那钻头……疼吗？","w":"A"},{"en":"They numb it first. You'll feel pressure, not pain.","zh":"他们会先打麻药。你会感觉有压力，不疼。","w":"B"},{"en":"Really? So my fear is for nothing?","zh":"真的？所以我白怕了？","w":"A"},{"en":"Mostly. And brush twice a day so you don't come back.","zh":"基本上是。还有每天刷两次牙，你就不用再来了。","w":"C"},{"en":"Deal. I'll brush like my life depends on it.","zh":"成交。我以后好好刷牙，跟保命似的。","w":"A"},{"en":"Slow down. Here are some dentist phrases.","zh":"放慢速度。来听几个看牙医的表达。","w":"H"},{"en":"My tooth has been hurting.","zh":"我的牙一直在疼。","w":"H"},{"en":"The longer you wait, the worse it gets.","zh":"越拖越糟。","w":"H"},{"en":"They numb it first.","zh":"他们会先打麻药。","w":"H"},{"en":"Brush twice a day.","zh":"每天刷两次牙。","w":"H"},{"en":"a toothache","zh":"牙疼","w":"H"},{"en":"the drill","zh":"钻头","w":"H"},{"en":"numb it","zh":"打麻药","w":"H"},{"en":"feel pressure, not pain","zh":"有压力，不疼","w":"H"},{"en":"brush twice a day","zh":"每天刷两次牙","w":"H"},{"en":"Your turn: in English, describe a health problem and when you'd see a doctor for it.","zh":"轮到你了：用英语描述一个健康问题，以及你什么时候会为它看医生。","w":"H"},{"en":"That's it for today. Next, we call in sick with a fever. See you on the next walk!","zh":"今天就到这里。下次我们发烧请假。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.98,"i":1},{"t":11.11,"i":2},{"t":14.81,"i":3},{"t":18.55,"i":4},{"t":25.72,"i":5},{"t":27.78,"i":6},{"t":31.07,"i":7},{"t":39.35,"i":8},{"t":43.17,"i":9},{"t":50.53,"i":10},{"t":52.74,"i":11},{"t":57.37,"i":12},{"t":60.61,"i":13},{"t":66.6,"i":14},{"t":70.3,"i":15},{"t":75.6,"i":27},{"t":82.38,"i":1},{"t":88.92,"i":2},{"t":93.68,"i":3},{"t":98.47,"i":4},{"t":107.48,"i":5},{"t":110.2,"i":6},{"t":114.46,"i":8},{"t":119.37,"i":9},{"t":128.62,"i":10},{"t":131.54,"i":11},{"t":137.46,"i":12},{"t":141.67,"i":13},{"t":149.26,"i":14},{"t":154.0,"i":16},{"t":159.2,"i":17},{"t":165.46,"i":18},{"t":170.23,"i":19},{"t":175.09,"i":20},{"t":180.83,"i":21},{"t":186.23,"i":22},{"t":191.46,"i":23},{"t":199.19,"i":24},{"t":205.69,"i":25},{"t":212.3,"i":26}],"count":28},{"id":71,"title":"发烧请假","sub":"Fever & Sick Leave","desc":"发烧了怎么请假，学会请假表达","audio":"audio/talk71.mp3","duration":210.2,"size":1261964,"lines":[{"en":"Welcome back. Today, we wake up with a fever.","zh":"欢迎回来。今天我们发烧醒来。","w":"H"},{"en":"Mom, I can't go to school. I'm burning up.","zh":"妈，我不能去上学了。我发烧了。","w":"A"},{"en":"Let me feel your forehead. Oh, you're really hot.","zh":"让我摸摸你额头。哦，你真的很烫。","w":"B"},{"en":"I told you. Can I stay home?","zh":"我就说吧。我能待在家吗？","w":"A"},{"en":"Yes, but first we take your temperature, and I'll call the teacher.","zh":"可以，但先量体温，我再给老师打电话。","w":"B"},{"en":"You don't need to call. Just let me sleep.","zh":"不用打了。让我睡就行。","w":"A"},{"en":"We have to tell the school. It's the rule.","zh":"得通知学校。这是规定。","w":"B"},{"en":"Staying home when you're sick is the right call — for you and your classmates. Here's how to ask for sick leave.","zh":"生病时待在家里，对你自己和同学都是对的。来听听怎么请假。","w":"H"},{"en":"When you have a fever, you should definitely stay home. You might be contagious.","zh":"发烧时你绝对该待在家。你可能有传染性。","w":"C"},{"en":"How do I ask for a day off properly?","zh":"怎么才能正式地请个假？","w":"A"},{"en":"Your parent calls, or you write a note. Say the reason and how long.","zh":"你家长打电话，或者你写张假条。说明原因和天数。","w":"B"},{"en":"Like, 'I have a fever, so I can't come to school today'?","zh":"比如，'我发烧了，今天不能来上学'？","w":"A"},{"en":"Exactly. And ask a classmate for the homework you miss.","zh":"没错。再让同学帮你带落下的作业。","w":"B"},{"en":"Good idea. I'll ask Leo to save my notes.","zh":"好主意。我让 Leo 帮我记笔记。","w":"A"},{"en":"Slow down. Here are some phrases for sick leave.","zh":"放慢速度。来听几个请假的表达。","w":"H"},{"en":"I'm burning up.","zh":"我发烧了。","w":"H"},{"en":"Take your temperature.","zh":"量体温。","w":"H"},{"en":"I can't come to school today.","zh":"我今天不能来上学。","w":"H"},{"en":"Ask a classmate for the homework.","zh":"让同学帮你带作业。","w":"H"},{"en":"a fever","zh":"发烧","w":"H"},{"en":"feel your forehead","zh":"摸摸额头","w":"H"},{"en":"take your temperature","zh":"量体温","w":"H"},{"en":"sick leave","zh":"病假","w":"H"},{"en":"contagious","zh":"有传染性","w":"H"},{"en":"Your turn: in English, write what you'd say to ask for a day off from school.","zh":"轮到你了：用英语写一段你会怎么向学校请假的话。","w":"H"},{"en":"That's it for today. Next, we get glasses. See you on the next walk!","zh":"今天就到这里。下次我们配眼镜。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.67,"i":1},{"t":9.58,"i":2},{"t":13.85,"i":3},{"t":16.68,"i":4},{"t":22.1,"i":5},{"t":25.26,"i":6},{"t":28.98,"i":7},{"t":37.79,"i":8},{"t":44.92,"i":9},{"t":47.77,"i":10},{"t":53.46,"i":11},{"t":57.7,"i":12},{"t":62.67,"i":13},{"t":66.48,"i":14},{"t":72.08,"i":26},{"t":78.85,"i":1},{"t":83.88,"i":2},{"t":89.36,"i":3},{"t":93.05,"i":4},{"t":99.95,"i":5},{"t":104.06,"i":6},{"t":108.85,"i":8},{"t":117.84,"i":9},{"t":121.57,"i":10},{"t":128.78,"i":11},{"t":134.22,"i":12},{"t":140.54,"i":13},{"t":145.45,"i":15},{"t":149.95,"i":16},{"t":154.75,"i":17},{"t":159.97,"i":18},{"t":165.63,"i":19},{"t":171.22,"i":20},{"t":177.51,"i":21},{"t":183.89,"i":22},{"t":189.77,"i":23},{"t":195.67,"i":24},{"t":202.07,"i":25}],"count":27},{"id":72,"title":"近视配眼镜","sub":"Getting Glasses","desc":"看不清黑板，去配一副合适的眼镜","audio":"audio/talk72.mp3","duration":213.7,"size":1282844,"lines":[{"en":"Welcome back. Today, we can finally see clearly — getting glasses.","zh":"欢迎回来。今天我们终于能看清了——配眼镜。","w":"H"},{"en":"I've been squinting at the blackboard all week. I think I need glasses.","zh":"我这一周都眯着眼看黑板。我觉得我需要眼镜。","w":"A"},{"en":"That's a sign. Can you read that sign across the street?","zh":"这是个信号。你能看清街对面那个牌子吗？","w":"B"},{"en":"There's a sign?","zh":"有牌子吗？","w":"A"},{"en":"Yep. Time for an eye test.","zh":"完了。该去测视力了。","w":"C"},{"en":"But glasses will change my whole look.","zh":"可眼镜会改变我整个形象。","w":"A"},{"en":"Squinting changes your look more, trust me.","zh":"相信我，眯眼更毁形象。","w":"B"},{"en":"Many students need glasses and don't know it. Here's what happens at the eye doctor.","zh":"很多学生近视了自己还不知道。来听听看眼科医生时会经历什么。","w":"H"},{"en":"The eye test is easy. You read letters on a chart, big to small.","zh":"测视力很简单。你看表上的字母，从大到小。","w":"C"},{"en":"And then they give me glasses right there?","zh":"然后当场就给我配眼镜？","w":"A"},{"en":"Not exactly. They check your eyes, then you pick a frame you like.","zh":"不完全是。他们检查眼睛，然后你挑个喜欢的镜框。","w":"B"},{"en":"Frames! Okay, that part I'm excited about.","zh":"镜框！好，这部分我期待。","w":"A"},{"en":"Just pick something comfortable and light. You'll wear it all day.","zh":"挑个舒服又轻的。你得戴一整天。","w":"C"},{"en":"Got it. And take care of my eyes — less phone, more breaks.","zh":"明白。还要爱护眼睛——少看手机，多休息。","w":"A"},{"en":"Slow down. Here are some phrases about glasses.","zh":"放慢速度。来听几个关于眼镜的表达。","w":"H"},{"en":"I've been squinting at the blackboard.","zh":"我眯着眼看黑板。","w":"H"},{"en":"I need an eye test.","zh":"我需要测视力。","w":"H"},{"en":"Read letters on a chart.","zh":"看表上的字母。","w":"H"},{"en":"Pick a frame you like.","zh":"挑个喜欢的镜框。","w":"H"},{"en":"squint","zh":"眯眼","w":"H"},{"en":"an eye test","zh":"测视力","w":"H"},{"en":"a frame","zh":"镜框","w":"H"},{"en":"comfortable and light","zh":"舒服又轻","w":"H"},{"en":"take care of my eyes","zh":"爱护眼睛","w":"H"},{"en":"Your turn: in English, describe one habit you'd change to protect your eyes.","zh":"轮到你了：用英语描述一个你想改的护眼习惯。","w":"H"},{"en":"That's it for today. Next, we get moving — staying fit. See you on the next walk!","zh":"今天就到这里。下次我们动起来——锻炼身体。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.35,"i":1},{"t":12.43,"i":2},{"t":16.85,"i":3},{"t":18.57,"i":4},{"t":22.99 d up and stretch between classes. Move your shoulders, your neck.","zh":"课间起来伸展一下。动动肩膀、脖子。","w":"C"},{"en":"Okay. Ten minutes of walking, plus stretches. I can do this.","zh":"好。十分钟走路，加上伸展。我能做到。","w":"A"},{"en":"Slow down. Here are some fitness phrases.","zh":"放慢速度。来听几个锻炼的表达。","w":"H"},{"en":"Moving your body gives you energy.","zh":"活动身体让你更有精力。","w":"H"},{"en":"Start tiny, ten minutes a day.","zh":"从极小开始，每天十分钟。","w":"H"},{"en":"Walking counts.","zh":"走路也算。","w":"H"},{"en":"Stand up and stretch.","zh":"起来伸展一下。","w":"H"},{"en":"exercise","zh":"锻炼","w":"H"},{"en":"gives you energy","zh":"给你精力","w":"H"},{"en":"start tiny","zh":"从极小开始","w":"H"},{"en":"the key is","zh":"关键是","w":"H"},{"en":"stretch","zh":"伸展","w":"H"},{"en":"Your turn: in English, describe one simple exercise you can do every day.","zh":"轮到你了：用英语描述一个你每天能做的简单锻炼。","w":"H"},{"en":"That's it for today. Next, we talk about sleep and health. See you on the next walk!","zh":"今天就到这里。下次我们聊睡眠与健康。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.22,"i":1},{"t":10.7,"i":2},{"t":15.98,"i":3},{"t":18.19,"i":4},{"t":23.95,"i":5},{"t":27.71,"i":6},{"t":33.28,"i":7},{"t":39.88,"i":8},{"t":43.41,"i":9},{"t":50.27,"i":10},{"t":53.15,"i":11},{"t":59.72,"i":12},{"t":63.39,"i":13},{"t":70.44,"i":14},{"t":75.87,"i":15},{"t":81.12,"i":27},{"t":87.9,"i":1},{"t":93.64,"i":2},{"t":100.35,"i":3},{"t":103.27,"i":4},{"t":110.55,"i":5},{"t":115.39,"i":6},{"t":122.43,"i":8},{"t":126.98,"i":9},{"t":135.63,"i":10},{"t":139.39,"i":11},{"t":147.68,"i":12},{"t":152.42,"i":13},{"t":161.31,"i":14},{"t":168.19,"i":16},{"t":173.92,"i":17},{"t":179.93,"i":18},{"t":184.65,"i":19},{"t":189.73,"i":20},{"t":195.88,"i":21},{"t":202.09,"i":22},{"t":208.16,"i":23},{"t":214.21,"i":24},{"t":219.76,"i":25},{"t":226.39,"i":26}],"count":28},{"id":74,"title":"睡眠与健康","sub":"Sleep & Health","desc":"睡够觉，身体和大脑才能好好工作","audio":"audio/talk74.mp3","duration":211.8,"size":1271612,"lines":[{"en":"Welcome back. Today, we talk about the thing we all love — sleep.","zh":"欢迎回来。今天我们聊聊大家都爱的事——睡眠。","w":"H"},{"en":"I stayed up till midnight again. I feel like a zombie.","zh":"我又熬夜到半夜了。我感觉自己像僵尸。","w":"A"},{"en":"How many hours do you usually get?","zh":"你通常睡几个小时？","w":"B"},{"en":"Six, maybe. On weekends I sleep ten.","zh":"六小时，可能吧。周末睡十小时。","w":"A"},{"en":"Teenagers need about eight to ten hours. You're running on empty.","zh":"青少年需要八到十小时。你是在透支。","w":"C"},{"en":"I know, but there's always one more video...","zh":"我知道，可总还有'最后一个视频'……","w":"A"},{"en":"Sleep isn't lazy — it's when your body and brain recover. Here's why it matters.","zh":"睡觉不是懒——它是身体和大脑恢复的时候。来听听为什么重要。","w":"H"},{"en":"When you sleep, your brain sorts what you learned that day.","zh":"你睡觉时，大脑会整理你当天学的东西。","w":"B"},{"en":"So sleeping helps my grades?","zh":"所以睡觉能帮我提成绩？","w":"A"},{"en":"More than one more hour of studying does, sometimes.","zh":"有时候比多学一小时还管用。","w":"B"},{"en":"And a regular bedtime matters. Same time every night.","zh":"规律的作息很重要。每天同一时间睡。","w":"C"},{"en":"Even weekends?","zh":"周末也是？","w":"A"},{"en":"Even weekends. Big changes confuse your body clock.","zh":"周末也是。作息大起大落会打乱生物钟。","w":"C"},{"en":"Okay. Phone away, lights off, same time every night. I'll try.","zh":"好。手机拿开，关灯，每天同一时间睡。我试试。","w":"A"},{"en":"Slow down. Here are some sleep phrases.","zh":"放慢速度。来听几个关于睡眠的表达。","w":"H"},{"en":"I stayed up till midnight.","zh":"我熬夜到半夜。","w":"H"},{"en":"I feel like a zombie.","zh":"我感觉像僵尸。","w":"H"},{"en":"Teenagers need eight to ten hours.","zh":"青少年需要八到十小时。","w":"H"},{"en":"Keep a regular bedtime.","zh":"保持规律作息。","w":"H"},{"en":"stay up late","zh":"熬夜","w":"H"},{"en":"run on empty","zh":"透支","w":"H"},{"en":"sort what you learned","zh":"整理学到的内容","w":"H"},{"en":"a regular bedtime","zh":"规律作息","w":"H"},{"en":"body clock","zh":"生物钟","w":"H"},{"en":"Your turn: in English, describe your sleep habits and one thing you'd improve.","zh":"轮到你了：用英语描述你的睡眠习惯，以及你想改进的一点。","w":"H"},{"en en":"First, dig a hole twice as wide as the roots.","zh":"首先，挖一个比根宽一倍的坑。","w":"C"},{"en":"How deep?","zh":"多深？","w":"A"},{"en":"Deep enough that the roots are covered, but the trunk isn't buried.","zh":"深到盖住根，但不埋住树干。","w":"C"},{"en":"Then put the tree in, fill with soil, and press it gently.","zh":"然后把树放进去，填土，轻轻压实。","w":"B"},{"en":"And water it?","zh":"然后浇水？","w":"A"},{"en":"A lot, the first few weeks. It helps the roots settle.","zh":"头几周要浇很多。帮根扎稳。","w":"B"},{"en":"Got it. I'll take care of mine like a pet.","zh":"明白。我会像养宠物一样照顾它。","w":"A"},{"en":"Slow down. Here are some tree-planting phrases.","zh":"放慢速度。来听几个种树的表达。","w":"H"},{"en":"Dig a hole twice as wide as the roots.","zh":"挖一个比根宽一倍的坑。","w":"H"},{"en":"Fill with soil and press gently.","zh":"填土，轻轻压实。","w":"H"},{"en":"Water it a lot the first few weeks.","zh":"头几周要浇很多水。","w":"H"},{"en":"It helps the roots settle.","zh":"帮根扎稳。","w":"H"},{"en":"plant a tree","zh":"种树","w":"H"},{"en":"dig a hole","zh":"挖坑","w":"H"},{"en":"the roots","zh":"根","w":"H"},{"en":"fill with soil","zh":"填土","w":"H"},{"en":"settle","zh":"扎根","w":"H"},{"en":"Your turn: in English, describe how to plant a tree in three steps.","zh":"轮到你了：用英语分三步描述怎么种树。","w":"H"},{"en":"That's it for today. Next, we care for animals. See you on the next walk!","zh":"今天就到这里。下次我们爱护小动物。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.67,"i":1},{"t":10.75,"i":2},{"t":14.64,"i":3},{"t":17.59,"i":4},{"t":23.59,"i":5},{"t":28.36,"i":6},{"t":35.51,"i":7},{"t":40.26,"i":8},{"t":41.85,"i":9},{"t":46.96,"i":10},{"t":51.95,"i":11},{"t":53.67,"i":12},{"t":58.59,"i":13},{"t":62.07,"i":14},{"t":67.64,"i":26},{"t":74.41,"i":1},{"t":79.63,"i":2},{"t":84.61,"i":3},{"t":88.46,"i":4},{"t":96.06,"i":5},{"t":102.14,"i":7},{"t":108.18,"i":8},{"t":110.33,"i":9},{"t":116.82,"i":10},{"t":123.17,"i":11},{"t":125.51,"i":12},{"t":131.76,"i":13},{"t":136.26,"i":15},{"t":142.3,"i":16 ay cat","zh":"流浪猫","w":"H"},{"en":"come to you","zh":"自己过来","w":"H"},{"en":"sniff your hand","zh":"闻你的手","w":"H"},{"en":"protect itself","zh":"自保","w":"H"},{"en":"an animal shelter","zh":"动物救助站","w":"H"},{"en":"Your turn: in English, describe how you'd help a lost or stray animal safely.","zh":"轮到你了：用英语描述你会怎么安全地帮助一只走失或流浪的动物。","w":"H"},{"en":"That's it for today. Next, we celebrate — Thanksgiving. See you on the next walk!","zh":"今天就到这里。下次我们过节——感恩节。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.42,"i":1},{"t":11.4,"i":2},{"t":16.2,"i":3},{"t":19.53,"i":4},{"t":25.87,"i":5},{"t":29.1,"i":6},{"t":35.66,"i":7},{"t":40.58,"i":8},{"t":41.94,"i":9},{"t":46.36,"i":10},{"t":51.99,"i":11},{"t":55.23,"i":12},{"t":61.09,"i":13},{"t":64.73,"i":14},{"t":70.28,"i":26},{"t":77.05,"i":1},{"t":82.17,"i":2},{"t":88.28,"i":3},{"t":92.61,"i":4},{"t":100.62,"i":5},{"t":104.83,"i":7},{"t":111.08,"i":8},{"t":112.97,"i":9},{"t":118.62,"i":10},{"t":125.76,"i":11},{"t":129.97,"i":12},{"t":137.37,"i":13},{"t":142.07,"i":15},{"t":147.75,"i":16},{"t":152.47,"i":17},{"t":157.83,"i":18},{"t":162.99,"i":19},{"t":169.13,"i":20},{"t":174.82,"i":21},{"t":180.87,"i":22},{"t":187.37,"i":23},{"t":194.02,"i":24},{"t":200.79,"i":25}],"count":27},{"id":79,"title":"感恩节","sub":"Thanksgiving","desc":"感恩节的由来与传统，学会说感谢","audio":"audio/talk79.mp3","duration":198.4,"size":1190828,"lines":[{"en":"Welcome back. Today, we give thanks — it's Thanksgiving.","zh":"欢迎回来。今天我们表达感谢——感恩节。","w":"H"},{"en":"Our English class is learning about Thanksgiving. What's it really about?","zh":"我们英语课在学感恩节。它到底是关于什么的？","w":"A"},{"en":"It's an American holiday where families gather and give thanks.","zh":"这是美国家庭团聚、表达感谢的节日。","w":"B"},{"en":"And there's a big dinner — turkey, potatoes, pumpkin pie.","zh":"还有顿大餐——火鸡、土豆、南瓜派。","w":"C"},{"en":"Turkey? Why turkey?","zh":"火鸡？为什么是火鸡？","w":"A"},{"en":"It's tradition. And everyone says what they're thankful for.","zh":"这是传统。大家还会说自己在感谢什么。","w":"B"},{"en":"Thanksgiving is a good reminder to say thank you. Let's hear more.","zh":"感恩节是个提醒我们说谢谢的好时机。来多听听。","w":"H"},{"en":"So people take turns saying thanks?","zh":"所以大家轮流说感谢？","w":"A"},{"en":"Right. Even the smallest things — a warm meal, a good friend.","zh":"对。再小的事也行——一顿热饭、一个好朋友。","w":"C"},{"en":"I like that. What would you be thankful for?","zh":"我喜欢。你会感谢什么？","w":"A"},{"en":"My family, and that I get to go to school.","zh":"感谢我的家人，还有我能上学。","w":"B"},{"en":"I'm thankful for my health and my friends like you two.","zh":"感谢我的健康，还有像你俩这样的朋友。","w":"C"},{"en":"Now I feel bad for complaining about homework.","zh":"现在我都不好意思抱怨作业了。","w":"A"},{"en":"Slow down. Here are some Thanksgiving phrases.","zh":"放慢速度。来听几个感恩节的表达。","w":"H"},{"en":"Families gather and give thanks.","zh":"家人团聚，表达感谢。","w":"H"},{"en":"There's a big dinner.","zh":"有顿大餐。","w":"H"},{"en":"Say what you're thankful for.","zh":"说你在感谢什么。","w":"H"},{"en":"I'm thankful for my family.","zh":"我感谢我的家人。","w":"H"},{"en":"give thanks","zh":"表达感谢","w":"H"},{"en":"gather","zh":"团聚","w":"H"},{"en":"thankful for","zh":"为……而感谢","w":"H"},{"en":"take turns","zh":"轮流","w":"H"},{"en":"a warm meal","zh":"一顿热饭","w":"H"},{"en":"Your turn: in English, name three things you're thankful for.","zh":"轮到你了：用英语说出三件你感谢的事。","w":"H"},{"en":"That's it for today. Next, things get spooky — Halloween. See you on the next walk!","zh":"今天就到这里。下次来点吓人的——万圣节。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.31,"i":1},{"t":11.26,"i":2},{"t":16.37,"i":3},{"t":22.0,"i":4},{"t":24.45,"i":5},{"t":29.34,"i":6},{"t":35.68,"i":7},{"t":38.51,"i":8},{"t":45.45,"i":9},{"t":48.83,"i":10},{"t":52.31,"i":11},{"t":56.86,"i":12},{"t":60.37,"i":13},{"t":65.89,"i":25},{"t":72.66,"i":1},{"t":78.94,"i":2},{"t":85.43,"i":3},{"t":92.57,"i":4},{"t":95.8,"i":5},{"t":102.0,"i":7},{"t":105.71,"i":8},{"t":114.46," 玩。","w":"A"},{"en":"Those are actually good rules. It protects your eyes and your sleep.","zh":"这些规矩其实挺好。保护眼睛和睡眠。","w":"B"},{"en":"A phone is a tool, not a boss. Here's how to use it well.","zh":"手机是工具，不是主人。来听听怎么用好它。","w":"H"},{"en":"So how do I not become a phone zombie?","zh":"那我怎么才能不变成手机僵尸？","w":"A"},{"en":"Set limits. Use the screen-time feature, and put it away for homework.","zh":"设定时限。用屏幕时间功能，写作业时放一边。","w":"C"},{"en":"And don't sleep with it next to your pillow. Charge it across the room.","zh":"还有别把它放枕头边睡。放到房间另一头充电。","w":"B"},{"en":"Across the room? That's so far.","zh":"房间另一头？太远了。","w":"A"},{"en":"Exactly the point. You'll scroll less and sleep better.","zh":"要的就是这个。你会少刷手机、睡得更好。","w":"B"},{"en":"Fine. Phone as a tool, not a boss. Got it.","zh":"行。手机是工具，不是主人。明白。","w":"A"},{"en":"Slow down. Here are some phrases about phones.","zh":"放慢速度。来听几个关于手机的表达。","w":"H"},{"en":"I finally got my first phone.","zh":"我终于有自己的第一部手机了。","w":"H"},{"en":"No phone at the dinner table.","zh":"吃饭时不碰手机。","w":"H"},{"en":"Put it away for homework.","zh":"写作业时放一边。","w":"H"},{"en":"Charge it across the room.","zh":"放到房间另一头充电。","w":"H"},{"en":"secondhand","zh":"二手的","w":"H"},{"en":"a phone zombie","zh":"手机僵尸","w":"H"},{"en":"screen time","zh":"屏幕时间","w":"H"},{"en":"put it away","zh":"放一边","w":"H"},{"en":"scroll less","zh":"少刷手机","w":"H"},{"en":"Your turn: in English, describe one rule you'd set for using a phone.","zh":"轮到你了：用英语描述一条你会为使用手机设定的规则。","w":"H"},{"en":"That's it for today. Next, we talk social media. See you on the next walk!","zh":"今天就到这里。下次我们聊社交媒体。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.34,"i":1},{"t":11.18,"i":2},{"t":14.9,"i":3},{"t":19.46,"i":4},{"t":24.23,"i":5},{"t":27.93,"i":6},{"t":33.25,"i":7},{"t":39.45,"i":8},{"t":42.35,"i":9},{"t":49.55,"i":10},{"t":54.9,"i":11},{"t":58.04,"i":12},{"t":63.08,"i":13},{"t":67.59,"i":14},{"t":73.16,"i":26},{"t":79.93, estion is, who's in charge — you or the game?","zh":"问题是，谁做主——你还是游戏？","w":"C"},{"en":"The game, clearly. It always wins.","zh":"显然是游戏。它总是赢。","w":"A"},{"en":"Then it's time to set a timer before you start.","zh":"那你该在开打前定个闹钟。","w":"B"},{"en":"Gaming is fun, and it can even be good for your brain. The key is balance.","zh":"打游戏有趣，甚至对大脑有好处。关键是平衡。","w":"H"},{"en":"So games can be good for you?","zh":"所以游戏还能有好处？","w":"A"},{"en":"Some improve your reaction and problem-solving. But only in moderation.","zh":"有些能提升反应和解决问题的能力。但要适度。","w":"C"},{"en":"Set a time, like forty minutes. When the timer rings, save and stop.","zh":"定个时间，比如四十分钟。闹钟响了就存档停手。","w":"B"},{"en":"But stopping in the middle is so hard.","zh":"可打到一半停下来太难了。","w":"A"},{"en":"Finish the round, then stop. Don't start a new one.","zh":"打完这局就停。别再开新局。","w":"C"},{"en":"And what if I keep playing anyway?","zh":"要是我还是继续打呢？","w":"A"},{"en":"Then it's time to talk to your parents and make a plan together.","zh":"那就要跟父母谈谈，一起定个计划。","w":"B"},{"en":"Slow down. Here are some gaming phrases.","zh":"放慢速度。来听几个打游戏的表达。","w":"H"},{"en":"Just one more round.","zh":"再打一局。","w":"H"},{"en":"Set a timer before you start.","zh":"开打前定个闹钟。","w":"H"},{"en":"Finish the round, then stop.","zh":"打完这局就停。","w":"H"},{"en":"Who's in charge, you or the game?","zh":"谁做主，你还是游戏？","w":"H"},{"en":"one more round","zh":"再打一局","w":"H"},{"en":"get hooked","zh":"上瘾","w":"H"},{"en":"in charge","zh":"做主","w":"H"},{"en":"set a timer","zh":"定闹钟","w":"H"},{"en":"in moderation","zh":"适度","w":"H"},{"en":"Your turn: in English, describe how you'd balance gaming with study.","zh":"轮到你了：用英语描述你会怎么平衡打游戏和学习。","w":"H"},{"en":"That's it for today. Next, we learn online. See you on the next walk!","zh":"今天就到这里。下次我们上网课。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.06,"i":1},{"t":11.21,"i":2},{"t":15.69,"i":3},{"t":20.78,"i":4},{"t":24.38,"i":5},{"t":27.9,"i":6},{"t ng hurts your eyes.","zh":"还要休息。盯着屏幕太久伤眼睛。","w":"C"},{"en":"Got it. Learn, check sources, rest my eyes.","zh":"明白。学习、核对来源、让眼睛休息。","w":"A"},{"en":"Slow down. Here are some online learning phrases.","zh":"放慢速度。来听几个在线学习的表达。","w":"H"},{"en":"I found this app that teaches English.","zh":"我发现一个教英语的 App。","w":"H"},{"en":"Little and often beats cramming.","zh":"少量多次胜过突击。","w":"H"},{"en":"Pick good sources.","zh":"挑好资源。","w":"H"},{"en":"Take breaks from the screen.","zh":"别一直盯着屏幕，要休息。","w":"H"},{"en":"stay focused","zh":"保持专注","w":"H"},{"en":"little and often","zh":"少量多次","w":"H"},{"en":"cramming","zh":"突击学习","w":"H"},{"en":"dead time","zh":"碎片时间","w":"H"},{"en":"take breaks","zh":"休息","w":"H"},{"en":"Your turn: in English, describe one way you use the internet to learn.","zh":"轮到你了：用英语描述一种你用网络学习的方式。","w":"H"},{"en":"That's it for today. Next, we watch short videos. See you on the next walk!","zh":"今天就到这里。下次我们刷短视频。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.94,"i":1},{"t":12.26,"i":2},{"t":17.76,"i":3},{"t":23.25,"i":4},{"t":28.65,"i":5},{"t":32.39,"i":6},{"t":39.35,"i":7},{"t":42.45,"i":8},{"t":46.89,"i":9},{"t":52.31,"i":10},{"t":57.49,"i":11},{"t":60.32,"i":12},{"t":67.11,"i":13},{"t":71.55,"i":14},{"t":77.24,"i":26},{"t":84.01,"i":1},{"t":90.79,"i":2},{"t":97.74,"i":3},{"t":104.71,"i":4},{"t":111.56,"i":5},{"t":116.37,"i":7},{"t":120.37,"i":8},{"t":126.05,"i":9},{"t":132.92,"i":10},{"t":139.49,"i":11},{"t":143.19,"i":12},{"t":151.77,"i":13},{"t":157.45,"i":15},{"t":163.32,"i":16},{"t":168.98,"i":17},{"t":173.91,"i":18},{"t":179.14,"i":19},{"t":185.38,"i":20},{"t":191.71,"i":21},{"t":196.95,"i":22},{"t":202.63,"i":23},{"t":208.54,"i":24},{"t":214.57,"i":25}],"count":27},{"id":89,"title":"短视频","sub":"Short Videos","desc":"短视频让人上瘾，学会控制观看","audio":"audio/talk89.mp3","duration":204.5,"size":1227548,"lines":[{"en":"Welcome back. Today, we talk about the thing that eats our time — short videos.","zh":"欢迎回来。今天我们聊聊那个吞噬时间的东西——短视频。","w":"H"},{"en":"I sat down to watch one video and suddenly it was midnight.","zh":"我坐下来看一个视频，突然就半夜了。","w":"A"},{"en":"The algorithm knows exactly what to show you next.","zh":"算法太懂下一步该给你看什么了。","w":"B"},{"en":"That's not an accident. Every swipe is designed to keep you watching.","zh":"这不是巧合。每一次滑动都是设计好让你看下去的。","w":"C"},{"en":"It's scary how fast time goes.","zh":"时间过得快得吓人。","w":"A"},{"en":"The trick is to decide your limit before you open the app.","zh":"诀窍是打开 App 前先定好时长。","w":"B"},{"en":"Short videos can be fun and even useful. But without a limit, they eat your day.","zh":"短视频可以有趣甚至有用。但不设限，它就会吃掉你的一天。","w":"H"},{"en":"So how do I control it?","zh":"那我怎么控制？","w":"A"},{"en":"Set a timer before you start. When it rings, close the app.","zh":"开始前定闹钟。一响就关掉 App。","w":"C"},{"en":"Or watch for a reason — learn a skill, not just pass time.","zh":"或者带着目的看——学个技能，而不是打发时间。","w":"B"},{"en":"I do follow some cooking and drawing accounts. Those are useful.","zh":"我确实关注了一些做菜和画画的账号。那些有用。","w":"A"},{"en":"Then keep the useful ones and cut the rest.","zh":"那就留有用的，删掉其他的。","w":"C"},{"en":"Good plan. Watch less, learn more.","zh":"好计划。少看点，多学点。","w":"A"},{"en":"Slow down. Here are some phrases about short videos.","zh":"放慢速度。来听几个关于短视频的表达。","w":"H"},{"en":"Suddenly it was midnight.","zh":"突然就半夜了。","w":"H"},{"en":"Every swipe is designed to keep you watching.","zh":"每次滑动都是设计好让你看下去的。","w":"H"},{"en":"Decide your limit before you open the app.","zh":"打开 App 前先定好时长。","w":"H"},{"en":"Watch less, learn more.","zh":"少看点，多学点。","w":"H"},{"en":"the algorithm","zh":"算法","w":"H"},{"en":"every swipe","zh":"每次滑动","w":"H"},{"en":"set a timer","zh":"定闹钟","w":"H"},{"en":"pass time","zh":"打发时间","w":"H"},{"en":"cut the rest","zh":"删掉其他的","w":"H"},{"en":"Your turn: in English, describe how you'd limit your short-video time.","zh":"轮到你了：用英语描述你会怎么限制自己刷短视频的时间。","w":"H"},{"en":"That's it for today. Next, we make up with a friend. See you on the next walk!","zh":"今天就到这里。下次我们和朋友和好。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.51,"i":1},{"t":12.0,"i":2},{"t":15.91,"i":3},{"t":22.36,"i":4},{"t":25.19,"i":5},{"t":29.37,"i":6},{"t":36.76,"i":7},{"t":39.02,"i":8},{"t":45.61,"i":9},{"t":50.6,"i":10},{"t":55.19,"i":11},{"t":59.43,"i":12},{"t":63.01,"i":13},{"t":68.89,"i":25},{"t":75.66,"i":1},{"t":81.38,"i":2},{"t":86.41,"i":3},{"t":94.56,"i":4},{"t":98.24,"i":5},{"t":103.58,"i":7},{"t":106.55,"i":8},{"t":114.89,"i":9},{"t":121.24,"i":10},{"t":127.08,"i":11},{"t":132.52,"i":12},{"t":137.11,"i":14},{"t":142.36,"i":15},{"t":148.57,"i":16},{"t":154.66,"i":17},{"t":160.14,"i":18},{"t":166.22,"i":19},{"t":172.1,"i":20},{"t":178.24,"i":21},{"t":184.02,"i":22},{"t":190.02,"i":23},{"t":196.13,"i":24}],"count":26},{"id":90,"title":"和好朋友吵架","sub":"Making Up with a Friend","desc":"吵架了怎么和好，学会道歉与沟通","audio":"audio/talk90.mp3","duration":223.1,"size":1339004,"lines":[{"en":"Welcome back. Today, we fix a friendship — making up with a friend.","zh":"欢迎回来。今天我们修复友谊——和朋友和好。","w":"H"},{"en":"I had a fight with my best friend. We haven't talked in two days.","zh":"我和最好的朋友吵架了。两天没说话了。","w":"A"},{"en":"That's a long time. What happened?","zh":"那挺久了。怎么了？","w":"B"},{"en":"I said something mean, and now I don't know how to fix it.","zh":"我说了句难听的话，现在不知道该怎么挽回。","w":"A"},{"en":"Start with a simple sorry. Not 'sorry, but...' — just sorry.","zh":"先简单地道个歉。不是'对不起，但是……'——就只是对不起。","w":"C"},{"en":"What if he doesn't accept it?","zh":"要是他不接受呢？","w":"A"},{"en":"Give him time. An apology is a door you open, not one you push through.","zh":"给他时间。道歉是打开一扇门，不是硬闯进去。","w":"B"},{"en":"Every friendship has bumps. The strong ones know how to repair. Here's how.","zh":"每段友谊都有磕碰。牢固的友谊懂得修复。来听听怎么做。","w":"H"},{"en":"How do I say sorry without sounding fake?","zh":"怎么道歉才不显得假？","w":"A"},{"en":"Be specific. 'I'm sorry I said that about your drawing. It was wrong.'","zh":"说具体点。'对不起，我那样说你画的事。是我错了。'","w":"C"},{"en":"And listen. Don't interrupt while he tells you how he feels.","zh":"还要倾听。他说感受时别打断。","w":"B"},{"en":"Then we just move on like nothing happened?","zh":"然后就像没事一样继续？","w":"A"},{"en":"Not exactly. You learn from it, so it doesn't happen again.","zh":"不完全是。你从中吸取教训，让它不再发生。","w":"C"},{"en":"Okay. Sorry, listen, and learn. I can do that.","zh":"好。道歉、倾听、吸取教训。我能做到。","w":"A"},{"en":"Slow down. Here are some phrases for making up.","zh":"放慢速度。来听几个和好的表达。","w":"H"},{"en":"We haven't talked in two days.","zh":"我们两天没说话了。","w":"H"},{"en":"Start with a simple sorry.","zh":"先简单地道个歉。","w":"H"},{"en":"I'm sorry I said that.","zh":"对不起，我说了那样的话。","w":"H"},{"en":"Give him time.","zh":"给他时间。","w":"H"},{"en":"had a fight","zh":"吵架","w":"H"},{"en":"say sorry","zh":"道歉","w":"H"},{"en":"an apology","zh":"道歉","w":"H"},{"en":"be specific","zh":"说具体点","w":"H"},{"en":"move on","zh":"继续前进","w":"H"},{"en":"Your turn: in English, write a short apology to a friend you hurt.","zh":"轮到你了：用英语写一段向你伤害过的朋友道歉的话。","w":"H"},{"en":"That's it for today. Next, we handle exam stress. See you on the next walk!","zh":"今天就到这里。下次我们应对考试焦虑。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.99,"i":1},{"t":11.69,"i":2},{"t":15.31,"i":3},{"t":19.46,"i":4},{"t":26.35,"i":5},{"t":28.62,"i":6},{"t":34.81,"i":7},{"t":42.78,"i":8},{"t":46.17,"i":9},{"t":53.92,"i":10},{"t":58.71,"i":11},{"t":61.57,"i":12},{"t":67.9,"i":13},{"t":72.87,"i":14},{"t":78.37,"i":26},{"t":85.14,"i":1},{"t":91.13,"i":2},{"t":95.79,"i":3},{"t":101.09,"i":4},{"t":109.76,"i":5},{"t":112.77,"i":6},{"t":120.61,"i":8},{"t":124.99,"i":9},{"t":134.75,"i":10},{"t":140.85,"i":11},{"t":144.56,"i":12},{"t":152.57,"i":13},{"t":158.89,"i":15},{"t":164.31,"i":16},{"t":169.58,"i":17},{"t":174.71,"i":18},{"t":179.23,"i":19},{"t":185.11,"i":20},{"t":190.92,"i":21},{"t":196.99,"i":22},{"t":203.14,"i":23},{"t":208.54,"i":24},{"t":214.5,"i":25}],"count":27},{"id":91,"title":"考试焦虑","sub":"Exam Stress","desc":"考试前的紧张，学会放松与复习","audio":"audio/talk91.mp3","duration":220.3,"size":1322156,"lines":[{"en":"Welcome back. Today, we talk about the butterflies before a big test — exam stress.","zh":"欢迎回来。今天我们聊聊大考前的紧张——考试焦虑。","w":"H"},{"en":"The exam is tomorrow and my brain feels like scrambled eggs.","zh":"明天考试，我脑子乱成一锅粥。","w":"A"},{"en":"That's normal. A little nerves actually help you focus.","zh":"这很正常。一点点紧张其实能帮你集中注意力。","w":"B"},{"en":"A little? I can't even sleep.","zh":"一点点？我都睡不着了。","w":"A"},{"en":"Then stop cramming. Your brain needs rest to remember things.","zh":"那就别突击了。大脑需要休息才能记住东西。","w":"C"},{"en":"But there's so much left to review!","zh":"可还有好多没复习呢！","w":"A"},{"en":"Review the main points, then stop. Trust what you know.","zh":"复习重点，然后停。相信你已经会的东西。","w":"B"},{"en":"Exam stress is real, but you can manage it. Here's how.","zh":"考试焦虑是真的，但你能应对。来听听怎么做。","w":"H"},{"en":"The night before, sleep early. A rested brain beats a tired one.","zh":"考前一晚早点睡。休息好的大脑胜过疲惫的。","w":"C"},{"en":"What about during the exam, when I panic?","zh":"那考试中慌了怎么办？","w":"A"},{"en":"Breathe slowly. Read the question twice. Start with the easy parts.","zh":"慢慢呼吸。题目读两遍。先做简单的。","w":"B"},{"en":"And if I blank out?","zh":"要是脑子一片空白呢？","w":"A"},{"en":"Move to the next question and come back. It'll come to you.","zh":"先做下一题，回头再看。答案会想起来的。","w":"C"},{"en":"Okay. Sleep, breathe, and don't get stuck.","zh":"好。睡觉、呼吸、别卡住。","w":"A"},{"en":"Slow down. Here are some exam phrases.","zh":"放慢速度。来听几个关于考试的表达。","w":"H"},{"en":"My brain feels like scrambled eggs.","zh":"我脑子乱成一锅粥。","w":"H"},{"en":"Stop cramming, review the main points.","zh":"别突击了，复习重点。","w":"H"},{"en":"Breathe slowly.","zh":"慢慢呼吸。","w":"H"},{"en":"Start with the easy parts.","zh":"先做简单的。","w":"H"},{"en":"scrambled eggs","zh":"乱成一锅粥","w":"H"},{"en":"cramming","zh":"突击","w":"H"},{"en":"a rested brain","zh":"休息好的大脑","w":"H"},{"en":"blank out","zh":"脑子空白","w":"H"},{"en":"don't get stuck","zh":"别卡住","w":"H"},{"en":"Your turn: in English, describe one way you calm down before a test.","zh":"轮到你了：用英语描述一种你考试前放松的方法。","w":"H"},{"en":"That's it for today. Next, we step on stage. See you on the next walk!","zh":"今天就到这里。下次我们上台演讲。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":8.23,"i":1},{"t":13.2,"i":2},{"t":18.24,"i":3},{"t":21.14,"i":4},{"t":27.74,"i":5},{"t":30.54,"i":6},{"t":35.34,"i":7},{"t":41.68,"i":8},{"t":48.66,"i":9},{"t":52.14,"i":10},{"t":58.26,"i":11},{"t":60.27,"i":12},{"t":66.15,"i":13},{"t":70.35,"i":14},{"t":75.63,"i":26},{"t":82.4,"i":1},{"t":88.73,"i":2},{"t":95.12,"i":3},{"t":98.88,"i":4},{"t":107.22,"i":5},{"t":110.85,"i":6},{"t":116.96,"i":8},{"t":125.76,"i":9},{"t":130.23,"i":10},{"t":137.97,"i":11},{"t":140.67,"i":12},{"t":148.13,"i":13},{"t":153.49,"i":15},{"t":159.53,"i":16},{"t":165.91,"i":17},{"t":170.58,"i":18},{"t":175.87,"i":19},{"t":182.38,"i":20},{"t":187.61,"i":21},{"t":193.87,"i":22},{"t":199.51,"i":23},{"t":205.68,"i":24},{"t":212.0,"i":25}],"count":27},{"id":92,"title":"上台演讲","sub":"Giving a Speech","desc":"克服紧张，自信地开口演讲","audio":"audio/talk92.mp3","duration":221.8,"size":1331660,"lines":[{"en":"Welcome back. Today, we face the crowd — giving a speech.","zh":"欢迎回来。今天我们面对观众——上台演讲。","w":"H"},{"en":"I have to give a speech in front of the whole class. I'm terrified.","zh":"我必须在全班面前演讲。我吓坏了。","w":"A"},{"en":"Everyone's nervous before a speech. Even teachers.","zh":"每个人演讲前都会紧张。老师也是。","w":"B"},{"en":"The key is practice. Say it out loud, not just in your head.","zh":"关键是练习。要大声念出来，不能只在心里过。","w":"C"},{"en":"I practiced in front of my mirror. My cat judged me.","zh":"我对着镜子练了。我家猫还给我打分。","w":"A"},{"en":"Was the cat impressed?","zh":"猫被打动了吗？","w":"B"},{"en":"She fell asleep. Not a great sign.","zh":"她睡着了。不是好兆头。","w":"A"},{"en":"A good speech is less about being perfect and more about being clear. Here's how.","zh":"好的演讲不在于完美，而在于清晰。来听听怎么做。","w":"H"},{"en":"Start with one strong opening line. Grab their attention.","zh":"用一个有力的开头抓住注意力。","w":"C"},{"en":"Like a question?","zh":"比如提个问题？","w":"A"},{"en":"Exactly. Or a surprising fact. Then your main points, then a clear ending.","zh":"没错。或者一个惊人的事实。然后是要点，最后是清晰的结尾。","w":"C"},{"en":"And slow down. Nervous people rush. Pause between ideas.","zh":"还要放慢。紧张的人会越说越快。要点之间停一停。","w":"B"},{"en":"What if I forget my lines?","zh":"要是忘词了呢？","w":"A"},{"en":"Look at your notes, take a breath, and keep going. Nobody knows your script.","zh":"看眼笔记，吸口气，继续说。没人知道你原本的稿子。","w":"B"},{"en":"Slow down. Here are some speech phrases.","zh":"放慢速度。来听几个演讲的表达。","w":"H"},{"en":"I have to give a speech.","zh":"我必须演讲。","w":"H"},{"en":"Say it out loud.","zh":"大声念出来。","w":"H"},{"en":"Start with a strong opening line.","zh":"用有力的开头。","w":"H"},{"en":"Slow down and pause.","zh":"放慢，停顿。","w":"H"},{"en":"give a speech","zh":"演讲","w":"H"},{"en":"in front of the class","zh":"在全班面前","w":"H"},{"en":"grab their attention","zh":"抓住注意力","w":"H"},{"en":"rush","zh":"越说越快","w":"H"},{"en":"forget my lines","zh":"忘词","w":"H"},{"en":"Your turn: in English, give a one-sentence opening for a speech about your hobby.","zh":"轮到你了：用英语说一句关于你爱好的演讲开场白。","w":"H"},{"en":"That's it for today. Next, we're home alone for the first time. See you on the next walk!","zh":"今天就到这里。下次我们第一次独自在家。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.51,"i":1},{"t":11.18,"i":2},{"t":16.01,"i":3},{"t":22.6,"i":4},{"t":26.73,"i":5},{"t":28.94,"i":6},{"t":32.13,"i":7},{"t":39.3,"i":8},{"t":45.47,"i":9},{"t":47.17,"i":10},{"t":55.91,"i":11},{"t":62.0,"i":12},{"t":64.4,"i":13},{"t":70.35,"i":14},{"t":75.58,"i":26},{"t":82.35,"i":1},{"t":88.34,"i":2},{"t":94.47,"i":3},{"t":102.81,"i":4},{"t":108.11,"i":5},{"t":111.05,"i":6},{"t":115.16,"i":8},{"t":122.95,"i":9},{"t":125.27,"i":10},{"t":136.22,"i":11},{"t":143.94,"i":12},{"t":147.09,"i":13},{"t":154.62,"i":15},{"t":159.72,"i":16},{"t":164.47,"i":17},{"t":170.1,"i":18},{"t":175.25,"i":19},{"t":181.2,"i":20},{"t":188.07,"i":21},{"t":194.64,"i":22},{"t":199.73,"i":23},{"t":206.38,"i":24},{"t":212.96,"i":25}],"count":27},{"id":93,"title":"第一次独立","sub":"First Time Alone","desc":"第一次独自在家，学会照顾自己","audio":"audio/talk93.mp3","duration":225.4,"size":1353116,"lines":[{"en":"Welcome back. Today, a milestone — your first time home alone.","zh":"欢迎回来。今天是个里程碑——你第一次独自在家。","w":"H"},{"en":"My parents are going away overnight. I'll be home alone for the first time!","zh":"我爸妈要出去住一晚。我第一次一个人在家！","w":"A"},{"en":"Exciting and a little scary, right?","zh":"又兴奋又有点怕，对吧？","w":"B"},{"en":"Mostly exciting. I can stay up and eat whatever I want.","zh":"主要是兴奋。我可以熬夜，想吃什么吃什么。","w":"A"},{"en":"That's the fun part. But you still need to be responsible.","zh":"那是好玩的部分。但你还是要负起责任。","w":"C"},{"en":"Responsible how? It's one night.","zh":"负什么责任？就一晚。","w":"A"},{"en":"Lock the doors, don't open to strangers, and know who to call.","zh":"锁好门，不给陌生人开门，知道该找谁求助。","w":"B"},{"en":"Being alone is a chance to show you can handle things. Here's a simple checklist.","zh":"独处是证明你能行的机会。来听个简单清单。","w":"H"},{"en":"First, lock the door and keep your phone charged.","zh":"首先，锁好门，手机充满电。","w":"C"},{"en":"Check. What about dinner?","zh":"好。晚饭呢？","w":"A"},{"en":"Something simple. Don't leave the stove on, and clean up after.","zh":"做点简单的。别忘关炉子，吃完收拾。","w":"B"},{"en":"I was just going to order noodles.","zh":"我本来想点面条。","w":"A"},{"en":"That works too. Just don't open the door to strangers.","zh":"那也行。只是别给陌生人开门。","w":"B"},{"en":"And have a plan for emergencies. Know your neighbors and the emergency number.","zh":"还要有应急计划。知道邻居和紧急电话。","w":"C"},{"en":"Got it. Locked door, simple food, and a plan.","zh":"明白。锁门、简单食物、有预案。","w":"A"},{"en":"Slow down. Here are some phrases about being alone.","zh":"放慢速度。来听几个关于独处的表达。","w":"H"},{"en":"I'll be home alone for the first time.","zh":"我第一次一个人在家。","w":"H"},{ anding there when it happened.","zh":"因为出事时我正好站在那儿。","w":"A"},{"en":"Being in the wrong place at the wrong time. It happens.","zh":"在错误的时间出现在错误的地点。常有的事。","w":"C"},{"en":"I tried to explain, but no one listened.","zh":"我想解释，但没人听。","w":"A"},{"en":"Then explain calmly, when people are ready to listen.","zh":"那就在大家愿意听的时候，冷静地解释。","w":"B"},{"en":"When you're misunderstood, the instinct is to shout. But calm wins. Here's how.","zh":"被误解时，本能是想喊。但冷静才管用。来听听怎么做。","w":"H"},{"en":"First, don't lose your temper. Shouting makes you look guilty.","zh":"首先，别发火。大喊会让你显得心虚。","w":"C"},{"en":"But it's so unfair!","zh":"可这太不公平了！","w":"A"},{"en":"I know. Say what you saw, clearly and simply. Stick to the facts.","zh":"我懂。把你看到的清楚、简单地说出来。只说事实。","w":"B"},{"en":"Like, 'I was standing there, but I didn't touch the window'?","zh":"比如，'我站在那儿，但我没碰窗户'？","w":"A"},{"en":"Exactly. And if they still don't believe you, let it rest. The truth comes out.","zh":"没错。要是他们还不信，就先放一放。真相会大白的。","w":"B"},{"en":"So calm, facts, and patience.","zh":"所以是冷静、讲事实、有耐心。","w":"A"},{"en":"Slow down. Here are some phrases for being misunderstood.","zh":"放慢速度。来听几个关于被误解的表达。","w":"H"},{"en":"Everyone thinks I did it, but I didn't.","zh":"大家都以为是我做的，可我没有。","w":"H"},{"en":"Don't lose your temper.","zh":"别发火。","w":"H"},{"en":"Stick to the facts.","zh":"只说事实。","w":"H"},{"en":"The truth comes out.","zh":"真相会大白。","w":"H"},{"en":"misunderstood","zh":"被误解","w":"H"},{"en":"wrong place, wrong time","zh":"错误的时间地点","w":"H"},{"en":"lose your temper","zh":"发火","w":"H"},{"en":"stick to the facts","zh":"只说事实","w":"H"},{"en":"let it rest","zh":"先放一放","w":"H"},{"en":"Your turn: in English, explain calmly that you didn't do something you're blamed for.","zh":"轮到你了：用英语冷静地解释一件你没做却被指责的事。","w":"H"},{"en":"That's it for today. Next, we help a stranger. See you on the next walk!","zh":"今天就到这里。下次我们帮助陌生人。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{ ness isn't a trade.","zh":"那你还是做了对的事。善意不是交易。","w":"C"},{"en":"I like that. Help for the sake of helping.","zh":"我喜欢这个。为了帮助而帮助。","w":"A"},{"en":"Slow down. Here are some phrases about helping.","zh":"放慢速度。来听几个关于帮助的表达。","w":"H"},{"en":"I helped him pick it up.","zh":"我帮他捡起来了。","w":"H"},{"en":"It made my whole day.","zh":"那一整天我心情都很好。","w":"H"},{"en":"Hold a door for someone.","zh":"帮人扶一下门。","w":"H"},{"en":"Kindness isn't a trade.","zh":"善意不是交易。","w":"H"},{"en":"help a stranger","zh":"帮助陌生人","w":"H"},{"en":"made my day","zh":"让我心情很好","w":"H"},{"en":"give up your seat","zh":"让座","w":"H"},{"en":"hold a door","zh":"扶门","w":"H"},{"en":"for the sake of","zh":"为了……本身","w":"H"},{"en":"Your turn: in English, describe one kind thing you could do for a stranger today.","zh":"轮到你了：用英语描述一件你今天能为陌生人做的善事。","w":"H"},{"en":"That's it for today. Next, we talk about our heroes. See you on the next walk!","zh":"今天就到这里。下次我们聊聊榜样。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.84,"i":1},{"t":12.43,"i":2},{"t":16.05,"i":3},{"t":20.04,"i":4},{"t":24.69,"i":5},{"t":29.7,"i":6},{"t":36.23,"i":7},{"t":39.06,"i":8},{"t":44.46,"i":9},{"t":49.74,"i":10},{"t":52.74,"i":11},{"t":58.62,"i":12},{"t":61.93,"i":13},{"t":67.42,"i":25},{"t":74.2,"i":1},{"t":81.26,"i":2},{"t":85.93,"i":3},{"t":91.06,"i":4},{"t":97.0,"i":5},{"t":103.37,"i":7},{"t":107.08,"i":8},{"t":113.93,"i":9},{"t":120.61,"i":10},{"t":124.51,"i":11},{"t":131.96,"i":12},{"t":136.25,"i":14},{"t":141.21,"i":15},{"t":146.12,"i":16},{"t":151.25,"i":17},{"t":156.35,"i":18},{"t":162.52,"i":19},{"t":168.45,"i":20},{"t":174.71,"i":21},{"t":180.62,"i":22},{"t":186.81,"i":23},{"t":193.3,"i":24}],"count":26},{"id":96,"title":"我的榜样","sub":"My Role Model","desc":"榜样的力量，向优秀的人学习","audio":"audio/talk96.mp3","duration":213.3,"size":1280252,"lines":[{"en":"Welcome back. Today, we talk about the people who inspire us — role models.","zh":"欢迎回来。今天我们聊聊激励我们的人——榜样。","w":"H"},{"en":"Who's your role model?","zh":"你的榜样是谁？","w":"A"},{"en":"My mom. She works hard and never complains.","zh":"我妈。她努力工作，从不抱怨。","w":"B"},{"en":"Mine is my uncle. He taught himself to code and now builds apps.","zh":"我的是我叔叔。他自学编程，现在做 App。","w":"C"},{"en":"I never thought about it. Maybe my grandpa?","zh":"我从没想过。也许我爷爷？","w":"A"},{"en":"Why him?","zh":"为什么是他？","w":"B"},{"en":"He's patient, and he can fix anything.","zh":"他很有耐心，而且什么都能修。","w":"A"},{"en":"A role model doesn't have to be famous. It's someone whose qualities you admire.","zh":"榜样不一定是名人。是你欣赏其品质的人。","w":"H"},{"en":"The best thing about a role model is you can learn from them.","zh":"榜样最好的一点是，你能向他们学习。","w":"C"},{"en":"How do I learn from someone who's just living their life?","zh":"怎么向一个只是过自己生活的人学习？","w":"A"},{"en":"Notice what they do well, and try it yourself. Patience, kindness, hard work.","zh":"观察他们做得好的一面，然后自己试试。耐心、善良、勤奋。","w":"B"},{"en":"So I don't copy them, I learn their good habits?","zh":"所以我不是照搬，而是学他们的好习惯？","w":"A"},{"en":"Exactly. You become your own person with their best traits.","zh":"没错。你吸收他们的优点，成为你自己。","w":"C"},{"en":"I like that. My grandpa's patience, my mom's kindness.","zh":"我喜欢。爷爷的耐心，妈妈的善良。","w":"A"},{"en":"Slow down. Here are some phrases about role models.","zh":"放慢速度。来听几个关于榜样的表达。","w":"H"},{"en":"Who's your role model?","zh":"你的榜样是谁？","w":"H"},{"en":"She works hard and never complains.","zh":"她努力工作，从不抱怨。","w":"H"},{"en":"Learn from their good habits.","zh":"学习他们的好习惯。","w":"H"},{"en":"Become your own person.","zh":"成为你自己。","w":"H"},{"en":"a role model","zh":"榜样","w":"H"},{"en":"inspire","zh":"激励","w":"H"},{"en":"admire","zh":"欣赏","w":"H"},{"en":"good habits","zh":"好习惯","w":"H"},{"en":"your own person","zh":"你自己","w":"H"},{"en":"Your turn: in English, name your role model and one quality you admire in them.","zh":"轮到你了：用英语说出你的榜样，以及你欣赏他/她的一个品质。","w":"H"},{"en":"That's it for today. Next, we try different jobs — career day. See you on the next walk!","zh":"今天就到这里。下次我们体验不同职业——职业体验日。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.47,"i":1},{"t":9.48,"i":2},{"t":14.3,"i":3},{"t":21.02,"i":4},{"t":24.5,"i":5},{"t":26.2,"i":6},{"t":29.39,"i":7},{"t":36.45,"i":8},{"t":41.13,"i":9},{"t":44.94,"i":10},{"t":52.33,"i":11},{"t":56.02,"i":12},{"t":62.19,"i":13},{"t":66.96,"i":14},{"t":72.73,"i":26},{"t":79.5,"i":1},{"t":82.2,"i":2},{"t":88.33,"i":3},{"t":96.81,"i":4},{"t":101.29,"i":5},{"t":103.61,"i":6},{"t":107.75,"i":8},{"t":113.71,"i":9},{"t":118.62,"i":10},{"t":127.92,"i":11},{"t":132.68,"i":12},{"t":140.49,"i":13},{"t":146.58,"i":15},{"t":151.39,"i":16},{"t":157.36,"i":17},{"t":162.66,"i":18},{"t":167.76,"i":19},{"t":173.76,"i":20},{"t":179.52,"i":21},{"t":185.04,"i":22},{"t":190.99,"i":23},{"t":197.33,"i":24},{"t":204.01,"i":25}],"count":27},{"id":97,"title":"职业体验日","sub":"Career Day","desc":"体验不同的职业，发现自己的兴趣","audio":"audio/talk97.mp3","duration":206.3,"size":1238636,"lines":[{"en":"Welcome back. Today, we try on different jobs — career day!","zh":"欢迎回来。今天我们体验不同职业——职业体验日！","w":"H"},{"en":"Our school had a career day. We tried different jobs for a morning.","zh":"我们学校办了个职业体验日。我们体验了一上午不同职业。","w":"A"},{"en":"Cool! What did you try?","zh":"酷！你体验了什么？","w":"B"},{"en":"I was a news reporter. I interviewed people in the hall.","zh":"我当了新闻记者。我在大厅采访大家。","w":"A"},{"en":"Did you like it?","zh":"你喜欢吗？","w":"C"},{"en":"Loved it! Asking questions and telling stories is fun.","zh":"超喜欢！提问和讲故事很好玩。","w":"A"},{"en":"I tried being a nurse. I learned to wrap a bandage.","zh":"我体验了护士。学会了包扎。","w":"B"},{"en":"Career day is a chance to peek at jobs before choosing one. Here's what matters.","zh":"职业体验日是选职业前窥探各种工作的机会。来听听什么最重要。","w":"H"},{"en":"How do I know which job fits me?","zh":"怎么知道哪个职业适合我？","w":"A"},{"en":"Think about what you enjoy doing, not just what sounds cool.","zh":"想想你喜欢做什么，而不只是听起来酷的。","w":"C"},{"en":"I like talking and writing. So reporter makes sense.","zh":"我喜欢说话和写作。所以记者挺合适。","w":"A"},{"en":"And try many things. You don't have to decide now.","zh":"还要多尝试。你不必现在就决定。","w":"B"},{"en":"Right. Today it's reporter, next month it might be something new.","zh":"对。今天想当记者，下个月可能又发现新的。","w":"C"},{"en":"So career day is about exploring, not deciding.","zh":"所以职业体验日是探索，不是决定。","w":"A"},{"en":"Slow down. Here are some career phrases.","zh":"放慢速度。来听几个关于职业的表达。","w":"H"},{"en":"We tried different jobs.","zh":"我们体验了不同职业。","w":"H"},{"en":"I interviewed people.","zh":"我采访了大家。","w":"H"},{"en":"What job fits me?","zh":"什么职业适合我？","w":"H"},{"en":"You don't have to decide now.","zh":"你不必现在就决定。","w":"H"},{"en":"career day","zh":"职业体验日","w":"H"},{"en":"try different jobs","zh":"体验不同职业","w":"H"},{"en":"a reporter","zh":"记者","w":"H"},{"en":"what fits me","zh":"适合我的","w":"H"},{"en":"explore, not decide","zh":"探索而非决定","w":"H"},{"en":"Your turn: in English, describe a job you'd like to try and why.","zh":"轮到你了：用英语描述一个你想尝试的职业，以及为什么。","w":"H"},{"en":"That's it for today. Next, we imagine school in the future. See you on the next walk!","zh":"今天就到这里。下次我们畅想未来的学校。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.6,"i":1},{"t":11.18,"i":2},{"t":14.11,"i":3},{"t":18.09,"i":4},{"t":20.51,"i":5},{"t":25.07,"i":6},{"t":29.63,"i":7},{"t":36.83,"i":8},{"t":39.33,"i":9},{"t":44.44,"i":10},{"t":48.59,"i":11},{"t":53.22,"i":12},{"t":59.67,"i":13},{"t":63.8,"i":14},{"t":69.05,"i":26},{"t":75.83,"i":1},{"t":81.67,"i":2},{"t":85.5,"i":3},{"t":90.6,"i":4},{"t":93.78,"i":5},{"t":99.6,"i":6},{"t":105.42,"i":8},{"t":108.69,"i":9},{"t":115.21,"i":10},{"t":120.53,"i":11},{"t":126.44,"i":12},{"t":134.59,"i":13},{"t":139.88,"i":15},{"t":145.03,"i":16},{"t":149.92,"i":17},{"t":154.74,"i":18},{"t":159.96,"i":19},{"t":165.72,"i":20},{"t":172.32,"i":21},{"t":178.08,"i":22},{"t":184.03,"i":23},{"t":191.71,"i":24},{"t":197.48,"i":25}],"count":27},{"id":98,"title":"未来学校","sub":"School of the Future","desc":"畅想未来学校的样子，发挥想象力","audio":"audio/talk98.mp3","duration":206.1,"size":1237052,"lines":[{"en":"Welcome back. Today, we time-travel — school of the future.","zh":"欢迎回来。今天我们穿越——未来的学校。","w":"H"},{"en":"Imagine school in fifty years. What would it be like?","zh":"想象一下五十年后的学校。会是什么样？","w":"A"},{"en":"No heavy backpacks. Everything is on one thin screen.","zh":"没有沉重的书包。所有东西都在一块薄薄的屏幕上。","w":"B"},{"en":"Or holograms! A teacher appears in your room as light.","zh":"或者全息投影！老师以光的形态出现在你房间里。","w":"C"},{"en":"I'd want AI that helps me learn at my own speed.","zh":"我想要能按我自己的节奏教我的人工智能。","w":"A"},{"en":"But I'd still want real friends, not just screens.","zh":"但我还是想要真实的朋友，而不只是屏幕。","w":"B"},{"en":"Dreaming about the future is fun, and it shapes what we build. Let's imagine more.","zh":"畅想未来很有趣，而且它会塑造我们的创造。来多想一点。","w":"H"},{"en":"Maybe classes won't be by age. You learn with people who share your level.","zh":"也许不再按年龄分班。你和水平相近的人一起学。","w":"C"},{"en":"And tests? Can we get rid of tests?","zh":"那考试呢？能取消考试吗？","w":"A"},{"en":"Maybe tests become projects. You show what you learned by building something.","zh":"也许考试变成项目。你用做东西来展示所学。","w":"B"},{"en":"I love that idea. Learning by doing, not just memorizing.","zh":"我喜欢这个想法。做中学，而不是死记硬背。","w":"A"},{"en":"Some of this is already happening. The future starts now.","zh":"其中一些已经在发生了。未来始于现在。","w":"C"},{"en":"Slow down. Here are some future-school phrases.","zh":"放慢速度。来听几个关于未来学校的表达。","w":"H"},{"en":"Imagine school in fifty years.","zh":"想象五十年后的学校。","w":"H"},{"en":"Everything is on one thin screen.","zh":"所有东西都在一块薄屏上。","w":"H"},{"en":"Learn at my own speed.","zh":"按我自己的节奏学习。","w":"H"},{"en":"Learning by doing.","zh":"做中学。","w":"H"},{"en":"time-travel","zh":"穿越","w":"H"},{"en":"a hologram","zh":"全息投影","w":"H"},{"en":"at my own speed","zh":"按我自己的节奏","w":"H"},{"en":"get rid of","zh":"取消","w":"H"},{"en":"learning by doing","zh":"做中学","w":"H"},{"en":"Your turn: in English, describe one thing you'd change abo

,"zh":"你想吃啥？","w":"H"},{"en":"Delivery is free if we spend over thirty yuan.","zh":"满三十块免配送费。","w":"H"},{"en":"Want to share some snacks?","zh":"想一起拼点零食吗？","w":"H"},{"en":"I'm starving.","zh":"我快饿死了。","w":"H"},{"en":"in the mood for","zh":"想吃……","w":"H"},{"en":"Do they deliver?","zh":"他们送外卖吗？","w":"H"},{"en":"hit thirty","zh":"凑到三十","w":"H"},{"en":"a food group","zh":"一个食物类别","w":"H"},{"en":"Your turn: in English, order your favorite takeout and name one healthier snack.","zh":"轮到你了：用英语点你最爱吃的外卖，再说一样更健康的零食。","w":"H"},{"en":"That's it for today. Next, we head to the supermarket. See you on the next walk!","zh":"今天就到这里。下次我们去超市。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.85,"i":1},{"t":11.35,"i":2},{"t":14.66,"i":3},{"t":18.52,"i":4},{"t":25.17,"i":5},{"t":28.17,"i":6},{"t":34.96,"i":7},{"t":40.09,"i":8},{"t":47.37,"i":9},{"t":52.36,"i":10},{"t":56.72,"i":11},{"t":60.3,"i":12},{"t":64.66,"i":13},{"t":67.78,"i":14},{"t":72.96,"i":15},{"t":77.4,"i":16},{"t":83.52,"i":28},{"t":90.29,"i":1},{"t":94.79,"i":2},{"t":99.08,"i":3},{"t":104.03,"i":4},{"t":112.42,"i":5},{"t":116.32,"i":6},{"t":124.88,"i":7},{"t":131.42,"i":9},{"t":137.74,"i":10},{"t":143.32,"i":11},{"t":147.92,"i":12},{"t":153.5,"i":13},{"t":157.54,"i":14},{"t":164.13,"i":15},{"t":169.78,"i":17},{"t":174.93,"i":18},{"t":180.01,"i":19},{"t":186.61,"i":20},{"t":191.88,"i":21},{"t":197.71,"i":22},{"t":204.02,"i":23},{"t":209.95,"i":24},{"t":215.61,"i":25},{"t":221.64,"i":26},{"t":228.29,"i":27}],"count":29},{"id":41,"title":"逛超市","sub":"The Supermarket","desc":"列清单、比价格，超市购物小技巧","audio":"audio/talk41.mp3","duration":248.3,"size":1490348,"lines":[{"en":"Welcome back. Today, we go shopping at the supermarket.","zh":"欢迎回来。今天我们去超市购物。","w":"H"},{"en":"Mom gave me a list and fifty yuan. She says if I do well, I can keep the change.","zh":"我妈给我一张清单和五十块。她说我表现好，剩下的钱归我。","w":"A"},{"en":"Now you're motivated. What's on the list?","zh":"这下你有动力了。清单上有啥？","w":"B"},{"en":"Milk, eggs, bread, and some vegetables. Easy.","zh":"牛奶、鸡蛋、面包，还有点蔬菜。简单。","w":"A"},{"en":"Careful. The trick is not to walk past the snacks aisle.","zh":"小心点。诀窍是别路过零食区。","w":"B"},{"en":"I have a plan. I'll go in, grab, pay, and get out.","zh":"我有计划。进去，拿东西，付钱，走人。","w":"A"},{"en":"That's what everyone says. Then the cookies start calling your name.","zh":"每个人都这么说。然后饼干就开始喊你的名字了。","w":"B"},{"en":"Supermarkets are designed to make you buy more. Here's how to shop smart.","zh":"超市就是设计来让你多买的。来听听怎么聪明购物。","w":"H"},{"en":"Okay, I'm here. First stop, the milk. But there are five brands and three sizes.","zh":"好，我到了。第一站，牛奶。但有五个牌子、三种规格。","w":"A"},{"en":"Check the price per liter, not just the price. The big bottle is usually cheaper.","zh":"看每升的单价，别只看价格。大瓶通常更划算。","w":"C"},{"en":"Smart. How do I know which is fresher?","zh":"聪明。怎么知道哪个更新鲜？","w":"A"},{"en":"Check the date. Pick the one with the latest sell-by date.","zh":"看日期。选保质期最靠后的。","w":"C"},{"en":"Got it. Eggs next. Some boxes are half the price of others.","zh":"明白。接下来鸡蛋。有些盒子价格只有别的一半。","w":"A"},{"en":"Cheaper eggs are fine if they're not broken. Open the box and check.","zh":"便宜的鸡蛋只要没破就行。打开盒子检查一下。","w":"C"},{"en":"This is like a video game, but I win real money.","zh":"这跟打游戏一样，但我赢的是真钱。","w":"A"},{"en":"Slow down. Here are some shopping phrases.","zh":"放慢速度。来听几个购物表达。","w":"H"},{"en":"What's on the list?","zh":"清单上有啥？","w":"H"},{"en":"Check the price per liter.","zh":"看每升的单价。","w":"H"},{"en":"Pick the one with the latest sell-by date.","zh":"选保质期最靠后的。","w":"H"},{"en":"Open the box and check.","zh":"打开盒子检查一下。","w":"H"},{"en":"keep the change","zh":"剩下零钱归我","w":"H"},{"en":"price per liter","zh":"每升单价","w":"H"},{"en":"sell-by date","zh":"保质期","w":"H"},{"en":"the latest","zh":"最靠后的（日期）","w":"H"},{"en":"half the price","zh":"价格一半","w":"H"},{"en":"Your turn: in English, list three things you'd buy at a supermarket and how you'd choose them.","zh":"轮到你了：用英语列出你在超市会买的三样东西，以及你会怎么挑选。","w":"H"},{"en":"That's it for today. Next, we buy school supplies. See you on the next walk!","zh":"今天就到这里。下次我们买文具。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.12,"i":1},{"t":12.38,"i":2},{"t":16.13,"i":3},{"t":21.26,"i":4},{"t":26.15,"i":5},{"t":31.07,"i":6},{"t":36.28,"i":7},{"t":42.88,"i":8},{"t":49.24,"i":9},{"t":56.72,"i":10},{"t":60.01,"i":11},{"t":65.86,"i":12},{"t":71.02,"i":13},{"t":77.62,"i":14},{"t":81.48,"i":15},{"t":86.79,"i":27},{"t":93.56,"i":1},{"t":101.47,"i":2},{"t":106.28,"i":3},{"t":112.8,"i":4},{"t":119.02,"i":5},{"t":125.28,"i":6},{"t":131.89,"i":8},{"t":139.94,"i":9},{"t":149.36,"i":10},{"t":153.6,"i":11},{"t":161.0,"i":12},{"t":167.56,"i":13},{"t":175.9,"i":14},{"t":180.86,"i":16},{"t":185.6,"i":17},{"t":190.76,"i":18},{"t":196.84,"i":19},{"t":202.09,"i":20},{"t":208.38,"i":21},{"t":214.62,"i":22},{"t":220.72,"i":23},{"t":226.4,"i":24},{"t":232.74,"i":25},{"t":239.83,"i":26}],"count":28},{"id":42,"title":"买文具","sub":"Stationery Shopping","desc":"新学期买文具，如何不花冤枉钱","audio":"audio/talk42.mp3","duration":240.8,"size":1445276,"lines":[{"en":"Welcome back. Today, a small but fun topic — buying stationery.","zh":"欢迎回来。今天是个小但有趣的话题——买文具。","w":"H"},{"en":"New semester, new pens. I love stationery season.","zh":"新学期，新笔。我超爱文具季。","w":"A"},{"en":"You and half the school. The stationery shop was packed yesterday.","zh":"你和半个学校的人都一样。昨天文具店挤爆了。","w":"B"},{"en":"I know, I saw the line. Some kids had three baskets.","zh":"我知道，我看到排队了。有的同学拿了三个篮子。","w":"A"},{"en":"You only have two hands. Why do people buy so much?","zh":"你只有两只手。大家干嘛买那么多？","w":"C"},{"en":"Cute erasers, fancy notebooks... they're like a trap.","zh":"可爱的橡皮、漂亮的笔记本……跟陷阱似的。","w":"B"},{"en":"I will not be trapped. I have a list this year.","zh":"我今年不会被套路。我有清单。","w":"A"},{"en":"A list helps, but there's more to smart stationery shopping. Let's listen.","zh":"清单有用，但聪明买文具还有更多门道。来听听。","w":"H"},{"en":"First on my list: three pens, two pencils, and a notebook.","zh":"清单第一项：三支笔，两支铅笔，一个笔记本。","w":"A"},{"en":"Buy pens you can refill. They cost more at first but last forever.","zh":"买能换笔芯的笔。一开始贵点，但能用很久。","w":"C"},{"en":"Good point. What about notebooks? Some are so pretty.","zh":"有道理。笔记本呢？有些太好看了。","w":"A"},{"en":"Check the paper. If the paper is thin, ink goes through to the other side.","zh":"看纸张。如果纸太薄，墨水会渗到背面。","w":"B"},{"en":"I never thought about that.","zh":"我从来没想过这个。","w":"A"},{"en":"And skip the ten-piece eraser set. One good eraser is enough.","zh":"还有别买十件套橡皮。一块好橡皮就够了。","w":"B"},{"en":"But they smell like fruit...","zh":"可它们有水果味啊……","w":"A"},{"en":"And that's how they get you.","zh":"看吧，这就是他们套路你的方式。","w":"C"},{"en":"Slow down. Here are some phrases for the stationery shop.","zh":"放慢速度。来听几个文具店的表达。","w":"H"},{"en":"The stationery shop was packed.","zh":"文具店挤爆了。","w":"H"},{"en":"Buy pens you can refill.","zh":"买能换笔芯的笔。","w":"H"},{"en":"Check the paper.","zh":"看纸张。","w":"H"},{"en":"Ink goes through to the other side.","zh":"墨水会渗到背面。","w":"H"},{"en":"stationery season","zh":"文具季","w":"H"},{"en":"you can refill","zh":"能换笔芯的","w":"H"},{"en":"last forever","zh":"能用很久","w":"H"},{"en":"goes through","zh":"渗过去","w":"H"},{"en":"skip the set","zh":"别买套装","w":"H"},{"en":"Your turn: in English, name three stationery items and say which one you'd splurge on.","zh":"轮到你了：用英语说出三样文具，再说说哪一样你愿意多花点钱。","w":"H"},{"en":"That's it for today. Next, we learn to bargain. See you on the next walk!","zh":"今天就到这里。下次我们学砍价。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.11,"i":1},{"t":11.66,"i":2},{"t":17.21,"i":3},{"t":21.81,"i":4},{"t":27.93,"i":5},{"t":32.56,"i":6},{"t":36.16,"i":7},{"t":43.19,"i":8},{"t":48.33,"i":9},{"t":55.14,"i":10},{"t":59.53,"i":11},{"t":65.77,"i":12},{"t":67.93,"i":13},{"t":73.37,"i":14},{"t":75.58,"i":15},{"t":78.58,"i":16},{"t":84.65,"i":28},{"t":91.42,"i":1},{"t":97.24,"i":2},{"t":104.26,"i":3},{"t":110.13,"i":4},{"t":117.87,"i":5},{"t":123.79,"i":6},{"t":128.41,"i":8},{"t":134.95,"i":9},{"t":143.53,"i":10},{"t":149.13,"i":11},{"t":157.01,"i":12},{"t":159.88,"i":13},{"t":166.78,"i":14},{"t":169.72,"i":15},{"t":173.62,"i":17},{"t":179.35,"i":18},{"t":184.55,"i":19},{"t":189.17,"i":20},{"t":194.64,"i":21},{"t":201.48,"i":22},{"t":207.65,"i":23},{"t":213.79,"i":24},{"t":219.38,"i":25},{"t":225.57,"i":26},{"t":232.71,"i":27}],"count":29},{"id":43,"title":"讨价还价","sub":"Bargaining","desc":"在市场里砍价，几句就能省下钱","audio":"audio/talk43.mp3","duration":249.8,"size":1499564,"lines":[{"en":"Welcome back. Today, we head to the market and learn to bargain.","zh":"欢迎回来。今天我们去市场学砍价。","w":"H"},{"en":"My aunt took me to the market today. She bargained for everything.","zh":"今天我姑妈带我去市场。她买什么都砍价。","w":"A"},{"en":"She's a pro. How much did she save?","zh":"她是高手。她省了多少？","w":"B"},{"en":"On a bag of apples, she saved ten yuan. The seller even laughed.","zh":"一袋苹果她省了十块。卖家都笑了。","w":"A"},{"en":"Bargaining is normal in markets. Sellers expect it.","zh":"在市场里砍价很正常。卖家都预料到了。","w":"C"},{"en":"I'm too shy. I just pay whatever they say.","zh":"我太害羞了。他们报多少我付多少。","w":"A"},{"en":"That's why you're always out of pocket money by Friday.","zh":"所以你的零花钱到周五就没了。","w":"B"},{"en":"Bargaining isn't rude — it's part of the game. Here's how to do it politely.","zh":"砍价不是没礼貌——它是市场里的一部分。来听听怎么礼貌地砍。","w":"H"},{"en":"Okay, teach me. How do I start?","zh":"好，教我。怎么开头？","w":"A"},{"en":"First, ask the price. Then say it's a bit high and make a lower offer.","zh":"先问价格。然后说有点贵，报个低一点的价格。","w":"C"},{"en":"Like, 'How much is this scarf?'","zh":"比如，'这条围巾多少钱？'","w":"A"},{"en":"Right. Seller says fifty. You say, 'That's a bit much. How about thirty-five?'","zh":"对。卖家说五十。你说，'有点贵。三十五怎么样？'","w":"C"},{"en":"And then?","zh":"然后呢？","w":"A"},{"en":"They'll meet you in the middle, maybe forty. You can say forty is okay, or walk away.","zh":"他们会取个中间价，比如四十。你觉得四十行就说行，或者假装走开。","w":"C"},{"en":"Walking away works every time. They call you back.","zh":"转身走人每次都管用。他们会把你喊回来。","w":"B"},{"en":"Really? Even with my aunt, they call her back and she already left the market.","zh":"真的？我姑妈也是，她都离开市场了他们还喊她。","w":"A"},{"en":"Slow down. Here are the bargaining phrases.","zh":"放慢速度。来听砍价的表达。","w":"H"},{"en":"How much is this scarf?","zh":"这条围巾多少钱？","w":"H"},{"en":"That's a bit much.","zh":"有点贵。","w":"H"},{"en":"How about thirty-five?","zh":"三十五怎么样？","w":"H"},{"en":"Will you meet me in the middle?","zh":"能取个中间价吗？","w":"H"},{"en":"bargain for everything","zh":"什么都砍价","w":"H"},{"en":"make a lower offer","zh":"报个低一点的价格","w":"H"},{"en":"a bit much","zh":"有点贵","w":"H"},{"en":"meet you in the middle","zh":"取个中间价","w":"H"},{"en":"walk away","zh":"假装走开","w":"H"},{"en":"Your turn: in English, bargain for a fifty-yuan item and try to get it for thirty-five.","zh":"轮到你了：用英语把一件五十块的东西砍到三十五。","w":"H"},{"en":"That's it for today. Next, we shop online. See you on the next walk!","zh":"今天就到这里。下次我们网上购物。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.36,"i":1},{"t":10.82,"i":2},{"t":14.69,"i":3},{"t":20.2,"i":4},{"t":26.06,"i":5},{"t":29.61,"i":6},{"t":33.47,"i":7},{"t":40.38,"i":8},{"t":43.53,"i":9},{"t":50.8,"i":10},{"t":53.29,"i":11},{"t":63.15,"i":12},{"t":64.57,"i":13},{"t":72.41,"i":14},{"t":77.04,"i":15},{"t":82.78,"i":16},{"t":88.08,"i":28},{"t":94.85,"i":1},{"t":100.55,"i":2},{"t":105.51,"i":3},{"t":112.53,"i":4},{"t":119.93,"i":5},{"t":124.51,"i":6},{"t":129.46,"i":8},{"t":133.55,"i":9},{"t":142.71,"i":10},{"t":146.01,"i":11},{"t":158.36,"i":12},{"t":160.29,"i":13},{"t":170.14,"i":14},{"t":176.03,"i":15},{"t":183.29,"i":17},{"t":188.35,"i":18},{"t":193.12,"i":19},{"t":198.22,"i":20},{"t":203.16,"i":21},{"t":210.0,"i":22},{"t":216.57,"i":23},{"t":222.53,"i":24},{"t":228.89,"i":25},{"t":234.55,"i":26},{"t":241.81,"i":27}],"count":29},{"id":44,"title":"网上购物","sub":"Online Shopping","desc":"网购的方便与陷阱，如何下单更安心","audio":"audio/talk44.mp3","duration":242.8,"size":1457228,"lines":[{"en":"Welcome back. Today, we talk about online shopping.","zh":"欢迎回来。今天我们聊聊网购。","w":"H"},{"en":"I bought a phone case online last night. It was half the price of the shop.","zh":"昨晚我在网上买了个手机壳。比店里便宜一半。","w":"A"},{"en":"Nice. When does it arrive?","zh":"不错。什么时候到？","w":"B"},{"en":"Tomorrow. Free shipping, too.","zh":"明天。还包邮。","w":"A"},{"en":"Let me guess — it has no reviews and the photo looks too good.","zh":"我猜猜——没有评价，照片看着太好看。","w":"C"},{"en":"How did you know?","zh":"你怎么知道的？","w":"A"},{"en":"Because we've all been there. Online shopping is great, until it isn't.","zh":"因为我们都踩过坑。网购很棒，直到翻车为止。","w":"B"},{"en":"Online shopping saves time and money, but you need a few habits. Let's listen.","zh":"网购省时省钱，但你需要几个好习惯。来听听。","w":"H"},{"en":"Okay, so how do I shop online without getting tricked?","zh":"好，那怎么网购才不被坑？","w":"A"},{"en":"First, check the reviews. Look at the photos from real buyers, not just the seller.","zh":"首先，看评价。要看真实买家的晒图，别只看卖家的图。","w":"C"},{"en":"What if there are no reviews?","zh":"要是没有评价呢？","w":"A"},{"en":"Then be careful. A brand-new seller with no reviews is a gamble.","zh":"那就小心。新卖家没评价，就是赌。","w":"C"},{"en":"Also check the return policy. If they don't allow returns, think twice.","zh":"还要看退货政策。如果不支持退货，就得三思。","w":"B"},{"en":"And never pay outside the app, right? My mom always says that.","zh":"而且绝不在 App 外付款，对吧？我妈老这么说。","w":"A"},{"en":"Your mom is smart. Keep everything on the platform.","zh":"你妈很聪明。所有交易都留在平台上。","w":"C"},{"en":"Got it. Reviews, returns, and stay on the app.","zh":"明白。看评价、看退货、留在 App 里。","w":"A"},{"en":"Slow down. Here are some online shopping phrases.","zh":"放慢速度。来听几个网购的表达。","w":"H"},{"en":"When does it arrive?","zh":"什么时候到？","w":"H"},{"en":"Free shipping.","zh":"包邮。","w":"H"},{"en":"Check the reviews.","zh":"看评价。","w":"H"},{"en":"Check the return policy.","zh":"看退货政策。","w":"H"},{"en":"half the price","zh":"便宜一半","w":"H"},{"en":"free shipping","zh":"包邮","w":"H"},{"en":"real buyers","zh":"真实买家","w":"H"},{"en":"return policy","zh":"退货政策","w":"H"},{"en":"think twice","zh":"三思","w":"H"},{"en":"Your turn: in English, describe something you'd buy online and one thing you'd check first.","zh":"轮到你了：用英语说说你想网购的东西，以及你会先检查什么。","w":"H"},{"en":"That's it for today. Next, we handle returns and refunds. See you on the next walk!","zh":"今天就到这里。下次我们处理退换货。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.0,"i":1},{"t":11.02,"i":2},{"t":14.35,"i":3},{"t":17.28,"i":4},{"t":22.99,"i":5},{"t":24.59,"i":6},{"t":30.25,"i":7},{"t":37.65,"i":8},{"t":41.77,"i":9},{"t":49.69,"i":10},{"t":51.99,"i":11},{"t":58.69,"i":12},{"t":64.57,"i":13},{"t":69.27,"i":14},{"t":74.91,"i":15},{"t":79.61,"i":16},{"t":85.37,"i":28},{"t":92.14,"i":1},{"t":98.51,"i":2},{"t":102.82,"i":3},{"t":106.65,"i":4},{"t":113.89,"i":5},{"t":116.08,"i":6},{"t":123.25,"i":8},{"t":128.51,"i":9},{"t":138.46,"i":10},{"t":141.5,"i":11},{"t":149.93,"i":12},{"t":157.39,"i":13},{"t":163.37,"i":14},{"t":170.51,"i":15},{"t":176.5,"i":17},{"t":181.34,"i":18},{"t":185.85,"i":19},{"t":190.66,"i":20},{"t":195.91,"i":21},{"t":202.25,"i":22},{"t":208.13,"i":23},{"t":214.22,"i":24},{"t":220.77,"i":25},{"t":226.77,"i":26},{"t":233.93,"i":27}],"count":29},{"id":45,"title":"退换货","sub":"Returns & Refunds","desc":"买错了、坏了，怎么退怎么换","audio":"audio/talk45.mp3","duration":254.3,"size":1526348,"lines":[{"en":"Welcome back. Today, we deal with returns and refunds.","zh":"欢迎回来。今天我们处理退换货。","w":"H"},{"en":"Remember that phone case I ordered? It arrived, and it doesn't fit.","zh":"还记得我订的手机壳吗？到了，但是不合。","w":"A"},{"en":"Uh oh. Did the listing say it fits your phone?","zh":"哎呀。商品页写适配你的手机了吗？","w":"B"},{"en":"It said it did. But it's loose on the sides.","zh":"写了适配。但两边松垮垮的。","w":"A"},{"en":"Then you can return it. That's a wrong fit, not your fault.","zh":"那你可以退。这是尺寸不符，不是你的错。","w":"C"},{"en":"Really? I thought once you buy it, it's yours forever.","zh":"真的？我以为买了就是你的了，退不了。","w":"A"},{"en":"No way. Most apps give you seven days to return, no questions asked.","zh":"才不是。大多数 App 支持七天无理由退货。","w":"B"},{"en":"Returning an item is easier than you think. Here's how.","zh":"退货比你想的简单。来听听怎么做。","w":"H"},{"en":"Okay, so I open the app, find the order, and tap return?","zh":"好，那我打开 App，找到订单，点退货？","w":"A"},{"en":"Right. Pick a reason — wrong size or item not as described.","zh":"对。选个理由——尺寸不对，或商品与描述不符。","w":"C"},{"en":"Then they give me a refund or send a new one?","zh":"然后他们退款，还是寄个新的？","w":"A"},{"en":"Usually you can choose. A refund goes back to your account in a few days.","zh":"通常可以选。退款几天内回到你的账户。","w":"C"},{"en":"And keep the box and everything until it's done. Don't throw the package away.","zh":"而且完成前别扔包装盒。别把包裹扔了。","w":"B"},{"en":"Good call. I almost recycled the box this morning.","zh":"说得对。我今天早上差点把盒子回收了。","w":"A"},{"en":"One more thing — if the seller ignores you, complain to the platform.","zh":"还有一点——如果卖家不理你，就向平台投诉。","w":"C"},{"en":"The platform has my back. Nice.","zh":"平台会护着我。不错。","w":"A"},{"en":"Slow down. Here are the return phrases.","zh":"放慢速度。来听退货的表达。","w":"H"},{"en":"It doesn't fit.","zh":"不合身。","w":"H"},{"en":"You can return it.","zh":"你可以退。","w":"H"},{"en":"Tap return and pick a reason.","zh":"点退货，选个理由。","w":"H"},{"en":"The refund goes back to your account.","zh":"退款会回到你的账户。","w":"H"},{"en":"a wrong fit","zh":"尺寸不符","w":"H"},{"en":"no questions asked","zh":"无理由","w":"H"},{"en":"not as described","zh":"与描述不符","w":"H"},{"en":"a refund","zh":"退款","w":"H"},{"en":"has my back","zh":"护着我","w":"H"},{"en":"Your turn: in English, ask a seller to return an item that doesn't fit and ask for a refund.","zh":"轮到你了：用英语请卖家退一件不合身的商品，并要求退款。","w":"H"},{"en":"That's it for today. Next, the weather warms up — spring is here. See you on the next walk!","zh":"今天就到这里。下次天气转暖——春天来了。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.24,"i":1},{"t":11.14,"i":2},{"t":15.14,"i":3},{"t":18.74,"i":4},{"t":24.83,"i":5},{"t":28.98,"i":6},{"t":35.01,"i":7},{"t":41.01,"i":8},{"t":46.26,"i":9},{"t":53.27,"i":10},{"t":56.46,"i":11},{"t":63.61,"i":12},{"t":69.65,"i":13},{"t":73.66,"i":14},{"t":79.85,"i":15},{"t":83.26,"i":16},{"t":88.51,"i":28},{"t":95.29,"i":1},{"t":101.51,"i":2},{"t":106.66,"i":3},{"t":111.28,"i":4},{"t":119.0,"i":5},{"t":124.31,"i":6},{"t":131.93,"i":8},{"t":138.59,"i":9},{"t":147.41,"i":10},{"t":151.53,"i":11},{"t":160.54,"i":12},{"t":168.19,"i":13},{"t":173.33,"i":14},{"t":181.17,"i":15},{"t":185.57,"i":17},{"t":190.29,"i":18},{"t":195.04,"i":19},{"t":200.53,"i":20},{"t":206.42,"i":21},{"t":212.49,"i":22},{"t":219.48,"i":23},{"t":225.81,"i":24},{"t":231.5,"i":25},{"t":237.45,"i":26},{"t":245.07,"i":27}],"count":29},{"id":46,"title":"春天的风","sub":"Spring Is Here","desc":"万物复苏的春天，聊聊天气和出游","audio":"audio/talk46.mp3","duration":237.3,"size":1424540,"lines":[{"en":"Welcome back. Today, the season changes — spring is here.","zh":"欢迎回来。今天季节更替——春天来了。","w":"H"},{"en":"Can you feel that? The air is different today.","zh":"你感觉到了吗？今天的空气不一样。","w":"A"},{"en":"Spring! My favorite. The trees are turning green again.","zh":"春天！我的最爱。树又变绿了。","w":"B"},{"en":"I like the smell after the rain. It's like the whole world washed its face.","zh":"我喜欢雨后的味道。就像整个世界洗了把脸。","w":"A"},{"en":"And the days are getting longer. We can stay out later.","zh":"而且白天变长了。我们可以玩到更晚。","w":"C"},{"en":"I just want to fly a kite this weekend.","zh":"我这周末只想放风筝。","w":"B"},{"en":"Kite flying? You and your grandma again?","zh":"放风筝？又跟你奶奶？","w":"A"},{"en":"She's the kite champion. Last year we got one stuck in a tree.","zh":"她是风筝冠军。去年我们有一个卡树上了。","w":"B"},{"en":"Spring means warmer days, more sunshine, and a chance to go outside. Let's hear what they plan.","zh":"春天意味着更暖的天、更多的阳光，还有出门的机会。听听他们计划什么。","w":"H"},{"en":"So what's the perfect spring day for you?","zh":"那你觉得完美的一天春天是什么样？","w":"A"},{"en":"A picnic in the park. A blanket, some fruit, and my dog.","zh":"公园野餐。一块毯子，一点水果，还有我的狗。","w":"B"},{"en":"I'd go for a bike ride by the river. Watch the flowers open.","zh":"我会去河边骑车。看花儿开。","w":"C"},{"en":"You two sound like a TV ad for spring.","zh":"你俩听着像春天的电视广告。","w":"A"},{"en":"And what would the great Jake do?","zh":"那伟大的 Jake 会干嘛？","w":"B"},{"en":"Honestly? Sleep in. Spring makes me want to nap in the sun like a cat.","zh":"说实话？睡懒觉。春天让我想跟猫一样在太阳下打盹。","w":"A"},{"en":"That also counts as enjoying spring.","zh":"那也算享受春天。","w":"C"},{"en":"Slow down. Here are some phrases for spring.","zh":"放慢速度。来听几个春天的表达。","w":"H"},{"en":"The trees are turning green again.","zh":"树又变绿了。","w":"H"},{"en":"The days are getting longer.","zh":"白天变长了。","w":"H"},{"en":"I want to fly a kite.","zh":"我想放风筝。","w":"H"},{"en":"Let's have a picnic in the park.","zh":"我们去公园野餐吧。","w":"H"},{"en":"turn green","zh":"变绿","w":"H"},{"en":"fly a kite","zh":"放风筝","w":"H"},{"en":"a picnic in the park","zh":"公园野餐","w":"H"},{"en":"watch the flowers open","zh":"看花开","w":"H"},{"en":"sleep in","zh":"睡懒觉","w":"H"},{"en":"Your turn: in English, describe your perfect spring day in three sentences.","zh":"轮到你了：用英语三句话描述你完美的一天春天。","w":"H"},{"en":"That's it for today. Next, the heat arrives — hot summer. See you on the next walk!","zh":"今天就到这里。下次热浪来了——炎炎夏日。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.6,"i":1},{"t":10.13,"i":2},{"t":15.43,"i":3},{"t":20.61,"i":4},{"t":26.3,"i":5},{"t":29.51,"i":6},{"t":33.18,"i":7},{"t":38.39,"i":8},{"t":46.79,"i":9},{"t":49.74,"i":10},{"t":55.14,"i":11},{"t":61.54,"i":12},{"t":64.76,"i":13},{"t":67.88,"i":14},{"t":73.32,"i":15},{"t":77.26,"i":16},{"t":82.63,"i":28},{"t":89.41,"i":1},{"t":93.95,"i":2},{"t":100.69,"i":3},{"t":107.27,"i":4},{"t":114.46,"i":5},{"t":118.63,"i":6},{"t":123.34,"i":7},{"t":129.98,"i":9},{"t":133.81,"i":10},{"t":140.66,"i":11},{"t":148.76,"i":12},{"t":152.92,"i":13},{"t":156.97,"i":14},{"t":163.87,"i":15},{"t":168.92,"i":17},{"t":174.48,"i":18},{"t":179.77,"i":19},{"t":184.83,"i":20},{"t":190.37,"i":21},{"t":196.05,"i":22},{"t":202.2,"i":23},{"t":209.11,"i":24},{"t":216.24,"i":25},{"t":221.88,"i":26},{"t":228.37,"i":27}],"count":29},{"id":47,"title":"炎热的夏天","sub":"Hot Summer","desc":"酷暑里怎么防暑降温，聊聊夏天","audio":"audio/talk47.mp3","duration":234.7,"size":1408556,"lines":[{"en":"Welcome back. Today, it's hot — really hot. Let's talk summer.","zh":"欢迎回来。今天很热——特别热。我们聊聊夏天。","w":"H"},{"en":"It's thirty-eight degrees. I'm melting.","zh":"三十八度。我要化了。","w":"A"},{"en":"And it's only June. August will be worse.","zh":"这才六月。八月更糟。","w":"B"},{"en":"Anyone want ice cream? My treat.","zh":"谁想吃冰淇淋？我请客。","w":"C"},{"en":"You're my favorite person right now.","zh":"你现在是我最喜欢的人。","w":"A"},{"en":"Don't just eat sugar. Drink water, too.","zh":"别光吃糖。也要喝水。","w":"B"},{"en":"You sound like the health teacher, Mia.","zh":"你听着像健康课老师，Mia。","w":"A"},{"en":"Hot weather can be fun, but you have to stay safe. Here's how.","zh":"热天可以很好玩，但要注意安全。来听听怎么做。","w":"H"},{"en":"First rule of summer: drink water before you feel thirsty.","zh":"夏天第一法则：渴之前就喝水。","w":"C"},{"en":"Why before?","zh":"为什么是渴之前？","w":"A"},{"en":"If you feel thirsty, you're already a bit dry. It's like a late warning.","zh":"等你觉得渴，身体已经有点缺水了。那是迟到的警报。","w":"C"},{"en":"And wear light, loose clothes. Dark colors soak up the heat.","zh":"还有穿浅色、宽松的衣服。深色吸热。","w":"B"},{"en":"So my all-black outfit was a mistake?","zh":"所以我这一身全黑是错的？","w":"A"},{"en":"In thirty-eight degrees? Yes, Jake. A big one.","zh":"在三十八度里？是的，Jake。大错特错。","w":"B"},{"en":"Fine. What about swimming? That's the best part of summer.","zh":"行。那游泳呢？那是夏天最棒的部分。","w":"A"},{"en":"Swimming is great, but never alone, and use sunscreen.","zh":"游泳很棒，但千万别一个人，还要涂防晒。","w":"C"},{"en":"I burn like toast without sunscreen.","zh":"不涂防晒我晒得跟吐司一样。","w":"A"},{"en":"Slow down. Here are some summer phrases.","zh":"放慢速度。来听几个夏天的表达。","w":"H"},{"en":"I'm melting.","zh":"我要化了。","w":"H"},{"en":"Drink water before you feel thirsty.","zh":"渴之前就喝水。","w":"H"},{"en":"Wear light, loose clothes.","zh":"穿浅色、宽松的衣服。","w":"H"},{"en":"Never swim alone.","zh":"千万别一个人游泳。","w":"H"},{"en":"I'm melting.","zh":"我要热化了。","w":"H"},{"en":"my treat","zh":"我请客","w":"H"},{"en":"a late warning","zh":"迟到的警报","w":"H"},{"en":"soak up the heat","zh":"吸热","w":"H"},{"en":"use sunscreen","zh":"涂防晒","w":"H"},{"en":"Your turn: in English, name two ways you stay cool in summer.","zh":"轮到你了：用英语说出两种你夏天降温的方法。","w":"H"},{"en":"That's it for today. Next, the leaves fall — autumn. See you on the next walk!","zh":"今天就到这里。下次叶落——秋天。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":8.02,"i":1},{"t":11.52,"i":2},{"t":15.91,"i":3},{"t":20.64,"i":4},{"t":23.3,"i":5},{"t":27.16,"i":6},{"t":29.97,"i":7},{"t":36.42,"i":8},{"t":41.8,"i":9},{"t":43.5,"i":10},{"t":50.43,"i":11},{"t":55.83,"i":12},{"t":58.97,"i":13},{"t":64.2,"i":14},{"t":68.74,"i":15},{"t":74.21,"i":16},{"t":77.28,"i":17},{"t":82.51,"i":29},{"t":89.28,"i":1},{"t":93.81,"i":2},{"t":99.44,"i":3},{"t":105.47,"i":4},{"t":108.96,"i":5},{"t":113.92,"i":6},{"t":117.56,"i":8},{"t":124.36,"i":9},{"t":126.68,"i":10},{"t":135.4,"i":11},{"t":142.25,"i":12},{"t":146.34,"i":13},{"t":152.98,"i":14},{"t":158.75,"i":15},{"t":165.7,"i":16},{"t":169.7,"i":18},{"t":174.13,"i":19},{"t":180.19,"i":20},{"t":185.7,"i":21},{"t":190.59,"i":22},{"t":196.35,"i":23},{"t":201.9,"i":24},{"t":207.99,"i":25},{"t":214.23,"i":26},{"t":220.4,"i":27},{"t":226.14,"i":28}],"count":30},{"id":48,"title":"秋天的收获","sub":"Autumn","desc":"秋高气爽，聊聊丰收和秋游","audio":"audio/talk48.mp3","duration":256.8,"size":1541468,"lines":[{"en":"Welcome back. Today, the air turns cool and the leaves turn gold — autumn.","zh":"欢迎回来。今天天气转凉，树叶变成金色——秋天。","w":"H"},{"en":"I love autumn. Not too hot, not too cold.","zh":"我喜欢秋天。不冷不热。","w":"A"},{"en":"And the food! Chestnuts, persimmons, sweet potatoes...","zh":"还有吃的！栗子、柿子、红薯……","w":"B"},{"en":"You think about food in every season, don't you?","zh":"你每个季节都在想吃的，对吧？","w":"A"},{"en":"Autumn is harvest season. It's the rule.","zh":"秋天是收获季。这是规矩。","w":"B"},{"en":"My grandparents live on a farm. Every autumn we help bring in the rice.","zh":"我爷爷奶奶住在农场。每年秋天我们都帮忙收稻子。","w":"C"},{"en":"Really? What's that like?","zh":"真的吗？那是什么感觉？","w":"A"},{"en":"Hard work, but the view is amazing. Golden fields everywhere.","zh":"很累，但景色超美。到处都是金黄的田野。","w":"C"},{"en":"Autumn is a season of change and harvest. Let's hear more about it.","zh":"秋天是变化和收获的季节。来多听听。","w":"H"},{"en":"The leaves are so pretty right now. They go red, orange, yellow...","zh":"现在的树叶真好看。变红、变橙、变黄……","w":"A"},{"en":"Let's go hiking in the hills before it gets too cold.","zh":"趁还没太冷，我们去山里徒步吧。","w":"B"},{"en":"Good idea. But bring a jacket. The morning is chilly.","zh":"好主意。但要带件外套。早上很凉。","w":"C"},{"en":"I hate the 'bring a jacket' part. It's never cold when I leave.","zh":"我讨厌'带外套'这句。我出门时从来都不冷。","w":"A"},{"en":"And it's always cold when you come back. Layers, Jake.","zh":"但你回来时总是冷。多穿几层，Jake。","w":"B"},{"en":"Fine. What else do we do in autumn?","zh":"行。秋天我们还干嘛？","w":"A"},{"en":"My school has a leaf art contest. We make pictures out of fallen leaves.","zh":"我们学校有树叶贴画比赛。用落叶拼成画。","w":"C"},{"en":"That sounds way more fun than homework.","zh":"那可比作业好玩多了。","w":"A"},{"en":"Slow down. Here are some autumn phrases.","zh":"放慢速度。来听几个秋天的表达。","w":"H"},{"en":"The leaves turn gold.","zh":"树叶变成金色。","w":"H"},{"en":"Autumn is harvest season.","zh":"秋天是收获季。","w":"H"},{"en":"Let's go hiking in the hills.","zh":"我们去山里徒步吧。","w":"H"},{"en":"Bring a jacket.","zh":"带件外套。","w":"H"},{"en":"harvest season","zh":"收获季","w":"H"},{"en":"bring in the rice","zh":"收稻子","w":"H"},{"en":"go hiking","zh":"徒步","w":"H"},{"en":"it's chilly","zh":"很凉","w":"H"},{"en":"layers","zh":"多穿几层","w":"H"},{"en":"Your turn: in English, say one thing you love about autumn and one activity you'd do.","zh":"轮到你了：用英语说一件你喜欢秋天的地方，和你想做的一项活动。","w":"H"},{"en":"That's it for today. Next, the first snow falls — a snow day. See you on the next walk!","zh":"今天就到这里。下次初雪落下——下雪天。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.15,"i":1},{"t":11.16,"i":2},{"t":16.37,"i":3},{"t":20.25,"i":4},{"t":24.47,"i":5},{"t":31.31,"i":6},{"t":33.78,"i":7},{"t":40.62,"i":8},{"t":46.77,"i":9},{"t":51.95,"i":10},{"t":56.03,"i":11},{"t":62.89,"i":12},{"t":67.54,"i":13},{"t":72.58,"i":14},{"t":75.77,"i":15},{"t":83.09,"i":16},{"t":86.18,"i":17},{"t":91.39,"i":29},{"t":98.16,"i":1},{"t":103.31,"i":2},{"t":109.92,"i":3},{"t":114.9,"i":4},{"t":120.32,"i":5},{"t":128.94,"i":6},{"t":132.2,"i":7},{"t":140.8,"i":9},{"t":147.39,"i":10},{"t":152.63,"i":11},{"t":161.28,"i":12},{"t":167.2,"i":13},{"t":173.6,"i":14},{"t":177.74,"i":15},{"t":186.94,"i":16},{"t":190.94,"i":18},{"t":195.85,"i":19},{"t":201.05,"i":20},{"t":206.54,"i":21},{"t":211.23,"i":22},{"t":217.45,"i":23},{"t":223.76,"i":24},{"t":229.5,"i":25},{"t":235.23,"i":26},{"t":240.61,"i":27},{"t":247.55,"i":28}],"count":30},{"id":49,"title":"下雪天","sub":"Snow Day","desc":"打雪仗、堆雪人，雪天的快乐与安全","audio":"audio/talk49.mp3","duration":215.5,"size":1293644,"lines":[{"en":"Welcome back. Today, look outside — it's snowing!","zh":"欢迎回来。今天看看窗外——下雪了！","w":"H"},{"en":"Snow! Real snow! School might even close!","zh":"雪！真雪！学校说不定都停课！","w":"A"},{"en":"Don't get your hopes up. Last time it snowed, we still had class.","zh":"别抱太大希望。上次下雪我们照样上课。","w":"B"},{"en":"But this is more snow. Look, it's already covering the ground.","zh":"可这次雪更大。看，都盖住地面了。","w":"A"},{"en":"Even if we have class, we can play in the snow after school.","zh":"就算上课，放学后也能玩雪。","w":"C"},{"en":"Snowball fight at four o'clock. Be there.","zh":"四点打雪仗。不见不散。","w":"B"},{"en":"You're on. I've been training all year.","zh":"来啊。我练了一整年。","w":"A"},{"en":"Snow is magical, but it's also cold and slippery. Here's how to enjoy it safely.","zh":"雪很神奇，但也很冷很滑。来听听怎么安全地玩。","w":"H"},{"en":"First thing — gloves. My hands always freeze.","zh":"第一件事——手套。我的手总是冻僵。","w":"A"},{"en":"And a hat. You lose a lot of heat from your head.","zh":"还有帽子。热量很多从头上跑掉。","w":"B"},{"en":"Wear shoes with grip. The path gets icy and you don't want to slip.","zh":"穿防滑的鞋。路面结冰，你不想摔跤。","w":"C"},{"en":"I fell last winter, in front of everyone. Never again.","zh":"我去年冬天摔了，还当着大家的面。绝不再来。","w":"A"},{"en":"We remember. It's still on video.","zh":"我们记得。视频还在呢。","w":"B"},{"en":"Why do you keep that video?","zh":"你们干嘛留着那个视频？","w":"A"},{"en":"For snowy days like today.","zh":"就为今天这样的雪天。","w":"B"},{"en":"Slow down. Here are some snow-day phrases.","zh":"放慢速度。来听几个雪天的表达。","w":"H"},{"en":"It's covering the ground.","zh":"雪盖住了地面。","w":"H"},{"en":"Let's have a snowball fight.","zh":"我们来打雪仗吧。","w":"H"},{"en":"Wear gloves and a hat.","zh":"戴手套和帽子。","w":"H"},{"en":"The path is icy.","zh":"路面结冰了。","w":"H"},{"en":"get your hopes up","zh":"抱太大希望","w":"H"},{"en":"snowball fight","zh":"打雪仗","w":"H"},{"en":"you lose heat from your head","zh":"热量从头上跑掉","w":"H"},{"en":"shoes with grip","zh":"防滑鞋","w":"H"},{"en":"slip","zh":"滑倒","w":"H"},{"en":"Your turn: in English, describe what you'd do on a perfect snow day.","zh":"轮到你了：用英语描述一个完美雪天你会做什么。","w":"H"},{"en":"That's it for today. Next, the wind howls — a typhoon day off. See you on the next walk!","zh":"今天就到这里。下次狂风呼啸——台风停课。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.95,"i":1},{"t":10.15,"i":2},{"t":15.41,"i":3},{"t":20.08,"i":4},{"t":25.39,"i":5},{"t":29.3,"i":6},{"t":32.41,"i":7},{"t":39.93,"i":8},{"t":44.13,"i":9},{"t":48.23,"i":10},{"t":54.66,"i":11},{"t":59.1,"i":12},{"t":62.74,"i":13},{"t":64.85,"i":14},{"t":67.66,"i":15},{"t":72.96,"i":27},{"t":79.74,"i":1},{"t":85.1,"i":2},{"t":91.78,"i":3},{"t":97.75,"i":4},{"t":104.48,"i":5},{"t":109.51,"i":6},{"t":113.55,"i":8},{"t":118.92,"i":9},{"t":124.18,"i":10},{"t":132.31,"i":11},{"t":137.96,"i":12},{"t":142.65,"i":13},{"t":145.47,"i":14},{"t":149.13,"i":16},{"t":154.14,"i":17},{"t":159.36,"i":18},{"t":164.35,"i":19},{"t":169.36,"i":20},{"t":175.55,"i":21},{"t":181.76,"i":22},{"t":189.01,"i":23},{"t":195.16,"i":24},{"t":200.36,"i":25},{"t":206.28,"i":26}],"count":28},{"id":50,"title":"台风停课","sub":"Typhoon Day Off","desc":"台风天停课在家，怎么安全度过","audio":"audio/talk50.mp3","duration":230.7,"size":1384940,"lines":[{"en":"Welcome back. Today, the wind is howling outside — a typhoon is coming.","zh":"欢迎回来。今天外面狂风呼啸——台风要来了。","w":"H"},{"en":"Did you see the news? Typhoon alert! School is closed tomorrow!","zh":"你看新闻了吗？台风警报！明天停课！","w":"A"},{"en":"I saw. My mom is taping the windows.","zh":"我看到了。我妈在给窗户贴胶带。","w":"B"},{"en":"Taping windows? Is that a real thing?","zh":"贴窗户？这是真的吗？","w":"A"},{"en":"Yeah, it stops the glass from flying if it breaks.","zh":"对，玻璃碎了就不会乱飞。","w":"C"},{"en":"Okay, that's scary. So what do we do all day?","zh":"好吧，听着有点吓人。那我们一整天干嘛？","w":"A"},{"en":"Stay inside, charge your phone, and have water and food ready.","zh":"待在家里，给手机充电，备好水和食物。","w":"B"},{"en":"A typhoon day off sounds fun, but safety comes first. Let's listen.","zh":"台风停课听着好玩，但安全第一。来听听。","w":"H"},{"en":"Can we at least go out and feel the wind?","zh":"我们至少能出去感受下风吧？","w":"A"},{"en":"No! That's how people get hit by flying things.","zh":"不行！那样会被飞来的东西砸到。","w":"B"},{"en":"Trees and signs can fall. Stay away from windows, too.","zh":"树和广告牌会倒。也要离窗户远点。","w":"C"},{"en":"Fine, fine. So we watch movies and eat instant noodles?","zh":"好好好。那我们看电影吃泡面？","w":"A"},{"en":"That's the plan. Unless the power goes out.","zh":"就这么办。除非停电。","w":"B"},{"en":"If the power goes out, I'll just nap. I'm a survivor.","zh":"要是停电，我就睡觉。我是生存达人。","w":"A"},{"en":"A survivor with a flashlight and a plan. Charge everything now.","zh":"生存达人要备好手电筒和计划。现在就充电。","w":"C"},{"en":"Slow down. Here are some typhoon-day phrases.","zh":"放慢速度。来听几个台风天的表达。","w":"H"},{"en":"A typhoon is coming.","zh":"台风要来了。","w":"H"},{"en":"School is closed tomorrow.","zh":"明天停课。","w":"H"},{"en":"Stay inside and charge your phone.","zh":"待在家里，给手机充电。","w":"H"},{"en":"Stay away from windows.","zh":"离窗户远点。","w":"H"},{"en":"typhoon alert","zh":"台风警报","w":"H"},{"en":"taping the windows","zh":"给窗户贴胶带","w":"H"},{"en":"the power goes out","zh":"停电","w":"H"},{"en":"get hit by","zh":"被砸到","w":"H"},{"en":"charge everything","zh":"把所有东西都充电","w":"H"},{"en":"Your turn: in English, list three things to prepare before a typhoon.","zh":"轮到你了：用英语列出台风来临前要准备的三样东西。","w":"H"},{"en":"That's it for today. Next, we check the forecast. See you on the next walk!","zh":"今天就到这里。下次我们看天气预报。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.23,"i":1},{"t":12.36,"i":2},{"t":16.41,"i":3},{"t":19.6,"i":4},{"t":24.47,"i":5},{"t":28.05,"i":6},{"t":33.49,"i":7},{"t":40.58,"i":8},{"t":43.5,"i":9},{"t":48.18,"i":10},{"t":54.95,"i":11},{"t":59.48,"i":12},{"t":63.68,"i":13},{"t":68.12,"i":14},{"t":74.45,"i":15},{"t":79.92,"i":27},{"t":86.7,"i":1},{"t":93.24,"i":2},{"t":98.43,"i":3},{"t":102.57,"i":4},{"t":108.78,"i":5},{"t":113.4,"i":6},{"t":120.3,"i":8},{"t":124.12,"i":9},{"t":130.09,"i":10},{"t":138.62,"i":11},{"t":144.42,"i":12},{"t":149.78,"i":13},{"t":155.46,"i":14},{"t":163.46,"i":16},{"t":168.49,"i":17},{"t":173.79,"i":18},{"t":179.54,"i":19},{"t":184.79,"i":20},{"t":190.88,"i":21},{"t":197.51,"i":22},{"t":204.13,"i":23},{"t":209.87,"i":24},{"t":216.16,"i":25},{"t":222.36,"i":26}],"count":28},{"id":51,"title":"天气预报","sub":"The Weather Forecast","desc":"看懂天气预报，学会用英语聊天气","audio":"audio/talk51.mp3","duration":238.4,"size":1431020,"lines":[{"en":"Welcome back. Today, let's learn to read the weather forecast.","zh":"欢迎回来。今天我们来学看天气预报。","w":"H"},{"en":"I never check the weather. I just look out the window.","zh":"我从不看天气。我直接看窗外。","w":"A"},{"en":"And that's why you got soaked last Tuesday.","zh":"所以上周二你被淋成落汤鸡。","w":"B"},{"en":"It was sunny when I left! The rain came out of nowhere.","zh":"我出门时还是晴天！雨突然就来了。","w":"A"},{"en":"The forecast said rain at three. It was right on time.","zh":"预报说三点下雨。准得很。","w":"C"},{"en":"Fine. So how do I read a forecast without getting confused?","zh":"行。那我怎么才能看懂预报不迷糊？","w":"A"},{"en":"A forecast has a few key pieces. Here's what to look at.","zh":"天气预报有几个关键点。来看看该看什么。","w":"H"},{"en":"First, the high and low temperature. Today's high is twenty-two, low is twelve.","zh":"首先，最高和最低温。今天最高二十二度，最低十二度。","w":"B"},{"en":"So bring a jacket for the morning, but not for lunch?","zh":"所以早上带外套，中午不用？","w":"A"},{"en":"Exactly. Big difference between day and night means layers.","zh":"对。昼夜温差大就要多穿几层。","w":"B"},{"en":"Then check the rain chance. Forty percent means it might rain, not it will.","zh":"然后看降雨概率。百分之四十是可能下雨，不是一定下。","w":"C"},{"en":"So thirty percent and I can skip the umbrella?","zh":"那百分之三十就不用带伞？","w":"A"},{"en":"Your call. But an umbrella fits in a bag.","zh":"你自己定。但一把伞放包里也不占地儿。","w":"C"},{"en":"And watch the wind. Strong wind plus rain is the worst.","zh":"还要看风。大风加下雨最难受。","w":"B"},{"en":"Got it. Temperature, rain chance, and wind.","zh":"明白。温度、降雨概率、风。","w":"A"},{"en":"Slow down. Here are the weather phrases.","zh":"放慢速度。来听聊天气的表达。","w":"H"},{"en":"Today's high is twenty-two, low is twelve.","zh":"今天最高二十二度，最低十二度。","w":"H"},{"en":"The forecast says rain at three.","zh":"预报说三点下雨。","w":"H"},{"en":"Forty percent chance of rain.","zh":"降雨概率百分之四十。","w":"H"},{"en":"Strong wind plus rain.","zh":"大风加下雨。","w":"H"},{"en":"the forecast","zh":"天气预报","w":"H"},{"en":"the high and low","zh":"最高和最低温","w":"H"},{"en":"chance of rain","zh":"降雨概率","w":"H"},{"en":"right on time","zh":"准得很","w":"H"},{"en":"out of nowhere","zh":"突然","w":"H"},{"en":"Your turn: in English, describe today's weather using temperature and rain chance.","zh":"轮到你了：用英语描述今天的天气，带上温度和降雨概率。","w":"H"},{"en":"That's it for today. Next, we dress for the seasons. See you on the next wal about summer? As little as possible?","zh":"夏天呢？能少穿就少穿？","w":"A"},{"en":"Light and loose, but cover your shoulders in strong sun.","zh":"轻薄宽松，但大太阳下要护住肩膀。","w":"C"},{"en":"And the rain?","zh":"那下雨呢？","w":"A"},{"en":"A waterproof jacket beats an umbrella when it's windy.","zh":"有风的时候，防水外套比伞好用。","w":"B"},{"en":"I'll just carry everything in my bag, then.","zh":"那我干脆把啥都塞包里。","w":"A"},{"en":"And look like you're moving house. Maybe not.","zh":"然后看起来像搬家。还是算了吧。","w":"C"},{"en":"Slow down. Here are some phrases for dressing.","zh":"放慢速度。来听几个穿衣的表达。","w":"H"},{"en":"A light jacket and jeans.","zh":"一件薄外套加牛仔裤。","w":"H"},{"en":"I like layering.","zh":"我喜欢叠穿。","w":"H"},{"en":"Three layers in winter.","zh":"冬天穿三层。","w":"H"},{"en":"A waterproof jacket beats an umbrella.","zh":"防水外套比伞好用。","w":"H"},{"en":"sort it","zh":"整理一下","w":"H"},{"en":"layering","zh":"叠穿","w":"H"},{"en":"a windproof coat","zh":"防风外套","w":"H"},{"en":"light and loose","zh":"轻薄宽松","w":"H"},{"en":"waterproof","zh":"防水的","w":"H"},{"en":"Your turn: in English, describe your favorite outfit and which season it's for.","zh":"轮到你了：用英语描述你最爱的一套穿搭，以及它适合哪个季节。","w":"H"},{"en":"That's it for today — and that wraps up batch two! Next batch, we get moving: sports, travel, and hobbies. See you on the next walk!","zh":"今天就到这里——第二批也完成啦！下一批，我们动起来：运动、旅行和兴趣爱好。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.17,"i":1},{"t":11.16,"i":2},{"t":15.6,"i":3},{"t":20.66,"i":4},{"t":26.85,"i":5},{"t":33.06,"i":6},{"t":38.97,"i":7},{"t":41.15,"i":8},{"t":46.67,"i":9},{"t":50.05,"i":10},{"t":55.26,"i":11},{"t":56.89,"i":12},{"t":61.25,"i":13},{"t":64.78,"i":14},{"t":69.99,"i":15},{"t":75.39,"i":27},{"t":82.16,"i":1},{"t":88.48,"i":2},{"t":94.14,"i":3},{"t":100.58,"i":4},{"t":108.42,"i":5},{"t":116.28,"i":7},{"t":119.17,"i":8},{"t":126.16,"i":9},{"t":130.52,"i":10},{"t":137.13,"i":11},{"t":139.35,"i":12},{"t":144.93,"i":13},{"t":149.48,"i":14},{"t":156.09,"i":16},{"t":161.53,"i":17},{"t":166.25,"i":18},{"t":171.4,"i":19},{"t":177.42,"i":20},{"t":182.89,"i":21},{"t":188.29,"i":22},{"t":194.72,"i":23},{"t":201.01,"i":24},{"t":206.87,"i":25},{"t":213.43,"i":26}],"count":28},{"id":53,"title":"我的收藏爱好","sub":"My Hobby Collection","desc":"集邮、卡片、手办，聊聊收藏的乐趣","audio":"audio/talk53.mp3","duration":234.6,"size":1407836,"lines":[{"en":"Welcome back. Today, we talk about a hobby many of you love — collecting.","zh":"欢迎回来。今天我们聊一个很多同学都爱的爱好——收藏。","w":"H"},{"en":"Look at this! I finally got the last card for my set.","zh":"看这个！我终于集齐了这套卡的最后一张。","w":"A"},{"en":"No way! You've been hunting that one for months.","zh":"不会吧！你找那张找了几个月了。","w":"B"},{"en":"I traded three of my doubles for it. Totally worth it.","zh":"我用三张重复的换来的。太值了。","w":"A"},{"en":"What do you collect? Cards, stamps, figures?","zh":"你收藏什么？卡片、邮票、手办？","w":"C"},{"en":"Sports cards. My dad collected the same ones when he was my age.","zh":"运动卡。我爸在我这个年纪也收集同样的卡。","w":"A"},{"en":"That's cool — a hobby you share with your dad.","zh":"真酷——一个你和你爸共享的爱好。","w":"B"},{"en":"Collecting teaches patience and lets you share something with others. Let's hear more.","zh":"收藏能培养耐心，还能让你和别人分享。来多听听。","w":"H"},{"en":"How do you keep your collection safe?","zh":"你怎么保存你的收藏？","w":"C"},{"en":"Plastic sleeves and a binder. Dust and folding are the enemy.","zh":"塑料保护套和活页夹。灰尘和折痕是大敌。","w":"A"},{"en":"I collect stamps. My grandpa sends me one from every trip.","zh":"我集邮。我爷爷每次旅行都给我寄一张。","w":"B"},{"en":"So your collection is also a map of his trips.","zh":"那你的收藏也是他的旅行地图。","w":"A"},{"en":"Exactly! Each stamp has a story behind it.","zh":"没错！每张邮票背后都有个故事。","w":"B"},{"en":"I don't collect anything. Maybe I should start.","zh":"我啥也不收藏。也许我该开始了。","w":"C"},{"en":"Start small. Pick something you love, and enjoy the hunt.","zh":"从小开始。挑一样你喜欢的，享受寻找的过程。","w":"A"},{"en":"Slow down. Here are some phrases about collecting.","zh":"放慢速度。来听几个关于收藏的表达。","w":"H"},{"en":"I finally got the last card for my set.","zh":"我终于集齐了这套卡的最后一张。","w":"H"},{"en":"I traded three of my doubles for it.","zh":"我用三张重复的换来的。","w":"H"},{"en":"Each stamp has a story behind it.","zh":"每张邮票背后都有个故事。","w":"H"},{"en":"Pick something you love.","zh":"挑一样你喜欢的。","w":"H"},{"en":"the last card for my set","zh":"集齐套卡的最后一张","w":"H"},{"en":"my doubles","zh":"我重复的卡","w":"H"},{"en":"keep it safe","zh":"保存好","w":"H"},{"en":"a story behind it","zh":"背后的故事","w":"H"},{"en":"start small","zh":"从小开始","w":"H"},{"en":"Your turn: in English, describe what you collect or what you'd like to collect, and why.","zh":"轮到你了：用英语描述你收藏什么（或想收藏什么），以及为什么。","w":"H"},{"en":"That's it for today. Next, we pick up an instrument. See you on the next walk!","zh":"今天就到这里。下次我们学乐器。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.27,"i":1},{"t":11.57,"i":2},{"t":15.57,"i":3},{"t":19.65,"i":4},{"t":25.65,"i":5},{"t":30.74,"i":6},{"t":34.45,"i":7},{"t":41.68,"i":8},{"t":45.16,"i":9},{"t":50.75,"i":10},{"t":56.15,"i":11},{"t":60.08,"i":12},{"t":64.71,"i":13},{"t":70.01,"i":14},{"t":74.52,"i":15},{"t":80.14,"i":27},{"t":86.91,"i":1},{"t":92.4,"i":2},{"t":97.54,"i":3},{"t":102.79,"i":4},{"t":110.38,"i":5},{"t":116.83,"i":6},{"t":121.62,"i":8},{"t":126.09,"i":9},{"t":133.18,"i":10},{"t":140.04,"i":11},{"t":145.09,"i":12},{"t":151.0,"i":13},{"t":157.74,"i":14},{"t":163.48,"i":16},{"t":169.96,"i":17},{"t":175.8,"i":18},{"t":181.68,"i":19},{"t":186.64,"i":20},{"t":194.34,"i":21},{"t":200.24,"i":22},{"t":206.24,"i":23},{"t":212.96,"i":24},{"t":219.06,"i":25},{"t":226.2,"i":26}],"count":28},{"id":54,"title":"学乐器","sub":"Learning an Instrument","desc":"练琴的苦与乐，坚持就是胜利","audio":"audio/talk54.mp3","duration":236.0,"size":1416476,"lines":[{"en":"Welcome back. Today, we make music — or try to. Learning an instrument.","zh":"欢迎回来。今天我们搞音乐——或者说试着搞。学乐器。","w":"H"},{"en":"My mom signed me up for piano lessons. I have no idea what I'm doing.","zh":"我妈给我报了钢琴课。我完全不知道自己在干嘛。","w":"A"},{"en":"That's how everyone starts. Which hand is for which keys?","zh":"大家都是这么开始的。哪只手按哪些键？","w":"B"},{"en":"Both! At the same time! My brain refuses.","zh":"两只都要！同时！我脑子不肯。","w":"A"},{"en":"It gets easier. The first month is the hardest.","zh":"会越来越容易的。第一个月最难。","w":"C"},{"en":"Easy for you to say. You play guitar like a rock star.","zh":"你说得轻松。你吉他弹得跟摇滚明星似的。","w":"A"},{"en":"Rock star? I played one chord wrong for a whole song last week.","zh":"摇滚明星？上周我整首歌都弹错了一个和弦。","w":"C"},{"en":"Learning an instrument is hard, but the payoff is real. Here's how to stick with it.","zh":"学乐器很难，但回报是真的。来听听怎么坚持。","w":"H"},{"en":"The secret is short daily practice, not one long session.","zh":"秘诀是每天练一小会儿，不是一次练很久。","w":"B"},{"en":"How short?","zh":"多短？","w":"A"},{"en":"Fifteen minutes a day beats two hours on Sunday.","zh":"每天十五分钟，胜过周日练两小时。","w":"B"},{"en":"And record yourself. You'll hear your progress over time.","zh":"还要录下来。你会听到自己慢慢进步。","w":"C"},{"en":"Record myself? I sound like a cat walking on the keys.","zh":"录自己？我弹得像猫在琴键上散步。","w":"A"},{"en":"Now, maybe. In three months, you'll smile at that recording.","zh":"现在是。三个月后，你会对着那段录音笑。","w":"B"},{"en":"Okay, I'll try. Fifteen minutes, every day.","zh":"好，我试试。每天十五分钟。","w":"A"},{"en":"Slow down. Here are some phrases about music practice.","zh":"放慢速度。来听几个关于练琴的表达。","w":"H"},{"en":"I signed up for piano lessons.","zh":"我报了钢琴课。","w":"H"},{"en":"The first month is the hardest.","zh":"第一个月最难。","w":"H"},{"en":"Short daily practice beats one long session.","zh":"每天练一小会儿胜过一次练很久。","w":"H"},{"en":"Record yourself.","zh":"录下来。","w":"H"},{"en":"sign up for","zh":"报名参加","w":"H"},{"en":"play guitar","zh":"弹吉他","w":"H"},{"en":"stick with it","zh":"坚持下去","w":"H"},{"en":"daily practice","zh":"每天练习","w":"H"},{"en":"hear your progress","zh":"听到你的进步","w":"H"},{"en":"Your turn: in English, name an instrument you'd like to learn and how you'd practice.","zh":"轮到你了：用英语说出你想学的乐器，以及你会怎么练。","w":"H"},{"en":"That's it for today. Next, we draw and ta ,{"en":"And for drawing, Mia? How do you get better?","zh":"那画画呢，Mia？怎么进步？","w":"A"},{"en":"Draw a little every day. Don't wait for inspiration.","zh":"每天画一点。别等灵感。","w":"B"},{"en":"What if it looks bad?","zh":"画得丑怎么办？","w":"A"},{"en":"Then it's practice. Every bad drawing is a step to a good one.","zh":"那就算练习。每一张丑画都是通往好画的一步。","w":"B"},{"en":"Same with photos. Take a hundred, keep five.","zh":"拍照也一样。拍一百张，留五张。","w":"C"},{"en":"I like that. The bad ones aren't failures, they're practice.","zh":"我喜欢这个。丑的不是失败，是练习。","w":"A"},{"en":"Slow down. Here are some phrases about art and photos.","zh":"放慢速度。来听几个关于画画摄影的表达。","w":"H"},{"en":"I took a photo of the sunset.","zh":"我拍了张日落。","w":"H"},{"en":"No filter, the sky just did that.","zh":"没用滤镜，天空本来就那样。","w":"H"},{"en":"Draw a little every day.","zh":"每天画一点。","w":"H"},{"en":"Take a hundred, keep five.","zh":"拍一百张，留五张。","w":"H"},{"en":"take a photo","zh":"拍照","w":"H"},{"en":"golden hour","zh":"黄金时刻","w":"H"},{"en":"soft, warm light","zh":"柔和温暖的光","w":"H"},{"en":"wait for inspiration","zh":"等灵感","w":"H"},{"en":"keep five","zh":"留五张","w":"H"},{"en":"Your turn: in English, describe a photo you love or a picture you'd like to draw.","zh":"轮到你了：用英语描述一张你喜欢的照片，或一幅你想画的画。","w":"H"},{"en":"That's it for today. Next, the school sports day. See you on the next walk!","zh":"今天就到这里。下次是学校运动会。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.75,"i":1},{"t":11.74,"i":2},{"t":15.81,"i":3},{"t":19.17,"i":4},{"t":25.36,"i":5},{"t":30.14,"i":6},{"t":36.86,"i":7},{"t":39.11,"i":8},{"t":46.24,"i":9},{"t":49.52,"i":10},{"t":54.11,"i":11},{"t":56.1,"i":12},{"t":61.3,"i":13},{"t":67.3,"i":14},{"t":72.07,"i":15},{"t":78.05,"i":27},{"t":84.82,"i":1},{"t":89.95,"i":2},{"t":95.19,"i":3},{"t":99.52,"i":4},{"t":107.34,"i":5},{"t":113.44,"i":7},{"t":116.41,"i":8},{"t":125.4,"i":9},{"t":129.63,"i":10},{"t":135.48,"i":11},{"t":138.13,"i":12},{"t":144.74,"i":13},{"t":152.34,"i":14},{"t":158.42,"i":16},{"t":164.0,"i":17},{"t":170.21,"i":18},{"t":175.34,"i":19},{"t":180.92,"i":20},{"t":186.92,"i":21},{"t":192.76,"i":22},{"t":200.08,"i":23},{"t":206.99,"i":24},{"t":212.87,"i":25},{"t":219.48,"i":26}],"count":28},{"id":56,"title":"运动会的接力赛","sub":"Sports Day","desc":"接力赛的紧张与团队合作","audio":"audio/talk56.mp3","duration":228.6,"size":1372412,"lines":[{"en":"Welcome back. Today, it's the big day — the school sports meet!","zh":"欢迎回来。今天是大事——学校运动会！","w":"H"},{"en":"Guys, the relay race is in twenty minutes. I'm so nervous.","zh":"各位，接力赛二十分钟后开始。我好紧张。","w":"A"},{"en":"You've trained for this. Just don't drop the baton.","zh":"你练了这么久了。别掉棒就行。","w":"B"},{"en":"Don't drop the baton. Great. Now that's all I'll think about.","zh":"别掉棒。真棒。现在我满脑子都是这个。","w":"A"},{"en":"Relax. Focus on the handoff, not the whole race.","zh":"放松。专注交接棒，别想整场比赛。","w":"C"},{"en":"The handoff is the part I always mess up.","zh":"交接棒正是我老出错的地方。","w":"A"},{"en":"So let's practice it right now. Ten times.","zh":"那我们现在就练。十次。","w":"C"},{"en":"A relay race is about teamwork, not just speed. Here's the plan.","zh":"接力赛靠的是团队合作，不只是速度。来听听计划。","w":"H"},{"en":"Here's the order. I start, then Leo, then you anchor, Jake.","zh":"顺序是这样：我先跑，然后 Leo，你最后一棒，Jake。","w":"B"},{"en":"Anchor? That's a lot of pressure.","zh":"最后一棒？压力好大。","w":"A"},{"en":"You're the fastest in the last stretch. It makes sense.","zh":"你是冲刺最快的。这样安排合理。","w":"C"},{"en":"Okay. And the handoff?","zh":"好。那交接棒呢？","w":"A"},{"en":"I pass with my right hand, you take with your left. Then switch.","zh":"我右手递，你左手接。然后换手。","w":"B"},{"en":"And don't slow down before the exchange zone.","zh":"还有别在交接区前减速。","w":"C"},{"en":"Got it. Right hand, left hand, full speed.","zh":"明白。右手、左手、全速。","w":"A"},{"en":"Slow down. Here are some sports-day phrases.","zh":"放慢速度。来听几个运动会的表达。","w":"H"},{"en":"The relay race is in twenty minutes.","zh":"接力赛二十分钟后开始。","w":"H"},{"en":"Don't drop the baton.","zh":"别掉棒。","w":"H"},{"en":"Focus on the handoff.","zh":"专注交接棒。","w":"H"},{"en":"Don't slow down before the exchange zone.","zh":"别在交接区前减速。","w":"H"},{"en":"relay race","zh":"接力赛","w":"H"},{"en":"drop the baton","zh":"掉棒","w":"H"},{"en":"the handoff","zh":"交接棒","w":"H"},{"en":"anchor","zh":"最后一棒","w":"H"},{"en":"the last stretch","zh":"最后冲刺","w":"H"},{"en":"Your turn: in English, describe your role in a team sport or game.","zh":"轮到你了：用英语描述你在某个团队运动或游戏里的角色。","w":"H"},{"en":"That's it for today. Next, we jump in the pool. See you on the next walk!","zh":"今天就到这里。下次我们跳进泳池。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.72,"i":1},{"t":12.24,"i":2},{"t":16.56,"i":3},{"t":21.02,"i":4},{"t":27.28,"i":5},{"t":30.78,"i":6},{"t":36.21,"i":7},{"t":43.0,"i":8},{"t":48.28,"i":9},{"t":51.18,"i":10},{"t":57.08,"i":11},{"t":59.74,"i":12},{"t":65.12,"i":13},{"t":69.51,"i":14},{"t":73.83,"i":15},{"t":79.32,"i":27},{"t":86.1,"i":1},{"t":93.12,"i":2},{"t":98.65,"i":3},{"t":104.35,"i":4},{"t":112.28,"i":5},{"t":116.8,"i":6},{"t":123.68,"i":8},{"t":130.36,"i":9},{"t":134.14,"i":10},{"t":141.62,"i":11},{"t":145.09,"i":12},{"t":151.89,"i":13},{"t":157.5,"i":14},{"t":163.03,"i":16},{"t":169.02,"i":17},{"t":173.79,"i":18},{"t":178.84,"i":19},{"t":184.93,"i":20},{"t":190.98,"i":21},{"t":196.91,"i":22},{"t":202.67,"i":23},{"t":207.88,"i":24},{"t":214.48,"i":25},{"t":220.53,"i":26}],"count":28},{"id":57,"title":"游泳课","sub":"Swimming Lessons","desc":"学游泳的步骤，克服对水的恐惧","audio":"audio/talk57.mp3","duration":230.3,"size":1382060,"lines":[{"en":"Welcome back. Today, we get wet — swimming lessons.","zh":"欢迎回来。今天我们下水——游泳课。","w":"H"},{"en":"I started swimming lessons. I can float now, but I still panic.","zh":"我开始学游泳了。现在能浮起来了，但还是会慌。","w":"A"},{"en":"Floating is a big first step! What scares you?","zh":"能浮起来就是一大步了！你怕什么？","w":"B"},{"en":"Putting my face in the water. I hold my breath and freak out.","zh":"把脸埋进水里。我屏住呼吸就慌了。","w":"A"},{"en":"Blow bubbles instead of holding your breath. It sounds weird, but it calms you.","zh":"别憋气，要吐泡泡。听着怪，但能让你放松。","w":"C"},{"en":"Blow bubbles? Like a fish?","zh":"吐泡泡？跟鱼一样？","w":"A"},{"en":"Exactly. Breathe out through your nose, and you won't panic.","zh":"对。用鼻子呼气，你就不会慌。","w":"C"},{"en":"Swimming is a skill for life. Here's how to build it step by step.","zh":"游泳是一生受用的技能。来听听怎么一步步学。","w":"H"},{"en":"What's the first thing your coach teaches?","zh":"你教练先教什么？","w":"B"},{"en":"Floating on my back. Then kicking while holding the wall.","zh":"仰面漂浮。然后扶着池壁踢腿。","w":"A"},{"en":"Kicking is all in the legs, straight but not stiff.","zh":"踢腿全靠腿，要伸直但别僵。","w":"B"},{"en":"And when you add arms, breathe to the side, not up.","zh":"加上手臂后，要侧头呼吸，不是抬头。","w":"C"},{"en":"Breathe to the side. Got it. Why does everything in swimming feel backwards?","zh":"侧头呼吸。明白。为啥游泳里啥都感觉反着来？","w":"A"},{"en":"Because water is a new world. Give it time.","zh":"因为水是个新世界。给它点时间。","w":"B"},{"en":"I'll keep at it. My goal is to swim a whole lap.","zh":"我会坚持。我的目标是游完一整条泳道。","w":"A"},{"en":"Slow down. Here are some swimming phrases.","zh":"放慢速度。来听几个游泳的表达。","w":"H"},{"en":"I can float now.","zh":"我现在能浮起来了。","w":"H"},{"en":"Blow bubbles instead of holding your breath.","zh":"别憋气，要吐泡泡。","w":"H"},{"en":"Float on your back.","zh":"仰面漂浮。","w":"H"},{"en":"Breathe to the side, not up.","zh":"侧头呼吸，不是抬头。","w":"H"},{"en":"float","zh":"漂浮","w":"H"},{"en":"hold my breath","zh":"屏住呼吸","w":"H"},{"en":"blow bubbles","zh":"吐泡泡","w":"H"},{"en":"kick","zh":"踢腿","w":"H"},{"en":"swim a whole lap","zh":"游完整条泳道","w":"H"},{"en":"Your turn: in English, describe one swimming skill you know or want to learn.","zh":"轮到你了：用英语描述一项你会（或想学）的游泳技能。","w":"H"},{"en":"That's it for today. Next, we hit the badminton court. See you on the next walk!","zh":"今天就到这里。下次我们打羽毛球。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.39,"i":1},{"t":11.35,"i":2},{"t":15.81," ginner?","zh":"对新手最好的建议是啥？","w":"B"},{"en":"Hit the shuttle with the middle of the racket, and watch your opponent, not the birdie.","zh":"用球拍中间击球，看对手别看球。","w":"A"},{"en":"Watch the player, not the shuttle? That feels wrong.","zh":"看人别看球？感觉不对啊。","w":"B"},{"en":"Trust me, your eyes follow their racket and you'll react faster.","zh":"信我，盯着对手的球拍，你反应会更快。","w":"A"},{"en":"Slow down. Here are some badminton phrases.","zh":"放慢速度。来听几个羽毛球的表达。","w":"H"},{"en":"I need a badminton partner.","zh":"我需要个羽毛球搭档。","w":"H"},{"en":"Loser buys ice cream.","zh":"输的人买冰淇淋。","w":"H"},{"en":"First to twenty-one, and win by two.","zh":"先到二十一，领先两分。","w":"H"},{"en":"Watch your opponent, not the birdie.","zh":"看对手别看球。","w":"H"},{"en":"a racket","zh":"球拍","w":"H"},{"en":"rally scoring","zh":"每球得分制","w":"H"},{"en":"the serve","zh":"发球","w":"H"},{"en":"the shuttle","zh":"羽毛球","w":"H"},{"en":"react faster","zh":"反应更快","w":"H"},{"en":"Your turn: in English, name a sport and describe one rule of it.","zh":"轮到你了：用英语说出一种运动，并描述它的一条规则。","w":"H"},{"en":"That's it for today. Next, we ride to school. See you on the next walk!","zh":"今天就到这里。下次我们骑车上学。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.58,"i":1},{"t":10.85,"i":2},{"t":14.88,"i":3},{"t":19.75,"i":4},{"t":23.51,"i":5},{"t":28.31,"i":6},{"t":32.15,"i":7},{"t":39.38,"i":8},{"t":42.35,"i":9},{"t":49.38,"i":10},{"t":53.39,"i":11},{"t":59.79,"i":12},{"t":62.53,"i":13},{"t":68.04,"i":14},{"t":72.51,"i":15},{"t":77.47,"i":16},{"t":82.95,"i":28},{"t":89.72,"i":1},{"t":95.2,"i":2},{"t":100.37,"i":3},{"t":106.58,"i":4},{"t":111.41,"i":5},{"t":117.52,"i":6},{"t":122.45,"i":8},{"t":126.33,"i":9},{"t":135.17,"i":10},{"t":140.32,"i":11},{"t":148.42,"i":12},{"t":151.99,"i":13},{"t":159.01,"i":14},{"t":164.71,"i":15},{"t":171.03,"i":17},{"t":176.33,"i":18},{"t":181.48,"i":19},{"t":187.81,"i":20},{"t":193.68,"i":21},{"t":199.37,"i":22},{"t":205.56,"i":23},{"t":211.03,"i":24},{"t":216.57,"i":25},{"t":223.05,"i":26},{"t":228.92,"i":27}],"count":29},{"id":59,"title":"骑车上学","sub":"Biking to School","desc":"骑车上学的好处与安全守则","audio":"audio/talk59.mp3","duration":215.2,"size":1291916,"lines":[{"en":"Welcome back. Today, we bike to school.","zh":"欢迎回来。今天我们骑车上学。","w":"H"},{"en":"I started biking to school. It saves so much time!","zh":"我开始骑车上学了。省了好多时间！","w":"A"},{"en":"And it's good for the planet. No traffic, no fumes.","zh":"还对环境好。不堵车，没尾气。","w":"B"},{"en":"Plus, I feel free. Wind in my hair, whole road to myself.","zh":"而且感觉很自由。风吹头发，整条路都是我的。","w":"A"},{"en":"Do you wear a helmet?","zh":"你戴头盔吗？","w":"C"},{"en":"Uh... sometimes?","zh":"呃……有时戴？","w":"A"},{"en":"Always, Jake. Your head is worth more than your hair.","zh":"要一直戴，Jake。你的脑袋比发型值钱。","w":"C"},{"en":"Biking is great, but safety comes first. Here are the rules of the road.","zh":"骑车很棒，但安全第一。来听交通规则。","w":"H"},{"en":"What do you check before every ride?","zh":"每次骑车前你检查什么？","w":"B"},{"en":"Brakes and tire pressure. And my bell works.","zh":"刹车和胎压。还有车铃响不响。","w":"A"},{"en":"Good. And on the road, ride with traffic, not against it.","zh":"很好。还有在路上要顺着车流骑，别逆行。","w":"C"},{"en":"What about at night?","zh":"晚上呢？","w":"A"},{"en":"Lights front and back, and something bright so drivers see you.","zh":"前后灯都开，再穿点显眼的，让司机看到你。","w":"C"},{"en":"And never wear headphones. You need to hear what's coming.","zh":"还有绝不戴耳机。你得听见周围的声音。","w":"B"},{"en":"No headphones. Got it. My music can wait.","zh":"不戴耳机。明白。音乐可以等。","w":"A"},{"en":"Slow down. Here are some biking phrases.","zh":"放慢速度。来听几个骑车的表达。","w":"H"},{"en":"I started biking to school.","zh":"我开始骑车上学了。","w":"H"},{"en":"Always wear a helmet.","zh":"要一直戴头盔。","w":"H"},{"en":"Ride with traffic, not against it.","zh":"顺着车流骑，别逆行。","w":"H"},{"en":"Never wear headphones.","zh":"绝不戴耳机。","w":"H"},{"en":"bike to school","zh":"骑车上学","w":"H"},{"en":"a helmet","zh":"头盔","w":"H"},{"en":"tire pressure","zh":"胎压","w":"H"},{"en":"ride with traffic","zh":"顺车流骑","w":"H"},{"en":"lights front and back","zh":"前后灯","w":"H"},{"en":"Your turn: in English, list three safety rules for riding a bike.","zh":"轮到你了：用英语列出三条骑车的安全规则。","w":"H"},{"en":"That's it for today. Next, we take the bus. See you on the next walk!","zh":"今天就到这里。下次我们坐公交。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.35,"i":1},{"t":9.46,"i":2},{"t":14.57,"i":3},{"t":20.06,"i":4},{"t":22.72,"i":5},{"t":24.71,"i":6},{"t":30.9,"i":7},{"t":37.82,"i":8},{"t":40.67,"i":9},{"t":44.39,"i":10},{"t":50.91,"i":11},{"t":52.78,"i":12},{"t":58.25,"i":13},{"t":62.74,"i":14},{"t":66.79,"i":15},{"t":72.05,"i":27},{"t":78.82,"i":1},{"t":84.09,"i":2},{"t":90.58,"i":3},{"t":97.56,"i":4},{"t":101.05,"i":5},{"t":103.7,"i":6},{"t":111.51,"i":8},{"t":115.22,"i":9},{"t":120.01,"i":10},{"t":128.25,"i":11},{"t":130.76,"i":12},{"t":137.68,"i":13},{"t":143.43,"i":14},{"t":148.63,"i":16},{"t":154.02,"i":17},{"t":159.03,"i":18},{"t":165.07,"i":19},{"t":170.15,"i":20},{"t":176.2,"i":21},{"t":181.79,"i":22},{"t":187.86,"i":23},{"t":194.32,"i":24},{"t":201.11,"i":25},{"t":207.16,"i":26}],"count":28},{"id":60,"title":"挤公交","sub":"Taking the Bus","desc":"坐公交的礼仪和实用表达","audio":"audio/talk60.mp3","duration":214.8,"size":1289324,"lines":[{"en":"Welcome back. Today, we take the bus.","zh":"欢迎回来。今天我们坐公交。","w":"H"},{"en":"The bus was packed this morning. I was squished like a pancake.","zh":"今早公交挤爆了。我被挤得像块饼。","w":"A"},{"en":"Rush hour is the worst. Did you get a seat?","zh":"高峰时段最难受。你抢到座了吗？","w":"B"},{"en":"No, but an old lady did. I gave her mine.","zh":"没有，但有个老奶奶坐了。我把我的让给她了。","w":"A"},{"en":"That's kind of you. She probably needed it more.","zh":"你真好。她应该更需要。","w":"B"},{"en":"Good bus manners. Offering your seat is the golden rule.","zh":"这是公交礼仪。让座是黄金法则。","w":"C"},{"en":"Riding the bus has its own small rules. Here's how to be a good passenger.","zh":"坐公交有它的小规矩。来听听怎么当个好乘客。","w":"H"},{"en":"So what are the unwritten bus rules?","zh":"那公交的潜规则是啥？","w":"A"},{"en":"Offer seats to the old, the young, and anyone who needs it.","zh":"给老人、小孩和有需要的人让座。","w":"C"},{"en":"Move to the back so people can get on. Don't block the door.","zh":"往里走，让别人能上车。别堵门。","w":"B"},{"en":"And keep your voice down, right? Some kids shout the whole ride.","zh":"还有小声点，对吧？有些同学一路都在喊。","w":"A"},{"en":"Exactly. And have your card ready before you get on.","zh":"没错。而且上车前把卡准备好。","w":"B"},{"en":"Guilty. I always dig for my card at the reader.","zh":"我认罪。我老是在刷卡机前翻卡。","w":"A"},{"en":"We've all seen it. Just keep it in your pocket.","zh":"我们都见过。放口袋里就好。","w":"C"},{"en":"Slow down. Here are some bus phrases.","zh":"放慢速度。来听几个公交的表达。","w":"H"},{"en":"The bus was packed.","zh":"公交挤爆了。","w":"H"},{"en":"I gave my seat to an old lady.","zh":"我把座位让给了一个老奶奶。","w":"H"},{"en":"Move to the back, don't block the door.","zh":"往里走，别堵门。","w":"H"},{"en":"Have your card ready.","zh":"把卡准备好。","w":"H"},{"en":"rush hour","zh":"高峰时段","w":"H"},{"en":"offer your seat","zh":"让座","w":"H"},{"en":"block the door","zh":"堵门","w":"H"},{"en":"keep your voice down","zh":"小声点","w":"H"},{"en":"have your card ready","zh":"把卡准备好","w":"H"},{"en":"Your turn: in English, describe your bus ride to school using three sentences.","zh":"轮到你了：用英语三句话描述你坐公交上学的经历。","w":"H"},{"en":"That's it for today. Next, we get lost in the subway. See you on the next walk!","zh":"今天就到这里。下次我们在地铁里迷路。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.38,"i":1},{"t":10.01,"i":2},{"t":14.09,"i":3},{"t":18.04,"i":4},{"t":22.24,"i":5},{"t":28.19,"i":6},{"t":35.03,"i":7},{"t":37.89,"i":8},{"t":43.33,"i":9},{"t":48.25,"i":10},{"t":52.55,"i":11},{"t":57.2,"i":12},{"t":61.06,"i":13},{"t":66.24,"i":14},{"t":71.36,"i":26},{"t":78.13,"i":1},{"t":84.02,"i":2},{"t":89.27,"i":3},{"t":94.34,"i":4},{"t":99.71,"i":5},{"t":107.23,"i":7},{"t":110.94,"i":8},{"t":117.84,"i":9},{"t":124.11,"i":10},{"t":129.6,"i":11},{"t":135.54,"i":12},{"t":140.49,"i":13},{"t":147.08,"i":15},{"t":151.97,"i":16},{"t":157.63,"i":17},{"t":163.74,"i":18},{"t":168.55,"i":19},{"t":174.36,"i":20},{"t":180.55,"i":21},{"t":186.55,"i":22},{"t":193.11,"i":23},{"t":199.54,"i":24},{"t":206.27,"i":25}],"count":27},{"id":61,"title":"地铁迷路","sub":"The Subway Mix-Up","desc":"坐错方向怎么办，学会问路","audio":"audio/talk61.mp3","duration":224.5,"size":1347500,"lines":[{"en":"Welcome back. Today, we take the subway — and get a little lost.","zh":"欢迎回来。今天我们坐地铁——然后有点迷路了。","w":"H"},{"en":"Guys, I think I took the wrong train.","zh":"各位，我觉得我坐错车了。","w":"A"},{"en":"What? Where are you now?","zh":"什么？你现在在哪儿？","w":"B"},{"en":"I don't know! The station names look familiar but wrong.","zh":"我不知道！站名看着眼熟但又不对。","w":"A"},{"en":"Check the line map. Which line are you on, and which direction?","zh":"看线路图。你在几号线，往哪个方向？","w":"C"},{"en":"Line three... heading to the airport? I need downtown.","zh":"三号线……往机场方向？我要去市中心。","w":"A"},{"en":"Then get off at the next stop and switch to the other platform.","zh":"那就在下一站下车，换到对面的站台。","w":"C"},{"en":"Getting lost on the subway is common, and easy to fix. Here's how to ask for help.","zh":"地铁坐错很常见，也容易解决。来听听怎么求助。","w":"H"},{"en":"Okay, I'm off. Now what? I still don't know the way.","zh":"好，我下车了。然后呢？我还是不知道路。","w":"A"},{"en":"Find a station worker in a uniform, or ask a friendly passenger.","zh":"找穿制服的工作人员，或者问个和善的乘客。","w":"B"},{"en":"How do I ask without sounding silly?","zh":"怎么问才不显得傻？","w":"A"},{"en":"Just say, 'Excuse me, how do I get to downtown?'","zh":"就说，'打扰一下，请问去市中心怎么走？'","w":"B"},{"en":"Or use the map app on your phone. It shows every transfer.","zh":"或者用手机地图 App。上面显示每次换乘。","w":"C"},{"en":"You mean I could have checked my phone this whole time?","zh":"你是说我这一路都可以查手机？","w":"A"},{"en":"Yes, Jake. Yes, you could.","zh":"是的，Jake。是的，你可以。","w":"B"},{"en":"Slow down. Here are some subway phrases.","zh":"放慢速度。来听几个地铁的表达。","w":"H"},{"en":"I think I took the wrong train.","zh":"我觉得我坐错车了。","w":"H"},{"en":"Which line are you on?","zh":"你在几号线？","w":"H"},{"en":"Switch to the other platform.","zh":"换到对面的站台。","w":"H"},{"en":"How do I get to downtown?","zh":"去市中心怎么走？","w":"H"},{"en":"the wrong train","zh":"坐错车","w":"H"},{"en":"the line map","zh":"线路图","w":"H"},{"en":"the other platform","zh":"对面的站台","w":"H"},{"en":"a station worker","zh":"地铁工作人员","w":"H"},{"en":"every transfer","zh":"每次换乘","w":"H"},{"en":"Your turn: in English, ask for directions to a place using 'Excuse me, how do I get to...'","zh":"轮到你了：用英语问路，用上 'Excuse me, how do I get to...'","w":"H"},{"en":"That's it for today. Next, we take a taxi to the airport. See you on the next walk!","zh":"今天就到这里。下次我们打车去机场。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.84,"i":1},{"t":9.96,"i":2},{"t":12.93,"i":3},{"t":17.4,"i":4},{"t":23.83,"i":5},{"t":28.5,"i":6},{"t":33.52,"i":7},{"t":41.2,"i":8},{"t":45.42,"i":9},{"t":51.2,"i":10},{"t":54.11,"i":11},{"t":58.33,"i":12},{"t":64.52,"i":13},{"t":67.61,"i":14},{"t":71.21,"i":15},{"t":76.54,"i":27},{"t":83.31,"i":1},{"t":87.36,"i":2},{"t":91.23,"i":3},{"t":96.93,"i":4},{"t":105.03,"i":5},{"t":111.0,"i":6},{"t":117.37,"i":8},{"t":122.78,"i":9},{"t":130.09,"i":10},{"t":133.87,"i":11},{"t":139.28,"i":12},{"t":147.12,"i":13},{"t":151.14,"i":14},{"t":155.76,"i":16},{"t":161.12,"i":17},{"t":166.11,"i":18},{"t":171.52,"i":19},{"t":176.65,"i":20},{"t":182.75,"i":21},{"t":188.65,"i":22},{"t":195.28,"i":23},{"t":201.73,"i":24},{"t":208.04,"i":25},{"t":215.66,"i":26}],"count":28},{"id":62,"title":"打车去机场","sub":"Taxi to the Airport","desc":"赶飞机的紧张时刻，学会打车表达","audio":"audio/talk62.mp3","duration":224.5,"size":1347356,"lines":[{"en":"Welcome back. Today, we're in a hurry — a taxi to the airport.","zh":"欢迎回来。今天很赶——打车去机场。","w":"H"},{"en":"Our flight leaves in three hours. We need a taxi now!","zh":"飞机三小时后起飞。我们得马上打车！","w":"A"},{"en":"Relax, the airport is only forty minutes away.","zh":"放松，机场只要四十分钟。","w":"B"},{"en":"That's if the road is clear. What if there's traffic?","zh":"那得路况好。万一堵车呢？","w":"A"},{"en":"I'll book a taxi on the app. It shows the fare up front.","zh":"我用 App 叫车。上面会显示预估车费。","w":"C"},{"en":"Make it fast. I can't miss this flight — it's my cousin's wedding.","zh":"快点。我不能误机——是我表哥的婚礼。","w":"A"},{"en":"We won't miss it. The taxi is two minutes away.","zh":"不会误的。车两分钟就到。","w":"B"},{"en":"Taking a taxi to the airport can be stressful. A little planning helps. Let's listen.","zh":"打车去机场可能很紧张。提前规划有帮助。来听听。","w":"H"},{"en":"The car is here. Did everyone grab their bags?","zh":"车到了。大家都拿好行李了吗？","w":"C"},{"en":"I have my backpack. Do I have my passport?","zh":"我背着包。我护照带了吗？","w":"A"},{"en":"You just checked it two minutes ago. It's in your front pocket.","zh":"你两分钟前刚检查过。在你前袋里。","w":"B"},{"en":"I know, I'm just nervous. What if we're late?","zh":"我知道，我就是紧张。万一迟到呢？","w":"A"},{"en":"Then the driver knows the shortcuts. Leave it to him.","zh":"那司机知道近路。交给他。","w":"C"},{"en":"Okay. Deep breaths. Wedding, not a test.","zh":"好。深呼吸。是婚礼，不是考试。","w":"A"},{"en":"Slow down. Here are some taxi and airport phrases.","zh":"放慢速度。来听几个打车和机场的表达。","w":"H"},{"en":"We need a taxi now.","zh":"我们得马上打车。","w":"H"},{"en":"Book a taxi on the app.","zh":"用 App 叫车。","w":"H"},{"en":"The airport is forty minutes away.","zh":"机场要四十分钟。","w":"H"},{"en":"Did everyone grab their bags?","zh":"大家都拿好行李了吗？","w":"H"},{"en":"book a taxi","zh":"叫车","w":"H"},{"en":"the fare up front","zh":"预估车费","w":"H"},{"en":"miss this flight","zh":"误机","w":"H"},{"en":"the shortcuts","zh":"近路","w":"H"},{"en":"deep breaths","zh":"深呼吸","w":"H"},{"en":"Your turn: in English, tell a taxi driver where you want to go and ask how long it takes.","zh":"轮到你了：用英语告诉出租车司机你要去哪儿，并问要多久。","w":"H"},{"en":"That's it for today. Next, we talk road safety. See you on the next walk!","zh":"今天就到这里。下次我们聊交通安全。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.72,"i":1},{"t":11.3,"i":2},{"t":16.13,"i":3},{"t":19.89,"i":4},{"t":25.89,"i":5},{"t":30.83,"i":6},{"t":35.51,"i":7},{"t":44.27,"i":8},{"t":49.74,"i":9},{"t":53.36,"i":10},{"t":57.99,"i":11},{"t":61.76,"i":12},{"t":67.42,"i":13},{"t":71.76,"i":14},{"t":77.79,"i":26},{"t":84.56,"i":1},{"t":90.41,"i":2},{"t":96.56,"i":3},{"t":101.42,"i":4},{"t":109.02,"i":5},{"t":115.32,"i":6},{"t":121.31,"i":8},{"t":128.25,"i":9},{"t":132.92,"i":10},{"t":138.84,"i":11},{"t":143.67,"i":12},{"t":150.84,"i":13},{"t":156.39,"i":15},{"t":161.4,"i":16},{"t":166.55,"i":17},{"t":172.28,"i":18},{"t":177.79,"i":19},{"t":183.99,"i":20},{"t":190.39,"i":21},{"t":196.68,"i":22},{"t":202.75,"i":23},{"t":208.75,"i":24},{"t":216.2,"i":25}],"count":27},{"id":63,"title":"交通安全","sub":"Road Safety","desc":"过马路、看信号，安全出行小常识","audio":"audio/talk63.mp3","duration":214.7,"size":1288892,"lines":[{"en":"Welcome back. Today, an important topic — road safety.","zh":"欢迎回来。今天是个重要话题——交通安全。","w":"H"},{"en":"I almost got hit by a bike yesterday. I was looking at my phone.","zh":"昨天我差点被自行车撞。我正看手机呢。","w":"A"},{"en":"That's exactly what not to do. Phones wait, the road doesn't.","zh":"这正是最不该做的。手机可以等，路可不等。","w":"B"},{"en":"I know. I felt so dumb.","zh":"我知道。我觉得自己好蠢。","w":"A"},{"en":"The good news is, you're fine. Now you'll look up.","zh":"好消息是你没事。以后你就会抬头了。","w":"C"},{"en":"Trust me, I will. That bike came out of nowhere.","zh":"相信我，会的。那自行车突然就冒出来了。","w":"A"},{"en":"Roads are shared by cars, bikes, and walkers. Here's how to stay safe.","zh":"道路是车、自行车和行人共用的。来听听怎么保安全。","w":"H"},{"en":"First rule: cross at the crosswalk, and wait for the green light.","zh":"第一条：走斑马线，等绿灯。","w":"B"},{"en":"Even if there are no cars?","zh":"就算没车也等？","w":"A"},{"en":"Especially then. A car can appear fast, and you never know.","zh":"尤其是没车的时候。车可能突然出现，你永远不知道。","w":"B"},{"en":"Look left, then right, then left again before you cross.","zh":"过马路前左看、右看、再左看。","w":"C"},{"en":"And at night, wear something bright.","zh":"晚上要穿亮色的。","w":"A"},{"en":"Right. Drivers can't stop for what they can't see.","zh":"对。司机看不见的东西，就没法为它停下。","w":"B"},{"en":"No more phone-walking for me. I'll keep my eyes on the road.","zh":"我再也不边走边看手机了。我会盯着路。","w":"A"},{"en":"Slow down. Here are some road safety phrases.","zh":"放慢速度。来听几个交通安全的表达。","w":"H"},{"en":"Cross at the crosswalk.","zh":"走斑马线。","w":"H"},{"en":"Wait for the green light.","zh":"等绿灯。","w":"H"},{"en":"Look left, then right, then left again.","zh":"左看、右看、再左看。","w":"H"},{"en":"Wear something bright at night.","zh":"晚上穿亮色的。","w":"H"},{"en":"crosswalk","zh":"斑马线","w":"H"},{"en":"green light","zh":"绿灯","w":"H"},{"en":"look both ways","zh":"左右看","w":"H"},{"en":"came out of nowhere","zh":"突然冒出来","w":"H"},{"en":"keep my eyes on the road","zh":"盯着路","w":"H"},{"en":"Your turn: in English, list three rules for crossing a road safely.","zh":"轮到你了：用英语列出三条安全过马路的规则。","w":"H"},{"en":"That's it for today. Next, we go on a day trip. See you on the next walk!","zh":"今天就到这里。下次我们去郊游。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.41,"i":1},{"t":10.94,"i":2},{"t":16.49,"i":3},{"t":19.24,"i":4},{"t":25.19,"i":5},{"t":29.2,"i":6},{"t":36.55,"i":7},{"t":42.06,"i":8},{"t":44.39,"i":9},{"t":49.72,"i":10},{"t":55.26,"i":11},{"t":58.16,"i":12},{"t":62.6,"i":13},{"t":66.75,"i":14},{"t":72.32,"i":26},{"t":79.09,"i":1},{"t":84.89,"i":2},{"t":91.91,"i":3},{"t":95.52,"i":4},{"t":103.04,"i":5},{"t":108.17,"i":7},{"t":115.16,"i":8},{"t":118.25,"i":9},{"t":125.03,"i":10},{"t":132.05,"i":11},{"t":135.8,"i":12},{"t":141.48,"i":13},{"t":146.79,"i":15},{"t":151.85,"i":16},{"t":156.95,"i":17},{"t":163.71,"i":18},{"t":168.94,"i":19},{"t":174.67,"i":20},{"t":180.46,"i":21},{"t":186.91,"i":22},{"t":193.2,"i":23},{"t":200.33,"i":24},{"t":206.48,"i":25}],"count":27},{"id":64,"title":"周末郊游","sub":"A Day Trip","desc":"周末去郊外走走，放松心情","audio":"audio/talk64.mp3","duration":213.0,"size":1278812,"lines":[{"en":"Welcome back. Today, we escape the city — a day trip!","zh":"欢迎回来。今天我们逃离城市——郊游！","w":"H"},{"en":"My family is going on a day trip this weekend. I'm so excited.","zh":"这周末我们全家去郊游。我好兴奋。","w":"A"},{"en":"Nice! Where are you going?","zh":"不错！你们去哪儿？","w":"B"},{"en":"A lake about an hour away. We're going to have a picnic and maybe boat.","zh":"一小时车程外的一个湖。我们野餐，可能还划船。","w":"A"},{"en":"Sounds perfect. What should we pack for a day trip?","zh":"听着完美。郊游该带点啥？","w":"C"},{"en":"Water, snacks, sunscreen, and a hat. Maybe a small blanket.","zh":"水、零食、防晒、帽子。也许再带条小毯子。","w":"B"},{"en":"My mom packs everything. She's the trip boss.","zh":"我妈啥都带。她是旅行总指挥。","w":"A"},{"en":"A day trip is a great way to recharge. Here's how to make it smooth.","zh":"郊游是充电的好方式。来听听怎么让它更顺利。","w":"H"},{"en":"What time are you leaving?","zh":"你们几点出发？","w":"B"},{"en":"Early, like eight. We want to beat the crowd.","zh":"很早，八点。我们想赶在人群前。","w":"A"},{"en":"Smart. Early morning by the lake is the best part.","zh":"聪明。清晨的湖边是最美的。","w":"C"},{"en":"I just hope the weather holds.","zh":"我就盼着天气别变。","w":"A"},{"en":"Even if it's cloudy, a day out beats a day on the couch.","zh":"就算多云，出门玩也比窝沙发强。","w":"B"},{"en":"True. And I can finally put my phone down for a day.","zh":"对。而且我终于能放下手机一天了。","w":"A"},{"en":"Now that's a real vacation.","zh":"那才是真正的度假。","w":"C"},{"en":"Slow down. Here are some day-trip phrases.","zh":"放慢速度。来听几个郊游的表达。","w":"H"},{"en":"We're going on a day trip.","zh":"我们去郊游。","w":"H"},{"en":"We're going to have a picnic.","zh":"我们要野餐。","w":"H"},{"en":"What should we pack?","zh":"该带点啥？","w":"H"},{"en":"We want to beat the crowd.","zh":"我们想赶在人群前。","w":"H"},{"en":"a day trip","zh":"郊游","w":"H"},{"en":"have a picnic","zh":"野餐","w":"H"},{"en":"pack","zh":"收拾行李","w":"H"},{"en":"beat the crowd","zh":"赶在人群前","w":"H"},{"en":"the weather holds","zh":"天气别变","w":"H"},{"en":"Your turn: in English, plan a day trip — say where you'd go and what you'd bring.","zh":"轮到你了：用英语规划一次郊游——说去哪儿、带什么。","w":"H"},

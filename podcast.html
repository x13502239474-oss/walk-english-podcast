<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>初中单词 · 散步听</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
  --pri:#2563eb; --pri-soft:#eaf1ff; --accent:#f59e0b; --ok:#059669;
  --r:16px; --sh:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

/* ---------- 顶部板块切换 ---------- */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 14px 6px;
  display:flex;gap:8px;border-bottom:1px solid transparent}
.tabs button{flex:1;padding:11px 0;border-radius:12px;background:var(--card);
  font-size:14.5px;color:var(--sub);box-shadow:var(--sh);transition:.15s;font-weight:500}
.tabs button.on{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.tabs button span{display:block;font-size:11px;opacity:.75;margin-top:1px}

header{padding:12px 18px 4px}
h1{margin:0;font-size:22px;letter-spacing:-.3px}
.tagline{margin:5px 0 0;color:var(--sub);font-size:13px}
.stats{display:flex;gap:8px;margin:14px 18px 0}
.stat{flex:1;background:var(--card);border-radius:12px;padding:12px 10px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:19px}
.stat span{font-size:11.5px;color:var(--sub)}

/* ---------- 学习统计 ---------- */
.study{margin:14px 18px 0;background:var(--card);border-radius:var(--r);
  padding:14px 16px 10px;box-shadow:var(--sh)}
.sd-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sd-main b{font-size:27px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.sd-main span{display:block;font-size:11.5px;color:var(--sub);margin-top:1px}
.sd-side{display:flex;gap:18px;text-align:right;padding-bottom:3px}
.sd-side b{font-size:16px;font-variant-numeric:tabular-nums}
.sd-side span{display:block;font-size:10.5px;color:var(--sub);margin-top:2px}
.sd-bars{display:flex;align-items:flex-end;gap:5px;height:54px;margin-top:15px}
.sd-bars i{flex:1;background:#dbeafe;border-radius:4px 4px 2px 2px;height:4px;
  transition:height .3s ease,background .2s}
.sd-bars i.on{background:var(--pri)}
.sd-days{display:flex;gap:5px;margin-top:6px}
.sd-days span{flex:1;text-align:center;font-size:10.5px;color:var(--sub)}
.sd-days span.on{color:var(--pri);font-weight:600}

.resume{margin:14px 18px 0;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;
  border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 20px rgba(37,99,235,.25)}
.resume .rt{flex:1;min-width:0}
.resume .rt b{font-size:16px;display:block}
.resume .rt span{font-size:12.5px;opacity:.85}
.resume .rbtn{width:46px;height:46px;border-radius:50%;background:#fff;color:#2563eb;
  display:grid;place-items:center;font-size:19px;flex:0 0 auto}

.sec{margin:20px 18px 8px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{margin:0;font-size:15px}
.sec em{font-style:normal;font-size:12.5px;color:var(--sub)}
.list{margin:0 18px 30px;display:flex;flex-direction:column;gap:9px}
.ep{background:var(--card);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--sh);border:1px solid transparent;transition:.15s}
.ep:active{transform:scale(.985)}
.ep.done{border-color:#a7f3d0;background:#f0fdf7}
.ep .num{width:42px;height:42px;border-radius:11px;background:var(--pri-soft);color:var(--pri);
  display:grid;place-items:center;font-weight:700;font-size:16px;flex:0 0 auto}
.ep.done .num{background:#d1fae5;color:var(--ok)}
.ep .info{flex:1;min-width:0}
.ep .info b{font-size:15.5px;display:block;font-weight:600}
.ep .info span{font-size:12.5px;color:var(--sub);display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .3s}
.ep .go{color:#c3c8d0;font-size:19px;flex:0 0 auto}

/* ---------- 播放页 ---------- */
#player{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#player.on{display:flex}
.p-top{padding:14px 12px;display:flex;align-items:center;gap:6px}
.p-top .back{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink);background:var(--card);box-shadow:0 2px 8px rgba(17,24,39,.10);
  transition:transform .12s,box-shadow .12s;flex:0 0 auto}
.p-top .back:active{transform:scale(.92);box-shadow:0 1px 4px rgba(17,24,39,.14)}
.p-top .back svg{width:26px;height:26px;display:block}
.p-top .t{flex:1;text-align:center;min-width:0}
.p-top .t b{font-size:15.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-top .t span{font-size:11.5px;color:var(--sub)}
.p-top .mode{font-size:12px;color:var(--pri);background:var(--pri-soft);padding:6px 10px;border-radius:20px;flex:0 0 auto}

.card{margin:6px 14px 0;background:var(--card);border-radius:20px;padding:24px 20px;
  box-shadow:var(--sh);min-height:220px;display:flex;flex-direction:column;justify-content:center}
.w-en{font-size:37px;font-weight:700;letter-spacing:-.5px;line-height:1.15;word-break:break-word}
.w-ph{color:var(--sub);font-size:16px;margin-top:7px;font-family:"Segoe UI","Lucida Sans Unicode",Arial,sans-serif}
.w-cn{font-size:18px;margin-top:14px;line-height:1.65;color:#374151}
.w-ex{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.w-ex .en{font-size:16.5px;line-height:1.6;color:#1f2937}
.w-ex .zh{font-size:14px;color:var(--sub);margin-top:6px}
.w-idx{font-size:12px;color:#9ca3af;margin-top:auto;padding-top:12px;text-align:right}
/* 节目卡 */
.t-en{font-size:23px;font-weight:600;line-height:1.5;color:#111827}
.t-tag{font-size:11.5px;color:var(--pri);background:var(--pri-soft);display:inline-block;
  padding:4px 9px;border-radius:14px;margin-bottom:12px}
/* 整体译文面板 */
.transcript{margin:10px 14px 0;background:var(--card);border-radius:16px;padding:4px 14px;
  overflow-y:auto;max-height:34vh;box-shadow:var(--sh)}
.transcript .tl{padding:9px 6px;border-bottom:1px dashed var(--line)}
.transcript .tl:last-child{border-bottom:0}
.transcript .tl .en{color:#1f2937;font-size:13.5px;font-weight:500;line-height:1.55}
.transcript .tl .zh{color:var(--sub);margin-top:3px;font-size:12.5px;line-height:1.55}
.transcript .tl.on{background:var(--pri-soft);border-radius:8px}
.transcript .tl.on .en{color:var(--pri);font-weight:600}

/* ---------- 进度条（可拖动） ---------- */
.ctl{padding:0 14px;margin-top:14px}
.pg-wrap{position:relative;padding:16px 0;touch-action:none}
.progress{height:7px;background:#dfe3ea;border-radius:6px;position:relative;overflow:visible;touch-action:none;cursor:pointer;transition:height .12s}
.pg-wrap.dragging .progress{height:11px;border-radius:8px}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--pri);width:0;border-radius:6px}
.progress b{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;
  border:3px solid var(--pri);transform:translate(-50%,-50%);left:0;box-shadow:0 2px 6px rgba(37,99,235,.35);
  transition:width .12s,height .12s}
.pg-wrap.dragging .progress b{width:26px;height:26px}
.bubble{position:absolute;top:-18px;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:11.5px;padding:4px 8px;border-radius:8px;opacity:0;transition:opacity .15s;pointer-events:none;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.bubble.on{opacity:1}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
#t-buf{color:var(--pri)}
.big{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:10px}
.big button{width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:var(--sh);
  display:grid;place-items:center;font-size:21px;color:#374151}
.big .play{width:70px;height:70px;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(37,99,235,.35)}
.big .play:active{transform:scale(.94)}
.opts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13px;color:#374151;box-shadow:var(--sh)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.p-bottom{margin-top:auto;padding:10px 14px calc(18px + var(--safe-b))}
.tip{text-align:center;font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;
  padding:10px 18px;border-radius:22px;font-size:13.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.loading{padding:40px;text-align:center;color:var(--sub);font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <button id="tab-word" class="on" onclick="switchTab('word')">单词播客<span>1812 词 · 32 集</span></button>
    <button id="tab-talk" onclick="switchTab('talk')">英语节目<span>情景对话</span></button>
  </div>

  <header>
    <h1 id="h-title">初中单词 · 散步听</h1>
    <p class="tagline" id="h-sub">新东方词根+联想记忆法 · 边走边听，一天一单元</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-a">–</b><span id="s-a-l">单词总数</span></div>
    <div class="stat"><b id="s-b">–</b><span id="s-b-l">节目集数</span></div>
    <div class="stat"><b id="s-c">0</b><span id="s-c-l">已听内容</span></div>
  </div>

  <div class="study">
    <div class="sd-top">
      <div class="sd-main"><b id="st-today">0</b><span>今日学习（分钟）</span></div>
      <div class="sd-side">
        <div><b id="st-streak">0</b><span>连续天数</span></div>
        <div><b id="st-total">0</b><span>累计小时</span></div>
      </div>
    </div>
    <div class="sd-bars" id="st-bars"></div>
    <div class="sd-days" id="st-days"></div>
  </div>

  <div id="resume" class="resume hide" onclick="resumePlay()">
    <div class="rt"><b id="r-title"></b><span id="r-sub"></span></div>
    <div class="rbtn">▶</div>
  </div>

  <div class="sec"><h2 id="sec-t">全部节目</h2><em id="sec-em"></em></div>
  <div class="list" id="list"><div class="loading">载入中…</div></div>
</div>

<!-- 播放页 -->
<div id="player">
  <div class="p-top">
    <button class="back" onclick="closePlayer()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5 8 12l7 7"/>
      </svg>
    </button>
    <div class="t"><b id="p-title">–</b><span id="p-sub"></span></div>
    <button class="mode" id="m-mode" onclick="toggleMode()">音频</button>
  </div>

  <div class="card hide" id="c-word">
    <div>
      <div class="w-en" id="w-en">准备开始</div>
      <div class="w-ph" id="w-ph"></div>
      <div class="w-cn" id="w-cn"></div>
      <div class="w-ex hide" id="w-ex">
        <div class="en" id="w-ex-en"></div>
        <div class="zh" id="w-ex-zh"></div>
      </div>
    </div>
    <div class="w-idx" id="w-idx"></div>
  </div>

  <div class="card hide" id="c-talk">
    <div>
      <div class="t-tag" id="t-tag"></div>
      <div class="t-en" id="t-en">准备开始</div>
    </div>
    <div class="w-idx" id="t-idx"></div>
  </div>

  <div id="transcript" class="transcript hide"></div>

  <div class="ctl">
    <div class="pg-wrap" id="pgwrap">
      <div class="progress" id="pg"><i id="pg-i"></i><b id="pg-dot"></b></div>
      <div class="bubble" id="pg-bub">0:00</div>
    </div>
    <div class="times"><span id="t-cur">0:00</span><span id="t-buf"></span><span id="t-dur">0:00</span></div>
    <div class="big">
      <button onclick="prev()">⏮</button>
      <button class="play" id="btn-play" onclick="togglePlay()">▶</button>
      <button onclick="next()">⏭</button>
    </div>
    <div class="opts">
      <button class="chip" data-rate="0.8">0.8×</button>
      <button class="chip on" data-rate="1">1.0×</button>
      <button class="chip" data-rate="1.25">1.25×</button>
      <button class="chip" data-rate="1.5">1.5×</button>
      <button class="chip" id="chip-auto" onclick="toggleAuto()">连播</button>
      <button class="chip" id="chip-timer" onclick="cycleTimer()">定时</button>
      <button class="chip" id="chip-off" onclick="cacheCurrent()">离线</button>
      <button class="chip" id="chip-trans" onclick="toggleTrans()" style="display:none">翻译</button>
    </div>
  </div>

  <div class="p-bottom">
    <div class="tip">拖动进度条可跳到任意位置 · 锁屏也能听<br>把本页「添加到主屏幕」，下次一点就开</div>
  </div>
</div>

ds","desc":"怎么开口、怎么接话，交到第一个新朋友","audio":"audio/talk01.mp3","duration":455.4,"size":2732780,"lines":[{"en":"Uh, hey — is this seat taken?","zh":"呃，你好——这个座位有人吗？","w":"A"},{"en":"Nope, go ahead! You're new here, right? I haven't seen you before.","zh":"没有，坐吧！你是新来的吧？我之前没见过你。","w":"B"},{"en":"Yeah, today's my first day. Honestly, I almost got lost twice this morning.","zh":"对，今天是我第一天。说实话，今天早上我差点迷路两次。","w":"A"},{"en":"Welcome to Walk and Talk, the podcast you can listen to while you walk. I'm Jenny.","zh":"欢迎收听 Walk and Talk，一个边散步边听的播客。我是 Jenny。","w":"H"},{"en":"Today, we start with something everyone knows — the first day at a new school. New faces, new hallways, and one big question: how do you make friends?","zh":"今天，我们从一个大家都经历过的事说起——新学校的第一天。新面孔、新走廊，还有一个大问题：怎么交到朋友？","w":"H"},{"en":"I'm Jake. My family just moved here last week.","zh":"我叫 Jake。我们全家上周刚搬过来。","w":"A"},{"en":"Cool, I'm Mia. Welcome to Sunshine Middle School. How do you like it so far?","zh":"酷，我是 Mia。欢迎来到阳光中学。到目前为止感觉怎么样？","w":"B"},{"en":"It's... big? The campus is twice as big as my old one.","zh":"就是……挺大的？校园比我以前的学校大两倍。","w":"A"},{"en":"Ha, wait till you see the sports field. So where are you from?","zh":"哈，等你看到操场再说。你从哪儿来？","w":"B"},{"en":"A small town called Greenfield. Nothing exciting there, I promise.","zh":"一个叫绿野镇的小地方。真的没什么好玩的，我保证。","w":"A"},{"en":"Small towns are cool. My grandma lives in one — everyone knows everyone.","zh":"小镇挺好的。我奶奶就住在那种地方——所有人都认识所有人。","w":"B"},{"en":"Exactly! That's the thing I miss already.","zh":"就是这个！我已经开始想念这一点了。","w":"A"},{"en":"Don't worry, you'll like it here. What grade are you in?","zh":"别担心，你会喜欢上这里的。你几年级？","w":"B"},{"en":"Eighth. You?","zh":"八年级。你呢？","w":"A"},{"en":"Same! We're probably in the same class then. What's your favorite subject?","zh":"一样！那我们可能同班。你最喜欢什么科目？","w":"B"},{"en":"Science, I guess. I like doing experiments.","zh":"科学吧。我喜欢做实验。","w":"A"},{"en":"Nice, Mr. Lee's class is awesome. He lets us do real experiments — like, with fire sometimes.","zh":"不错，李老师的课超棒。他让我们做真正的实验——有时候还用火。","w":"B"},{"en":"Whoa, now I'm actually excited.","zh":"哇，这下我真有点兴奋了。","w":"A"},{"en":"Hey, we eat lunch at twelve. Want to sit with us? Me and my friends.","zh":"嘿，我们十二点吃午饭。要不要跟我们坐？我和我的朋友们。","w":"B"},{"en":"Really? That'd be great. Thanks!","zh":"真的吗？那太好了。谢谢！","w":"A"},{"en":"See? Making friends is not that hard. Jake asked one simple question, and Mia did the rest.","zh":"看吧？交朋友没那么难。Jake 问了一个简单的问题，剩下的 Mia 都接住了。","w":"H"},{"en":"Over here, Jake! This is Leo, and that's Emma.","zh":"这边，Jake！这是 Leo，那是 Emma。","w":"B"},{"en":"Hey, new guy. I'm Leo. Cool backpack.","zh":"嘿，新同学。我是 Leo。书包不错。","w":"C"},{"en":"Thanks. It's got all my science stuff in it.","zh":"谢谢。里面装的全是科学课的东西。","w":"A"},{"en":"You like science? Emma's crazy about it, too.","zh":"你喜欢科学？Emma 对科学也超狂热。","w":"C"},{"en":"Guys, come on. Jake, don't listen to him. So — do you play any sports?","zh":"你们俩，行了。Jake，别听他的。那——你运动吗？","w":"B"},{"en":"Basketball, mostly. I'm not great, but I enjoy it.","zh":"主要是篮球。打得不算好，但我喜欢。","w":"A"},{"en":"Perfect. We play every Friday after school. You should come.","zh":"完美。我们每周五放学后都打。你应该来。","w":"C"},{"en":"Deal! Oh no, is that the bell? We just sat down!","zh":"成交！哦不，是上课铃吗？我们才刚坐下啊！","w":"A"},{"en":"Yeah, lunch is only thirty minutes. Come on, I'll show you where the science room is.","zh":"是啊，午饭只有三十分钟。走吧，我带你去找科学教室。","w":"B"},{"en":"You're the best, Mia. Seriously.","zh":"你太好了，Mia。真的。","w":"A"},{"en":"Before we slow things down, here are some useful phrases from today's conversations.","zh":"在我们放慢速度之前，来听几个今天对话里有用的表达。","w":"H"},{"en":"Is this seat taken?","zh":"这个座位有人吗？","w":"H"},{"en":"How do you like it so far?","zh":"你目前感觉怎么样？","w":"H"},{"en":"Wait till you see the sports field.","zh":"等你看到操场就知道了。","w":"H"},{"en":"Want to sit with us?","zh":"要不要跟我们一起坐？","w":"H"},{"en":"Is this seat taken?","zh":"这个座位有人吗？","w":"H"},{"en":"I haven't seen you before.","zh":"我以前没见过你。","w":"H"},{"en":"How do you like it so far?","zh":"到目前为止你觉得怎么样？","w":"H"},{"en":"Wait till you...","zh":"等你……就知道了","w":"H"},{"en":"What's your favorite subject?","zh":"你最喜欢的科目是什么？","w":"H"},{"en":"You should come.","zh":"你应该来（发出邀请）。","w":"H"},{"en":"That'd be great.","zh":"那太好了。","w":"H"},{"en":"You're the best.","zh":"你人真好（口语感谢）。","w":"H"},{"en":"Your turn: tonight, introduce yourself out loud in English for thirty seconds — your name, where you're from, and one thing you love.","zh":"轮到你了：今晚用英语大声做三十秒自我介绍——你的名字、你来自哪里，还有一件你喜欢的事。","w":"H"},{"en":"That's it for today. Next time, we talk about mornings — and what happens when your alarm clock betrays you. See you on the next walk!","zh":"今天就到这里。下一集我们聊聊早晨——以及当你的闹钟背叛你时会发生什么。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":2.9,"i":1},{"t":8.64,"i":2},{"t":14.54,"i":3},{"t":21.98,"i":4},{"t":34.17,"i":5},{"t":38.3,"i":6},{"t":44.75,"i":7},{"t":49.24,"i":8},{"t":54.42,"i":9},{"t":59.48,"i":10},{"t":65.36,"i":11},{"t":68.77,"i":12},{"t":73.16,"i":13},{"t":75.22,"i":14},{"t":81.31,"i":15},{"t":85.1,"i":16},{"t":93.36,"i":17},{"t":96.14,"i":18},{"t":102.38,"i":19},{"t":105.86,"i":20},{"t":115.17,"i":21},{"t":120.16,"i":22},{"t":126.95,"i":23},{"t":130.69,"i":24},{"t":136.45,"i":25},{"t":143.02,"i":26},{"t":147.39,"i":27},{"t":154.8,"i":28},{"t":159.41,"i":29},{"t":166.18,"i":30},{"t":169.2,"i":31},{"t":175.82,"i":46},{"t":182.6,"i":0},{"t":186.35,"i":1},{"t":193.61,"i":2},{"t":201.09,"i":5},{"t":206.38,"i":6},{"t":214.55,"i":7},{"t":220.28,"i":8},{"t":226.84,"i":9},{"t":233.28,"i":10},{"t":240.74,"i":11},{"t":245.12,"i":12},{"t":250.74,"i":13},{"t":253.49,"i":14},{"t":261.21,"i":15},{"t":266.09,"i":16},{"t":276.47,"i":17},{"t":280.11,"i":18},{"t":287.99,"i":19},{"t":292.47,"i":21},{"t":298.82,"i":22},{"t":307.37,"i":23},{"t":312.18,"i":24},{"t":319.49,"i":25},{"t":327.78,"i":26},{"t":333.36,"i":27},{"t":342.69,"i":28},{"t":348.56,"i":29},{"t":357.09,"i":30},{"t":361.01,"i":32},{"t":365.8,"i":33},{"t":371.1,"i":34},{"t":376.8,"i":35},{"t":381.67,"i":36},{"t":388.05,"i":37},{"t":395.2,"i":38},{"t":402.52,"i":39},{"t":408.43,"i":40},{"t":415.8,"i":41},{"t":421.7,"i":42},{"t":428.04,"i":43},{"t":434.13,"i":44},{"t":443.91,"i":45}],"count":47},{"id":2,"title":"起床大作战","sub":"Morning Chaos","desc":"闹钟没响、车胎没气——一个手忙脚乱的早晨","audio":"audio/talk02.mp3","duration":383.9,"size":2303948,"lines":[{"en":"Mia! You will not believe what happened this morning.","zh":"Mia！你绝对不敢相信今天早上发生了什么。","w":"A"},{"en":"Let me guess. You overslept again?","zh":"我猜猜。你又睡过头了？","w":"B"},{"en":"Worse. My alarm didn't go off, and I woke up at seven forty!","zh":"更糟。我闹钟没响，我七点四十才醒！","w":"A"},{"en":"Mornings. Some people love them. Most of us just survive them.","zh":"早晨。有人热爱早晨，我们大多数人只是勉强撑过去。","w":"H"},{"en":"Today, we follow Jake through one of those mornings where everything — and I mean everything — goes wrong.","zh":"今天，我们跟着 Jake 度过一个所有事情——真的是所有事情——都出岔子的早晨。","w":"H"},{"en":"So I jumped out of bed, brushed my teeth in one minute, and ran out the door.","zh":"于是我跳下床，一分钟刷完牙，冲出了家门。","w":"A"},{"en":"Did you eat anything?","zh":"你吃东西了吗？","w":"B"},{"en":"I grabbed a piece of bread. Well... half of a piece.","zh":"我抓了一片面包。呃……半片。","w":"A"},{"en":"That's not breakfast, that's a joke.","zh":"那不是早餐，那是个笑话。","w":"B"},{"en":"Tell me about it. And then — my bike had a flat tire!","zh":"可不是嘛。然后——我自行车胎没气了！","w":"A"},{"en":"No way. So how did you get here?","zh":"不会吧。那你怎么到学校的？","w":"B"},{"en":"I ran. Three kilometers. In my school shoes.","zh":"我跑来的。三公里。穿着我的校鞋。","w":"A"},{"en":"And you're not even sweaty?","zh":"你居然都没出汗？","w":"B"},{"en":"I am. Very. Don't stand too close.","zh":"我出了。很多。别站太近。","w":"A"},{"en":"Ha! Okay, okay. But seriously, Jake — why not just set two alarms?","zh":"哈！好好好。不过说真的，Jake——为什么不设两个闹钟？","w":"B"},{"en":"I do set two. The problem is, I turn both off in my sleep. My mom says I could sleep through a fire alarm.","zh":"我确实设了两个。问题是我睡着的时候把它们都关了。我妈说我火警响了都能继续睡。","w":"A"},{"en":"That's a talent, honestly.","zh":"说实话，这是个天赋。","w":"B"},{"en":"A useless talent.","zh":"一个没用的天赋。","w":"A"},{"en":"My dad is the same. Once he slept through my birthday party. A daytime party.","zh":"我爸也一样。有一次他睡过了我的生日派对。白天办的派对。","w":"B"},{"en":"Wait, really? How is that possible?","zh":"等等，真的假的？这怎么可能？","w":"A"},{"en":"He worked night shifts that week. But we still make fun of him for it.","zh":"那周他上夜班。但我们至今还拿这事笑他。","w":"B"},{"en":"Mia's family has a secret for mornings, by the way. Here's what she told Jake.","zh":"顺便说一句，Mia 家对付早晨有个秘诀。听听她跟 Jake 说了什么。","w":"H"},{"en":"Anyway, here's our secret. We prep everything the night before.","zh":"总之，这是我们家的秘诀：前一晚把一切都准备好。","w":"B"},{"en":"Like what?","zh":"比如什么？","w":"A"},{"en":"School bag by the door, clothes on the chair, and my mom puts the bread next to the kettle.","zh":"书包放门口，衣服搭椅子上，我妈把面包放在水壶旁边。","w":"B"},{"en":"That's it? No magic?","zh":"就这样？没有魔法？","w":"A"},{"en":"That's it. Mornings are just ten tiny battles, Jake. Win them the night before.","zh":"就这样。早晨不过是十场小战斗，Jake。前一晚就赢下它们。","w":"B"},{"en":"You sound like a poster in the school hallway.","zh":"你说话像学校走廊里的标语海报。","w":"A"},{"en":"I'll take that as a compliment.","zh":"我就当这是夸奖吧。","w":"B"},{"en":"Before we slow things down, here are the best lines from this morning's disaster.","zh":"在放慢之前，来回顾一下今早这场灾难里的金句。","w":"H"},{"en":"My alarm didn't go off.","zh":"我的闹钟没响。","w":"H"},{"en":"I overslept again.","zh":"我又睡过头了。","w":"H"},{"en":"Tell me about it.","zh":"可不是嘛。","w":"H"},{"en":"I'll take that as a compliment.","zh":"我就当这是夸奖吧。","w":"H"},{"en":"You will not believe what happened.","zh":"你绝对不敢相信发生了什么。","w":"H"},{"en":"My alarm didn't go off.","zh":"我的闹钟没响。","w":"H"},{"en":"I overslept.","zh":"我睡过头了。","w":"H"},{"en":"Tell me about it.","zh":"可不是嘛（表示同感）。","w":"H"},{"en":"No way.","zh":"不会吧。","w":"H"},{"en":"sleep through something","zh":"睡着了没被（警报/噪音）吵醒","w":"H"},{"en":"prep everything the night before","zh":"前一晚把一切都准备好","w":"H"},{"en":"I'll take that as a compliment.","zh":"我就当这是夸奖吧。","w":"H"},{"en":"Tonight before bed, say your morning plan out loud in English: bag by the door, clothes on the chair, breakfast ready. Then win your ten tiny battles.","zh":"今晚睡前，用英语大声说出你的早晨计划：书包放门口、衣服搭椅子上、早餐备好。然后赢下你的十场小战斗。","w":"H"},{"en":"Next time, we're heading to the school cafeteria — where the meatballs are a mystery and the line is very, very long. See you!","zh":"下一集，我们去学校食堂——那里的肉丸是个谜，队伍非常非常长。再见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":3.91,"i":1},{"t":7.63,"i":2},{"t":12.83,"i":3},{"t":20.28,"i":4},{"t":28.05,"i":5},{"t":33.5,"i":6},{"t":35.61,"i":7},{"t":39.86,"i":8},{"t":43.17,"i":9},{"t":47.72,"i":10},{"t":51.37,"i":11},{"t":55.9,"i":12},{"t":58.33,"i":13},{"t":62.24,"i":14},{"t":68.98,"i":15},{"t":76.82,"i":16},{"t":79.7,"i":17},{"t":81.76,"i":18},{"t":88.58,"i":19},{"t":91.62,"i":20},{"t":97.05,"i":21},{"t":104.25,"i":22},{"t":109.79,"i":23},{"t":111.28,"i":24},{"t":117.95,"i":25},{"t":120.44,"i":26},{"t":127.01,"i":27},{"t":130.11,"i":28},{"t":132.77,"i":29},{"t":139.13,"i":44},{"t":145.9,"i":0},{"t":150.93,"i":1},{"t":155.72,"i":2},{"t":162.33,"i":5},{"t":169.23,"i":6},{"t":172.05,"i":7},{"t":177.46,"i":8},{"t":181.75,"i":9},{"t":187.57,"i":10},{"t":192.26,"i":11},{"t":198.03,"i":12},{"t":201.21,"i":13},{"t":206.24,"i":14},{"t":214.75,"i":15},{"t":224.6,"i":16},{"t":228.36,"i":17},{"t":231.08,"i":18},{"t":239.66,"i":19},{"t":243.63,"i":20},{"t":250.53,"i":22},{"t":257.55,"i":23},{"t":259.6,"i":24},{"t":268.02,"i":25},{"t":271.29,"i":26},{"t":279.61,"i":27},{"t":283.6,"i":28},{"t":287.07,"i":30},{"t":292.42,"i":31},{"t":297.38,"i":32},{"t":302.0,"i":33},{"t":307.39,"i":34},{"t":314.93,"i":35},{"t":322.32,"i":36},{"t":328.39,"i":37},{"t":334.46,"i":38},{"t":339.91,"i":39},{"t":346.37,"i":40},{"t":354.1,"i":41},{"t":361.56,"i":42},{"t":373.47,"i":43}],"count":45},{"id":3,"title":"食堂风云","sub":"Cafeteria Days","desc":"神秘肉丸、疯狂长队和饭桌上的好段子","audio":"audio/talk03.mp3","duration":427.0,"size":2562716,"lines":[{"en":"Dude, what IS that on your tray?","zh":"老兄，你餐盘上那是什么？","w":"C"},{"en":"I have no idea. It's Tuesday, so... meatballs? Maybe?","zh":"我也不知道。今天是周二，所以……肉丸？可能吧？","w":"A"},{"en":"Those are not meatballs. Those are rumors of meatballs.","zh":"那不是肉丸。那是肉丸的传闻。","w":"C"},{"en":"Welcome back to Walk and Talk. Today: lunchtime.","zh":"欢迎回到 Walk and Talk。今天的话题：午餐时间。","w":"H"},{"en":"The school cafeteria — crazy lines, mystery food, and honestly, some of the best conversations of the whole day.","zh":"学校食堂——疯狂的队伍、神秘的饭菜，还有说真的，一天当中最精彩的那些对话。","w":"H"},{"en":"The line is already crazy. We got here four minutes after the bell.","zh":"队伍已经排疯了。铃响四分钟后我们就到了。","w":"A"},{"en":"Four minutes is late, my friend. Four minutes is very late.","zh":"四分钟就是晚了，我的朋友。四分钟非常晚。","w":"C"},{"en":"Look at the menu board. Fish and chips on Monday, noodles on Wednesday...","zh":"看菜单板。周一炸鱼薯条，周三面条……","w":"A"},{"en":"And on Tuesday, the mystery. You never know what you're going to get.","zh":"而周二是谜之菜品。你永远不知道会拿到什么。","w":"C"},{"en":"Okay, decision time. Noodle soup, or the mystery tray?","zh":"好，做决定吧。面汤，还是谜之餐盘？","w":"A"},{"en":"Noodle soup. Always pick the thing you can name.","zh":"面汤。永远选你能叫出名字的东西。","w":"C"},{"en":"Solid advice. One noodle soup, please. And a milk.","zh":"好建议。一份面汤，谢谢。再加一盒牛奶。","w":"A"},{"en":"Make that two. And two buns, please. Thank you.","zh":"来两份。再加两个馒头，谢谢。","w":"C"},{"en":"Where do we sit? Everything's full.","zh":"我们坐哪儿？全满了。","w":"A"},{"en":"There — Mia saved us seats by the window. Come on.","zh":"那儿——Mia 在窗边帮我们占了座。快走。","w":"C"},{"en":"At the table, the food review begins. This is where Jake learns a very important lesson about Tuesday.","zh":"到了饭桌，美食点评开始。Jake 就是在这里学到了关于周二的重要一课。","w":"H"},{"en":"Took you long enough! We've been waiting.","zh":"你们可真够慢的！我们都等半天了。","w":"B"},{"en":"You try fighting that line with empty hands, Mia.","zh":"你空着手去跟那条队伍斗一斗试试，Mia。","w":"C"},{"en":"Fair. So how's the noodle soup today?","zh":"有道理。今天的面汤怎么样？","w":"B"},{"en":"Actually pretty good! Way better than last week, when it was basically hot water with two noodles in it.","zh":"其实还挺好喝！比上周强多了，上周那碗基本就是热水里泡着两根面。","w":"A"},{"en":"I had that one. It was soup-flavored soup.","zh":"我喝过那碗。那是汤味的汤。","w":"C"},{"en":"Ha! You two sound like food critics.","zh":"哈！你俩说话像美食评论家。","w":"B"},{"en":"Speaking of food — Emma, your homemade cookies last Friday? Amazing. Could my mom get the recipe?","zh":"说到吃的——Emma，你上周五带的自制饼干？绝了。我妈能要个配方吗？","w":"A"},{"en":"She doesn't really use a recipe. She just throws things in. That's why they're never the same twice.","zh":"她其实不用配方。就是随便往里扔。所以饼干每次都不一样。","w":"B"},{"en":"Even better. Every cookie is a surprise.","zh":"那更好了。每一块饼干都是惊喜。","w":"A"},{"en":"Hey, look — they have apple pie today. Get it before the eighth graders clean it out.","zh":"嘿，看——今天有苹果派。趁八年级那帮人还没抢光，赶紧买。","w":"C"},{"en":"Too late. Table nine already has four plates of it.","zh":"晚了。九号桌已经有四盘了。","w":"B"},{"en":"Those kids are professionals.","zh":"那帮孩子是专业的。","w":"C"},{"en":"Before we slow down, here are the tastiest lines from today.","zh":"放慢之前，来听今天最有味道的几句。","w":"H"},{"en":"You never know what you're going to get.","zh":"你永远不知道会得到什么。","w":"H"},{"en":"How's the noodle soup today?","zh":"今天面汤怎么样？","w":"H"},{"en":"Speaking of food...","zh":"说到吃的……","w":"H"},{"en":"Too late.","zh":"太晚了（来不及了）。","w":"H"},{"en":"What IS that?","zh":"那到底是什么？","w":"H"},{"en":"I have no idea.","zh":"我完全不知道。","w":"H"},{"en":"Always pick the thing you can name.","zh":"永远选你能叫出名字的东西。","w":"H"},{"en":"Took you long enough!","zh":"你可真够慢的！","w":"H"},{"en":"Speaking of...","zh":"说到……（话题转换）","w":"H"},{"en":"clean out","zh":"一抢而空","w":"H"},{"en":"Those kids are professionals.","zh":"那帮孩子是专业的。","w":"H"},{"en":"soup-flavored soup","zh":"汤味的汤（吐槽没味道）","w":"H"},{"en":"Today's challenge: describe your lunch out loud in English — what it was, how it tasted, and whether you'd order it again.","zh":"今日挑战：用英语大声描述你的午餐——吃了什么、味道如何、还会不会再点。","w":"H"},{"en":"Next time, we leave school and go to a burger shop — where Jake learns the most important question in fast food. See you on the next walk!","zh":"下一集，我们离开学校去汉堡店——Jake 将在那里学到快餐界最重要的问题。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":3.96,"i":1},{"t":8.8,"i":2},{"t":15.02,"i":3},{"t":20.9,"i":4},{"t":30.0,"i":5},{"t":34.87,"i":6},{"t":41.25,"i":7},{"t":46.31,"i":8},{"t":52.67,"i":9},{"t":57.37,"i":10},{"t":62.84,"i":11},{"t":67.74,"i":12},{"t":74.81,"i":13},{"t":77.93,"i":14},{"t":83.86,"i":15},{"t":92.45,"i":16},{"t":96.0,"i":17},{"t":100.8,"i":18},{"t":104.69,"i":19},{"t":111.72,"i":20},{"t":116.95,"i":21},{"t":120.76,"i":22},{"t":128.37,"i":23},{"t":135.68,"i":24},{"t":139.43,"i":25},{"t":147.25,"i":26},{"t":152.07,"i":27},{"t":155.45,"i":28},{"t":160.71,"i":43},{"t":167.48,"i":0},{"t":172.56,"i":1},{"t":178.71,"i":2},{"t":186.57,"i":5},{"t":192.78,"i":6},{"t":200.85,"i":7},{"t":207.3,"i":8},{"t":215.33,"i":9},{"t":221.31,"i":10},{"t":228.24,"i":11},{"t":234.47,"i":12},{"t":243.36,"i":13},{"t":247.4,"i":14},{"t":254.9,"i":16},{"t":259.47,"i":17},{"t":265.58,"i":18},{"t":270.59,"i":19},{"t":279.43,"i":20},{"t":286.07,"i":21},{"t":290.97,"i":22},{"t":300.54,"i":23},{"t":309.74,"i":24},{"t":314.55,"i":25},{"t":324.38,"i":26},{"t":330.54,"i":27},{"t":334.92,"i":29},{"t":340.57,"i":30},{"t":345.73,"i":31},{"t":350.54,"i":32},{"t":354.85,"i":33},{"t":361.14,"i":34},{"t":367.5,"i":35},{"t":375.18,"i":36},{"t":381.76,"i":37},{"t":387.49,"i":38},{"t":392.99,"i":39},{"t":400.55,"i":40},{"t":407.15,"i":41},{"t":416.18,"i":42}],"count":44},{"id":4,"title":"汉堡店点餐","sub":"Burger Shop & Big News","desc":"点餐全程英文实操，公园里还传来一个好消息","audio":"audio/talk04.mp3","duration":422.7,"size":2536796,"lines":[{"en":"Hi there! Welcome to Burger Corner. What can I get started for you?","zh":"你好！欢迎来到汉堡角。你想来点什么？","w":"C"},{"en":"Hi! Can I get a cheeseburger meal, please?","zh":"你好！我要一个芝士汉堡套餐，谢谢。","w":"A"},{"en":"Sure. Fries and a drink come with it. Small, medium, or large?","zh":"好的。套餐配薯条和饮料。小杯、中杯还是大杯？","w":"C"},{"en":"Today we're ordering food — burgers, fries, and one very important question: for here, or to go?","zh":"今天我们来点餐——汉堡、薯条，还有一个非常重要的问题：在这儿吃，还是带走？","w":"H"},{"en":"Jake is meeting Mia at the park. But first, he has to survive the lunch rush.","zh":"Jake 要去公园见 Mia。但首先，他得先挺过午饭高峰。","w":"H"},{"en":"Sure. Fries and a drink come with it. Small, medium, or large?","zh":"好的。套餐含薯条和饮料。小、中、大杯？","w":"C"},{"en":"Medium, please. And can I swap the cola for orange juice?","zh":"中杯，谢谢。能把可乐换成橙汁吗？","w":"A"},{"en":"No problem. Anything else? Our apple pie is two-for-one today.","zh":"没问题。还要别的吗？今天苹果派买一送一。","w":"C"},{"en":"Tempting... but no, thanks. I'm good.","zh":"好心动……但不用了，谢谢。","w":"A"},{"en":"For here or to go?","zh":"在这儿吃还是带走？","w":"C"},{"en":"To go, please. I'm meeting a friend at the park.","zh":"带走，谢谢。我要去公园见朋友。","w":"A"},{"en":"That'll be six fifty. Card or cash?","zh":"一共六块五。刷卡还是现金？","w":"C"},{"en":"Card, please. Here you go.","zh":"刷卡。给你。","w":"A"},{"en":"Great. Your number is twenty-seven. We'll call you at the pickup window.","zh":"好。你的号码是 27 号。取餐窗口会叫号。","w":"C"},{"en":"Thanks a lot!","zh":"多谢！","w":"A"},{"en":"Enjoy! And hey — extra napkins are by the door. Just saying.","zh":"慢用！对了——门口有多余的纸巾。好心提醒。","w":"C"},{"en":"You're a hero. Thank you.","zh":"你是英雄。谢谢你。","w":"A"},{"en":"Two minutes later, Jake arrives at the park. Mia is already there — with some big news.","zh":"两分钟后，Jake 到了公园。Mia 已经在那儿了——还带着一个大消息。","w":"H"},{"en":"Sorry I'm late — the line was long. I got you a cheeseburger too. Hope that's okay.","zh":"抱歉来晚了——队太长。我也给你买了个芝士汉堡，希望你喜欢。","w":"A"},{"en":"Are you kidding? You're my favorite person today. So. Big news.","zh":"开什么玩笑？你是我今天最喜欢的人。好了。大消息。","w":"B"},{"en":"What happened?","zh":"怎么了？","w":"A"},{"en":"I passed the audition! For the school band. I'm playing the keyboard!","zh":"我通过选拔了！学校乐队的！我弹键盘！","w":"B"},{"en":"No way! Mia, that's awesome! Since when do you play?","zh":"不会吧！Mia，太棒了！你什么时候会弹琴的？","w":"A"},{"en":"Since fourth grade. But I never told anyone — I was too shy.","zh":"四年级就开始了。但我谁也没告诉过——我太害羞了。","w":"B"},{"en":"Well, now everyone's going to know you're great. When's the first show?","zh":"那现在大家都要知道你有多厉害了。第一场演出是什么时候？","w":"A"},{"en":"Next month, at the school festival. I'm kind of terrified, honestly.","zh":"下个月，校园艺术节上。说实话我有点吓坏了。","w":"B"},{"en":"You'll be fine. And I'll be in the front row, being loud.","zh":"你没问题。我会坐在第一排，使劲喝彩。","w":"A"},{"en":"Please don't bring a banner.","zh":"千万别带横幅。","w":"B"},{"en":"No promises.","zh":"我可不敢保证。","w":"A"},{"en":"Before we slow things down, here's how to order like a pro.","zh":"放慢之前，来学学怎么像老手一样点餐。","w":"H"},{"en":"What can I get started for you?","zh":"你想来点什么？","w":"H"},{"en":"For here or to go?","zh":"在这儿吃还是带走？","w":"H"},{"en":"That'll be six fifty.","zh":"一共六块五。","w":"H"},{"en":"I'm good, thanks.","zh":"不用了，谢谢。","w":"H"},{"en":"Can I get ..., please?","zh":"我要一份……（点餐万能句）","w":"H"},{"en":"For here or to go?","zh":"在这儿吃还是带走？","w":"H"},{"en":"Anything else?","zh":"还要别的吗？","w":"H"},{"en":"I'm good, thanks.","zh":"不用了，谢谢。","w":"H"},{"en":"That'll be ...","zh":"一共是……钱。","w":"H"},{"en":"Card or cash?","zh":"刷卡还是现金？","w":"H"},{"en":"No way! That's awesome!","zh":"不会吧！太棒了！","w":"H"},{"en":"No promises.","zh":"我可不敢保证。","w":"H"},{"en":"Next time you order anything — bubble tea, bread, noodles — say the whole order in English in your head: what you want, the size, and for here or to go.","zh":"下次你买任何东西——奶茶、面包、面条——在心里用英语把整个订单说出来：要什么、什么规格、堂食还是带走。","w":"H"},{"en":"Next time: new sneakers. They glow in the dark, they cost too much, and Mia has opinions. See you!","zh":"下一集：新球鞋。会发光，价格离谱，而且 Mia 有一堆意见。再见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.39,"i":1},{"t":10.99,"i":2},{"t":19.31,"i":3},{"t":27.88,"i":4},{"t":35.33,"i":5},{"t":43.65,"i":6},{"t":48.33,"i":7},{"t":56.03,"i":8},{"t":60.28,"i":9},{"t":63.11,"i":10},{"t":66.83,"i":11},{"t":72.03,"i":12},{"t":74.89,"i":13},{"t":82.54,"i":14},{"t":84.29,"i":15},{"t":92.35,"i":16},{"t":94.85,"i":17},{"t":102.94,"i":18},{"t":109.1,"i":19},{"t":115.32,"i":20},{"t":116.92,"i":21},{"t":122.9,"i":22},{"t":127.09,"i":23},{"t":132.59,"i":24},{"t":137.31,"i":25},{"t":143.1,"i":26},{"t":147.49,"i":27},{"t":149.96,"i":28},{"t":151.87,"i":29},{"t":156.94,"i":44},{"t":163.71,"i":0},{"t":173.01,"i":1},{"t":177.66,"i":2},{"t":188.11,"i":5},{"t":198.56,"i":6},{"t":204.52,"i":7},{"t":214.23,"i":8},{"t":219.64,"i":9},{"t":223.33,"i":10},{"t":228.12,"i":11},{"t":234.73,"i":12},{"t":238.46,"i":13},{"t":248.07,"i":14},{"t":250.44,"i":15},{"t":260.58,"i":16},{"t":263.88,"i":18},{"t":271.66,"i":19},{"t":279.52,"i":20},{"t":281.7,"i":21},{"t":289.27,"i":22},{"t":294.63,"i":23},{"t":301.6,"i":24},{"t":307.62,"i":25},{"t":314.92,"i":26},{"t":320.53,"i":27},{"t":323.78,"i":28},{"t":326.34,"i":30},{"t":331.63,"i":31},{"t":336.5,"i":32},{"t":341.65,"i":33},{"t":346.68,"i":34},{"t":353.45,"i":35},{"t":359.95,"i":36},{"t":366.0,"i":37},{"t":372.84,"i":38},{"t":378.38,"i":39},{"t":384.6,"i":40},{"t":394.1,"i":41},{"t":400.46,"i":42},{"t":412.28,"i":43}],"count":45},{"id":5,"title":"买球鞋","sub":"Sneaker Shopping","desc":"发光的鞋 vs 打折的鞋，谁赢了？","audio":"audio/talk05.mp3","duration":400.2,"size":2402012,"lines":[{"en":"Mom said I can get new sneakers if I keep my grades up. Look at these — they glow in the dark!","zh":"我妈说只要我保住成绩就能买新球鞋。看这双——它们会在黑暗里发光！","w":"A"},{"en":"They glow? Okay, first of all, that's amazing. Second of all — how much are they?","zh":"会发光？好，首先，这很酷。其次——多少钱？","w":"B"},{"en":"...Don't ask.","zh":"……别问。","w":"A"},{"en":"Shopping! Today Jake takes Mia sneaker shopping, and Mia teaches him the most powerful word in shopping: budget.","zh":"购物！今天 Jake 拉着 Mia 去买球鞋，而 Mia 教会他购物界最有力的一个词：预算。","w":"H"},{"en":"Whoa, look at these. They glow in the dark, Mia. GLOW.","zh":"哇，看这双。它们会在黑暗里发光，Mia。发光！","w":"A"},{"en":"I see. And the price tag? Three hundred eighty, Jake. That's more than your monthly allowance, isn't it?","zh":"看到了。那价签呢？三百八，Jake。比你一个月零花钱还多，是不是？","w":"B"},{"en":"Let me do the math... yeah. It is exactly more than my monthly allowance.","zh":"我算算……对。恰好比我的月零花钱多。","w":"A"},{"en":"Okay, rule one of shopping: just because it glows doesn't mean you need it.","zh":"好，购物第一条：会发光不代表你需要它。","w":"B"},{"en":"Hi guys! Looking for anything special?","zh":"你们好！想找什么样的？","w":"C"},{"en":"Hi, yeah — running shoes, size forty. Do you have these in blue?","zh":"你好——跑鞋，40 码。这双有蓝色的吗？","w":"A"},{"en":"Let me check the back... I have thirty-nine and forty-one. The forty is nearly sold out, sorry.","zh":"我去后面看看……有 39 和 41 码。40 码快卖完了，抱歉。","w":"C"},{"en":"What about this pair? Same brand, twenty percent off this week.","zh":"那这双呢？同品牌，这周打八折。","w":"B"},{"en":"Good eye. Those are on sale — two hundred forty.","zh":"好眼光。那双在打折——二百四。","w":"C"},{"en":"Hmm. They don't glow, though.","zh":"嗯……可它们不发光啊。","w":"A"},{"en":"But they won't glow-blink at you from the box when your mom checks the receipt.","zh":"但当你妈查小票的时候，它们不会在鞋盒里冲你一闪一闪。","w":"B"},{"en":"...That's fair. Okay, I'll take them. Can I try them on first?","zh":"……有道理。好，我买了。能先试试吗？","w":"A"},{"en":"Of course. There's the bench. Take your time.","zh":"当然可以。长凳在那边。慢慢试。","w":"C"},{"en":"And here's how it ended — walking out of the store, thirty seconds later.","zh":"结局如何——三十秒后，走出店门。","w":"H"},{"en":"See? You got good shoes AND money left for bubble tea. That's called a win-win.","zh":"看吧？你买到了好鞋，还剩下买奶茶的钱。这就叫双赢。","w":"B"},{"en":"You're scary good at this. How do you know all this stuff?","zh":"你这也太强了。这些都是跟谁学的？","w":"A"},{"en":"My mom taught me. She says: a smart buyer knows three numbers — the price, the budget, and the discount.","zh":"我妈教的。她说：聪明的买家知道三个数字——价格、预算、折扣。","w":"B"},{"en":"Say that again, I'm writing it on my phone.","zh":"再说一遍，我记到手机里。","w":"A"},{"en":"Also — never shop hungry. You buy weird things when you're hungry.","zh":"还有——千万别饿着肚子逛街。饿的时候你会买奇怪的东西。","w":"B"},{"en":"Too late. I almost bought a glowing hat earlier.","zh":"晚了。我刚才差点买了一顶会发光的帽子。","w":"A"},{"en":"Of course you did.","zh":"你果然干了。","w":"B"},{"en":"Before we slow down, here's your shopping survival kit.","zh":"放慢之前，这是你的购物生存包。","w":"H"},{"en":"Do you have these in blue?","zh":"这个有蓝色的吗？","w":"H"},{"en":"Can I try them on?","zh":"我能试穿吗？","w":"H"},{"en":"It's twenty percent off.","zh":"打八折。","w":"H"},{"en":"I'll take it.","zh":"我买了。","w":"H"},{"en":"How much is it?","zh":"多少钱？","w":"H"},{"en":"It's on sale.","zh":"它在打折。","w":"H"},{"en":"twenty percent off","zh":"打八折","w":"H"},{"en":"Can I try it on?","zh":"我能试穿吗？","w":"H"},{"en":"I'll take it.","zh":"我要买它。","w":"H"},{"en":"Just because it glows doesn't mean you need it.","zh":"会发光不代表你需要它。","w":"H"},{"en":"win-win","zh":"双赢","w":"H"},{"en":"Never shop hungry.","zh":"别饿着肚子逛街。","w":"H"},{"en":"Next time you see a price tag, practice this in your head: 'It costs ... yuan, and it's ... percent off.' Numbers are muscles. Train them.","zh":"下次看到价签，在心里练习这句话：“它卖……元，打……折。”数字是肌肉，要练。","w":"H"},{"en":"Next time: rain ruins the weekend... or does it? Mia defends the rainy Saturday. See you on the next walk!","zh":"下一集：雨毁了周末……真的吗？Mia 要为下雨的周六辩护。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.65,"i":1},{"t":13.82,"i":2},{"t":15.55,"i":3},{"t":25.15,"i":4},{"t":29.85,"i":5},{"t":38.22,"i":6},{"t":43.21,"i":7},{"t":48.59,"i":8},{"t":53.7,"i":9},{"t":59.29,"i":10},{"t":68.77,"i":11},{"t":74.0,"i":12},{"t":79.85,"i":13},{"t":82.44,"i":14},{"t":87.36,"i":15},{"t":92.49,"i":16},{"t":98.78,"i":17},{"t":104.66,"i":18},{"t":111.16,"i":19},{"t":114.95,"i":20},{"t":123.61,"i":21},{"t":126.97,"i":22},{"t":132.49,"i":23},{"t":136.33,"i":24},{"t":138.39,"i":25},{"t":143.41,"i":40},{"t":150.18,"i":0},{"t":158.57,"i":1},{"t":167.58,"i":2},{"t":169.92,"i":4},{"t":175.91,"i":5},{"t":186.43,"i":6},{"t":192.78,"i":7},{"t":199.61,"i":8},{"t":206.12,"i":9},{"t":213.19,"i":10},{"t":225.06,"i":11},{"t":231.7,"i":12},{"t":239.1,"i":13},{"t":242.52,"i":14},{"t":248.77,"i":15},{"t":255.29,"i":16},{"t":263.24,"i":18},{"t":271.46,"i":19},{"t":276.35,"i":20},{"t":287.23,"i":21},{"t":291.56,"i":22},{"t":298.58,"i":23},{"t":303.52,"i":24},{"t":306.26,"i":26},{"t":311.1,"i":27},{"t":315.82,"i":28},{"t":321.02,"i":29},{"t":325.43,"i":30},{"t":331.53,"i":31},{"t":337.6,"i":32},{"t":344.34,"i":33},{"t":350.49,"i":34},{"t":356.18,"i":35},{"t":365.39,"i":36},{"t":370.77,"i":37},{"t":377.37,"i":38},{"t":389.95,"i":39}],"count":41},{"id":6,"title":"下雨的周末","sub":"The Rainy Saturday","desc":"骑行泡汤了？不，堡垒计划开始","audio":"audio/talk06.mp3","duration":449.8,"size":2699516,"lines":[{"en":"Ugh, look outside. It's been raining since Friday.","zh":"唉，看外面。从周五就开始下了。","w":"B"},{"en":"So much for our bike trip. There goes the whole weekend.","zh":"我们的骑行泡汤了。整个周末都完了。","w":"A"},{"en":"Not so fast. Rainy weekends are secretly the best weekends.","zh":"先别急。下雨的周末其实是最好的周末。","w":"B"},{"en":"You made a plan. The sky made a different plan. Classic weekend story.","zh":"你做好了一个计划。天空做了另一个计划。经典的周末故事。","w":"H"},{"en":"Today: what do you do when the rain ruins everything? Mia has answers. Jake has doubts. The rain doesn't care.","zh":"今天：当雨毁了一切，你怎么办？Mia 有答案，Jake 有怀疑，雨不在乎。","w":"H"},{"en":"Okay, convince me. What's so great about a rainy weekend?","zh":"行，说服我。下雨的周末到底好在哪里？","w":"A"},{"en":"Think about it. No one makes plans, so no guilt. You stay in, watch a movie, build the world's biggest blanket fort...","zh":"你想想。没人约你，所以没有负罪感。宅在家、看电影、搭一个世界上最大的毯子堡垒……","w":"B"},{"en":"A blanket fort? Mia, we're fourteen.","zh":"毯子堡垒？Mia，我们都十四岁了。","w":"A"},{"en":"Fourteen-year-olds make the BEST blanket forts. My little brother joins for ten minutes, gets bored, leaves — and then it's perfect.","zh":"十四岁搭的毯子堡垒最棒。我弟加入十分钟就无聊走了——然后就完美了。","w":"B"},{"en":"Ha! Okay, that's actually true. But my mom will say: 'You have homework.'","zh":"哈！行吧，这话倒是真的。但我妈会说：“你有作业。”","w":"A"},{"en":"So do homework inside the fort. Homework plus blanket fort equals... homework, but cozy.","zh":"那就把作业搬进堡垒里写。作业加毯子堡垒等于……作业，但是很 cozy。","w":"B"},{"en":"You've thought about this a lot, haven't you?","zh":"这事你想了很多吧？","w":"A"},{"en":"Every rainy Saturday of my life. Bring your math book. I'll make hot chocolate.","zh":"我人生里每个下雨的周六。带上你的数学书，我来做热巧克力。","w":"B"},{"en":"Deal. Should I bring anything else?","zh":"成交。还要带别的吗？","w":"A"},{"en":"Snacks. Fort rule number one: whoever complains about the rain has to share their snacks.","zh":"零食。堡垒第一条规矩：谁抱怨下雨，谁就得分享零食。","w":"B"},{"en":"That's not a real rule.","zh":"这不是真规矩。","w":"A"},{"en":"It is now.","zh":"从现在开始是了。","w":"B"},{"en":"Saturday morning. The fort is up. And there's a knock at the door — someone new wants in.","zh":"周六早上。堡垒搭好了。有人敲门——一个新成员想加入。","w":"H"},{"en":"Guys, I'm here! Wow. This is... actually impressive. There are pillows.","zh":"我来了！哇。这……确实厉害。还有枕头。","w":"C"},{"en":"Welcome to Fort Sunday. Shoes off, and keep your opinions about the rain to yourself.","zh":"欢迎来到星期日堡垒。脱鞋，关于雨的看法请自己保留。","w":"A"},{"en":"My mom says thanks for inviting me — oh, and she sent dumplings. Frozen ones. She said, 'just boil them.'","zh":"我妈说谢谢你们叫我——哦，她让我带了饺子。速冻的。她说：“煮一下就行。”","w":"C"},{"en":"Your mom is a legend.","zh":"你妈是个传奇。","w":"B"},{"en":"Okay, movie time. Mia, what are we watching?","zh":"好，看电影时间。Mia，我们看什么？","w":"A"},{"en":"The rule of fort movies: something a little bit scary, a little bit funny, and absolutely no homework in the first twenty minutes.","zh":"堡垒电影法则：有点吓人、有点好笑，并且前二十分钟绝对不许写作业。","w":"B"},{"en":"I brought two movies and my dad's popcorn machine.","zh":"我带了两部电影，还有我爸的爆米花机。","w":"C"},{"en":"Leo. Leo, buddy. You might have the best family in this city.","zh":"Leo。Leo，兄弟。你家的家庭配置可能是全市第一。","w":"A"},{"en":"I know. Tell me something I don't know.","zh":"我知道。说点我不知道的。","w":"C"},{"en":"Before we slow things down — a few cozy lines for rainy days.","zh":"放慢之前——几句适合下雨天的暖心表达。","w":"H"},{"en":"It's been raining since Friday.","zh":"从周五就一直下雨。","w":"H"},{"en":"So much for our bike trip.","zh":"我们的骑行算是泡汤了。","w":"H"},{"en":"Not so fast.","zh":"先别急着下结论。","w":"H"},{"en":"Deal.","zh":"成交。","w":"H"},{"en":"So much for...","zh":"……算是泡汤了。","w":"H"},{"en":"There goes the whole weekend.","zh":"整个周末就这样没了。","w":"H"},{"en":"Not so fast.","zh":"先别急。","w":"H"},{"en":"You've thought about this a lot, haven't you?","zh":"这事你想了很多吧？","w":"H"},{"en":"Deal.","zh":"成交。","w":"H"},{"en":"Fort rule number one","zh":"堡垒第一条规矩（自创规矩的幽默）","w":"H"},{"en":"That's not a real rule. — It is now.","zh":"这不是真规矩。——从现在起是了。","w":"H"},{"en":"Your mom is a legend.","zh":"你妈是个传奇。","w":"H"},{"en":"Rainy day challenge: describe your perfect indoor day in English — what you'd watch, eat, and build. Forty seconds, out loud.","zh":"雨天挑战：用英语描述你完美的宅家一天——看什么、吃什么、搭什么。四十秒，大声说。","w":"H"},{"en":"Next time, the rain stops and we hit the basketball court — where Jake hears the strangest job offer of his life. See you!","zh":"下一集，雨停了，我们去篮球场——Jake 将在那里听到他人生中最奇怪的招募。再见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":4.82,"i":1},{"t":8.8,"i":2},{"t":14.47,"i":3},{"t":22.24,"i":4},{"t":33.41,"i":5},{"t":37.68,"i":6},{"t":47.08,"i":7},{"t":50.87,"i":8},{"t":60.88,"i":9},{"t":67.28,"i":10},{"t":74.89,"i":11},{"t":77.77,"i":12},{"t":84.53,"i":13},{"t":87.68,"i":14},{"t":94.8,"i":15},{"t":96.86,"i":16},{"t":98.78,"i":17},{"t":107.38,"i":18},{"t":117.31,"i":19},{"t":123.26,"i":20},{"t":134.39,"i":21},{"t":136.79,"i":22},{"t":140.37,"i":23},{"t":150.16,"i":24},{"t":154.93,"i":25},{"t":159.92,"i":26},{"t":164.65,"i":27},{"t":170.36,"i":42},{"t":177.13,"i":0},{"t":183.29,"i":1},{"t":188.39,"i":2},{"t":195.55,"i":5},{"t":201.04,"i":6},{"t":212.83,"i":7},{"t":217.72,"i":8},{"t":230.23,"i":9},{"t":238.31,"i":10},{"t":247.87,"i":11},{"t":251.63,"i":12},{"t":260.18,"i":13},{"t":264.28,"i":14},{"t":273.26,"i":15},{"t":275.99,"i":16},{"t":278.57,"i":18},{"t":291.01,"i":19},{"t":298.54,"i":20},{"t":312.44,"i":21},{"t":315.6,"i":22},{"t":320.22,"i":23},{"t":332.47,"i":24},{"t":338.58,"i":25},{"t":344.93,"i":26},{"t":350.96,"i":28},{"t":356.43,"i":29},{"t":361.77,"i":30},{"t":366.68,"i":31},{"t":370.73,"i":32},{"t":376.95,"i":33},{"t":384.12,"i":34},{"t":390.72,"i":35},{"t":399.7,"i":36},{"t":404.76,"i":37},{"t":411.56,"i":38},{"t":422.16,"i":39},{"t":429.05,"i":40},{"t":439.79,"i":41}],"count":43},{"id":7,"title":"放学篮球局","sub":"After-School Basketball","desc":"三对三、一场险胜和新队友的诞生","audio":"audio/talk07.mp3","duration":387.3,"size":2324540,"lines":[{"en":"Jake! You're on my team today. And try to actually catch the ball this time.","zh":"Jake！你今天在我队。这次争取把球接住行吗。","w":"C"},{"en":"That was ONE time, Leo. One time!","zh":"那只有一次，Leo。一次！","w":"A"},{"en":"It's in my memory forever. Let's go.","zh":"它永远留在我的记忆里。走吧。","w":"C"},{"en":"Sports after school. Fresh air, loud friends, and one life skill nobody teaches you in class: how to invite a stranger to play.","zh":"放学后的运动。新鲜空气、吵闹的朋友，还有一项课堂上学不到的生活技能：怎么邀请陌生人一起玩。","w":"H"},{"en":"Alright, teams of three. Me, Jake and Emma against Mia, Dan and... wait, where's Dan?","zh":"好，三人一队。我、Jake、Emma，对 Mia、Dan 和……等等，Dan 呢？","w":"C"},{"en":"He texted me. He's at his grandma's. So we're five — three on two?","zh":"他发消息说在奶奶家。那我们一共五个人——三对二？","w":"B"},{"en":"Or we ask that guy over there. He's been watching us for ten minutes.","zh":"或者问问那边那个人。他已经看我们看了十分钟了。","w":"A"},{"en":"Excuse me! Do you play? Three on three — we need one more!","zh":"你好！你打球吗？三对三——我们还差一个！","w":"B"},{"en":"He's coming over. See? Worst case, you just ask.","zh":"他过来了。看吧？大不了就是开口问一下。","w":"C"},{"en":"New guy, you're with us. What's your name?","zh":"新来的，你跟我们一队。你叫什么？","w":"C"},{"en":"Kevin. Nice.","zh":"Kevin。很高兴认识。","w":"C"},{"en":"Kevin, rule one: pass to Jake, he misses, we all pretend it was part of the plan.","zh":"Kevin，第一条规矩：传球给 Jake，他没进，我们就都假装那是战术的一部分。","w":"C"},{"en":"I can HEAR you.","zh":"我听得见。","w":"A"},{"en":"First to eleven wins. Losers buy drinks!","zh":"先到十一分获胜。输的买饮料！","w":"B"},{"en":"Game on.","zh":"开打。","w":"C"},{"en":"Forty minutes later. The score is close. The drinks are on someone. Let's listen.","zh":"四十分钟后。比分胶着。饮料有人要请了。来听。","w":"H"},{"en":"Eleven to ten. That was the closest game of my life.","zh":"十一比十。这是我人生中最胶着的一场比赛。","w":"A"},{"en":"My legs are noodles. Actual noodles.","zh":"我的腿是面条。真的面条。","w":"C"},{"en":"Drinks on you two. Water for me, please — I'm saving my money for the school fair.","zh":"你们俩请客。我要水——我在为学校义卖攒钱。","w":"B"},{"en":"Careful, Mia. You might save enough to buy the whole fair.","zh":"省着点，Mia。你可能会攒到把整个义卖都买下来。","w":"C"},{"en":"Same time next Friday? And Kevin — you're officially on the team now.","zh":"下周五老时间？还有 Kevin——你现在是正式队员了。","w":"A"},{"en":"Wait, there's a team? Since when?","zh":"等等，还有队？什么时候有的？","w":"C"},{"en":"Since ten seconds ago. Congratulations.","zh":"十秒钟前刚成立的。恭喜。","w":"A"},{"en":"Best job offer I've ever had.","zh":"这是我收到过的最好的工作邀约。","w":"C"},{"en":"Before we slow down, here's the courtside vocabulary.","zh":"放慢之前，来学球场边的表达。","w":"H"},{"en":"Do you play?","zh":"你打球吗？","w":"H"},{"en":"We need one more!","zh":"我们还差一个人！","w":"H"},{"en":"First to eleven wins.","zh":"先到十一分获胜。","w":"H"},{"en":"Game on.","zh":"开打。","w":"H"},{"en":"You're on my team today.","zh":"你今天在我这队。","w":"H"},{"en":"Do you play?","zh":"你打球吗？","w":"H"},{"en":"Worst case, you just ask.","zh":"最坏的情况也就是开口问一下。","w":"H"},{"en":"Game on.","zh":"开打。","w":"H"},{"en":"Drinks on you.","zh":"饮料你请。","w":"H"},{"en":"Same time next Friday?","zh":"下周五老时间？","w":"H"},{"en":"Since when?","zh":"什么时候开始的？（惊讶）","w":"H"},{"en":"Best offer I've ever had.","zh":"我收到过最好的邀约。","w":"H"},{"en":"Sports challenge: in English, describe your favorite way to move — running, dancing, swimming, anything. Say why you love it and when you do it.","zh":"运动挑战：用英语描述你最喜欢的运动方式——跑步、跳舞、游泳都行。说出你为什么喜欢、什么时候做。","w":"H"},{"en":"Next time: Jake and Mia take a bus to the Science Museum. It should take twenty minutes. It takes... longer. See you on the next walk!","zh":"下一集：Jake 和 Mia 坐公交去科技馆。本该二十分钟。结果用了……久一点。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":8.23,"i":1},{"t":11.54,"i":2},{"t":16.58,"i":3},{"t":27.38,"i":4},{"t":36.71,"i":5},{"t":42.71,"i":6},{"t":47.37,"i":7},{"t":53.17,"i":8},{"t":60.56,"i":9},{"t":65.82,"i":10},{"t":69.61,"i":11},{"t":77.04,"i":12},{"t":78.82,"i":13},{"t":83.38,"i":14},{"t":85.7,"i":15},{"t":95.16,"i":16},{"t":99.53,"i":17},{"t":104.71,"i":18},{"t":111.28,"i":19},{"t":117.54,"i":20},{"t":122.58,"i":21},{"t":127.43,"i":22},{"t":131.29,"i":23},{"t":134.89,"i":24},{"t":139.91,"i":39},{"t":146.68,"i":0},{"t":157.01,"i":1},{"t":161.29,"i":2},{"t":167.71,"i":4},{"t":179.41,"i":5},{"t":187.01,"i":6},{"t":192.95,"i":7},{"t":200.31,"i":8},{"t":209.61,"i":9},{"t":216.29,"i":10},{"t":221.15,"i":11},{"t":230.5,"i":12},{"t":232.89,"i":13},{"t":238.71,"i":14},{"t":241.79,"i":16},{"t":247.37,"i":17},{"t":253.93,"i":18},{"t":262.23,"i":19},{"t":270.16,"i":20},{"t":276.55,"i":21},{"t":282.73,"i":22},{"t":287.69,"i":23},{"t":292.33,"i":25},{"t":296.67,"i":26},{"t":301.56,"i":27},{"t":306.81,"i":28},{"t":311.07,"i":29},{"t":317.84,"i":30},{"t":323.43,"i":31},{"t":331.71,"i":32},{"t":337.16,"i":33},{"t":343.04,"i":34},{"t":350.07,"i":35},{"t":355.81,"i":36},{"t":362.96,"i":37},{"t":374.68,"i":38}],"count":40},{"id":8,"title":"迷路奇遇","sub":"Getting Lost","desc":"拿反的地图、热心的路人和一堂问路课","audio":"audio/talk08.mp3","duration":393.0,"size":2358812,"lines":[{"en":"Mia. Mia. Stop walking. Look at this street. Do you see any of these buildings on the map?","zh":"Mia。Mia。别走了。看这条街。地图上有这些楼里的任何一栋吗？","w":"A"},{"en":"Hmm. No. Okay. Don't panic, but... I think we took the wrong bus.","zh":"嗯。没有。好。先别慌，但是……我觉得我们坐错车了。","w":"B"},{"en":"We've been walking for forty minutes, Mia.","zh":"我们已经走了四十分钟了，Mia。","w":"A"},{"en":"Today's episode: getting lost, and the skill that saves you every time — asking for help.","zh":"今天的节目：迷路，以及每次都能救你的那项技能——开口求助。","w":"H"},{"en":"How? You had the map open the whole time!","zh":"怎么会？你一路上地图都开着呢！","w":"A"},{"en":"I did! But the map was upside down, so 'left' was actually 'right'...","zh":"我确实开着！但地图拿反了，所以“左”其实是“右”……","w":"B"},{"en":"For forty minutes, Mia. We've been walking for forty minutes.","zh":"整整四十分钟，Mia。我们走了四十分钟了。","w":"A"},{"en":"In our defense, it was a very interesting forty minutes. Did you see that cat café?","zh":"凭良心说，这四十分钟还挺有意思的。你看到那家猫咖了吗？","w":"B"},{"en":"I did see it. We walked past it three times.","zh":"我看到了。我们路过它三次。","w":"A"},{"en":"Okay, okay. New plan. Let's ask someone. That lady looks friendly.","zh":"好好好。新计划。我们问人吧。那位女士看起来很友善。","w":"B"},{"en":"Excuse me, hi — sorry to bother you. We're trying to get to the Science Museum. Are we far?","zh":"您好，打扰一下。我们想去科技馆，还远吗？","w":"A"},{"en":"Oh, you're close! But you went the wrong way at the last crossing. Go back, turn right at the bakery, and it's the big glass building on your left.","zh":"哦，很近了！但你们在上个路口走反了。往回走，在面包店右转，左手边那栋大玻璃楼就是。","w":"C"},{"en":"Back, right at the bakery, big glass building. Got it. Thank you so much!","zh":"往回、面包店右转、大玻璃楼。记住了。太感谢了！","w":"A"},{"en":"No worries, dear. It happens to everyone — this neighborhood all looks the same.","zh":"没事的，孩子。人人都遇到过——这一带的楼长得都一样。","w":"C"},{"en":"See? Asking is faster than guessing. That's lesson one of getting lost.","zh":"看吧？开口问比瞎猜快。这是迷路第一课。","w":"B"},{"en":"Lesson two: never let Mia hold the map.","zh":"第二课：永远别让 Mia 拿地图。","w":"A"},{"en":"The map was FINE. It was upside down, but it was fine.","zh":"地图好好的。是拿反了，但它好好的。","w":"B"},{"en":"Twenty minutes later — after one more wrong turn, but who's counting — they arrive.","zh":"二十分钟后——再多拐错一次弯之后，不过谁在数呢——他们到了。","w":"H"},{"en":"There it is! The glass building! We made it, and we're only twenty minutes late.","zh":"在那儿！玻璃大楼！我们到了，只迟到了二十分钟。","w":"A"},{"en":"See? Character-building. Anyway — look, they have a robot section.","zh":"看吧？磨练意志。总之——看，有机器人展区。","w":"B"},{"en":"Mia. It's a science museum. They have six robot sections.","zh":"Mia。这是科技馆。他们有六个机器人展区。","w":"A"},{"en":"Then today is the best day of my life.","zh":"那今天是我人生中最好的一天。","w":"B"},{"en":"Before we slow things down — the four sentences that will save you in any city on Earth.","zh":"放慢之前——这四句话能在地球上任何城市救你。","w":"H"},{"en":"Excuse me, sorry to bother you.","zh":"您好，打扰一下。","w":"H"},{"en":"We're trying to get to the Science Museum.","zh":"我们想去科技馆。","w":"H"},{"en":"Are we far?","zh":"还远吗？","w":"H"},{"en":"Turn right at the bakery.","zh":"在面包店右转。","w":"H"},{"en":"Excuse me, sorry to bother you.","zh":"您好，打扰一下。","w":"H"},{"en":"We're trying to get to ...","zh":"我们想去……","w":"H"},{"en":"Are we far?","zh":"还远吗？","w":"H"},{"en":"Go back and turn right.","zh":"往回走然后右转。","w":"H"},{"en":"It's on your left.","zh":"在你左手边。","w":"H"},{"en":"Thank you so much!","zh":"太感谢了！","w":"H"},{"en":"No worries.","zh":"没事的。","w":"H"},{"en":"Asking is faster than guessing.","zh":"开口问比瞎猜快。","w":"H"},{"en":"Look at a map of your neighborhood and describe one route in English: go straight, turn left at..., it's on your right. Out loud, twice.","zh":"看一张你家附近的地图，用英语描述一条路线：直走、在……左转、它在你右手边。大声说两遍。","w":"H"},{"en":"Next time: Jake catches nine colds in one classroom, and finally visits the doctor. Bring tissues. See you!","zh":"下一集：Jake 在教室里打了九个喷嚏，终于去看了医生。备好纸巾。再见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.08,"i":1},{"t":13.56,"i":2},{"t":16.84,"i":3},{"t":24.19,"i":4},{"t":27.86,"i":5},{"t":33.64,"i":6},{"t":38.56,"i":7},{"t":45.23,"i":8},{"t":49.11,"i":9},{"t":55.69,"i":10},{"t":62.81,"i":11},{"t":75.32,"i":12},{"t":81.31,"i":13},{"t":89.21,"i":14},{"t":95.49,"i":15},{"t":99.19,"i":16},{"t":104.44,"i":17},{"t":111.31,"i":18},{"t":117.33,"i":19},{"t":123.45,"i":20},{"t":128.63,"i":21},{"t":132.37,"i":22},{"t":139.17,"i":37},{"t":145.94,"i":0},{"t":154.85,"i":1},{"t":163.05,"i":2},{"t":167.29,"i":4},{"t":172.03,"i":5},{"t":179.36,"i":6},{"t":185.61,"i":7},{"t":194.02,"i":8},{"t":199.0,"i":9},{"t":207.29,"i":10},{"t":216.26,"i":11},{"t":231.85,"i":12},{"t":239.44,"i":13},{"t":249.37,"i":14},{"t":257.32,"i":15},{"t":262.09,"i":16},{"t":268.77,"i":18},{"t":276.39,"i":19},{"t":284.13,"i":20},{"t":290.74,"i":21},{"t":295.55,"i":23},{"t":301.52,"i":24},{"t":307.49,"i":25},{"t":311.9,"i":26},{"t":317.0,"i":27},{"t":325.55,"i":28},{"t":332.1,"i":29},{"t":337.79,"i":30},{"t":344.75,"i":31},{"t":351.11,"i":32},{"t":357.75,"i":33},{"t":363.54,"i":34},{"t":371.48,"i":35},{"t":382.24,"i":36}],"count":38},{"id":9,"title":"看医生","sub":"Doctor's Orders","desc":"喷嚏、喉咙痛和一句“医生说不行”","audio":"audio/talk09.mp3","duration":388.3,"size":2330156,"lines":[{"en":"Achoo! ...Ugh.","zh":"阿嚏！……唉。","w":"A"},{"en":"Bless you. Jake, you've sneezed nine times since first class. Go to the doctor.","zh":"保佑你。Jake，第一节课到现在你打了九个喷嚏了。去看医生吧。","w":"B"},{"en":"It's just a cold. I'll be fine by Friday.","zh":"就是普通感冒。周五之前肯定好。","w":"A"},{"en":"Everyone gets sick sometimes. Today's episode: being honest about how you feel — and what the doctor actually says.","zh":"人人都会生病。今天的节目：诚实地描述你的感受——以及医生到底会说什么。","w":"H"},{"en":"You said that on Monday. It's Wednesday, Jake.","zh":"周一你也是这么说的。今天是周三了，Jake。","w":"B"},{"en":"Okay, it's a stubborn cold. Still just a cold.","zh":"好吧，这是个顽固的感冒。但也就是感冒。","w":"A"},{"en":"Be honest. How do you feel right now?","zh":"说实话。你现在感觉怎么样？","w":"B"},{"en":"Honestly? My head feels like a drum, and my throat hurts when I talk.","zh":"说实话？我的头像鼓一样，说话的时候喉咙也疼。","w":"A"},{"en":"Then go. Today. Ask your mom to take you to the clinic after school.","zh":"那就去。今天去。让你妈放学后带你去诊所。","w":"B"},{"en":"Okay, okay, you win. But if the doctor says it's nothing, I get to say 'I told you so.'","zh":"好好好，你赢了。但要是医生说没事，我就可以说“我早说过吧”。","w":"A"},{"en":"Deal. Now go before you sneeze on someone again.","zh":"成交。趁你还没再喷嚏喷到谁，快去吧。","w":"B"},{"en":"After school, Jake's mom takes him to the clinic. Inside room three, the doctor asks the question every patient hears first.","zh":"放学后，Jake 妈妈带他去了诊所。三号诊室里，医生问了每个病人都会先被问到的问题。","w":"H"},{"en":"Hello, young man. What brings you in today?","zh":"你好，小伙子。今天哪里不舒服？","w":"C"},{"en":"I've had a cough since Monday, and a headache since yesterday. And I'm really tired.","zh":"我从周一开始咳嗽，昨天开始头疼。而且特别累。","w":"A"},{"en":"Any fever?","zh":"发烧吗？","w":"C"},{"en":"I don't know. My mom measured this morning — thirty-seven point eight.","zh":"不知道。我妈早上量了——三十七度八。","w":"A"},{"en":"A little one. Let me listen to your lungs. Breathe in... and out. Again. Good.","zh":"有一点低烧。我听听你的肺。吸气……呼气。再来。好。","w":"C"},{"en":"Okay. It's a common cold, nothing serious. But you should rest for two days and drink lots of warm water.","zh":"好了。是普通感冒，不严重。但要休息两天，多喝温水。","w":"C"},{"en":"Do I need medicine?","zh":"需要吃药吗？","w":"A"},{"en":"Just this — one pill after dinner, for three days. And no basketball until the fever is gone. Understood?","zh":"只要这个——晚饭后一片，吃三天。退烧之前不许打篮球。明白吗？","w":"C"},{"en":"Not even a little basketball?","zh":"一点点篮球也不行？","w":"A"},{"en":"Doctor's orders. Rest is also medicine — and it's free.","zh":"医嘱。休息也是药——而且是免费的。","w":"C"},{"en":"That's the most unfair rule I've ever heard. But okay. Thanks, doctor.","zh":"这是我听过最不公平的规定。但好吧。谢谢医生。","w":"A"},{"en":"Before we slow down — how to describe a cold like a pro.","zh":"放慢之前——像老手一样描述感冒。","w":"H"},{"en":"What brings you in today?","zh":"今天哪里不舒服？","w":"H"},{"en":"I've had a cough since Monday.","zh":"我从周一开始咳嗽。","w":"H"},{"en":"Any fever?","zh":"发烧吗？","w":"H"},{"en":"Doctor's orders.","zh":"医嘱。","w":"H"},{"en":"It's just a cold.","zh":"只是普通感冒。","w":"H"},{"en":"How do you feel right now?","zh":"你现在感觉怎么样？","w":"H"},{"en":"My throat hurts when I talk.","zh":"我说话时喉咙疼。","w":"H"},{"en":"I've had a cough since Monday.","zh":"我从周一开始咳嗽。","w":"H"},{"en":"Any fever?","zh":"发烧吗？","w":"H"},{"en":"nothing serious","zh":"不严重","w":"H"},{"en":"Doctor's orders.","zh":"医嘱。","w":"H"},{"en":"Rest is also medicine.","zh":"休息也是药。","w":"H"},{"en":"Health challenge: if you felt sick today, describe it in English — where it hurts, since when, how bad. If you feel great, say why. Out loud.","zh":"健康挑战：如果你今天不舒服，用英语描述它——哪里疼、从什么时候开始、多严重。如果你状态很好，说说为什么。大声说。","w":"H"},{"en":"Next time: a secret birthday plan, a chocolate cake, and the hardest rule of all — nobody posts anything online. See you on the next walk!","zh":"下一集：一个秘密生日计划、一个巧克力蛋糕，以及最难的一条规矩——不许发任何东西上网。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":2.18,"i":1},{"t":9.07,"i":2},{"t":12.67,"i":3},{"t":22.51,"i":4},{"t":26.63,"i":5},{"t":30.62,"i":6},{"t":34.41,"i":7},{"t":39.8,"i":8},{"t":45.75,"i":9},{"t":52.52,"i":10},{"t":56.91,"i":11},{"t":67.21,"i":12},{"t":72.53,"i":13},{"t":78.08,"i":14},{"t":80.52,"i":15},{"t":85.51,"i":16},{"t":96.12,"i":17},{"t":106.46,"i":18},{"t":108.38,"i":19},{"t":119.42,"i":20},{"t":121.81,"i":21},{"t":128.12,"i":22},{"t":134.0,"i":23},{"t":139.09,"i":38},{"t":145.86,"i":0},{"t":148.76,"i":1},{"t":157.43,"i":2},{"t":162.08,"i":4},{"t":167.37,"i":5},{"t":172.49,"i":6},{"t":177.35,"i":7},{"t":184.2,"i":8},{"t":191.73,"i":9},{"t":200.28,"i":10},{"t":205.89,"i":12},{"t":212.64,"i":13},{"t":219.66,"i":14},{"t":222.87,"i":15},{"t":229.19,"i":16},{"t":242.45,"i":17},{"t":255.4,"i":18},{"t":257.98,"i":19},{"t":271.77,"i":20},{"t":274.92,"i":21},{"t":282.9,"i":22},{"t":290.36,"i":24},{"t":295.29,"i":25},{"t":300.59,"i":26},{"t":305.02,"i":27},{"t":309.79,"i":28},{"t":316.12,"i":29},{"t":322.92,"i":30},{"t":330.6,"i":31},{"t":337.89,"i":32},{"t":343.63,"i":33},{"t":350.25,"i":34},{"t":356.61,"i":35},{"t":363.93,"i":36},{"t":376.8,"i":37}],"count":39},{"id":10,"title":"惊喜生日会","sub":"The Surprise Party","desc":"保密难度五颗星的生日计划","audio":"audio/talk10.mp3","duration":416.7,"size":2501084,"lines":[{"en":"Emma's birthday is on Saturday. Are we doing a surprise party or not?","zh":"Emma 周六生日。惊喜派对到底办不办？","w":"B"},{"en":"We ARE. But we have to plan it without her finding out. You know how she is.","zh":"办。但我们得计划得天衣无缝，不能让她发现。你知道她的。","w":"A"},{"en":"She found out about her own Christmas present last year. She read the email over her dad's shoulder.","zh":"她去年连自己的圣诞礼物都提前发现了。凑在她爸肩膀后面看的邮件。","w":"B"},{"en":"Planning a surprise party takes three skills: a good plan, a backup plan, and the ability to keep a secret. Today, all three are tested.","zh":"策划惊喜派对需要三种能力：好计划、备用计划，还有保守秘密的能力。今天，三种全部接受考验。","w":"H"},{"en":"Okay, first: the cake. Chocolate or fruit?","zh":"好，第一：蛋糕。巧克力还是水果的？","w":"A"},{"en":"Chocolate. It's not up for debate. Emma would choose chocolate in her sleep.","zh":"巧克力。这没有讨论余地。Emma 睡着了都会选巧克力。","w":"B"},{"en":"Agreed. Chocolate cake with strawberries on top. Second: where? My place is small.","zh":"同意。巧克力蛋糕，上面放草莓。第二：在哪儿办？我家太小。","w":"A"},{"en":"What about the park? If it doesn't rain — picnic tables, balloons, and Leo brings his speaker.","zh":"公园怎么样？要是不下雨——野餐桌、气球，Leo 带他的音箱来。","w":"B"},{"en":"And if it rains?","zh":"那要是下雨呢？","w":"A"},{"en":"Backup plan: Leo's garage. It's big and his parents don't mind.","zh":"备用计划：Leo 家车库。很大，他爸妈也不介意。","w":"B"},{"en":"You've already talked to Leo, haven't you?","zh":"你已经跟 Leo 说过了吧？","w":"A"},{"en":"I texted him an hour ago. He said, and I quote, 'I was born ready.'","zh":"我一小时前就发消息了。他说，原话是：“我生下来就准备好了。”","w":"B"},{"en":"Guest list? Whole class, or keep it small?","zh":"客人名单？全班都请，还是小型？","w":"A"},{"en":"Small. Twelve people, max. Big parties stress Emma out.","zh":"小型。最多十二个人。大型派对会让 Emma 有压力。","w":"B"},{"en":"Good point. I'll make a group chat tonight, and everyone brings one snack.","zh":"有道理。我今晚建个群，每人带一样零食。","w":"A"},{"en":"Perfect. Oh — and one rule. NOBODY posts anything online until Sunday.","zh":"完美。哦——还有一条规矩。周日之前谁都不许发网上。","w":"B"},{"en":"Not even a story?","zh":"发个限时动态也不行？","w":"A"},{"en":"Not even a story. Her sister spies for us, but her cousin... her cousin cannot be trusted.","zh":"动态也不行。她妹妹是我们这边的卧底，但她表姐……她表姐守不住秘密。","w":"B"},{"en":"Saturday afternoon. The park. The cake is here. The balloons are up. And Emma is about to arrive.","zh":"周六下午。公园。蛋糕到位。气球挂好。Emma 马上就到。","w":"H"},{"en":"Shh, shh! She's coming! Everyone hide!","zh":"嘘嘘！她来了！大家躲起来！","w":"A"},{"en":"Lights off! Lights off!","zh":"关灯！关灯！","w":"B"},{"en":"Why are all the lights off? Hello...? Guys? This isn't funny—","zh":"怎么灯全关了？喂……？你们呢？不好玩啊——","w":"B"},{"en":"SURPRISE! HAPPY BIRTHDAY!","zh":"惊喜！生日快乐！","w":"A"},{"en":"You GUYS! Oh my goodness — wait. Is that chocolate cake? With strawberries?","zh":"你们这些家伙！我的天——等等。那是巧克力蛋糕吗？还有草莓？","w":"B"},{"en":"Your favorites. Happy birthday, Emma.","zh":"都是你的最爱。生日快乐，Emma。","w":"A"},{"en":"I actually might cry. Okay, no, I'm fine. Group hug! Come on!","zh":"我真的可能会哭。好，没事，我没事。抱一个！都过来！","w":"B"},{"en":"Before we slow down — the vocabulary of a perfect surprise.","zh":"放慢之前——一场完美惊喜的词汇表。","w":"H"},{"en":"Are we doing a surprise party or not?","zh":"惊喜派对到底办不办？","w":"H"},{"en":"It's not up for debate.","zh":"这没有讨论余地。","w":"H"},{"en":"And if it rains?","zh":"那要是下雨呢？","w":"H"},{"en":"Nobody posts anything online.","zh":"谁都不许发网上。","w":"H"},{"en":"Are we ... or not?","zh":"到底……不……？","w":"H"},{"en":"It's not up for debate.","zh":"没有讨论余地。","w":"H"},{"en":"Good point.","zh":"有道理。","w":"H"},{"en":"Backup plan","zh":"备用计划","w":"H"},{"en":"and I quote","zh":"原话是（引用某人的话）","w":"H"},{"en":"Big parties stress her out.","zh":"大型派对让她有压力。","w":"H"},{"en":"Not even a story.","zh":"动态也不行。","w":"H"},{"en":"Group hug!","zh":"一起抱一个！","w":"H"},{"en":"Plan your dream party in English, out loud: where, when, what food, who comes, and your backup plan. One minute.","zh":"用英语大声策划你的梦想派对：在哪、何时、吃什么、谁参加，还有你的备用计划。一分钟。","w":"H"},{"en":"Next time: Grandma, tea eggs, and a train that leaves at nine fifteen — not nine. See you on the next walk!","zh":"下一集：奶奶、茶叶蛋，和一班九点十五——不是九点——发车的火车。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.69,"i":1},{"t":11.32,"i":2},{"t":18.79,"i":3},{"t":30.21,"i":4},{"t":34.67,"i":5},{"t":40.84,"i":6},{"t":47.7,"i":7},{"t":55.24,"i":8},{"t":57.13,"i":9},{"t":63.42,"i":10},{"t":66.25,"i":11},{"t":72.15,"i":12},{"t":76.06,"i":13},{"t":81.86,"i":14},{"t":87.33,"i":15},{"t":94.56,"i":16},{"t":96.47,"i":17},{"t":104.51,"i":18},{"t":116.06,"i":19},{"t":119.9,"i":20},{"t":123.13,"i":21},{"t":129.11,"i":22},{"t":132.06,"i":23},{"t":139.28,"i":24},{"t":142.76,"i":25},{"t":149.93,"i":26},{"t":155.62,"i":41},{"t":162.39,"i":0},{"t":169.58,"i":1},{"t":176.72,"i":2},{"t":186.12,"i":4},{"t":191.82,"i":5},{"t":199.63,"i":6},{"t":208.28,"i":7},{"t":217.75,"i":8},{"t":220.28,"i":9},{"t":228.24,"i":10},{"t":231.95,"i":11},{"t":239.42,"i":12},{"t":244.45,"i":13},{"t":251.81,"i":14},{"t":258.73,"i":15},{"t":267.81,"i":16},{"t":270.37,"i":17},{"t":280.49,"i":19},{"t":285.42,"i":20},{"t":289.63,"i":21},{"t":297.2,"i":22},{"t":301.05,"i":23},{"t":310.14,"i":24},{"t":314.61,"i":25},{"t":323.65,"i":27},{"t":329.52,"i":28},{"t":334.55,"i":29},{"t":339.23,"i":30},{"t":344.95,"i":31},{"t":351.72,"i":32},{"t":358.56,"i":33},{"t":364.32,"i":34},{"t":370.47,"i":35},{"t":376.23,"i":36},{"t":383.79,"i":37},{"t":390.34,"i":38},{"t":395.88,"i":39},{"t":406.59,"i":40}],"count":42},{"id":11,"title":"火车去奶奶家","sub":"The Train Trip","desc":"改点的车票、茶叶蛋和一个文件夹","audio":"audio/talk11.mp3","duration":420.1,"size":2521388,"lines":[{"en":"Mom said the train leaves at nine, right? Not eight? Because I checked the tickets and—","zh":"妈说火车九点发车对吧？不是八点？因为我看了票……","w":"A"},{"en":"Nine fifteen. It got changed last week. Why? What time did you tell your dad?","zh":"九点十五。上周改的。怎么了？你跟你爸说的是几点？","w":"B"},{"en":"...Eight. I told him eight. He's going to be there at seven thirty with sandwiches.","zh":"……八点。我跟他说八点。他会七点半就带着三明治站在那儿了。","w":"A"},{"en":"Train stations: big boards, small panics, and grandmas who always have snacks.","zh":"火车站：巨大的屏幕、小小的心慌，还有永远有零食的奶奶。","w":"H"},{"en":"Relax, the train is at nine fifteen, we're an hour early. Want a sandwich?","zh":"放松，火车九点十五，我们早到了一小时。要三明治吗？","w":"C"},{"en":"We're not an hour early, we're forty minutes early. And no — I ate a sandwich at six a.m. Out of panic.","zh":"我们不是早一小时，是早了四十分钟。不吃——我早上六点出于恐慌吃了一个三明治。","w":"A"},{"en":"That's the most Jake thing you've ever said. Okay, tickets?","zh":"这是你说过的最有 Jake 味的一句话。好，票呢？","w":"C"},{"en":"Got them — all three, in this folder, in order. Me, you, Grandma.","zh":"拿到了——三张都在这个文件夹里，按顺序。我、你、奶奶。","w":"A"},{"en":"You made a folder.","zh":"你还做了个文件夹。","w":"C"},{"en":"I made a folder. Grandma loses things. It's her superpower.","zh":"我做了个文件夹。奶奶会丢东西。这是她的超能力。","w":"A"},{"en":"Speaking of Grandma — platform change! Look, the board says platform three now.","zh":"说到奶奶——站台变了！看，大屏说改到三站台了。","w":"C"},{"en":"Already? Ugh, fine. Grab the bags — wait, where's Grandma?","zh":"又改？行吧行吧。拿上包——等等，奶奶呢？","w":"A"},{"en":"She's buying tea eggs. Jake. She will buy tea eggs for exactly one more minute, and then wonder where we are.","zh":"她在买茶叶蛋。Jake。她还会再买整整一分钟，然后开始纳闷我们去哪了。","w":"C"},{"en":"Then we run. On three. One, two—","zh":"那我们跑。数到三。一、二——","w":"A"},{"en":"GRANDMA! WE'RE OVER HERE!","zh":"奶奶！我们在这儿！","w":"C"},{"en":"On the train now. Two hours and forty minutes of river views, stories, and one big food surprise.","zh":"现在火车开了。两小时四十分钟的河景、故事，和一个大大的食物惊喜。","w":"H"},{"en":"Jake, dear, your ticket. Seat twelve, by the window?","zh":"Jake，好孩子，你的票。十二座，靠窗？","w":"B"},{"en":"That's yours, Grandma — twelve, by the window. I'm in thirteen.","zh":"那是您的票，奶奶——十二座靠窗。我在十三座。","w":"A"},{"en":"Wow, Jake, look at that river! How long until we arrive?","zh":"哇，Jake，看那条河！还有多久到？","w":"C"},{"en":"Two hours and forty minutes. If you get bored, I downloaded three movies for you.","zh":"两小时四十分钟。您要是无聊，我给您下载了三部电影。","w":"A"},{"en":"You're a good boy, you know that? Now — I packed us something. Don't tell your mother.","zh":"你是个好孩子，知道吗？现在——我给咱们带了点东西。别告诉你妈。","w":"B"},{"en":"Grandma. Is that— are those tea eggs?","zh":"奶奶。那是——那是茶叶蛋吗？","w":"A"},{"en":"Six of them. One for each hour of the trip, and two for luck.","zh":"六个。旅途每小时一个，另外两个图个吉利。","w":"B"},{"en":"The trip is less than three hours.","zh":"这趟车不到三小时。","w":"A"},{"en":"Then we'll be very lucky.","zh":"那我们会非常幸运。","w":"B"},{"en":"Before we slow things down — travel words that work on any train, in any country.","zh":"放慢之前——在任何国家、任何火车上都用得上的旅行词汇。","w":"H"},{"en":"The train leaves at nine fifteen.","zh":"火车九点十五发车。","w":"H"},{"en":"Platform three now.","zh":"现在改到三站台了。","w":"H"},{"en":"How long until we arrive?","zh":"还有多久到？","w":"H"},{"en":"Don't tell your mother.","zh":"别告诉你妈。","w":"H"},{"en":"The train leaves at ...","zh":"火车……点发车。","w":"H"},{"en":"It got changed last week.","zh":"上周改了。","w":"H"},{"en":"Platform change!","zh":"站台变了！","w":"H"},{"en":"Speaking of ...","zh":"说到……","w":"H"},{"en":"Grab the bags!","zh":"拿上包！","w":"H"},{"en":"We're over here!","zh":"我们在这儿！","w":"H"},{"en":"How long until we arrive?","zh":"还有多久到？","w":"H"},{"en":"for luck","zh":"图个吉利","w":"H"},{"en":"Describe your last trip in English: where you went, how long it took, and one funny thing that happened. One minute, out loud.","zh":"用英语描述你上次出行：去了哪、花了多久、发生的一件趣事。一分钟，大声说。","w":"H"},{"en":"Next time: Biscuit the dog sees a squirrel, jumps the fence, and becomes a neighborhood mystery. See you!","zh":"下一集：小狗饼干看到一只松鼠、翻过栅栏，成了整个社区的悬案。再见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.17,"i":1},{"t":13.29,"i":2},{"t":18.98,"i":3},{"t":26.13,"i":4},{"t":34.0,"i":5},{"t":41.13,"i":6},{"t":47.29,"i":7},{"t":53.84,"i":8},{"t":56.65,"i":9},{"t":61.76,"i":10},{"t":70.09,"i":11},{"t":75.87,"i":12},{"t":86.33,"i":13},{"t":90.07,"i":14},{"t":94.29,"i":15},{"t":103.27,"i":16},{"t":108.31,"i":17},{"t":113.78,"i":18},{"t":120.59,"i":19},{"t":126.69,"i":20},{"t":133.26,"i":21},{"t":136.96,"i":22},{"t":142.23,"i":23},{"t":145.26,"i":24},{"t":147.82,"i":25},{"t":154.69,"i":40},{"t":161.46,"i":0},{"t":169.25,"i":1},{"t":178.24,"i":2},{"t":185.45,"i":4},{"t":195.32,"i":5},{"t":204.31,"i":6},{"t":212.1,"i":7},{"t":220.37,"i":8},{"t":224.0,"i":9},{"t":230.52,"i":10},{"t":240.97,"i":11},{"t":248.3,"i":12},{"t":261.37,"i":13},{"t":266.18,"i":14},{"t":271.6,"i":16},{"t":277.99,"i":17},{"t":284.92,"i":18},{"t":293.5,"i":19},{"t":301.21,"i":20},{"t":309.5,"i":21},{"t":314.27,"i":22},{"t":320.95,"i":23},{"t":324.88,"i":24},{"t":328.25,"i":26},{"t":334.02,"i":27},{"t":338.91,"i":28},{"t":344.21,"i":29},{"t":348.98,"i":30},{"t":355.53,"i":31},{"t":362.97,"i":32},{"t":369.54,"i":33},{"t":375.28,"i":34},{"t":381.42,"i":35},{"t":387.47,"i":36},{"t":394.79,"i":37},{"t":400.53,"i":38},{"t":410.93,"i":39}],"count":41},{"id":12,"title":"小狗走丢了","sub":"Where Is Biscuit?","desc":"松鼠嫌疑犯、寻狗启事和一个反转结局","audio":"audio/talk12.mp3","duration":361.5,"size":2169596,"lines":[{"en":"Mia, this is serious. Biscuit jumped the fence this morning and he hasn't come back.","zh":"Mia，这次是认真的。小狗饼干今天早上翻过了栅栏，到现在没回来。","w":"A"},{"en":"Since when? What time did you last see him?","zh":"什么时候的事？你最后一次见到他是几点？","w":"B"},{"en":"Seven. He saw a squirrel, and, well... you know Biscuit.","zh":"七点。他看见一只松鼠，然后……你懂饼干的。","w":"A"},{"en":"Losing a pet is scary. But panic doesn't find dogs — plans do. Today, Mia brings the plans.","zh":"宠物丢了很吓人。但恐慌找不到狗——计划才能。今天，Mia 负责计划。","w":"H"},{"en":"Okay. Don't worry. Dogs come back. But let's not just wait. What does he love most?","zh":"好。别慌。狗会回来的。但咱们不能干等。他最爱什么？","w":"B"},{"en":"Food. Squeaky toys. Food. Did I say food?","zh":"吃的。会叫的玩具。吃的。我说过吃了吗？","w":"A"},{"en":"Plan one: walk around the block with his squeaky toy and call him.","zh":"计划一：拿着他的玩具绕街区走一圈，边走边喊他。","w":"B"},{"en":"Already did. Twice. A lady asked if I was recruiting for a dog band.","zh":"已经做过了。两次。有位女士问我是不是在给一支狗狗乐队招人。","w":"A"},{"en":"Plan two: we make posters. A photo, his name, your mom's phone number.","zh":"计划二：做寻狗启事。照片、名字、你妈妈的电话。","w":"B"},{"en":"I have a photo. Look — here he is stealing my sandwich.","zh":"我有照片。看——这是他在偷我三明治。","w":"A"},{"en":"That's... an amazing photo, but not for a poster. We need his face. Okay — print ten. We'll put them at the school gate and the park.","zh":"这照片……很精彩，但不适合做启事。要他的正脸。好——打印十张，贴校门口和公园。","w":"B"},{"en":"And the squirrel?","zh":"那松鼠呢？","w":"A"},{"en":"The squirrel is a suspect, Jake. Not a location.","zh":"松鼠是嫌疑人，Jake。不是地点。","w":"B"},{"en":"Two hours of searching. No dog. And then — the phone rings.","zh":"两个小时的寻找。没有狗。然后——电话响了。","w":"H"},{"en":"Mia! MIA! Answer your phone!","zh":"Mia！MIA！接电话！","w":"A"},{"en":"What happened?! Did you find him?","zh":"怎么了？！找到他了吗？","w":"B"},{"en":"Better. He found HIMSELF. He was at the school gate, sitting next to his own poster, waiting for someone to read it.","zh":"还有更好的。他自己找到了自己。他在校门口，坐在自己的寻狗启事旁边，等人来读。","w":"A"},{"en":"You're joking.","zh":"你逗我呢。","w":"B"},{"en":"I'm not! The guard fed him a bun. He's home. He's eating. He's a criminal and I love him.","zh":"没有！门卫喂了他一个馒头。他到家了。正在吃。他是个罪犯，我爱死他了。","w":"A"},{"en":"Okay, from now on: fence fixed, and no squirrels on weekends.","zh":"好，从现在起：修好栅栏，周末禁止松鼠出现。","w":"B"},{"en":"I'll inform the squirrels personally.","zh":"我会亲自通知松鼠们的。","w":"A"},{"en":"Before we slow down — how to talk about a lost pet without panicking.","zh":"放慢之前——怎么在不慌乱的情况下谈论走丢的宠物。","w":"H"},{"en":"He hasn't come back yet.","zh":"他还没回来。","w":"H"},{"en":"What time did you last see him?","zh":"你最后一次见到他是几点？","w":"H"},{"en":"We need his face for the poster.","zh":"启事上得有他的正脸。","w":"H"},{"en":"He's home safe.","zh":"他安全到家了。","w":"H"},{"en":"This is serious.","zh":"这次是认真的。","w":"H"},{"en":"Since when?","zh":"什么时候开始的？","w":"H"},{"en":"Don't worry. Dogs come back.","zh":"别慌。狗会回来的。","w":"H"},{"en":"Plan one / Plan two","zh":"计划一／计划二","w":"H"},{"en":"You're joking.","zh":"你逗我呢。","w":"H"},{"en":"He's a criminal and I love him.","zh":"他是个罪犯，但我爱他（又气又爱）。","w":"H"},{"en":"From now on","zh":"从现在起","w":"H"},{"en":"I'll inform them personally.","zh":"我会亲自通知他们。","w":"H"},{"en":"Pet challenge: describe a pet — real or imaginary — in English: name, looks, favorite food, and one thing it always does wrong. One minute.","zh":"宠物挑战：用英语描述一只宠物——真实或想象的：名字、长相、最爱的食物，和它总做错的一件事。一分钟。","w":"H"},{"en":"Next time: a science project due Friday, a beautiful title page, and one very organized friend. See you on the next walk!","zh":"下一集：周五截止的科学作业、一个精美封面，和一位非常有条理的朋友。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.41,"i":1},{"t":10.2,"i":2},{"t":15.69,"i":3},{"t":25.87,"i":4},{"t":33.52,"i":5},{"t":38.54,"i":6},{"t":44.29,"i":7},{"t":49.81,"i":8},{"t":56.55,"i":9},{"t":61.04,"i":10},{"t":72.01,"i":11},{"t":73.78,"i":12},{"t":78.72,"i":13},{"t":86.26,"i":14},{"t":89.59,"i":15},{"t":92.9,"i":16},{"t":100.94,"i":17},{"t":102.91,"i":18},{"t":110.18,"i":19},{"t":115.94,"i":20},{"t":118.86,"i":21},{"t":124.84,"i":36},{"t":131.61,"i":0},{"t":139.71,"i":1},{"t":144.6,"i":2},{"t":151.57,"i":4},{"t":161.2,"i":5},{"t":167.58,"i":6},{"t":174.88,"i":7},{"t":181.88,"i":8},{"t":190.39,"i":9},{"t":196.14,"i":10},{"t":209.85,"i":11},{"t":212.24,"i":12},{"t":218.52,"i":14},{"t":222.85,"i":15},{"t":227.13,"i":16},{"t":237.22,"i":17},{"t":239.85,"i":18},{"t":248.98,"i":19},{"t":256.29,"i":20},{"t":260.1,"i":22},{"t":265.34,"i":23},{"t":270.83,"i":24},{"t":276.46,"i":25},{"t":281.23,"i":26},{"t":287.78,"i":27},{"t":293.52,"i":28},{"t":303.53,"i":29},{"t":311.38,"i":30},{"t":317.26,"i":31},{"t":325.1,"i":32},{"t":331.03,"i":33},{"t":338.4,"i":34},{"t":350.82,"i":35}],"count":37},{"id":13,"title":"小组作业","sub":"The Group Project","desc":"分工、熬夜和一句“排练过的停顿”","audio":"audio/talk13.mp3","duration":406.6,"size":2440316,"lines":[{"en":"So. The science project. Due Friday. Has anyone... actually started?","zh":"那么。科学作业。周五交。有人……真的开始了吗？","w":"B"},{"en":"I made a title page. It's beautiful. It says 'The Water Cycle' in three colors.","zh":"我做了个封面。很漂亮。用三种颜色写着“水循环”。","w":"A"},{"en":"Guys. GUYS. We have four days. Four. Days.","zh":"各位。各位！我们还有四天。四。天。","w":"C"},{"en":"Group projects: where friendship, deadlines, and different ideas of 'started' collide.","zh":"小组作业：友谊、截止日期，以及对“开始了”的不同理解，在这里发生碰撞。","w":"H"},{"en"

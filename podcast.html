<audio id="au" preload="metadata"></audio>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
/* 发布站点用 ?sharecode= 鉴权，静态资源不带码会 403，这里给所有资源补上 */
const SC = new URLSearchParams(location.search).get('sharecode') || '';
const withSC = u => (SC && !/^(blob:|data:)/i.test(u)) ? u + (u.indexOf('?') > -1 ? '&' : '?') + 'sharecode=' + SC : u;
const fmt = s => { s = Math.max(0, s | 0); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
const LS = (k, v) => {
  if (v === undefined) {
    try { return JSON.parse(localStorage.getItem('wp.' + k) || 'null'); } catch (e) { return null; }
  }
  try { localStorage.setItem('wp.' + k, JSON.stringify(v)); } catch (e) { }
};

let DATA = { lists: {}, total: 0 }, META = { episodes: [] }, TALK = { episodes: [] };
let section = 'word';
let cur = { type: 'word', epId: null, words: [], lines: [], cues: [], idx: 0, dur: 0 };
let playing = false, autoNext = LS('auto') === true, timerMin = 0, timerEnd = 0;
const au = $('#au');

const SRC = () => section === 'talk'
  ? { meta: TALK.episodes, key: 'tp.' }
  : { meta: META.episodes, key: 'p.' };

/* ---------- 载入 ---------- */
async function boot() {
  if (window.__DATA__) { DATA = window.__DATA__.words || DATA; META = window.__DATA__.episodes || META; TALK = window.__DATA__.talks || TALK; }
  else if (window.__WORDS__) { DATA = window.__WORDS__; META = window.__META__; }
  if (!META.episodes || !META.episodes.length) {
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 8000);
      const get = (u) => fetch(u, { signal: ctl.signal }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const [d, m, t] = await Promise.all([
        get(withSC('data/words.json')),
        get(withSC('data/episodes.json')),
        get(withSC('data/talks.json')).catch(() => ({ episodes: [] }))
      ]);
      clearTimeout(to);
      DATA = d; META = m; TALK = t;
    } catch (e) {
      $('#list').innerHTML = '<div class="loading">数据载入失败<br><br>' +
        '本页处于受限预览环境，请改为：<br>' +
        '① 浏览器打开 <b>http://localhost:8765</b><br>' +
        '② 或访问 GitHub 线上地址<br>' +
        '③ 或双击 podcast/start.bat 启动后刷新</div>';
      return;
    }
  }
  if (TALK.episodes && TALK.episodes.length) {
    $('#tab-talk').querySelector('span').textContent = TALK.episodes.length + ' 集 · 情景对话';
  } else {
    $('#tab-talk').style.display = 'none';
    $('#tab-word').style.borderRadius = '12px';
  }
  refreshList();
  setupMedia();
}

function switchTab(s) {
  section = s; refreshList();
  $('#tab-word').classList.toggle('on', s === 'word');
  $('#tab-talk').classList.toggle('on', s === 'talk');
  $('#h-title').textContent = s === 'talk' ? '英语节目 · 散步听' : '初中单词 · 散步听';
  $('#h-sub').textContent = s === 'talk'
    ? '初中水平情景对话 · 边走边听，练听力与口语'
    : '新东方词根+联想记忆法 · 边走边听，一天一单元';
  $('#s-a-l').textContent = s === 'talk' ? '节目集数' : '单词总数';
  $('#s-b-l').textContent = s === 'talk' ? '总时长' : '节目集数';
  $('#s-c-l').textContent = s === 'talk' ? '已听集数' : '已听单词';
  $('#sec-t').textContent = s === 'talk' ? '全部节目' : '全部节目';
}

function progOf(id) {
  const p = LS(SRC().key + id);
  if (!p || !p.i) return 0;
  const ep = SRC().meta.find(e => e.id === id);
  return ep && (ep.count || 0) ? Math.min(1, p.i / ep.count) : 0;
}

function refreshList() {
  const { meta } = SRC();
  if (section === 'talk') {
    const heard = meta.filter(e => (LS('tp.' + e.id) || {}).heard).length;
    $('#s-a').textContent = meta.length;
    $('#s-b').textContent = Math.round(meta.reduce((a, e) => a + (e.duration || 0), 0) / 60) + '′';
    $('#s-c').textContent = heard;
  } else {
    let n = 0;
    for (const e of meta) { const p = LS('p.' + e.id); if (p && p.i) n += Math.min(p.i, e.count); }
    $('#s-a').textContent = DATA.total || 0;
    $('#s-b').textContent = meta.length;
    $('#s-c').textContent = n;
  }
  $('#sec-em').textContent = '共 ' + meta.length + ' 集';

  $('#list').innerHTML = [...meta].sort((a, b) => a.id - b.id).map(e => {
    const p = progOf(e.id);
    const done = p >= 0.98;
    const dur = e.duration ? Math.round(e.duration / 60) + ' 分钟' : '';
    const sub = section === 'talk'
      ? (e.desc || '') + (dur ? ' · ' + dur : '')
      : (e.count ? e.count + ' 词' : '') + (dur ? ' · ' + dur : '');
    return `<div class="ep ${done ? 'done' : ''}" onclick="openEp(${e.id})">
      <div class="num">${done ? '✓' : e.id}</div>
      <div class="info"><b>${e.title}</b><span>${sub}</span>
        <div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div></div>
      <div class="go">›</div></div>`;
  }).join('') || '<div class="loading">暂无内容</div>';

  const last = LS('last');
  if (last && last.s === section && meta.some(e => e.id === last.id)) {
    const e = meta.find(x => x.id === last.id);
    $('#resume').classList.remove('hide');
    $('#r-title').textContent = '继续 ' + e.title;
    const p = LS(SRC().key + last.id) || {};
    $('#r-sub').textContent = section === 'talk'
      ? '上次听到 ' + fmt(p.t || 0)
      : '听到第 ' + ((p.i || 0) + 1) + ' 个单词';
  } else $('#resume').classList.add('hide');
}
function resumePlay() { const l = LS('last'); if (l) openEp(l.id, true); }

/* ---------- 打开某集 ---------- */
async function openEp(id, resume) {
  const { meta, key } = SRC();
  const ep = meta.find(e => e.id === id);
  if (!ep) return;
  cur = {
    type: section, epId: id,
    words: section === 'word' ? (DATA.lists[String(id)] || []) : [],
    lines: section === 'talk' ? (ep.lines || []) : [],
    cues: ep.cues || [], idx: 0, dur: ep.duration || 0
  };
  const p = LS(key + id) || { t: 0, i: 0 };
  cur.idx = resume ? (p.i || 0) : 0;

  $('#p-title').textContent = ep.title;
  $('#p-sub').textContent = section === 'talk' ? (ep.sub || '') : (ep.count + ' 个单词');
  $('#c-word').classList.toggle('hide', section !== 'word');
  $('#c-talk').classList.toggle('hide', section !== 'talk');
  $('#player').classList.add('on');
  $('#t-dur').textContent = cur.dur ? fmt(cur.dur) : '--:--';
  $('#t-tag').textContent = ep.sub || '';

  setMode(ep.audio ? 'audio' : 'live', true);
  render();
  buildTranscript();
  if (cur.type === 'word' || cur.mode === 'audio') {
    if (!ep.audio) { setMode('live'); return; }
    au.removeAttribute('data-remote');
    au.src = await audioSrc(ep);
    au.load();
    if (cur.cues[cur.idx]) au.currentTime = cur.cues[cur.idx].t;
    play();
  } else {
    livePlay();
  }
  markOffline();
}

function closePlayer() { pause(); $('#player').classList.remove('on'); refreshList(); }

/* ---------- 音频模式 ---------- */
function play() {
  if (cur.mode === 'live') return livePlay();
  playing = true; $('#btn-play').textContent = '❚❚';
  au.play().catch(() => { toast('音频未就绪，切换为朗读模式'); setMode('live'); livePlay(); });
  updateMedia();
}
function pause() {
  playing = false; $('#btn-play').textContent = '▶';
  au.pause(); liveStop(); saveProgress(); updateMedia(); flushStudy(true);
}
function togglePlay() { playing ? pause() : play(); }

const durOf = () => cur.dur || (au.duration && isFinite(au.duration) ? au.duration : 0);

function onTime() {
  if (dragging) return;
  const t = au.currentTime, d = durOf();
  accStudy(t);
  syncCue(t);
  $('#t-cur').textContent = fmt(t);
  setBar(d ? t / d : 0);
}
au.addEventListener('timeupdate', onTime);
au.addEventListener('loadedmetadata', () => {
  if (!cur.dur && au.duration) { $('#t-dur').textContent = fmt(au.duration); }
});
au.addEventListener('ended', () => {
  saveProgress(true);
  if (autoNext) {
    const { meta } = SRC();
    const i = meta.findIndex(e => e.id === cur.epId);
    if (i >= 0 && i + 1 < meta.length) { pause(); openEp(meta[i + 1].id); toast('继续下一集'); return; }
  }
  pause(); toast('本集听完了');
});
au.addEventListener('error', () => { if (playing) { setMode('live'); livePlay(); } });

function syncCue(t) {
  const c = cur.cues;
  if (!c.length) return;
  let i = 0;
  for (let k = 0; k < c.length; k++) if (c[k].t <= t + .05) i = k; else break;
  const idx = c[i].i;
  if (idx !== cur.idx) { cur.idx = idx; render(); }
}

function seekTo(i) {
  const n = cur.type === 'talk' ? cur.lines.length : cur.words.length;
  i = Math.max(0, Math.min(i, n - 1));
  cur.idx = i; render();
  if (cur.mode === 'audio') {
    if (cur.cues[i]) {
      au.currentTime = cur.cues[i].t;
      const d = durOf(); if (d) setBar(au.currentTime / d);
    }
  } else livePlay();
  saveProgress();
}
function prev() { seekTo(cur.idx - 1); }
function next() { seekTo(cur.idx + 1); }

/* ---------- 进度条拖动（rAF 节流 + 加大命中区） ---------- */
let dragging = false, dragT = 0, dragP = 0, raf = 0;
const pg = $('#pg'), bub = $('#pg-bub'), pgw = $('#pgwrap');
function setBar(p) {
  p = Math.max(0, Math.min(1, p || 0));
  $('#pg-i').style.width = (p * 100) + '%';
  $('#pg-dot').style.left = (p * 100) + '%';
}
function paintDrag() {
  raf = 0;
  setBar(dragP);
  bub.classList.add('on');
  bub.textContent = fmt(dragT);
  bub.style.left = (6 + dragP * 88) + '%';   // 贴边时气泡不出屏
}
function dragAt(clientX) {
  const r = pg.getBoundingClientRect();
  dragP = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  dragT = dragP * durOf();
  if (!raf) raf = requestAnimationFrame(paintDrag);
}
pgw.addEventListener('pointerdown', e => {
  if (!durOf()) return;
  const r = pg.getBoundingClientRect();
  if (e.clientY < r.top - 24 || e.clientY > r.bottom + 24) return;   // 命中区放宽到 ±24px
  dragging = true;
  pgw.classList.add('dragging');
  try { pgw.setPointerCapture(e.pointerId); } catch (_) { }
  dragAt(e.clientX);
  e.preventDefault();
});
pgw.addEventListener('pointermove', e => { if (dragging) { e.preventDefault(); dragAt(e.clientX); } });
function endDrag() {
  if (!dragging) return;
  dragging = false;
  pgw.classList.remove('dragging');
  bub.classList.remove('on');
  if (cur.mode === 'audio' && durOf()) au.currentTime = dragT;
  saveProgress();
}
pgw.addEventListener('pointerup', endDrag);
pgw.addEventListener('pointercancel', endDrag);
pgw.addEventListener('lostpointercapture', endDrag);
$('#pg').addEventListener('click', e => e.stopPropagation());

/* 缓冲状态提示 */
au.addEventListener('waiting', () => { $('#t-buf').textContent = '缓冲中…'; });
['playing', 'canplay', 'seeked'].forEach(ev =>
  au.addEventListener(ev, () => { $('#t-buf').textContent = ''; }));

/* ---------- 实时朗读模式 ---------- */
let liveOn = false;
const synth = window.speechSynthesis;
let voices = [];
if (synth) { voices = synth.getVoices() || []; synth.onvoiceschanged = () => voices = synth.getVoices(); }
const pick = lang => voices.find(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(lang));
function speak(text, lang, rate) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate || 1;
    const v = pick(lang); if (v) u.voice = v;
    u.onend = res; u.onerror = res;
    synth.speak(u);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function liveRun(i) {
  if (!liveOn) return;
  if (cur.type === 'talk') {
    if (i >= cur.lines.length) { pause(); toast('本集读完了'); return; }
    cur.idx = i; render();
    const L = cur.lines[i];
    if (L.en) { await speak(L.en, 'en-US', .82); if (!liveOn) return; await sleep(500); }
    afterLive(i);
    await sleep(900);
    liveRun(i + 1);
  } else {
    if (i >= cur.words.length) { pause(); toast('本集读完了'); return; }
    cur.idx = i; render();
    const w = cur.words[i];
    await speak(w.sw + '. ' + w.sw, 'en-US', .85); if (!liveOn) return;
    await sleep(700);
    let zh = w.d || ''; if (w.exz) zh += '。例句：' + w.exz;
    await speak(zh, 'zh-CN', 1.05); if (!liveOn) return;
    await sleep(400);
    if (w.ex) { await speak(w.ex, 'en-US', .95); if (!liveOn) return; }
    afterLive(i);
    await sleep(1600);
    liveRun(i + 1);
  }
}
function afterLive(i) {
  saveProgress();
  const n = cur.type === 'talk' ? cur.lines.length : cur.words.length;
  setBar((i + 1) / n);
  $('#t-cur').textContent = (i + 1) + ' / ' + n;
}
function livePlay() {
  if (!synth) { toast('当前浏览器不支持朗读'); return; }
  liveOn = true; playing = true; $('#btn-play').textContent = '❚❚';
  synth.cancel(); liveRun(cur.idx); updateMedia();
}
function liveStop() { liveOn = false; if (synth) synth.cancel(); }
function setMode(m, silent) {
  cur.mode = m;
  $('#m-mode').textContent = m === 'audio' ? '音频' : '朗读';
  if (m === 'audio') liveStop(); else au.pause();
  if (!silent) {
    playing = false;
    if (m === 'live') { render(); livePlay(); }
    else play();
  }
}
function toggleMode() {
  const ep = SRC().meta.find(e => e.id === cur.epId);
  if (!ep || !ep.audio) { toast('该集音频尚未生成，只能用朗读'); return; }
  setMode(cur.mode === 'audio' ? 'live' : 'audio');
}

/* ---------- 渲染 ---------- */
const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let transOpen = false;
function buildTranscript() {
  const tr = $('#transcript');
  if (cur.type !== 'talk') { tr.classList.add('hide'); $('#chip-trans').style.display = 'none'; return; }
  $('#chip-trans').style.display = '';
  tr.innerHTML = cur.lines.map((L, i) =>
    `<div class="tl" id="tr-${i}"><div class="en">${esc(L.en)}</div>` +
    (L.zh ? `<div class="zh">${esc(L.zh)}</div>` : '') + `</div>`).join('');
  tr.classList.toggle('hide', !transOpen);
}
function toggleTrans() {
  transOpen = !transOpen;
  $('#chip-trans').classList.toggle('on', transOpen);
  $('#transcript').classList.toggle('hide', !transOpen);
  markTrans();
}
function markTrans() {
  document.querySelectorAll('#transcript .tl.on').forEach(x => x.classList.remove('on'));
  const el = document.getElementById('tr-' + cur.idx);
  if (el && transOpen) {
    el.classList.add('on');
    el.scrollIntoView({ block: 'nearest' });
  }
}
function render() {
  if (cur.type === 'talk') {
    const L = cur.lines[cur.idx];
    if (!L) return;
    $('#t-en').textContent = L.en || '';
    $('#t-en').style.display = L.en ? '' : 'none';
    $('#t-idx').textContent = (cur.idx + 1) + ' / ' + cur.lines.length;
    markTrans();
  } else {
    const w = cur.words[cur.idx];
    if (!w) return;
    $('#w-en').textContent = w.w;
    $('#w-ph').textContent = w.ph ? '[' + w.ph + ']' : '';
    $('#w-cn').textContent = w.raw || w.d || '';
    if (w.ex) {
      $('#w-ex').classList.remove('hide');
      $('#w-ex-en').textContent = w.ex;
      $('#w-ex-zh').textContent = w.exz || '';
    } else $('#w-ex').classList.add('hide');
    $('#w-idx').textContent = (cur.idx + 1) + ' / ' + cur.words.length;
  }
}

function saveProgress(finished) {
  if (cur.epId == null) return;
  const key = SRC().key + cur.epId;
  const n = cur.type === 'talk' ? cur.lines.length : cur.words.length;
  const p = LS(key) || {};
  p.i = cur.idx; p.t = cur.mode === 'audio' ? au.currentTime : 0;
  if (finished || (cur.idx >= n - 1 && cur.type === 'talk')) p.heard = true;
  LS(key, p);
  LS('last', { id: cur.epId, s: section });
}

/* ---------- 学习时间统计 ---------- */
const pad2 = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
let stPending = 0, stFlushAt = 0;

function studyDays() {
  const s = LS('study');
  return (s && s.days) ? s.days : {};
}
function flushStudy(force) {
  const now = Date.now();
  if (!force && now - stFlushAt < 5000) return;
  if (stPending > 0) {
    const days = studyDays();
    const k = dayKey();
    days[k] = (days[k] || 0) + stPending;
    LS('study', { days });
    stPending = 0;
  }
  stFlushAt = now;
  renderStudy();
}
function addStudy(sec) {
  if (!(sec > 0)) return;
  stPending += sec;
  flushStudy(false);
}
function renderStudy() {
  const days = studyDays();
  const today = dayKey();
  const todaySec = (days[today] || 0) + stPending;
  $('#st-today').textContent = Math.floor(todaySec / 60);

  // 连续天数：今天不足 1 分钟则从昨天开始算
  let streak = 0;
  const dd = new Date();
  if (todaySec < 60) dd.setDate(dd.getDate() - 1);
  for (let i = 0; i < 400; i++) {
    if ((days[dayKey(dd)] || 0) >= 60) { streak++; dd.setDate(dd.getDate() - 1); } else break;
  }
  $('#st-streak').textContent = streak;

  const total = Object.values(days).reduce((a, b) => a + b, 0) + stPending;
  const h = total / 3600;
  $('#st-total').textContent = h >= 10 ? Math.round(h) : Math.round(h * 10) / 10;

  const week = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = dayKey(d);
    week.push({ v: (days[k] || 0) + (i === 0 ? stPending : 0), label: '日一二三四五六'[d.getDay()], i });
  }
  const max = Math.max(60, ...week.map(x => x.v));
  $('#st-bars').innerHTML = week
    .map(x => `<i class="${x.i === 0 ? 'on' : ''}" style="height:${Math.max(4, Math.round(50 * x.v / max))}px"></i>`)
    .join('');
  $('#st-days').innerHTML = week
    .map(x => `<span class="${x.i === 0 ? 'on' : ''}">${x.i === 0 ? '今天' : x.label}</span>`)
    .join('');
}
/* 音频播放时按实际播放位置增量计时 */
let stLastPos = 0;
function accStudy(t) {
  if (!playing || dragging) { stLastPos = t; return; }
  const d = t - stLastPos;
  if (d > 0 && d < 1.5) addStudy(d);
  stLastPos = t;
}
/* 朗读模式没有进度事件，用 1 秒心跳 */
setInterval(() => { if (playing && cur.mode !== 'audio') addStudy(1); }, 1000);

/* ---------- 控制项 ---------- */
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-rate]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  au.playbackRate = parseFloat(b.dataset.rate);
});
function toggleAuto() {
  autoNext = !autoNext; LS('auto', autoNext);
  $('#chip-auto').classList.toggle('on', autoNext);
  toast(autoNext ? '连播开启：一集结束自动下一集' : '连播关闭');
}
function cycleTimer() {
  const opts = [0, 10, 20, 30, 45];
  timerMin = opts[(opts.indexOf(timerMin) + 1) % opts.length];
  $('#chip-timer').classList.toggle('on', timerMin > 0);
  $('#chip-timer').textContent = timerMin ? timerMin + ' 分钟' : '定时';
  clearTimeout(timerEnd);
  if (timerMin) timerEnd = setTimeout(() => { pause(); toast('定时结束，下次再听'); }, timerMin * 60000);
  toast(timerMin ? `播放 ${timerMin} 分钟后自动停止` : '已取消定时');
}

/* ---------- 离线缓存 ---------- */
async function audioStore() { try { return await caches.open('walkpod-audio'); } catch (e) { return null; } }
async function audioSrc(ep) {
  const c = await audioStore();
  if (c) { const m = await c.match(ep.audio); if (m) return URL.createObjectURL(await m.blob()); }
  return withSC(ep.audio);
}

/* 双击本地 html 时若同目录没有音频，自动回退到在线音频 */
const REMOTE_AUDIO = 'https://walk-english-words.app.workbuddy.host/';
au.addEventListener('error', () => {
  const ep = SRC().meta.find(e => e.id === cur.epId);
  if (!ep || !ep.audio || au.dataset.remote === '1') return;
  if (/^https?:/.test(ep.audio)) return;
  au.dataset.remote = '1';
  const t = au.currentTime || 0, wasPlaying = playing;
  au.src = REMOTE_AUDIO + ep.audio + '?sharecode=DE7IOZTPLH';
  au.addEventListener('loadedmetadata', () => {
    if (t > 0) au.currentTime = t;
    if (wasPlaying) au.play().catch(() => {});
  }, { once: true });
  toast('本地没有音频文件，已切换到在线音频');
});
async function markOffline() {
  const ep = SRC().meta.find(e => e.id === cur.epId);
  const c = await audioStore();
  let has = false;
  if (c && ep && ep.audio) has = !!(await c.match(ep.audio));
  const b = $('#chip-off');
  b.classList.toggle('on', has); b.textContent = has ? '已离线' : '离线';
  b.style.display = (ep && ep.audio) ? '' : 'none';
}
async function cacheCurrent() {
  const ep = SRC().meta.find(e => e.id === cur.epId);
  if (!ep || !ep.audio) { toast('该集无音频文件'); return; }
  const c = await audioStore();
  if (!c) { toast('当前环境不支持离线缓存'); return; }
  try {
    if (await c.match(ep.audio)) { if (!confirm('已缓存过本集，重新下载一次？')) return; }
    else toast('开始下载 · 约 ' + (ep.size / 1024 / 1024).toFixed(1) + ' MB');
    const r = await fetch(withSC(ep.audio));
    if (!r.ok) throw 0;
    await c.put(ep.audio, r.clone());
    toast('已缓存，出门断网也能听');
    au.src = await audioSrc(ep); au.load();
  } catch (e) { toast('下载失败，请联网后重试'); }
  markOffline();
}

/* ---------- 系统播控 ---------- */
function setupMedia() {
  if (!('mediaSession' in navigator)) return;
  [['play', () => play()], ['pause', () => pause()],
  ['previoustrack', () => prev()], ['nexttrack', () => next()]]
    .forEach(([a, f]) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) { } });
}
function updateMedia() {
  if (!('mediaSession' in navigator)) return;
  const ep = SRC().meta.find(e => e.id === cur.epId);
  navigator.mediaSession.metadata = new MediaMetadata({
    title: ep ? ep.title : '散步听',
    artist: cur.type === 'talk' ? '英语节目' : '第 ' + (cur.idx + 1) + ' 词',
    album: '初中英语 · 散步听'
  });
  navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
}

let tt;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200);
}

document.addEventListener('keydown', e => {
  if (!$('#player').classList.contains('on')) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveProgress(); flushStudy(true); } });
window.addEventListener('pagehide', () => { saveProgress(); flushStudy(true); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });

boot();
setBar(0);
renderStudy();
</script>
</body>

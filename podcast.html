:"Okay, divide and conquer. Emma, you're the artist — posters and drawings.","zh":"好，分头行动。Emma，你是画家——海报和图都归你。","w":"C"},{"en":"On it. I'll do the water cycle diagram tonight.","zh":"马上做。我今晚就把水循环图画出来。","w":"B"},{"en":"Jake, you're good at talking, so the presentation is yours.","zh":"Jake，你能说会道，展示讲解归你。","w":"C"},{"en":"Define 'good at talking.'","zh":"“能说会道”怎么定义？","w":"A"},{"en":"You talked the PE teacher into giving us extra game time. Twice. You qualify.","zh":"你说服体育老师给我们加了游戏时间。两次。你够格。","w":"C"},{"en":"That's fair. Okay, but I need notes to talk from.","zh":"行吧。但我需要讲稿提纲。","w":"A"},{"en":"I'll write the script tonight. Everyone, same place, tomorrow lunch, bring your parts.","zh":"我今晚写稿。各位，明天午饭老地方，带上各自的部分。","w":"C"},{"en":"What if something goes wrong?","zh":"万一出问题怎么办？","w":"B"},{"en":"Something always goes wrong. That's why we have three days of backup time.","zh":"总会出问题的。所以我们留了三天备用时间。","w":"C"},{"en":"Leo, that's... genuinely wise.","zh":"Leo，这……真是智慧。","w":"A"},{"en":"I have two older sisters. I've survived many group projects.","zh":"我有两个姐姐。我在很多小组作业里活下来了。","w":"C"},{"en":"Presentation day. Nerves, a dramatic pause, and a very well-earned grade.","zh":"展示日。紧张、一个戏剧性停顿，和一份实至名归的成绩。","w":"H"},{"en":"Nervous?","zh":"紧张吗？","w":"B"},{"en":"My hands are cold and my brain is empty. Normal levels of nervous.","zh":"手是冷的，脑子是空的。标准紧张水平。","w":"A"},{"en":"You'll be fine. Just remember: slow down, look at them, and if you forget — look at me. I'll mouth the words.","zh":"你没问题。记住：放慢、看着他们、忘了的话——看我。我会口型提示你。","w":"C"},{"en":"You wrote the script. You know it by heart, don't you?","zh":"稿子是你写的。你都能背下来了吧？","w":"A"},{"en":"Leo never forgets the script.","zh":"Leo 从不忘稿。","w":"C"},{"en":"And we got an A! An A, guys! Mr. Lee said our teamwork was excellent.","zh":"我们得了 A！A 啊各位！李老师说我们的团队合作非常出色。","w":"B"},{"en":"Teamwork — and Jake's dramatic pause before the big word: evaporation.","zh":"团队合作——还有 Jake 在关键词“蒸发”之前那个戏剧性停顿。","w":"C"},{"en":"I practiced that pause in the mirror. Twice.","zh":"那个停顿我对着镜子练过。两次。","w":"A"},{"en":"We could tell.","zh":"我们看得出来。","w":"B"},{"en":"Before we slow down — how to divide the work like a pro.","zh":"放慢之前——像老手一样分工。","w":"H"},{"en":"Has anyone actually started?","zh":"有人真的开始了吗？","w":"H"},{"en":"Divide and conquer.","zh":"分头行动。","w":"H"},{"en":"The presentation is yours.","zh":"展示讲解归你。","w":"H"},{"en":"What if something goes wrong?","zh":"万一出问题怎么办？","w":"H"},{"en":"Due Friday.","zh":"周五截止。","w":"H"},{"en":"Divide and conquer.","zh":"分头行动。","w":"H"},{"en":"On it.","zh":"马上做。","w":"H"},{"en":"Define ...","zh":"……怎么定义？（幽默反问）","w":"H"},{"en":"That's fair.","zh":"行吧，有道理。","w":"H"},{"en":"Something always goes wrong.","zh":"总会出问题的。","w":"H"},{"en":"You know it by heart.","zh":"你都能背下来了。","w":"H"},{"en":"We could tell.","zh":"我们看得出来。","w":"H"},{"en":"Team challenge: in English, explain your role in your last group task — what you did, what was hard, and what you'd do differently.","zh":"团队挑战：用英语讲你上次小组任务中的角色——你做了什么、难在哪、下次会怎么改。","w":"H"},{"en":"Next time: seven hours of screen time, one very honest friend, and a deal with Mom. See you on the next walk!","zh":"下一集：七小时屏幕时间、一位非常诚实的朋友，和一份与妈妈的协议。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.22,"i":1},{"t":13.56,"i":2},{"t":23.18,"i":3},{"t":30.12,"i":4},{"t":38.01,"i":5},{"t":42.45,"i":6},{"t":48.06,"i":7},{"t":50.27,"i":8},{"t":59.07,"i":9},{"t":63.25,"i":10},{"t":71.6,"i":11},{"t":74.16,"i":12},{"t":81.19,"i":13},{"t":84.48,"i":14},{"t":91.17,"i":15},{"t":98.62,"i":16},{"t":100.34,"i":17},{"t":105.64,"i":18},{"t":116.44,"i":19},{"t":120.54,"i":20},{"t":124.09,"i":21},{"t":130.81,"i":22},{"t":137.22,"i":23},{"t":141.08,"i":24},{"t":142.95,"i":25},{"t":147.99,"i":40},{"t":154.76,"i":0},{"t":163.87,"i":1},{"t":171.85,"i":2},{"t":183.91,"i":4},{"t":193.84,"i":5},{"t":199.49,"i":6},{"t":206.6,"i":7},{"t":209.54,"i":8},{"t":220.57,"i":9},{"t":225.94,"i":10},{"t":236.41,"i":11},{"t":239.78,"i":12},{"t":248.65,"i":13},{"t":252.89,"i":14},{"t":261.32,"i":16},{"t":263.66,"i":17},{"t":270.4,"i":18},{"t":283.9,"i":19},{"t":289.14,"i":20},{"t":293.71,"i":21},{"t":302.2,"i":22},{"t":310.3,"i":23},{"t":315.28,"i":24},{"t":317.78,"i":26},{"t":323.22,"i":27},{"t":328.09,"i":28},{"t":333.5,"i":29},{"t":338.61,"i":30},{"t":344.37,"i":31},{"t":350.87,"i":32},{"t":355.91,"i":33},{"t":361.31,"i":34},{"t":367.12,"i":35},{"t":374.58,"i":36},{"t":381.02,"i":37},{"t":386.9,"i":38},{"t":396.74,"i":39}],"count":41},{"id":14,"title":"手机保卫战","sub":"Screen Time Deal","desc":"七小时的使用报告和一份谈判方案","audio":"audio/talk14.mp3","duration":384.2,"size":2305676,"lines":[{"en":"She took my phone, Leo. She said, 'One hour a day, that's it.' I'm going to lose my mind.","zh":"她把手机没收了，Leo。她说“每天一小时，就这些。”我要疯了。","w":"A"},{"en":"Your mom? Why? What happened?","zh":"你妈？为什么？发生什么了？","w":"C"},{"en":"She checked my screen time report. Seven hours on Sunday. SEVEN.","zh":"她看了我的屏幕使用报告。周日七小时。七小时。","w":"A"},{"en":"Phones: tiny rectangles that eat whole weekends. Today — one boy, one report card of shame, and one negotiation.","zh":"手机：吃掉整个周末的小方块。今天——一个男孩、一份“耻辱报告”，和一场谈判。","w":"H"},{"en":"On a school night? Jake. Buddy.","zh":"还是上学日？Jake。兄弟。","w":"C"},{"en":"It was raining! What was I supposed to do, read?","zh":"那天下雨啊！不然我干嘛，看书吗？","w":"A"},{"en":"Honestly? Kind of, yeah.","zh":"说实话？对，就是。","w":"C"},{"en":"You sound like my mom. This is a betrayal.","zh":"你说话像我妈。这是背叛。","w":"A"},{"en":"It's not betrayal, it's math. Seven hours is more than a full school day. Even I know that's too much — and I once watched TV for six hours straight.","zh":"这不是背叛，这是数学。七小时比一整个上学日还长。连我都知道太多了——虽然我最近也连着看了六小时电视。","w":"C"},{"en":"So what do I do? She won't change her mind. She never changes her mind.","zh":"那我怎么办？她不会改主意的。她从不改主意。","w":"A"},{"en":"Then make her a deal. Show her a plan. Homework first, phone after dinner, one hour, and the phone sleeps in the living room at nine.","zh":"那就跟她谈个协议。给她看个计划。作业优先、晚饭后用手机、一小时、九点手机“睡”在客厅。","w":"C"},{"en":"And if she says no?","zh":"那她要说不呢？","w":"A"},{"en":"Then you say: 'Deal or no deal?' — and you look her in the eye.","zh":"那你就说：“协议还是不协议？”——然后直视她的眼睛。","w":"C"},{"en":"That's a TV show, Leo.","zh":"那是档电视节目，Leo。","w":"A"},{"en":"It's also a negotiation. Trust me.","zh":"它也是一种谈判。相信我。","w":"C"},{"en":"One week later. The update — and honestly, nobody expects this one.","zh":"一周后。最新进展——说真的，谁都没想到。","w":"H"},{"en":"Update: the deal worked. Mostly.","zh":"更新：协议生效了。基本上。","w":"A"},{"en":"Mostly?","zh":"基本上？","w":"C"},{"en":"One hour a day on school nights, two on weekends. And guess what — I finished a whole book. A whole one.","zh":"上学日每天一小时，周末两小时。你猜怎么着——我读完了一整本书。一整本。","w":"A"},{"en":"Look at you. Growth.","zh":"看看你。成长了。","w":"C"},{"en":"Don't tell anyone I said this, but... I sleep better. Like, actually wake up rested.","zh":"别跟别人说我说的，但是……我睡得更好了。真的能睡到自然醒那种。","w":"A"},{"en":"The secret's out. Books: better than seven hours of scrolling.","zh":"秘密曝光了。书：胜过七小时刷屏。","w":"C"},{"en":"Never quote me on that.","zh":"这话可别说是我讲的。","w":"A"},{"en":"Before we slow down — the language of making a deal.","zh":"放慢之前——谈协议的语言。","w":"H"},{"en":"One hour a day, that's it.","zh":"每天一小时，就这些。","w":"H"},{"en":"It's not betrayal, it's math.","zh":"这不是背叛，这是数学。","w":"H"},{"en":"Then make her a deal.","zh":"那就跟她谈个协议。","w":"H"},{"en":"Deal or no deal?","zh":"协议成不成？","w":"H"},{"en":"You will not believe...","zh":"你绝对不敢相信……","w":"H"},{"en":"She never changes her mind.","zh":"她从不改主意。","w":"H"},{"en":"It's not betrayal, it's math.","zh":"这不是背叛，是数学。","w":"H"},{"en":"Make her a deal.","zh":"跟她谈个协议。","w":"H"},{"en":"Trust me.","zh":"相信我。","w":"H"},{"en":"Guess what —","zh":"你猜怎么着——","w":"H"},{"en":"The secret's out.","zh":"秘密曝光了。","w":"H"},{"en":"Never quote me on that.","zh":"别说是我说的。","w":"H"},{"en":"Make your own screen-time deal — say it in English: homework first, phone after dinner, one hour, phone sleeps at nine. Out loud, tonight.","zh":"给自己定一份屏幕时间协议——用英语说：作业优先、晚饭后用手机、一小时、九点手机睡觉。今晚大声说。","w":"H"},{"en":"Next time: the school talent show, a secret solo, and a USB stick full of stage lights. See you on the next walk!","zh":"下一集：校园才艺秀、一个秘密独奏，和一个装满舞台灯光的 U 盘。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.74,"i":1},{"t":12.26,"i":2},{"t":17.47,"i":3},{"t":27.88,"i":4},{"t":33.62,"i":5},{"t":37.22,"i":6},{"t":41.75,"i":7},{"t":45.23,"i":8},{"t":58.35,"i":9},{"t":63.82,"i":10},{"t":75.68,"i":11},{"t":77.74,"i":12},{"t":84.07,"i":13},{"t":86.47,"i":14},{"t":91.61,"i":15},{"t":98.78,"i":16},{"t":102.21,"i":17},{"t":104.47,"i":18},{"t":112.34,"i":19},{"t":116.32,"i":20},{"t":122.87,"i":21},{"t":129.52,"i":22},{"t":131.67,"i":23},{"t":136.55,"i":38},{"t":143.32,"i":0},{"t":151.83,"i":1},{"t":158.82,"i":2},{"t":165.44,"i":4},{"t":172.67,"i":5},{"t":177.32,"i":6},{"t":183.11,"i":7},{"t":187.61,"i":8},{"t":203.99,"i":9},{"t":210.92,"i":10},{"t":225.71,"i":11},{"t":228.44,"i":12},{"t":236.44,"i":13},{"t":239.6,"i":14},{"t":246.11,"i":16},{"t":250.56,"i":17},{"t":253.53,"i":18},{"t":263.43,"i":19},{"t":268.53,"i":20},{"t":276.8,"i":21},{"t":285.18,"i":22},{"t":288.03,"i":24},{"t":293.73,"i":25},{"t":299.58,"i":26},{"t":304.47,"i":27},{"t":309.26,"i":28},{"t":315.6,"i":29},{"t":323.06,"i":30},{"t":331.36,"i":31},{"t":337.44,"i":32},{"t":342.98,"i":33},{"t":348.64,"i":34},{"t":354.96,"i":35},{"t":361.94,"i":36},{"t":373.76,"i":37}],"count":39},{"id":15,"title":"才艺秀之夜","sub":"The Talent Show","desc":"秘密排练、全场大合唱和半根手指的颤抖","audio":"audio/talk15.mp3","duration":404.5,"size":2427644,"lines":[{"en":"Two days until the talent show and Leo has a SOLO. Did you know? Did HE know?","zh":"还有两天就才艺秀了，Leo 有个独奏。你知道吗？他自己知道吗？","w":"B"},{"en":"He said, and I quote, 'it's a small thing, no big deal.' He's been practicing in the music room every lunch this week.","zh":"他说，原话是：“小事一桩。”他这周每天中午都在音乐室练习。","w":"A"},{"en":"That is not 'small thing' energy.","zh":"这可不像“小事一桩”的能量。","w":"B"},{"en":"Stage fright, secret rehearsals, and one song the whole school remembers. Today: the talent show.","zh":"怯场、秘密排练，和一首全校都记得的歌。今天：才艺秀。","w":"H"},{"en":"It's just a small thing. Two minutes. I play, people clap, we go home.","zh":"就是件小事。两分钟。我弹，大家鼓掌，我们回家。","w":"C"},{"en":"Leo. You downloaded stage lights. On a USB stick. That is not 'small thing' energy.","zh":"Leo。你下载了舞台灯光。在一个 U 盘里。这可完全不是“小事”的能量。","w":"A"},{"en":"What are you playing? Tell us, or we find out on stage like everyone else.","zh":"你要弹什么？快说，不然我们就跟所有人一样在台下知道了。","w":"B"},{"en":"Fine. It's the song from that cartoon we all watched in fifth grade.","zh":"好吧。是我们五年级都看过的那部动画片里的歌。","w":"C"},{"en":"No. You're kidding. The one with—","zh":"不。你逗我。那首有——","w":"A"},{"en":"Yes. The theme song. The FULL theme song.","zh":"对。主题曲。完整版主题曲。","w":"C"},{"en":"The whole school is going to lose their minds.","zh":"全校都会疯掉的。","w":"B"},{"en":"That's the plan. But listen — if I mess up, no one mentions it. Ever.","zh":"计划就是这样。但听着——要是我弹砸了，谁都不许提。永远不许。","w":"C"},{"en":"Deal. And if you don't mess up?","zh":"成交。那要是你没砸呢？","w":"A"},{"en":"Then you can mention it. Forever, actually.","zh":"那你们就可以提。而且是永远地提。","w":"C"},{"en":"Show night. The lights go down. And then — you'll hear what happened, straight from the people who were there.","zh":"演出之夜。灯光暗下。然后——你们会从在场的当事人嘴里，听到发生了什么。","w":"H"},{"en":"YOU WERE AMAZING. The teachers were singing along! THE TEACHERS, LEO.","zh":"你太棒了！老师们都跟着唱了！老师们啊，Leo！","w":"B"},{"en":"My hands are still shaking. Look. Look at them.","zh":"我的手还在抖。看。看看。","w":"C"},{"en":"You didn't miss a single note. Not one.","zh":"你一个音都没错。一个都没有。","w":"A"},{"en":"I missed half a note in the middle.","zh":"中间错了半个音。","w":"C"},{"en":"Nobody noticed. Half a note doesn't count.","zh":"没人发现。半个音不算。","w":"B"},{"en":"Okay, but now the real question: what do you play NEXT year?","zh":"好，但真正的问题是：明年你弹什么？","w":"A"},{"en":"Next year... I have an idea. But I'll need a singer.","zh":"明年……我有个想法。但我需要一个歌手。","w":"C"},{"en":"Leo, neither of us can sing.","zh":"Leo，我们俩都不会唱歌。","w":"B"},{"en":"Jake. That was not a no.","zh":"Jake。那可不算拒绝。","w":"C"},{"en":"Before we slow things down — how to talk someone off (and onto) a stage.","zh":"放慢之前——怎么把人从台上劝下来（以及劝上去）。","w":"H"},{"en":"It's a small thing, no big deal.","zh":"小事一桩，没什么大不了。","w":"H"},{"en":"Tell us, or we find out on stage.","zh":"快说，不然我们就在台下知道了。","w":"H"},{"en":"Nobody noticed.","zh":"没人发现。","w":"H"},{"en":"That was not a no.","zh":"那可不算拒绝。","w":"H"},{"en":"Did you know? Did HE know?","zh":"你知道吗？他自己知道吗？","w":"H"},{"en":"and I quote","zh":"原话是","w":"H"},{"en":"lose their minds","zh":"疯狂／激动坏了","w":"H"},{"en":"If I mess up, no one mentions it.","zh":"我搞砸了谁也不许提。","w":"H"},{"en":"Deal.","zh":"成交。","w":"H"},{"en":"My hands are still shaking.","zh":"我的手还在抖。","w":"H"},{"en":"Half a note doesn't count.","zh":"半个音不算数。","w":"H"},{"en":"That was not a no.","zh":"那可不算拒绝。","w":"H"},{"en":"Bravery challenge: name one thing you're a little scared to try, in English — and one tiny step you'll take this week. Say it out loud.","zh":"勇气挑战：用英语说出一件你有点不敢尝试的事——以及这周你会迈出的一小步。大声说。","w":"H"},{"en":"Next time: winter holiday, forty dumplings from Grandma, and a family tradition of losing at video games. See you on the next walk!","zh":"下一集：寒假、奶奶的四十个饺子，和一个全家打游戏必输的传统。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.41,"i":1},{"t":15.33,"i":2},{"t":18.52,"i":3},{"t":27.5,"i":4},{"t":36.23,"i":5},{"t":43.5,"i":6},{"t":49.57,"i":7},{"t":56.39,"i":8},{"t":59.72,"i":9},{"t":66.39,"i":10},{"t":70.01,"i":11},{"t":78.34,"i":12},{"t":81.19,"i":13},{"t":86.62,"i":14},{"t":96.22,"i":15},{"t":102.62,"i":16},{"t":109.17,"i":17},{"t":112.48,"i":18},{"t":115.89,"i":19},{"t":120.09,"i":20},{"t":124.55,"i":21},{"t":131.24,"i":22},{"t":134.39,"i":23},{"t":138.85,"i":24},{"t":145.35,"i":39},{"t":152.13,"i":0},{"t":160.2,"i":1},{"t":171.4,"i":2},{"t":175.51,"i":4},{"t":186.47,"i":5},{"t":195.63,"i":6},{"t":203.32,"i":7},{"t":211.92,"i":8},{"t":216.25,"i":9},{"t":224.67,"i":10},{"t":229.33,"i":11},{"t":239.79,"i":12},{"t":243.49,"i":13},{"t":250.37,"i":15},{"t":258.47,"i":16},{"t":266.76,"i":17},{"t":271.05,"i":18},{"t":275.45,"i":19},{"t":280.81,"i":20},{"t":286.51,"i":21},{"t":294.97,"i":22},{"t":299.04,"i":23},{"t":304.74,"i":25},{"t":310.76,"i":26},{"t":317.01,"i":27},{"t":321.81,"i":28},{"t":326.67,"i":29},{"t":335.62,"i":30},{"t":341.38,"i":31},{"t":347.74,"i":32},{"t":356.57,"i":33},{"t":361.64,"i":34},{"t":368.89,"i":35},{"t":376.04,"i":36},{"t":382.54,"i":37},{"t":393.33,"i":38}],"count":40},{"id":16,"title":"春节与寒假","sub":"Winter Holiday","desc":"四十个饺子、捏脸的姨妈和侧着拿手机的奶奶","audio":"audio/talk16.mp3","duration":308.8,"size":1853660,"lines":[{"en":"Guess what Grandma sent us. Go on. Guess.","zh":"猜猜奶奶给我们寄了什么。来，猜。","w":"A"},{"en":"Tea eggs?","zh":"茶叶蛋？","w":"B"},{"en":"Better. A box of dumplings. Forty of them. Frozen. And a note: 'for the new year — eat well, sleep early, call me.'","zh":"更好。一盒饺子。四十个。速冻的。还附了张字条：“新年好——吃饱、早睡、给我打电话。”","w":"A"},{"en":"Winter holiday: the smell of dumplings, relatives who think you grew ten centimeters, and zero alarms for two whole weeks.","zh":"寒假：饺子的香味、觉得你长了十厘米的亲戚，和整整两周不用定闹钟的日子。","w":"H"},{"en":"Your grandma is the best person in this city.","zh":"你奶奶是全市最好的人。","w":"B"},{"en":"She really is. So — plans for the holiday? My family's doing the usual: big dinner on New Year's Eve, then visiting relatives for three days.","zh":"真的是。那——寒假有什么计划？我家照旧：除夕夜大餐，然后走亲戚三天。","w":"A"},{"en":"Ah yes. The three days of 'you've grown so tall' and 'are you eating enough?'","zh":"啊对。那三天：“你长这么高了”“你吃够了吗”。","w":"B"},{"en":"Every. Single. Year. My aunt pinches my cheek. I'm fourteen.","zh":"每。一。年。我姨妈都要捏我的脸。我都十四了。","w":"A"},{"en":"Embrace it. My family lives far away, so we video call instead. My grandma holds the phone sideways the entire time.","zh":"接受吧。我家离得远，所以只能视频。我奶奶全程把手机横着拿。","w":"B"},{"en":"All grandmas do that.","zh":"所有奶奶都那样。","w":"A"},{"en":"It's universal. But at least I get to see my cousins on screen. We play games together online at midnight.","zh":"这是世界通用的。但至少能在屏幕上见到表弟表妹。我们半夜一起联网打游戏。","w":"B"},{"en":"That actually sounds fun. What games?","zh":"这听起来确实挺好玩的。什么游戏？","w":"A"},{"en":"Mostly we lose at them. It's a tradition.","zh":"主要是我们一直输。这是传统。","w":"B"},{"en":"You know what? This year I'm learning to make dumplings. Grandma says mine look like sad little clouds.","zh":"你知道吗？今年我要学包饺子。奶奶说我包的像伤心的小云朵。","w":"A"},{"en":"Everyone's first dumplings look like sad little clouds. That's how you know they're homemade.","zh":"所有人的第一个饺子都像伤心的小云朵。这正是 homemade 的证明。","w":"B"},{"en":"Before we slow things down — the vocabulary of family holidays.","zh":"放慢之前——家庭假日的词汇表。","w":"H"},{"en":"Guess what Grandma sent us.","zh":"猜猜奶奶给我们寄了什么。","w":"H"},{"en":"Big dinner on New Year's Eve.","zh":"除夕夜吃大餐。","w":"H"},{"en":"We video call instead.","zh":"我们改用视频通话。","w":"H"},{"en":"It's a tradition.","zh":"这是个传统。","w":"H"},{"en":"Guess what!","zh":"你猜怎么着！","w":"H"},{"en":"the usual","zh":"照例／老一套","w":"H"},{"en":"Every. Single. Year.","zh":"每。一。年。（强调每次都这样）","w":"H"},{"en":"Embrace it.","zh":"接受它吧。","w":"H"},{"en":"It's universal.","zh":"这是世界通用的。","w":"H"},{"en":"That actually sounds fun.","zh":"这听起来确实好玩。","w":"H"},{"en":"It's a tradition.","zh":"这是个传统。","w":"H"},{"en":"homemade","zh":"自家做的（含温情）","w":"H"},{"en":"Holiday challenge: describe one family tradition in English — what you do, when, and why you keep doing it. One minute, out loud.","zh":"节日挑战：用英语描述一个家庭传统——做什么、什么时候做、为什么一直做。一分钟，大声说。","w":"H"},{"en":"Next time: seventeen photos of a thumb, a very patient grandson, and the birth of Tech Grandma. See you on the next walk!","zh":"下一集：十七张大拇指照片、一位非常有耐心的孙子，和“科技奶奶”的诞生。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":4.15,"i":1},{"t":5.97,"i":2},{"t":16.22,"i":3},{"t":25.6,"i":4},{"t":29.42,"i":5},{"t":40.07,"i":6},{"t":46.07,"i":7},{"t":52.12,"i":8},{"t":61.79,"i":9},{"t":64.02,"i":10},{"t":72.15,"i":11},{"t":75.46,"i":12},{"t":79.39,"i":13},{"t":86.4,"i":14},{"t":93.19,"i":15},{"t":99.02,"i":30},{"t":105.8,"i":0},{"t":111.09,"i":1},{"t":113.55,"i":2},{"t":126.38,"i":4},{"t":131.28,"i":5},{"t":144.59,"i":6},{"t":152.19,"i":7},{"t":159.83,"i":8},{"t":171.94,"i":9},{"t":174.9,"i":10},{"t":185.12,"i":11},{"t":189.4,"i":12},{"t":194.45,"i":13},{"t":203.3,"i":14},{"t":211.85,"i":16},{"t":217.24,"i":17},{"t":222.71,"i":18},{"t":227.96,"i":19},{"t":232.68,"i":20},{"t":238.32,"i":21},{"t":243.98,"i":22},{"t":255.88,"i":23},{"t":261.69,"i":24},{"t":267.98,"i":25},{"t":275.44,"i":26},{"t":281.73,"i":27},{"t":287.06,"i":28},{"t":298.56,"i":29}],"count":31},{"id":17,"title":"科技奶奶","sub":"Teaching Grandma Tech","desc":"手机课、绿色按钮和市场里的传奇","audio":"audio/talk17.mp3","duration":473.8,"size":2843084,"lines":[{"en":"Grandma, you don't need to press it hard. It's not a doorbell. It's a screen. Just tap it.","zh":"奶奶，不用使劲按。它不是门铃。是屏幕。轻轻点一下就行。","w":"C"},{"en":"I AM tapping it. See? Tap, tap. Nothing happens.","zh":"我就是在点啊。看？点，点。没反应。","w":"B"},{"en":"You're tapping the... that's the camera. You just took seventeen photos of your thumb.","zh":"您点的是……那是相机。您刚给大拇指拍了十七张照片。","w":"C"},{"en":"Someone in your family taught you how to walk. One day, you get to teach them something back. Today: that day.","zh":"家里有人教过你走路。总有一天，你可以教回他们一样东西。今天：就是那天。","w":"H"},{"en":"Okay, let's slow down. What do you want the phone to do?","zh":"好，我们慢慢来。您想让手机做什么？","w":"C"},{"en":"Three things. Video call your mother. Watch my shows. And pay at the market, so I stop carrying cash.","zh":"三件事。跟你妈视频。看我的剧。还有在市场付款，这样我就不用带现金了。","w":"B"},{"en":"Good news: all three are on this home screen. We just need to make the buttons bigger.","zh":"好消息：三样都在这个主屏上。我们只需要把按钮变大。","w":"C"},{"en":"Bigger? There's a setting for that?","zh":"变大？这还有设置？","w":"B"},{"en":"There's a setting for everything. Watch — settings, display, text size... see? Now everything's huge.","zh":"什么都有设置。看——设置、显示、字体大小……看到没？现在全都变大了。","w":"C"},{"en":"Oh, THAT's better. Why do they make everything so small by default? Not everyone is twelve, you know.","zh":"哦，这样好多了。他们为什么默认把一切做得这么小？可不是人人都十二岁。","w":"B"},{"en":"You should file a complaint. Grandma, one more thing — I'm setting up a shortcut. This green button is Mom. One press, video call, done.","zh":"您该去投诉。奶奶，还有一件事——我给您设一个快捷方式。这个绿色按钮就是妈。一按，视频通话，搞定。","w":"C"},{"en":"One press? No menus?","zh":"按一下？不用进菜单？","w":"B"},{"en":"No menus. Try it.","zh":"不用菜单。您试试。","w":"C"},{"en":"Oh! It's ringing! Hi, dear! Look — I did it myself! No, HE didn't help, I did it MYSELF!","zh":"哦！响了！喂，闺女！看——我自己弄的！不是，他没帮，是我自己弄的！","w":"B"},{"en":"She's telling on me. I did all of it. And she's telling everyone she did all of it.","zh":"她在“举报”我。全都是我弄的。而她跟所有人说是她自己弄的。","w":"C"},{"en":"Teamwork, sweetheart. But mostly me.","zh":"团队合作，好孩子。但主要是我。","w":"B"},{"en":"One week later, Leo checks in. And Grandma has news of her own.","zh":"一周后，Leo 回访。奶奶也有自己的新闻。","w":"H"},{"en":"So, how's the phone this week, Grandma?","zh":"那，这周手机用得怎么样，奶奶？","w":"C"},{"en":"Wonderful. I watched two shows, called your mother nine times, and I paid at the market like a queen. The young man at the fish stall calls me 'Tech Grandma.'","zh":"好极了。我看了两部剧，给你妈打了九次电话，还在市场像个女王一样付款。鱼摊的小伙子叫我“科技奶奶”。","w":"B"},{"en":"Tech Grandma. That's it. That's your official name now.","zh":"科技奶奶。就这样。这是您的官方称号了。","w":"C"},{"en":"I accept. Now — next lesson: those short videos. Your cousin sends them and I want to send some back.","zh":"我接受。现在——下一课：那些小视频。你表妹老发给我，我想回发一些。","w":"B"},{"en":"Grandma, you're going to be more online than I am.","zh":"奶奶，你会比我泡网上还久。","w":"C"},{"en":"Good. Then I can comment on your posts.","zh":"很好。那我就能去你帖子底下评论了。","w":"B"},{"en":"...I've made a mistake.","zh":"……我犯了个错误。","w":"C"},{"en":"Before we slow down — how to teach anything to anyone, in English.","zh":"放慢之前——怎么用英语把任何东西教给任何人。","w":"H"},{"en":"You don't need to press it hard.","zh":"不用使劲按。","w":"H"},{"en":"Just tap it.","zh":"轻轻点一下就行。","w":"H"},{"en":"There's a setting for that.","zh":"这有设置可以改。","w":"H"},{"en":"Try it.","zh":"试试看。","w":"H"},{"en":"It's not a doorbell. It's a screen.","zh":"它不是门铃，是屏幕。","w":"H"},{"en":"Just tap it.","zh":"轻轻点一下。","w":"H"},{"en":"Let's slow down.","zh":"我们慢慢来。","w":"H"},{"en":"There's a setting for everything.","zh":"什么都有设置。","w":"H"},{"en":"One press, done.","zh":"一按，搞定。","w":"H"},{"en":"I did it myself!","zh":"我自己做到的！","w":"H"},{"en":"She's telling on me.","zh":"她在“举报”我（告状）。","w":"H"},{"en":"I've made a mistake.","zh":"我犯了个错误（幽默）。","w":"H"},{"en":"Teaching challenge: pick one thing you're good at — a game, a dish, a phone trick — and explain step one in English, out loud, in thirty seconds.","zh":"教学挑战：挑一样你擅长的事——游戏、菜、手机技巧——用英语讲出第一步，三十秒，大声说。","w":"H"},{"en":"Next time: ketchup on ice cream, a seventy-two on a quiz, and the world's most annoying supportive friend. See you on the next walk!","zh":"下一集：冰淇淋上的番茄酱、七十二分的测验，和全世界最烦人但也最暖心的朋友。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":9.89,"i":1},{"t":15.86,"i":2},{"t":23.18,"i":3},{"t":33.28,"i":4},{"t":39.09,"i":5},{"t":48.04,"i":6},{"t":55.86,"i":7},{"t":59.0,"i":8},{"t":70.16,"i":9},{"t":78.25,"i":10},{"t":92.14,"i":11},{"t":95.24,"i":12},{"t":99.43,"i":13},{"t":108.36,"i":14},{"t":116.69,"i":15},{"t":120.69,"i":16},{"t":127.34,"i":17},{"t":131.83,"i":18},{"t":143.32,"i":19},{"t":149.97,"i":20},{"t":158.77,"i":21},{"t":163.4,"i":22},{"t":167.12,"i":23},{"t":170.05,"i":24},{"t":175.95,"i":39},{"t":182.73,"i":0},{"t":195.12,"i":1},{"t":202.69,"i":2},{"t":211.9,"i":4},{"t":219.25,"i":5},{"t":230.47,"i":6},{"t":240.3,"i":7},{"t":244.37,"i":8},{"t":258.3,"i":9},{"t":268.47,"i":10},{"t":285.78,"i":11},{"t":289.8,"i":12},{"t":295.17,"i":13},{"t":306.36,"i":14},{"t":316.81,"i":15},{"t":321.96,"i":17},{"t":327.69,"i":18},{"t":342.03,"i":19},{"t":350.41,"i":20},{"t":361.47,"i":21},{"t":367.38,"i":22},{"t":372.17,"i":23},{"t":375.97,"i":25},{"t":381.22,"i":26},{"t":385.75,"i":27},{"t":390.81,"i":28},{"t":395.07,"i":29},{"t":405.53,"i":30},{"t":411.46,"i":31},{"t":417.7,"i":32},{"t":425.17,"i":33},{"t":432.27,"i":34},{"t":438.73,"i":35},{"t":445.33,"i":36},{"t":451.81,"i":37},{"t":463.07,"i":38}],"count":40},{"id":18,"title":"糟糕的一天","sub":"Mia's Bad Day","desc":"碎了的眼镜、掉了的餐盘和一句“你是对的，但你很烦”","audio":"audio/talk18.mp3","duration":304.2,"size":1825580,"lines":[{"en":"Hey. You okay? You've been quiet all day.","zh":"嘿。还好吗？你一整天都没怎么说话。","w":"A"},{"en":"I'm fine.","zh":"我没事。","w":"B"},{"en":"Mia. You just put ketchup on your ice cream.","zh":"Mia。你刚刚往冰淇淋上挤了番茄酱。","w":"A"},{"en":"Some days are just... days. Everything goes wrong, all at once, on purpose. Today's episode: the bad day, and how friends help.","zh":"有些日子就……是那种日子。所有事一起出错，像是故意的。今天的节目：糟糕的一天，以及朋友怎么帮忙。","w":"H"},{"en":"...I need to tell you about my day.","zh":"……我得跟你讲讲我今天怎么了。","w":"B"},{"en":"Go ahead. I have snacks and nowhere to be.","zh":"说吧。我有零食，也没地方要去。","w":"A"},{"en":"So. This morning I broke my glasses. Then I got gum in my hair in second class. Then at lunch I dropped my tray. In front of EVERYONE.","zh":"就这样。早上我眼镜摔了。然后第二节课头发上粘了口香糖。午饭时我把餐盘打翻了。当着所有人的面。","w":"B"},{"en":"Oh no.","zh":"天哪。","w":"A"},{"en":"And the worst part? I studied all week for the math quiz, and I still got a seventy-two.","zh":"最糟的是什么？数学小测我复习了一整周，结果还是只考了七十二。","w":"B"},{"en":"Okay. First: give me the ice cream before you put anything else on it.","zh":"好。第一：趁你还没往上加别的东西，把冰淇淋给我。","w":"A"},{"en":"Thanks.","zh":"谢了。","w":"B"},{"en":"Second: one bad day is not a bad week. And a seventy-two on one quiz doesn't erase a week of studying. It just means the quiz was rude.","zh":"第二：糟糕的一天不是糟糕的一周。一次小测的七十二分也抹不掉你一整周的复习。它只能说明这份卷子很没礼貌。","w":"A"},{"en":"That's not how math works, Jake.","zh":"数学不是这么算的，Jake。","w":"B"},{"en":"It's how FRIENDS work. Look — tomorrow's a new day. New day, new tray, no gum.","zh":"朋友就是这么算的。看——明天是新的一天。新的一天、新餐盘、没有口香糖。","w":"A"},{"en":"You know what's annoying? You're right, and you're annoying about it.","zh":"你知道最气人的是什么吗？你是对的，而且你对得让人很烦。","w":"B"},{"en":"I've been told. Come on, let's go shoot some hoops. Losing at basketball will make you feel better about the quiz.","zh":"很多人这么说。走，去投两个球。在篮球上输一场，你就会对小测感觉好一点。","w":"A"},{"en":"You mean YOU'LL lose.","zh":"你是说“你”会输吧。","w":"B"},{"en":"We'll see who loses, ketchup girl.","zh":"看看谁输，番茄酱女士。","w":"A"},{"en":"Before we slow things down — the language of cheering someone up.","zh":"放慢之前——哄人开心的语言。","w":"H"},{"en":"You've been quiet all day.","zh":"你一整天都没怎么说话。","w":"H"},{"en":"I need to tell you about my day.","zh":"我得跟你讲讲我今天怎么了。","w":"H"},{"en":"Tomorrow's a new day.","zh":"明天是新的一天。","w":"H"},{"en":"Let's go shoot some hoops.","zh":"走，去投两个球。","w":"H"},{"en":"You've been quiet all day.","zh":"你一整天都很安静。","w":"H"},{"en":"Go ahead.","zh":"说吧／去吧。","w":"H"},{"en":"One bad day is not a bad week.","zh":"糟糕的一天不是糟糕的一周。","w":"H"},{"en":"That's not how ... works.","zh":"……不是这么回事的。","w":"H"},{"en":"You're right, and you're annoying about it.","zh":"你是对的，但对得让人烦。","w":"H"},{"en":"I've been told.","zh":"很多人这么说（自嘲）。","w":"H"},{"en":"In front of everyone","zh":"当着所有人的面","w":"H"},{"en":"We'll see.","zh":"走着瞧。","w":"H"},{"en":"Kindness challenge: think of a friend who had a hard day. Say one encouraging sentence to them in English — out loud, so it's ready when you need it.","zh":"善意挑战：想一个今天过得不好的朋友。用英语对他说一句鼓励的话——大声说出来，等需要的时候就能脱口而出。","w":"H"},{"en":"Next time: a career survey, a cat burgling a museum, and the most normal answer in the world. See you on the next walk!","zh":"下一集：一份职业调查、一只偷博物馆的猫，和世界上最正常的答案。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":3.89,"i":1},{"t":5.78,"i":2},{"t":9.35,"i":3},{"t":21.6,"i":4},{"t":24.31,"i":5},{"t":27.93,"i":6},{"t":39.11,"i":7},{"t":40.6,"i":8},{"t":47.15,"i":9},{"t":52.47,"i":10},{"t":54.17,"i":11},{"t":64.3,"i":12},{"t":67.54,"i":13},{"t":74.42,"i":14},{"t":79.1,"i":15},{"t":87.26,"i":16},{"t":89.54,"i":17},{"t":92.7,"i":18},{"t":98.08,"i":33},{"t":104.85,"i":0},{"t":109.83,"i":1},{"t":112.37,"i":2},{"t":116.96,"i":4},{"t":120.5,"i":5},{"t":125.17,"i":6},{"t":139.13,"i":7},{"t":141.15,"i":8},{"t":149.42,"i":9},{"t":156.2,"i":10},{"t":158.52,"i":11},{"t":171.18,"i":12},{"t":175.37,"i":13},{"t":184.04,"i":14},{"t":190.01,"i":15},{"t":200.27,"i":16},{"t":203.28,"i":17},{"t":207.37,"i":19},{"t":212.5,"i":20},{"t":218.03,"i":21},{"t":222.92,"i":22},{"t":228.19,"i":23},{"t":235.2,"i":24},{"t":240.7,"i":25},{"t":248.95,"i":26},{"t":256.35,"i":27},{"t":264.96,"i":28},{"t":270.87,"i":29},{"t":277.42,"i":30},{"t":283.01,"i":31},{"t":294.08,"i":32}],"count":34},{"id":19,"title":"长大想做什么","sub":"Dream Jobs","desc":"游戏设计师、未来的兽医和还没说出口的梦想","audio":"audio/talk19.mp3","duration":341.2,"size":2047772,"lines":[{"en":"Career survey for school. Question one: what do you want to be? And 'rich' is not an answer.","zh":"学校的职业调查。第一题：你想成为什么？“有钱”不算答案。","w":"A"},{"en":"You just took away my only answer.","zh":"你刚刚剥夺了我唯一的答案。","w":"C"},{"en":"Leo. Real answer. Now.","zh":"Leo。真答案。快。","w":"A"},{"en":"What do you want to be when you grow up? The most famous question in school — and the most unfair one, if you ask me.","zh":"你长大想做什么？学校里最有名的问题——依我说，也是最不公平的一个。","w":"H"},{"en":"Okay, fine. Real answer: game designer. I have a notebook full of game ideas. Level designs, characters, everything.","zh":"好吧，行。真答案：游戏设计师。我有个本子全是游戏点子。关卡设计、角色，什么都有。","w":"C"},{"en":"Seriously? Can I see?","zh":"真的假的？我能看看吗？","w":"A"},{"en":"Sure. This one's a puzzle game where you're a cat burgling a museum.","zh":"当然。这个是解谜游戏，你扮演一只偷博物馆的猫。","w":"C"},{"en":"A cat. Burgling. Leo, this is actually good. The levels make sense and everything.","zh":"一只猫。在偷东西。Leo，这真的挺好。关卡逻辑都通。","w":"A"},{"en":"I've been working on it since fifth grade. What about you?","zh":"我从五年级就开始弄了。你呢？","w":"C"},{"en":"I don't know yet. Everyone else has answers. Emma wants to be a vet, you want to make games, Mia wants—","zh":"我还不知道。别人都有答案。Emma 想当兽医，你想做游戏，Mia 想——","w":"A"},{"en":"Mia wants to build robots. She just doesn't say it out loud yet.","zh":"Mia 想造机器人。她只是还没大声说出来。","w":"C"},{"en":"Wait, really? How do you know?","zh":"等等，真的吗？你怎么知道的？","w":"A"},{"en":"She checks out every robot book in the library. Twice. And she 'fixes' things at home for fun. Jake, some people just need time.","zh":"她把图书馆所有机器人书都借遍了。每本借了两次。她在家还“修”东西玩。Jake，有些人只是需要时间。","w":"C"},{"en":"That's... actually comforting. So it's okay to not know yet?","zh":"这……真让人安心。所以还不知道也没关系？","w":"A"},{"en":"It's the most normal thing in the world. You're fourteen. You have, like, a million days to figure it out.","zh":"这是世界上最正常的事。你才十四岁。你有差不多一百万天去想明白。","w":"C"},{"en":"A million days. Okay. I can work with that.","zh":"一百万天。行。这个说法我能接受。","w":"A"},{"en":"Before we slow down — the language of big, not-yet-decided dreams.","zh":"放慢之前——用来谈论“还没想好”的大梦想的语言。","w":"H"},{"en":"What do you want to be?","zh":"你想成为什么？","w":"H"},{"en":"I don't know yet.","zh":"我还不知道。","w":"H"},{"en":"I've been working on it since fifth grade.","zh":"我从五年级就开始做了。","w":"H"},{"en":"Some people just need time.","zh":"有些人只是需要时间。","w":"H"},{"en":"What do you want to be?","zh":"你长大想做什么？","w":"H"},{"en":"'Rich' is not an answer.","zh":"“有钱”不算答案。","w":"H"},{"en":"Real answer.","zh":"真答案。","w":"H"},{"en":"Can I see?","zh":"我能看看吗？","w":"H"},{"en":"I don't know yet.","zh":"我还不知道。","w":"H"},{"en":"How do you know?","zh":"你怎么知道的？","w":"H"},{"en":"Some people just need time.","zh":"有些人只是需要时间。","w":"H"},{"en":"I can work with that.","zh":"这个说法我能接受。","w":"H"},{"en":"Dream challenge: in English, describe one job that sounds interesting to you — what they do all day, and one skill you'd need. You don't have to be sure. Out loud.","zh":"梦想挑战：用英语描述一份你觉得有意思的职业——他们每天做什么，需要什么技能。不用确定。大声说。","w":"H"},{"en":"Next time: exam week. Color-coded schedules, imaginary students, and the most important study tip of all. See you on the next walk!","zh":"下一集：考试周。彩色时间表、想象中的学生，和最重要的一条学习建议。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.79,"i":1},{"t":10.56,"i":2},{"t":13.84,"i":3},{"t":22.94,"i":4},{"t":36.47,"i":5},{"t":39.26,"i":6},{"t":45.81,"i":7},{"t":52.67,"i":8},{"t":58.28,"i":9},{"t":65.98,"i":10},{"t":72.61,"i":11},{"t":75.2,"i":12},{"t":88.25,"i":13},{"t":92.93,"i":14},{"t":103.03,"i":15},{"t":107.08,"i":16},{"t":113.16,"i":31},{"t":119.93,"i":0},{"t":128.49,"i":1},{"t":133.32,"i":2},{"t":137.56,"i":4},{"t":154.39,"i":5},{"t":158.03,"i":6},{"t":166.3,"i":7},{"t":174.95,"i":8},{"t":182.07,"i":9},{"t":191.75,"i":10},{"t":200.11,"i":11},{"t":203.51,"i":12},{"t":219.77,"i":13},{"t":225.73,"i":14},{"t":238.37,"i":15},{"t":243.57,"i":17},{"t":248.33,"i":18},{"t":252.96,"i":19},{"t":258.95,"i":20},{"t":264.34,"i":21},{"t":270.7,"i":22},{"t":277.69,"i":23},{"t":283.69,"i":24},{"t":289.28,"i":25},{"t":295.37,"i":26},{"t":301.18,"i":27},{"t":308.69,"i":28},{"t":315.25,"i":29},{"t":328.98,"i":30}],"count":32},{"id":20,"title":"考试周","sub":"Exam Week Survival","desc":"彩色的时间表、睡前的物理公式和一场迟到的骑行","audio":"audio/talk20.mp3","duration":423.3,"size":2540108,"lines":[{"en":"It's here. Exam week. I dreamt about math formulas last night. In COLOR.","zh":"来了。考试周。我昨晚梦见数学公式了。还是彩色的。","w":"B"},{"en":"Mia, you need sleep more than you need another hour of formulas.","zh":"Mia，比起再多刷一小时公式，你更需要睡觉。","w":"A"},{"en":"Don't distract me with logic. I'm memorizing.","zh":"别用逻辑干扰我。我在背书。","w":"B"},{"en":"Exam week. The week when everyone suddenly discovers the library. Today: study tricks that actually work — and one very important rule about sleep.","zh":"考试周。所有人突然发现图书馆的那一周。今天：真正有用的学习方法——和一条关于睡眠的非常重要的规则。","w":"H"},{"en":"Okay, real talk. How's the studying going?","zh":"好，说实话。复习得怎么样？","w":"A"},{"en":"I made a schedule. Color-coded. Then I broke the schedule. Then I made a new schedule to feel better about breaking the old one.","zh":"我做了个时间表。带颜色标注的。然后我打破了它。然后为了对打破旧表感觉好点，我又做了个新的。","w":"B"},{"en":"That's the most Mia thing I've ever heard. What's actually hard?","zh":"这是我听过最有 Mia 味的话。到底哪科难？","w":"A"},{"en":"Physics formulas. They all look the same. V equals this, P equals that... my brain just gives up.","zh":"物理公式。长得全都一样。V 等于这个，P 等于那个……我的大脑直接放弃。","w":"B"},{"en":"My trick: I explain it out loud to an imaginary student. If I can teach it, I know it. Want to try? Teach me one formula right now.","zh":"我的诀窍：大声讲给一个想象中的学生听。能教会别人，就说明自己会了。试试？现在教我一条公式。","w":"A"},{"en":"Okay... distance equals speed times time. So if a bus goes sixty kilometers an hour for two hours...","zh":"好……距离等于速度乘时间。那如果一辆公交车以每小时六十公里开了两个小时……","w":"B"},{"en":"...One hundred twenty kilometers. See? You know it.","zh":"……一百二十公里。看？你会了。","w":"A"},{"en":"Huh. Saying it out loud actually helps. Why does that work?","zh":"咦。说出来真的有用。这是什么原理？","w":"B"},{"en":"No idea. It just does. Also: tonight, close the books by ten and sleep.","zh":"不知道。反正就是有用。还有：今晚十点前合上书，去睡觉。","w":"A"},{"en":"But I haven't finished—","zh":"可我还没复习完——","w":"B"},{"en":"A tired brain forgets more than a rested brain learns. Sleep IS studying. Doctor's orders.","zh":"疲劳的大脑忘掉的，比休息好的大脑学到的还多。睡觉就是复习。医嘱。","w":"A"},{"en":"You're not a doctor.","zh":"你又不是医生。","w":"B"},{"en":"Future doctor. Manifesting.","zh":"未来的医生。先说先赢。","w":"A"},{"en":"And then — the exams end. There is always a moment after exam week that tastes like freedom. Here it is.","zh":"然后——考试结束。考试周之后总有一个瞬间，尝起来像自由。就是现在。","w":"H"},{"en":"It's OVER. Done. Finished. I'm free!","zh":"结束了！完成！结束！我自由了！","w":"B"},{"en":"How do you think it went?","zh":"你觉得考得怎么样？","w":"A"},{"en":"Math was fair, physics was mean, English was easy. Classic.","zh":"数学还行，物理很坏，英语简单。经典组合。","w":"B"},{"en":"Same. Now — two months of freedom. Bike trip? The one the rain ruined?","zh":"一样。现在——两个月自由时光。骑行去？上次被雨毁掉的那个？","w":"A"},{"en":"The one the rain ruined. Saturday, nine sharp.","zh":"被雨毁掉的那个。周六，九点整。","w":"B"},{"en":"Nine fifteen.","zh":"九点十五。","w":"A"},{"en":"...You checked the tickets, didn't you.","zh":"……你查过车票了，是不是。","w":"B"},{"en":"I made a folder.","zh":"我做了个文件夹。","w":"A"},{"en":"Before we slow down — the exam week survival kit, in four sentences.","zh":"放慢之前——考试周生存包，四句话搞定。","w":"H"},{"en":"How's the studying going?","zh":"复习得怎么样？","w":"H"},{"en":"Distance equals speed times time.","zh":"距离等于速度乘时间。","w":"H"},{"en":"Saying it out loud actually helps.","zh":"说出来真的有用。","w":"H"},{"en":"Sleep IS studying.","zh":"睡觉就是复习。","w":"H"},{"en":"Real talk.","zh":"说实话吧。","w":"H"},{"en":"Color-coded","zh":"用颜色标注的","w":"H"},{"en":"My brain just gives up.","zh":"我的大脑直接放弃。","w":"H"},{"en":"If I can teach it, I know it.","zh":"能教别人，就说明自己会了。","w":"H"},{"en":"Saying it out loud actually helps.","zh":"大声说出来真的有用。","w":"H"},{"en":"No idea. It just does.","zh":"不知道原理。反正有用。","w":"H"},{"en":"A tired brain forgets more.","zh":"疲劳的大脑忘得更多。","w":"H"},{"en":"Nine sharp.","zh":"九点整。","w":"H"},{"en":"Tonight, teach one thing you learned today to your imaginary student — out loud, in English, for one minute. If you can teach it, you know it.","zh":"今晚，把今天学到的一样东西讲给你想象中的学生听——用英语、出声、一分钟。能教别人，就是真的会了。","w":"H"},{"en":"That's the end of season one — twenty walks, twenty conversations. Replay your favorites, practice your lines, and I'll see you on the next walk. Bye for now!","zh":"第一季到此结束——二十次散步、二十段对话。重听你喜欢的集数，练熟你的台词，我们下次散步见。再见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":7.29,"i":1},{"t":12.12,"i":2},{"t":16.51,"i":3},{"t":29.2,"i":4},{"t":32.87,"i":5},{"t":42.3,"i":6},{"t":46.89,"i":7},{"t":55.74,"i":8},{"t":65.43,"i":9},{"t":73.98,"i":10},{"t":78.27,"i":11},{"t":83.74,"i":12},{"t":90.67,"i":13},{"t":93.14,"i":14},{"t":100.51,"i":15},{"t":102.72,"i":16},{"t":105.74,"i":17},{"t":115.8,"i":18},{"t":120.88,"i":19},{"t":122.85,"i":20},{"t":129.18,"i":21},{"t":135.42,"i":22},{"t":139.91,"i":23},{"t":141.82,"i":24},{"t":144.94,"i":25},{"t":146.81,"i":26},{"t":153.39,"i":41},{"t":160.16,"i":0},{"t":169.34,"i":1},{"t":175.5,"i":2},{"t":181.1,"i":4},{"t":185.82,"i":5},{"t":197.64,"i":6},{"t":203.48,"i":7},{"t":214.58,"i":8},{"t":226.74,"i":9},{"t":237.48,"i":10},{"t":242.96,"i":11},{"t":249.91,"i":12},{"t":258.66,"i":13},{"t":261.91,"i":14},{"t":271.16,"i":15},{"t":274.1,"i":16},{"t":278.03,"i":18},{"t":284.49,"i":19},{"t":287.12,"i":20},{"t":295.13,"i":21},{"t":303.01,"i":22},{"t":308.76,"i":23},{"t":311.31,"i":24},{"t":315.36,"i":25},{"t":317.87,"i":27},{"t":322.95,"i":28},{"t":328.79,"i":29},{"t":334.71,"i":30},{"t":339.75,"i":31},{"t":345.65,"i":32},{"t":351.39,"i":33},{"t":358.39,"i":34},{"t":366.48,"i":35},{"t":374.93,"i":36},{"t":384.96,"i":37},{"t":392.83,"i":38},{"t":398.62,"i":39},{"t":409.98,"i":40}],"count":42},{"id":21,"title":"我的早晨","sub":"My Morning Routine","desc":"从起床到出门，一个普通早晨的流水账","audio":"audio/talk21.mp3","duration":344.9,"size":2069804,"lines":[{"en":"Morning, Mia. You look... very awake. What time did you get up?","zh":"早上好，Mia。你看起来……特别清醒。你几点起的？","w":"A"},{"en":"Six thirty. Same as always. Why? You look half asleep.","zh":"六点半。跟平常一样。怎么了？你看起来半睡半醒。","w":"B"},{"en":"Six thirty? On a Monday? That should be illegal.","zh":"六点半？在周一？这应该算违法。","w":"A"},{"en":"Welcome back to Walk and Talk. I'm Jenny, and today we're talking about mornings — the little routine that sets up your whole day.","zh":"欢迎回到 Walk and Talk。我是 Jenny，今天我们聊聊早晨——那段决定你一整天状态的小小日常。","w":"H"},{"en":"Mia is one of those people who wakes up before the sun. Jake is not.","zh":"Mia 是那种天还没亮就起床的人。Jake 不是。","w":"H"},{"en":"I have a routine. It's not magic — it's just... regular.","zh":"我有一套固定流程。不是什么魔法——只是……有规律。","w":"B"},{"en":"Okay, walk me through it. Step by step. Pretend I've never woken up before.","zh":"好，给我一步一步讲讲。就当我这辈子没起过床。","w":"A"},{"en":"Alarm at six thirty. I sit up, not scroll my phone. That's the rule.","zh":"六点半闹钟响。我坐起来，不刷手机。这是铁律。","w":"B"},{"en":"Whoa, no phone first thing? What do you even do for ten minutes?","zh":"哇，第一件事不碰手机？那你那十分钟干嘛？","w":"A"},{"en":"Wash my face, open the window, drink a glass of water.","zh":"洗把脸，开窗户，喝杯水。","w":"B"},{"en":"That's it? That's the secret to being a morning person?","zh":"就这些？这就是成为早起达人的秘诀？","w":"A"},{"en":"No secret. I just don't fight the day. I start it.","zh":"没有秘诀。我只是不跟这一天作对。我主动开启它。","w":"B"},{"en":"I start my day by fighting my blanket for twenty minutes.","zh":"我开启一天的方式，是跟我的被子搏斗二十分钟。","w":"A"},{"en":"I know. I can hear you losing from my house.","zh":"我知道。隔着我家都能听见你节节败退。","w":"B"},{"en":"Hey! My blanket is very strong, okay?","zh":"喂！我的被子很强的，好吗？","w":"A"},{"en":"Here's the part that surprises people: Mia says the hard part isn't getting up. It's what happens next.","zh":"下面这段可能会让人意外：Mia 说最难的其实不是起床，而是起床之后。","w":"H"},{"en":"The trick is, I pack my bag the night before. Lunch, books, gym shoes — all in.","zh":"窍门是，我前一晚就把书包收拾好。午饭、书、运动鞋——全放进去。","w":"B"},{"en":"So in the morning, you just... grab it and go?","zh":"所以早上你就……拎起来就走？","w":"A"},{"en":"Exactly. No running around looking for my keys or my homework.","zh":"没错。不用为了找钥匙或作业到处乱跑。","w":"B"},{"en":"I spent ten minutes this morning looking for one sock. One.","zh":"我今天早上花了十分钟找一只袜子。一只。","w":"A"},{"en":"Where was it?","zh":"最后在哪？","w":"B"},{"en":"In the fridge. Don't ask.","zh":"在冰箱里。别问。","w":"A"},{"en":"In the... okay, Jake. Maybe start with the bag.","zh":"在冰……行吧，Jake。要不先从收拾书包开始。","w":"B"},{"en":"Before we slow down, here are the most useful lines about mornings.","zh":"在放慢之前，来听几句关于早晨最实用的表达。","w":"H"},{"en":"What time did you get up?","zh":"你几点起的？","w":"H"},{"en":"Walk me through it, step by step.","zh":"一步一步给我讲讲。","w":"H"},{"en":"I pack my bag the night before.","zh":"我前一晚就收拾好书包。","w":"H"},{"en":"Grab it and go.","zh":"拎起来就走。","w":"H"},{"en":"Same as always.","zh":"跟平常一样。","w":"H"},{"en":"That should be illegal.","zh":"这应该算违法（夸张吐槽）。","w":"H"},{"en":"I have a routine.","zh":"我有一套固定流程。","w":"H"},{"en":"Walk me through it.","zh":"给我详细讲讲。","w":"H"},{"en":"That's the rule.","zh":"这是铁律。","w":"H"},{"en":"No running around looking for...","zh":"不用到处乱找……","w":"H"},{"en":"Start with the bag.","zh":"先从收拾书包开始。","w":"H"},{"en":"Don't ask.","zh":"别问了。","w":"H"},{"en":"Your turn: tonight, write down your morning routine in English — three sentences. Then read it out loud and time yourself.","zh":"轮到你了：今晚用英语写下你的早晨流程——三句话。然后大声读出来，并给自己计时。","w":"H"},{"en":"Tomorrow, we're looking at the other side of the school day — what happens when the final bell rings. See you on the next walk!","zh":"明天，我们聊聊学校一天的另一面——放学铃响之后发生的事。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.09,"i":1},{"t":11.32,"i":2},{"t":15.4,"i":3},{"t":25.27,"i":4},{"t":31.97,"i":5},{"t":37.29,"i":6},{"t":43.27,"i":7},{"t":50.22,"i":8},{"t":54.83,"i":9},{"t":59.51,"i":10},{"t":63.51,"i":11},{"t":68.84,"i":12},{"t":73.01,"i":13},{"t":76.97,"i":14},{"t":80.67,"i":15},{"t":89.43,"i":16},{"t":96.7,"i":17},{"t":100.27,"i":18},{"t":105.81,"i":19},{"t":110.35,"i":20},{"t":112.12,"i":21},{"t":114.98,"i":22},{"t":119.49,"i":23},{"t":125.27,"i":38},{"t":132.04,"i":0},{"t":138.49,"i":1},{"t":146.37,"i":2},{"t":151.59,"i":5},{"t":158.37,"i":6},{"t":165.94,"i":7},{"t":174.72,"i":8},{"t":180.58,"i":9},{"t":186.55,"i":10},{"t":191.7,"i":11},{"t":198.45,"i":12},{"t":203.82,"i":13},{"t":208.89,"i":14},{"t":213.66,"i":16},{"t":222.79,"i":17},{"t":227.41,"i":18},{"t":234.43,"i":19},{"t":240.2,"i":20},{"t":242.59,"i":21},{"t":246.3,"i":22},{"t":252.04,"i":24},{"t":257.03,"i":25},{"t":263.04,"i":26},{"t":268.77,"i":27},{"t":273.47,"i":28},{"t":280.04,"i":29},{"t":286.76,"i":30},{"t":293.12,"i":31},{"t":299.36,"i":32},{"t":305.39,"i":33},{"t":313.09,"i":34},{"t":319.45,"i":35},{"t":325.07,"i":36},{"t":335.2,"i":37}],"count":39},{"id":22,"title":"放学后的安排","sub":"After School","desc":"最后一节课后的黄金两小时，怎么安排","audio":"audio/talk22.mp3","duration":356.8,"size":2141516,"lines":[{"en":"Freedom! The bell rang. What are you doing after school today?","zh":"解放了！铃响了。你今天放学后干嘛？","w":"A"},{"en":"The usual — homework, then dinner. Why, got something planned?","zh":"老样子——写作业，然后吃饭。怎么，你有安排？","w":"B"},{"en":"There's a new game shop near the station. I was thinking of checking it out.","zh":"车站旁边新开了家游戏店。我想去逛逛。","w":"A"},{"en":"That final bell. It's not just the end of class — it's the start of the best part of the day. Or the busiest. Sometimes both.","zh":"放学铃。它不只是下课，而是一天里最棒部分的开始。也可能是最忙的。有时候两者兼有。","w":"H"},{"en":"Today, Jake wants to do something fun. Mia has a plan, too. Let's see which one wins.","zh":"今天 Jake 想找点乐子。Mia 也有安排。看看谁赢了。","w":"H"},{"en":"The game shop? You have a math test on Friday, remember?","zh":"游戏店？你周五有数学测验，记得吗？","w":"B"},{"en":"It's Tuesday! Friday is basically next year.","zh":"今天才周二！周五基本上算明年的事了。","w":"A"},{"en":"That's exactly the kind of math that gets you a C on a test.","zh":"你这种算法，正好能让你数学考个 C。","w":"B"},{"en":"Come on. One hour. Then I'll do homework. Promise.","zh":"来嘛。就一小时。然后我写作业。保证。","w":"A"},{"en":"You said that last week. And then you stayed up till eleven.","zh":"你上周也这么说。然后熬到十一点。","w":"B"},{"en":"That was one time. Well... two times. Three at most.","zh":"那是就一次。好吧……两次。顶多三次。","w":"A"},{"en":"Here's a better idea. Come to the library with me. One hour, real homework.","zh":"我有个更好的主意。跟我去图书馆。一小时，真写作业。","w":"B"},{"en":"The library? For fun? You do know what the word 'fun' means, right?","zh":"图书馆？为了好玩？你知道'好玩'这词是什么意思吧？","w":"A"},{"en":"I know what a good grade means. That's rarer.","zh":"我知道好成绩是什么意思。那东西更难得。","w":"B"},{"en":"Mia has a system for after school. Jake thinks it's boring. But there's a middle way, and here's how they found it.","zh":"Mia 对放学后有一套方法。Jake 觉得太无聊。但其实有折中办法，听听他们怎么找到的。","w":"H"},{"en":"Okay, deal. Forty minutes at the game shop. Then the library, one hour. You in?","zh":"好，成交。游戏店四十分钟。然后图书馆一小时。干不干？","w":"B"},{"en":"Forty minutes? That's barely enough to say hello to the games.","zh":"四十分钟？跟游戏打个招呼都不够。","w":"A"},{"en":"Take it or leave it.","zh":"爱要不要。","w":"B"},{"en":"Fine, fine. But you're buying me a drink after.","zh":"行行行。但你之后得请我喝饮料。","w":"A"},{"en":"Why am I buying you a drink for doing your own homework?","zh":"你写自己的作业，凭什么我请你喝饮料？","w":"B"},{"en":"Because I'm your favorite person, obviously.","zh":"因为我显然是你最喜欢的人。","w":"A"},{"en":"You're not even my favorite desk mate.","zh":"你连我最喜欢的同桌都算不上。","w":"B"},{"en":"Harsh. Okay, forty minutes and a drink, final offer.","zh":"太狠了。好吧，四十分钟加一杯饮料，最后报价。","w":"A"},{"en":"Deal. Let's go before the game shop closes and the library runs out of seats.","zh":"成交。快走，不然游戏店关门、图书馆也没位子了。","w":"B"},{"en":"Time to slow down. Here are the best lines about planning your afternoon.","zh":"现在放慢节奏。来听几句关于安排下午时间的实用表达。","w":"H"},{"en":"What are you doing after school?","zh":"你放学后干什么？","w":"H"},{"en":"I was thinking of checking it out.","zh":"我正想去看看。","w":"H"},{"en":"Take it or leave it.","zh":"爱要不要（不容再讨价）。","w":"H"},{"en":"You in?","zh":"你干不干？","w":"H"},{"en":"The usual.","zh":"老样子。","w":"H"},{"en":"Got something planned?","zh":"有安排吗？","w":"H"},{"en":"I was thinking of...","zh":"我正想……","w":"H"},{"en":"Come on.","zh":"来嘛。","w":"H"},{"en":"That's exactly the kind of...","zh":"这正好是那种……","w":"H"},{"en":"Here's a better idea.","zh":"我有个更好的主意。","w":"H"},{"en":"Take it or leave it.","zh":"爱要不要。","w":"H"},{"en":"Deal.","zh":"成交。","w":"H"},{"en":"Your turn: plan your afternoon in English. Tell someone (or yourself) two things you will do, and one thing you'll skip.","zh":"轮到你了：用英语规划你的下午。告诉别人（或自己）你要做的两件事，和一件你不做的事。","w":"H"},{"en":"Next time, we're staying at home — with a pile of dishes, a mop, and a family debate about who does what. See you on the next walk!","zh":"下次，我们留在家里——面对一堆碗、一把拖把，还有一场关于谁该干什么的家庭争论。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":4.53,"i":1},{"t":9.98,"i":2},{"t":14.9,"i":3},{"t":26.83,"i":4},{"t":36.09,"i":5},{"t":40.68,"i":6},{"t":44.56,"i":7},{"t":49.14,"i":8},{"t":54.04,"i":9},{"t":58.69,"i":10},{"t":63.54,"i":11},{"t":70.06,"i":12},{"t":75.17,"i":13},{"t":79.47,"i":14},{"t":89.26,"i":15},{"t":96.48,"i":16},{"t":101.16,"i":17},{"t":103.42,"i":18},{"t":107.06,"i":19},{"t":110.8,"i":20},{"t":114.28,"i":21},{"t":117.4,"i":22},{"t":122.41,"i":23},{"t":128.84,"i":24},{"t":135.49,"i":39},{"t":142.27,"i":0},{"t":148.06,"i":1},{"t":154.96,"i":2},{"t":161.21,"i":5},{"t":167.06,"i":6},{"t":172.04,"i":7},{"t":177.91,"i":8},{"t":184.13,"i":9},{"t":190.07,"i":10},{"t":196.25,"i":11},{"t":204.5,"i":12},{"t":210.99,"i":13},{"t":216.5,"i":15},{"t":225.61,"i":16},{"t":231.59,"i":17},{"t":234.56,"i":18},{"t":239.25,"i":19},{"t":244.06,"i":20},{"t":248.56,"i":21},{"t":252.61,"i":22},{"t":259.0,"i":23},{"t":267.1,"i":25},{"t":272.47,"i":26},{"t":278.05,"i":27},{"t":282.75,"i":28},{"t":286.89,"i":29},{"t":292.56,"i":30},{"t":299.06,"i":31},{"t":305.35,"i":32},{"t":310.7,"i":33},{"t":318.02,"i":34},{"t":324.65,"i":35},{"t":330.86,"i":36},{"t":335.93,"i":37},{"t":345.99,"i":38}],"count":40},{"id":23,"title":"周末家务分工","sub":"Weekend Chores","desc":"谁来洗碗、谁来拖地，一个家庭的分工难题","audio":"audio/talk23.mp3","duration":363.6,"size":2182268,"lines":[{"en":"Saturday morning, and I'm holding a mop. Something is very wrong with this picture.","zh":"周六早上，我手里拿着拖把。这画面很有问题。","w":"A"},{"en":"Chores, Jake. Every family has them. Even yours.","zh":"家务活，Jake。每个家庭都有。你家也一样。","w":"B"},{"en":"But why does 'chores' always mean 'Jake'?","zh":"但为什么'家务活'总等于'Jake'？","w":"A"},{"en":"The weekend. Two whole days. Unless, of course, your family has a chore chart. Then it's two days of tiny wars.","zh":"周末。整整两天。除非你家有一张家务分工表。那这两天就是两场小规模战争。","w":"H"},{"en":"Today, Jake discovers that in his house, nobody ever seems to be free when there's a dish in the sink.","zh":"今天，Jake 发现他家有个规律：只要水槽里有碗，就没人有空。","w":"H"},{"en":"So my mom made a chore chart. My name is on it five times. Five.","zh":"我妈做了张家务表。我的名字出现了五次。五次。","w":"A"},{"en":"What do you have to do?","zh":"你要干什么？","w":"B"},{"en":"Dishes, trash, my room, feeding the cat, and — get this — watering plants that aren't even real.","zh":"洗碗、倒垃圾、收拾房间、喂猫，还有——听好了——给一盆假花浇水。","w":"A"},{"en":"Wait, fake plants? Why would she water fake plants?","zh":"等等，假花？为什么要给假花浇水？","w":"B"},{"en":"Exactly! I asked her. She said, 'Because it's on your list, and the list doesn't water itself.'","zh":"就是啊！我问她。她说：'因为它在你的清单上，而清单不会自己浇水。'","w":"A"},{"en":"Your mom is... very organized.","zh":"你妈妈……非常有条理。","w":"B"},{"en":"Organized? She once made a schedule for our vacation. A vacation!","zh":"有条理？她给我们假期排过时间表。假期！","w":"A"},{"en":"Okay, that's next level. But chores aren't all bad, right?","zh":"好吧，那是天花板级别了。但家务也不全是坏事吧？","w":"B"},{"en":"Name one good thing about doing dishes.","zh":"说说洗碗有哪一点好。","w":"A"},{"en":"Clean plate for your next meal?","zh":"下一顿有干净的盘子？","w":"B"},{"en":"I could use the same plate twice.","zh":"我可以一个盘子用两顿。","w":"A"},{"en":"That's disgusting, and you know it.","zh":"这很恶心，而且你自己心里清楚。","w":"B"},{"en":"Here's how Jake's family finally settled the great chore debate.","zh":"下面这段，是 Jake 家最终怎么解决这场家务大辩论的。","w":"H"},{"en":"So how do you decide who does what?","zh":"那你们怎么决定谁干什么？","w":"B"},{"en":"We rotate. Every week, the names move one spot.","zh":"我们轮流。每周名字往下移一格。","w":"A"},{"en":"So nobody's stuck with dishes forever?","zh":"所以没人会一直洗碗？","w":"B"},{"en":"Right. Last week I had trash. This week dishes. Next week, my sister does it.","zh":"对。上周我倒垃圾。这周洗碗。下周换我姐。","w":"A"},{"en":"That's actually fair. Smart mom.","zh":"这样还挺公平。你妈妈挺聪明。","w":"B"},{"en":"Yeah... I kind of hate that she's right. But don't tell her I said that.","zh":"是啊……我有点讨厌她居然是对的。但别告诉她我这么说过。","w":"A"},{"en":"Deal. Now go water your fake plants.","zh":"成交。现在去给你那盆假花浇水吧。","w":"B"},{"en":"I regret telling you that.","zh":"我后悔告诉你了。","w":"A"},{"en":"Slow it down. Here are the handiest lines about sharing the housework.","zh":"放慢。来听几句关于分担家务最实用的表达。","w":"H"},{"en":"Every family has chores.","zh":"每个家庭都有家务活。","w":"H"},{"en":"My name is on it five times.","zh":"我的名字出现了五次。","w":"H"},{"en":"We rotate every week.","zh":"我们每周轮流。","w":"H"},{"en":"Nobody's stuck with dishes forever.","zh":"没人会一直洗碗。","w":"H"},{"en":"Something is very wrong with this picture.","zh":"这画面很不对劲。","w":"H"},{"en":"Get this.","zh":"听好了（引出重点）。","w":"H"},{"en":"That's next level.","zh":"那是天花板级别了。","w":"H"},{"en":"Name one good thing about...","zh":"说说……有哪一点好。","w":"H"},{"en":"We rotate.","zh":"我们轮流。","w":"H"},{"en":"Nobody's stuck with...","zh":"没人会一直……","w":"H"},{"en":"I kind of hate that she's right.","zh":"我有点讨厌她居然是对的。","w":"H"},{"en":"Don't tell her I said that.","zh":"别告诉她我这么说过。","w":"H"},{"en":"Your turn: in English, list two chores you do at home, and one chore you'd trade with a family member if you could.","zh":"轮到你了：用英语列出你在家做的两件家务，以及如果可以，你想跟家人交换的一件家务。","w":"H"},{"en":"Tomorrow, we open the door to the most dangerous room in the house — the one with clothes everywhere. See you on the next walk!","zh":"明天，我们推开家里最危险的那扇门——那间到处是衣服的房间。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.78,"i":1},{"t":11.16,"i":2},{"t":14.44,"i":3},{"t":26.2,"i":4},{"t":33.81,"i":5},{"t":39.26,"i":6},{"t":41.32,"i":7},{"t":49.72,"i":8},{"t":54.37,"i":9},{"t":62.22,"i":10},{"t":65.65,"i":11},{"t":71.0,"i":12},{"t":76.13,"i":13},{"t":79.08,"i":14},{"t":81.58,"i":15},{"t":84.31,"i":16},{"t":87.43,"i":17},{"t":92.5,"i":18},{"t":95.61,"i":19},{"t":100.32,"i":20},{"t":103.6,"i":21},{"t":110.2,"i":22},{"t":114.01,"i":23},{"t":118.96,"i":24},{"t":122.91,"i":25},{"t":125.29,"i":26},{"t":131.84,"i":41},{"t":138.61,"i":0},{"t":145.92,"i":1},{"t":152.75,"i":2},{"t":156.99,"i":5},{"t":163.89,"i":6},{"t":166.63,"i":7},{"t":177.18,"i":8},{"t":183.12,"i":9},{"t":193.0,"i":10},{"t":197.45,"i":11},{"t":204.23,"i":12},{"t":210.75,"i":13},{"t":214.6,"i":14},{"t":217.87,"i":15},{"t":221.44,"i":16},{"t":225.48,"i":18},{"t":229.53,"i":19},{"t":235.51,"i":20},{"t":239.77,"i":21},{"t":248.09,"i":22},{"t":253.0,"i":23},{"t":259.27,"i":24},{"t":264.35,"i":25},{"t":267.48,"i":27},{"t":272.92,"i":28},{"t":278.51,"i":29},{"t":283.66,"i":30},{"t":289.51,"i":31},{"t":298.17,"i":32},{"t":303.81,"i":33},{"t":310.41,"i":34},{"t":317.51,"i":35},{"t":323.44,"i":36},{"t":330.04,"i":37},{"t":338.01,"i":38},{"t":345.16,"i":39},{"t":353.79,"i":40}],"count":42},{"id":24,"title":"我的房间","sub":"My Messy Room","desc":"房间乱到找不着床，一场大扫除","audio":"audio/talk24.mp3","duration":355.5,"size":2133596,"lines":[{"en":"Mia, if you don't hear from me for a few days, send help. My room ate me.","zh":"Mia，如果接下来几天你联系不上我，快叫人来救我。我的房间把我吞了。","w":"A"},{"en":"Your room? You mean the place with the clothes mountain?","zh":"你的房间？你是说那座衣服山？","w":"B"},{"en":"It's not a mountain anymore. It's a whole range.","zh":"现在不是一座山了。是一整条山脉。","w":"A"},{"en":"Every home has one room where things go to disappear. For Jake, it's his bedroom. And today, it's finally time to face it.","zh":"每个家都有一个东西进去就消失的房间。对 Jake 来说，是他的卧室。而今天，终于要面对它了。","w":"H"},{"en":"Mia has offered to help. She may regret it.","zh":"Mia 主动提出帮忙。她可能会后悔。","w":"H"},{"en":"Okay. First, we find the floor. It's under there somewhere, right?","zh":"好。首先，我们找到地板。它应该就在下面某处，对吧？","w":"B"},{"en":"I think I remember seeing it once. It was a nice floor.","zh":"我记得我见过它一次。是块不错的地板。","w":"A"},{"en":"Let's do three piles: keep, throw away, and 'what even is this'.","zh":"我们分三堆：留着、扔掉，还有'这到底是个啥'。","w":"B"},{"en":"That third pile is going to be huge.","zh":"第三堆会非常巨大。","w":"A"},{"en":"What is this? A sock, a battery, and... is that a half-eaten sandwich?","zh":"这是什么？一只袜子、一节电池，还有……那是半个吃剩的三明治？","w":"B"},{"en":"Ah, I was wondering where that went.","zh":"啊，我正纳闷它去哪了。","w":"A"},{"en":"You were 'wondering'? About a sandwich from last month?","zh":"你居然还'纳闷'？上个月的三明治？","w":"B"},{"en":"In my defense, I was saving it. For science.","zh":"替自己说句公道话，我是留着它。为了科学。","w":"A"},{"en":"What science? The science of growing new life forms under your bed?","zh":"什么科学？在你床底下培育新生命形态的科学？","w":"B"},{"en":"That's... actually not far off.","zh":"这个……其实还挺接近。","w":"A"},{"en":"I'm going to need gloves. And possibly a mask.","zh":"我需要手套。可能还得要个口罩。","w":"B"},{"en":"Two hours later, the room looks different. Here's what Jake learned about the magic of a clean space.","zh":"两小时后，房间变了个样。听听 Jake 从整洁空间里学到了什么。","w":"H"},{"en":"See? Look at it now. You can see the desk. You can open the window.","zh":"看吧？现在看看。书桌能看见了。窗户能打开了。","w":"B"},{"en":"It's... weirdly nice. I keep wanting to sit in here.","zh":"这……莫名地舒服。我老想待在这屋里。","w":"A"},{"en":"Told you. A clean room is a calm room.","zh":"早跟你说了。干净的房间，心里也清净。","w":"B"},{"en":"Okay, fine. But the real test is tomorrow. Can it stay like this for one week?","zh":"行吧，算你说得对。但真正的考验在明天。它能保持一周吗？","w":"A"},{"en":"It can, if you stop treating your floor like a second closet.","zh":"能，只要你别再把地板当第二个衣柜。","w":"B"},{"en":"That's a lifestyle choice, Mia. Respect it.","zh":"那是一种生活方式选择，Mia。请尊重。","w":"A"},{"en":"It's a fire hazard, Jake. Pick up the backpack.","zh":"那是个消防隐患，Jake。把书包捡起来。","w":"B"},{"en":"Slow down. Here are the lines you'll actually use when you clean your own room.","zh":"放慢。来听几句你收拾自己房间时真会用到的表达。","w":"H"},{"en":"We find the floor first.","zh":"我们先找到地板。","w":"H"},{"en":"Three piles: keep, throw away, and 'what even is this'.","zh":"分三堆：留着、扔掉、'这到底是个啥'。","w":"H"},{"en":"A clean room is a calm room.","zh":"干净的房间，心里也清净。","w":"H"},{"en":"Stop treating your floor like a second closet.","zh":"别再把地板当第二个衣柜。","w":"H"},{"en":"My room ate me.","zh":"我的房间把我吞了（夸张）。","w":"H"},{"en":"I was wondering where that went.","zh":"我正纳闷它去哪了。","w":"H"},{"en":"In my defense, I was saving it.","zh":"替自己说句公道话，我是留着它。","w":"H"},{"en":"Not far off.","zh":"还挺接近。","w":"H"},{"en":"It's weirdly nice.","zh":"莫名地舒服。","w":"H"},{"en":"Told you.","zh":"早跟你说了。","w":"H"},{"en":"The real test is tomorrow.","zh":"真正的考验在明天。","w":"H"},{"en":"Pick up the backpack.","zh":"把书包捡起来。","w":"H"},{"en":"Your turn: in English, describe one thing in your room you should throw away, and one thing you'd never get rid of.","zh":"轮到你了：用英语描述你房间里一件该扔掉的东西，和一件你永远不会丢的东西。","w":"H"},{"en":"Tomorrow, we gather around the table for the loudest meal of the week — family dinner. See you on the next walk!","zh":"明天，我们围坐在餐桌旁，吃一周里最热闹的那顿饭——家庭聚餐。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":5.88,"i":1},{"t":10.0,"i":2},{"t":13.6,"i":3},{"t":24.74,"i":4},{"t":30.0,"i":5},{"t":35.66,"i":6},{"t":39.86,"i":7},{"t":45.59,"i":8},{"t":48.69,"i":9},{"t":54.92,"i":10},{"t":57.92,"i":11},{"t":62.31,"i":12},{"t":66.49,"i":13},{"t":71.72,"i":14},{"t":74.67,"i":15},{"t":79.39,"i":16},{"t":87.79,"i":17},{"t":94.13,"i":18},{"t":98.18,"i":19},{"t":102.28,"i":20},{"t":108.38,"i":21},{"t":113.1,"i":22},{"t":116.82,"i":23},{"t":121.28,"i":24},{"t":128.25,"i":39},{"t":135.02,"i":0},{"t":142.45,"i":1},{"t":147.74,"i":2},{"t":152.38,"i":5},{"t":159.57,"i":6},{"t":164.96,"i":7},{"t":172.22,"i":8},{"t":176.24,"i":9},{"t":184.12,"i":10},{"t":188.02,"i":11},{"t":193.63,"i":12},{"t":198.97,"i":13},{"t":205.6,"i":14},{"t":209.43,"i":15},{"t":215.47,"i":17},{"t":223.47,"i":18},{"t":228.67,"i":19},{"t":233.91,"i":20},{"t":241.63,"i":21},{"t":247.64,"i":22},{"t":252.43,"i":23},{"t":258.13,"i":25},{"t":263.4,"i":26},{"t":271.38,"i":27},{"t":276.77,"i":28},{"t":283.34,"i":29},{"t":289.44,"i":30},{"t":297.02,"i":31},{"t":305.52,"i":32},{"t":311.73,"i":33},{"t":318.43,"i":34},{"t":323.85,"i":35},{"t":331.27,"i":36},{"t":337.97,"i":37},{"t":346.3,"i":38}],"count":40},{"id":25,"title":"家庭聚餐","sub":"Family Dinner","desc":"一桌菜、一大家子，饭桌上的热闹与规矩","audio":"audio/talk25.mp3","duration":354.2,"size":2125676,"lines":[{"en":"You will not believe what happened at dinner last night.","zh":"你绝对猜不到昨晚吃饭时发生了什么。","w":"A"},{"en":"Let me guess. Your little brother spilled something again?","zh":"我猜猜。你弟弟又打翻东西了？","w":"B"},{"en":"Worse. My grandma came to visit, and she brought... questions.","zh":"更糟。我奶奶来了，她带来了……各种问题。","w":"A"},{"en":"Family dinner. The food is warm, the table is full, and somebody is always asking too many questions. Today, it's Jake's turn to survive one.","zh":"家庭聚餐。饭菜是热的，桌子是满的，而且总有一个人问题太多。今天轮到 Jake 撑过这一顿了。","w":"H"},{"en":"If you've ever had a grandparent at the table, you already know what's coming.","zh":"如果你饭桌上也有过祖辈，你早就知道接下来会发生什么。","w":"H"},{"en":"Okay, what did she ask?","zh":"好吧，她问什么了？","w":"B"},{"en":"Everything. 'Why are you so thin? Are you eating? Why is your hair like that? Do you have a girlfriend yet?'","zh":"所有问题。'你怎么这么瘦？你吃饭吗？你头发怎么弄成这样？有女朋友了吗？'","w":"A"},{"en":"Classic grandma. What did you say?","zh":"典型的奶奶。你怎么答的？","w":"B"},{"en":"I said, 'Grandma, I'm fourteen.' She said, 'And? Your grandpa proposed at sixteen.'","zh":"我说：'奶奶，我才十四。'她说：'那又怎样？你爷爷十六岁就求婚了。'","w":"A"},{"en":"No way. Sixteen?","zh":"不会吧。十六岁？","w":"B"},{"en":"That's what she says. She also says the soup was better in her day.","zh":"她是这么说的。她还说她那个年代的汤更好喝。","w":"A"},{"en":"Is the soup ever good enough for grandmas?","zh":"奶奶们觉得汤有够好喝过吗？","w":"B"},{"en":"Never. It's a law of the universe.","zh":"从来没有。这是宇宙定律。","w":"A"},{"en":"Well, at least you got fed. Grandmas never let you leave the table hungry.","zh":"不过至少你吃饱了。奶奶们从不让你饿着离开饭桌。","w":"B"},{"en":"True. She piled my plate so high I couldn't see my dad across the table.","zh":"确实。她给我盛的菜堆得老高，隔着桌子都看不见我爸。","w":"A"},{"en":"But dinner wasn't just questions. The best part came at the end, when grandma told stories.","zh":"不过晚餐不只有问题。最好的部分在最后，奶奶讲起了故事。","w":"H"},{"en":"Did she tell any good stories?","zh":"她讲什么好故事了吗？","w":"B"},{"en":"The best. About my dad as a kid — he once got stuck in a tree chasing a kite.","zh":"太精彩了。讲我爸小时候——有次追风筝，结果卡在树上下不来。","w":"A"},{"en":"Your dad? Stuck in a tree? I need details.","zh":"你爸？卡在树上？我需要细节。","w":"B"},{"en":"He was up there for two hours. The whole neighborhood came to watch.","zh":"他在上面待了两小时。整个街坊都来看热闹。","w":"A"},{"en":"Now I see where you get it from.","zh":"现在我算知道你遗传谁了。","w":"B"},{"en":"Hey, I've never been stuck in a tree. I've been stuck in other places.","zh":"喂，我可从没卡在树上过。我卡的是别的地方。","w":"A"},{"en":"Like your own room, last week.","zh":"比如上周，你自己的房间。","w":"B"},{"en":"We agreed to never speak of that again.","zh":"我们说好再也不提那事的。","w":"A"},{"en":"We agreed to no such thing.","zh":"我可没跟你这么约定过。","w":"B"},{"en":"Slow it down. Here are the phrases that come up at every family table.","zh":"放慢。来听几句每个家庭饭桌上都会出现的表达。","w":"H"},{"en":"What did she ask?","zh":"她问什么了？","w":"H"},{"en":"You will not believe what happened.","zh":"你绝对猜不到发生了什么。","w":"H"},{"en":"At least you got fed.","zh":"至少你吃饱了。","w":"H"},{"en":"Now I see where you get it from.","zh":"现在我算知道你遗传谁了。","w":"H"},{"en":"She brought... questions.","zh":"她带来了……各种问题。","w":"H"},{"en":"Classic grandma.","zh":"典型的奶奶。","w":"H"},{"en":"And? ","zh":"那又怎样？","w":"H"},{"en":"It's a law of the universe.","zh":"这是宇宙定律。","w":"H"},{"en":"She never lets you leave hungry.","zh":"她从不让你饿着离开。","w":"H"},{"en":"I need details.","zh":"我需要细节。","w":"H"},{"en":"The whole neighborhood came to watch.","zh":"整个街坊都来看热闹。","w":"H"},{"en":"We agreed to never speak of that again.","zh":"我们说好再也不提那事了。","w":"H"},{"en":"Your turn: in English, describe your favorite dish at a family dinner, and who usually makes it.","zh":"轮到你了：用英语描述家庭聚餐里你最喜欢的一道菜，以及通常是谁做的。","w":"H"},{"en":"Tomorrow, we talk about the people who share your bedroom and borrow your things without asking — brothers and sisters. See you on the next walk!","zh":"明天，我们聊聊跟你住一个房间、还不打招呼就借你东西的人——兄弟姐妹。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":3.67,"i":1},{"t":8.2,"i":2},{"t":13.65,"i":3},{"t":26.16,"i":4},{"t":31.85,"i":5},{"t":34.87,"i":6},{"t":42.09,"i":7},{"t":45.59,"i":8},{"t":53.41,"i":9},{"t":56.29,"i":10},{"t":61.04,"i":11},{"t":64.18,"i":12},{"t":67.54,"i":13},{"t":73.68,"i":14},{"t":79.35,"i":15},{"t":87.48,"i":16},{"t":90.15,"i":17},{"t":96.53,"i":18},{"t":101.42,"i":19},{"t":106.08,"i":20},{"t":108.79,"i":21},{"t":113.92,"i":22},{"t":116.73,"i":23},{"t":119.77,"i":24},{"t":122.43,"i":25},{"t":129.04,"i":40},{"t":135.81,"i":0},{"t":140.52,"i":1},{"t":146.3,"i":2},{"t":153.2,"i":5},{"t":157.12,"i":6},{"t":166.23,"i":7},{"t":170.73,"i":8},{"t":180.56,"i":9},{"t":184.31,"i":10},{"t":190.37,"i":11},{"t":194.44,"i":12},{"t":198.77,"i":13},{"t":206.54,"i":14},{"t":213.7,"i":16},{"t":217.19,"i":17},{"t":225.27,"i":18},{"t":231.5,"i":19},{"t":237.44,"i":20},{"t":240.98,"i":21},{"t":247.52,"i":22},{"t":251.18,"i":23},{"t":255.12,"i":24},{"t":258.62,"i":26},{"t":263.38,"i":27},{"t":268.8,"i":28},{"t":273.88,"i":29},{"t":279.3,"i":30},{"t":287.0,"i":31},{"t":293.19,"i":32},{"t":298.06,"i":33},{"t":305.31,"i":34},{"t":312.99,"i":35},{"t":319.54,"i":36},{"t":327.44,"i":37},{"t":335.84,"i":38},{"t":343.5,"i":39}],"count":41},{"id":26,"title":"兄弟姐妹","sub":"Brothers & Sisters","desc":"有兄弟姐妹的烦恼与甜蜜","audio":"audio/talk26.mp3","duration":373.0,"size":2238572,"lines":[{"en":"Mia, do you have a sibling?","zh":"Mia，你有兄弟姐妹吗？","w":"A"},{"en":"One older sister. Why? Yours driving you crazy again?","zh":"一个姐姐。怎么了？你家的又把你逼疯了？","w":"B"},{"en":"She borrowed my favorite hoodie. Three weeks ago. It's gone, Mia. Gone.","zh":"她借走了我最爱的卫衣。三周前。它没了，Mia。没了。","w":"A"},{"en":"Brothers and sisters. They know your passwords, your weak spots, and exactly where you hide your snacks. Today, Jake has reached his limit.","zh":"兄弟姐妹。他们知道你的密码、你的软肋，还有你藏零食的确切位置。今天，Jake 忍到极限了。","w":"H"},{"en":"But as usual, there are two sides to every story.","zh":"但和往常一样，每件事都有两面。","w":"H"},{"en":"Gone as in... she lost it? Or gone as in she loves it so much she 'forgot' to give it back?","zh":"'没了'是指……她弄丢了？还是她太喜欢，所以'忘了'还？","w":"B"},{"en":"Both. First the second one, then the first one.","zh":"都是。先是第二种，后来变成第一种。","w":"A"},{"en":"Classic older sibling move. My sister does the same with my headphones.","zh":"经典的姐姐操作。我姐对我耳机也这样。","w":"B"},{"en":"The worst part? When I ask for it back, I'm the bad guy.","zh":"最气人的是？当我开口要回来的时候，反倒成了我的不是。","w":"A"},{"en":"Right? 'You never share!' Like I'm the problem.","zh":"可不是嘛？'你从不分享！'搞得像我才是问题。","w":"B"},{"en":"I share! I shared the hoodie, didn't I? Look where that got me.","zh":"我分享了啊！卫衣不就分享了吗？看看我落得什么下场。","w":"A"},{"en":"Okay, but here's the thing. Would you trade her for anything?","zh":"好，但问题是。你愿意用任何东西换掉她吗？","w":"B"},{"en":"What? No. Obviously not.","zh":"什么？不。当然不会。","w":"A"},{"en":"See? That's siblings. They drive you crazy, but they're yours.","zh":"看吧？这就是兄弟姐妹。他们让你抓狂，但他们是你的。","w":"B"},{"en":"Don't go getting deep on me while I'm still angry.","zh":"我还在气头上，你别突然跟我走心。","w":"A"},{"en":"I'm just saying. Now about the hoodie — have you checked her chair? She always drapes it there.","zh":"我只是说说。至于卫衣——你翻过她椅子吗？她总爱搭在那上面。","w":"B"},{"en":"Her chair. You might be onto something.","zh":"她的椅子。你这话可能有道理。","w":"A"},{"en":"The hoodie was, in fact, on the chair. Here's how Jake handled the 'getting it back' part.","zh":"卫衣确实在椅子上。听听 Jake 是怎么处理'要回来'这个环节的。","w":"H"},{"en":"So? Did you get it back?","zh":"所以呢？要回来了吗？","w":"B"},{"en":"I did. But first I had to listen to a ten-minute speech about how sharing is caring.","zh":"要回来了。但先听了十分钟'分享就是关爱'的演讲。","w":"A"},{"en":"And how did you respond?","zh":"那你怎么回应的？","w":"B"},{"en":"I said, 'Sharing is caring, so care about giving it back.'","zh":"我说：'分享就是关爱，那你就关爱关爱，把东西还我。'","w":"A"},{"en":"That's actually pretty good. Did she laugh?","zh":"这话其实挺妙。她笑了吗？","w":"B"},{"en":"She laughed, threw the hoodie at my face, and said I'm 'so dramatic'.","zh":"她笑了，把卫衣甩我脸上，说我'真够夸张的'。","w":"A"},{"en":"Sounds about right. Siblings, man.","zh":"差不多就这味儿。兄弟姐妹嘛。","w":"B"},{"en":"Siblings.","zh":"兄弟姐妹。","w":"A"},{"en":"Slow down. Here are the phrases that every sibling knows by heart.","zh":"放慢。来听几句每个有兄弟姐妹的人都烂熟于心的表达。","w":"H"},{"en":"Do you have a sibling?","zh":"你有兄弟姐妹吗？","w":"H"},{"en":"She borrowed my favorite hoodie.","zh":"她借走了我最爱的卫衣。","w":"H"},{"en":"They drive you crazy, but they're yours.","zh":"他们让你抓狂，但他们是你的。","w":"H"},{"en":"Sharing is caring.","zh":"分享就是关爱。","w":"H"},{"en":"Yours driving you crazy again?","zh":"你家的又把你逼疯了？","w":"H"},{"en":"She 'forgot' to give it back.","zh":"她'忘了'还。","w":"H"},{"en":"Classic older sibling move.","zh":"经典的姐姐操作。","w":"H"},{"en":"When I ask, I'm the bad guy.","zh":"我一开口要，就成了我的不是。","w":"H"},{"en":"Would you trade her for anything?","zh":"你愿意用任何东西换掉她吗？","w":"H"},{"en":"Don't get deep on me.","zh":"别突然跟我走心。","w":"H"},{"en":"You might be onto something.","zh":"你这话可能有道理。","w":"H"},{"en":"So dramatic.","zh":"真够夸张的。","w":"H"},{"en":"Your turn: in English, describe one annoying thing and one great thing about a sibling (or a close friend if you're an only child).","zh":"轮到你了：用英语描述兄弟姐妹（或独生子女的密友）身上一件烦人的事，和一件很棒的事。","w":"H"},{"en":"Tomorrow, we head to the supermarket with a very specific mission — and a very long shopping list. See you on the next walk!","zh":"明天，我们带着一项明确任务，和一张很长的购物清单，去逛超市。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":2.54,"i":1},{"t":8.08,"i":2},{"t":13.82,"i":3},{"t":25.92,"i":4},{"t":30.65,"i":5},{"t":37.63,"i":6},{"t":41.8,"i":7},{"t":47.85,"i":8},{"t":52.24,"i":9},{"t":56.82,"i":10},{"t":61.52,"i":11},{"t":66.3,"i":12},{"t":69.68,"i":13},{"t":75.65,"i":14},{"t":79.2,"i":15},{"t":86.11,"i":16},{"t":89.25,"i":17},{"t":97.2,"i":18},{"t":100.22,"i":19},{"t":106.2,"i":20},{"t":108.71,"i":21},{"t":113.75,"i":22},{"t":117.59,"i":23},{"t":122.96,"i":24},{"t":126.78,"i":25},{"t":128.46,"i":26},{"t":134.89,"i":41},{"t":141.66,"i":0},{"t":144.99,"i":1},{"t":152.01,"i":2},{"t":159.27,"i":5},{"t":168.06,"i":6},{"t":173.43,"i":7},{"t":181.07,"i":8},{"t":186.7,"i":9},{"t":192.57,"i":10},{"t":198.55,"i":11},{"t":204.64,"i":12},{"t":209.02,"i":13},{"t":216.57,"i":14},{"t":221.14,"i":15},{"t":229.84,"i":16},{"t":233.93,"i":18},{"t":237.85,"i":19},{"t":245.43,"i":20},{"t":248.73,"i":21},{"t":255.12,"i":22},{"t":260.05,"i":23},{"t":266.86,"i":24},{"t":271.77,"i":25},{"t":274.03,"i":27},{"t":278.75,"i":28},{"t":284.12,"i":29},{"t":290.35,"i":30},{"t":295.17,"i":31},{"t":302.92,"i":32},{"t":310.27,"i":33},{"t":317.95,"i":34},{"t":326.03,"i":35},{"t":333.23,"i":36},{"t":339.79,"i":37},{"t":346.94,"i":38},{"t":353.23,"i":39},{"t":362.86,"i":40}],"count":42},{"id":27,"title":"帮妈妈买菜","sub":"Grocery Run","desc":"第一次独自去超市，清单上都是谜语","audio":"audio/talk27.mp3","duration":387.6,"size":2326412,"lines":[{"en":"My mom just gave me the shopping list. I think it's written in code.","zh":"我妈刚把购物清单给我。我觉得那是用密码写的。","w":"A"},{"en":"Let me see. 'Tomatoes, not too soft. Green onions, a bunch. Soy sauce, the one with the red cap.' That's not code, that's a mom list.","zh":"我看看。'西红柿，别太软。小葱，一把。酱油，红盖的那种。'这不是密码，这是妈妈式清单。","w":"B"},{"en":"But there's twenty more lines just like that!","zh":"但后面还有二十行都是这种！","w":"A"},{"en":"The grocery run. Your mom hands you a list, a few bills, and a lot of instructions. And somehow, you're supposed to get it all right.","zh":"买菜任务。妈妈递给你一张清单、几张钞票，还有一大堆嘱咐。而你居然要全都买对。","w":"H"},{"en":"Today, Jake is sent to the supermarket alone for the first time. Mia tags along for moral support — and snacks.","zh":"今天，Jake 第一次被派去超市独自采购。Mia 陪他去打气——顺便买零食。","w":"H"},{"en":"Okay, first rule of grocery shopping: never go hungry. Here, grab a basket.","zh":"好，买菜第一定律：绝不能饿着肚子逛。来，拿个篮子。","w":"B"},{"en":"Why not a cart? The list is huge.","zh":"为什么不用推车？清单很长啊。","w":"A"},{"en":"Basket keeps you honest. You only buy what you can carry.","zh":"篮子让你保持清醒。你只能买你拎得动的东西。","w":"B"},{"en":"That's... weirdly smart.","zh":"这……莫名地聪明。","w":"A"},{"en":"Now, the tomatoes. Feel them, but don't squish them. My mom says squeezing ruins them.","zh":"现在，西红柿。摸一摸，但别捏。我妈说捏了会坏。","w":"B"},{"en":"Got it. Soft but not squishy. What's next?","zh":"明白。软但不烂。下一个？","w":"A"},{"en":"Soy sauce, red cap. Not the green one — that's the expensive one.","zh":"酱油，红盖。别拿绿盖的——那个贵。","w":"B"},{"en":"How do you know all this?","zh":"你怎么什么都知道？","w":"A"},{"en":"Years of being sent to the store. It's a rite of passage, Jake. Welcome.","zh":"因为被派去买了好几年。这是一种成长仪式，Jake。欢迎加入。","w":"B"},{"en":"The mission hit one small snag at the checkout. Here's what happened.","zh":"结账时出了点小岔子。听听发生了什么。","w":"H"},{"en":"We're at the checkout and... I'm short. Like, short on money.","zh":"我们在收银台，然后……我钱不够了。就差一点。","w":"A"},{"en":"How short?","zh":"差多少？","w":"B"},{"en":"Five yuan. I must have dropped it, or my mom can't count. Probably me.","zh":"五块钱。我可能弄丢了，也可能是我妈算错。多半是我。","w":"A"},{"en":"Here, I'll cover it. You can pay me back in snacks later.","zh":"给，我先垫上。回头你用零食还我。","w":"B"},{"en":"You're a lifesaver. Remind me to never doubt your grocery wisdom again.","zh":"你真是救命恩人。以后我再也不怀疑你的买菜智慧了。","w":"A"},{"en":"Oh, you will. Everyone does. It's the circle of grocery life.","zh":"哦，你会的。大家都这样。这是买菜的循环人生。","w":"B"},{"en":"Okay, but the real question — did I get everything on the list?","zh":"好吧，但真正的问题是——清单上的东西我买齐了吗？","w":"A"},{"en":"Let's check. Tomatoes, onions, soy sauce... eggs. Jake. Where are the eggs?","zh":"我们对对。西红柿、洋葱、酱油……鸡蛋。Jake。鸡蛋呢？","w":"B"},{"en":"...The eggs.","zh":"……鸡蛋。","w":"A"},{"en":"The eggs, Jake.","zh":"鸡蛋，Jake。","w":"B"},{"en":"I'll go back. Don't tell my mom about the five yuan.","zh":"我回去拿。那五块钱的事别告诉我妈。","w":"A"},{"en":"Slow down. Here are the phrases you'll need on your own grocery run.","zh":"放慢。来听几句你自己去买菜时会用到的表达。","w":"H"},{"en":"She gave me the shopping list.","zh":"她把购物清单给我了。","w":"H"},{"en":"Grab a basket.","zh":"拿个篮子。","w":"H"},{"en":"I'm short on money.","zh":"我钱不够了。","w":"H"},{"en":"Did I get everything on the list?","zh":"清单上的东西我买齐了吗？","w":"H"},{"en":"It's written in code.","zh":"那是用密码写的。","w":"H"},{"en":"A mom list.","zh":"妈妈式清单。","w":"H"},{"en":"First rule of grocery shopping.","zh":"买菜第一定律。","w":"H"},{"en":"It's a rite of passage.","zh":"这是一种成长仪式。","w":"H"},{"en":"I'm short.","zh":"我钱不够了。","w":"H"},{"en":"I'll cover it.","zh":"我先垫上。","w":"H"},{"en":"You're a lifesaver.","zh":"你真是救命恩人。","w":"H"},{"en":"Don't tell my mom.","zh":"别告诉我妈。","w":"H"},{"en":"Your turn: in English, list three things you'd buy at the supermarket, and describe one of them so someone could pick it out for you.","zh":"轮到你了：用英语列出你要在超市买的三样东西，并描述其中一样，让另一个人能照着帮你挑出来。","w":"H"},{"en":"Tomorrow, we race against the clock — the bell is about to ring, and Jake is still three blocks away. See you on the next walk!","zh":"明天，我们跟时间赛跑——上课铃快响了，Jake 还在三条街外。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":4.63,"i":1},{"t":16.7,"i":2},{"t":19.96,"i":3},{"t":31.44,"i":4},{"t":40.89,"i":5},{"t":48.14,"i":6},{"t":51.45,"i":7},{"t":56.2,"i":8},{"t":58.65,"i":9},{"t":66.52,"i":10},{"t":70.83,"i":11},{"t":76.52,"i":12},{"t":78.61,"i":13},{"t":84.89,"i":14},{"t":91.35,"i":15},{"t":96.24,"i":16},{"t":98.07,"i":17},{"t":103.75,"i":18},{"t":108.29,"i":19},{"t":113.59,"i":20},{"t":119.23,"i":21},{"t":123.9,"i":22},{"t":131.7,"i":23},{"t":133.48,"i":24},{"t":135.68,"i":25},{"t":139.74,"i":26},{"t":146.03,"i":41},{"t":152.8,"i":0},{"t":158.71,"i":1},{"t":173.8,"i":2},{"t":178.01,"i":5},{"t":187.14,"i":6},{"t":191.43,"i":7},{"t":197.49,"i":8},{"t":200.69,"i":9},{"t":210.59,"i":10},{"t":216.12,"i":11},{"t":223.31,"i":12},{"t":226.08,"i":13},{"t":234.04,"i":15},{"t":240.27,"i":16},{"t":242.73,"i":17},{"t":249.94,"i":18},{"t":255.73,"i":19},{"t":262.47,"i":20},{"t":269.61,"i":21},{"t":275.57,"i":22},{"t":285.37,"i":23},{"t":287.76,"i":24},{"t":290.7,"i":25},{"t":295.9,"i":27},{"t":301.34,"i":28},{"t":306.11,"i":29},{"t":310.92,"i":30},{"t":316.41,"i":31},{"t":322.79,"i":32},{"t":328.87,"i":33},{"t":336.83,"i":34},{"t":343.94,"i":35},{"t":349.58,"i":36},{"t":355.39,"i":37},{"t":361.84,"i":38},{"t":368.2,"i":39},{"t":377.4,"i":40}],"count":42},{"id":28,"title":"迟到风波","sub":"Late Again!","desc":"一路狂奔，还是差一步进教室","audio":"audio/talk28.mp3","duration":393.1,"size":2359244,"lines":[{"en":"Mia. The bell rings in four minutes. I'm still at the corner store. Tell me it's not over.","zh":"Mia。四分钟后上课铃响。我还在街角便利店。告诉我还有救。","w":"A"},{"en":"Corner store? Jake, what are you even doing there?","zh":"便利店？Jake，你去那儿干嘛？","w":"B"},{"en":"I forgot my lunch. And my homework. And, apparently, my sense of time.","zh":"我忘了带午饭。忘了带作业。看来也忘了带时间观念。","w":"A"},{"en":"Being late. It happens to everyone, but some of us turn it into an art form. Today, Jake attempts the four-minute dash.","zh":"迟到。谁都经历过，但有人把它玩成了艺术。今天，Jake 挑战四分钟冲刺。","w":"H"},{"en":"Spoiler: it does not go as planned.","zh":"剧透：事情没按计划走。","w":"H"},{"en":"Forget the corner store. Just run. What's your plan?","zh":"别管便利店了。快跑。你打算怎么办？","w":"B"},{"en":"Run to the crossing, hope the light is green, then sprint the last block.","zh":"跑到路口，盼着是绿灯，然后最后一段冲刺。","w":"A"},{"en":"That's not a plan, that's a wish.","zh":"那不是计划，那叫许愿。","w":"B"},{"en":"I'll take a wish. It's all I have!","zh":"有愿可许就不错了。我只有这个了！","w":"A"},{"en":"Okay, update me at the gate. If you make it, you owe me a story.","zh":"好，到校门口再跟我说。要是赶上了，你欠我一个故事。","w":"B"},{"en":"Deal. Oh no — the crossing guard is holding everyone. The light is red. Of course it's red.","zh":"成交。哦不——护导员把大家拦住了。是红灯。果然是红灯。","w":"A"},{"en":"Deep breaths. Once it turns green, you've got maybe thirty seconds.","zh":"深呼吸。一变绿，你大概有三十秒。","w":"B"},{"en":"It's green! I'm running. I can see the gate. This might actually work!","zh":"绿了！我在跑。能看见校门了。这次可能真行！","w":"A"},{"en":"Go, go, go!","zh":"冲，冲，冲！","w":"B"},{"en":"I'm here! I'm... at the gate. And the bell just rang. I missed it by five seconds.","zh":"我到了！我……到校门口了。而铃刚刚响。就差五秒。","w":"A"},{"en":"Five seconds. So close. Here's what happened at the classroom door.","zh":"五秒。就差一点。听听教室门口发生了什么。","w":"H"},{"en":"Five seconds? That's brutal. What did the teacher say?","zh":"五秒？太惨了。老师怎么说？","w":"B"},{"en":"She looked at me, at her watch, and said, 'Nice of you to join us, Jake.'","zh":"她看看我，又看看表，说：'Jake，您肯来上课，我们不胜荣幸。'","w":"A"},{"en":"Ouch. The watch look. That's the worst.","zh":"哎哟。看一眼手表。那最扎心。","w":"B"},{"en":"I said, 'I'm sorry, I was helping a lost dog.' It wasn't even true, and she knew it.","zh":"我说：'对不起，我在帮一条走丢的狗。'这根本不是真的，她也知道。","w":"A"},{"en":"You used the lost dog excuse? That's like, the oldest one in the book.","zh":"你居然用'帮走丢的狗'当借口？那都是最老套的了。","w":"B"},{"en":"In my panic, my brain served me a classic. I'm not proud.","zh":"我一慌，脑子给我上了个老古董。我不以此为荣。","w":"A"},{"en":"Well, lesson learned: pack your bag the night before. Or, you know, just be honest.","zh":"总之，教训就是：前一晚把书包收拾好。或者，干脆老实交代。","w":"B"},{"en":"Honesty. Right. I'll try that next time — in about two weeks, when I'm late again.","zh":"老实交代。行。下次我试试——大概两周后，我再次迟到的时候。","w":"A"},{"en":"Slow it down. Here are the phrases you'll want when the clock is against you.","zh":"放慢。来听几句当时间跟你作对时你会用到的表达。","w":"H"},{"en":"The bell rings in four minutes.","zh":"四分钟后上课铃响。","w":"H"},{"en":"What's your plan?","zh":"你打算怎么办？","w":"H"},{"en":"I missed it by five seconds.","zh":"就差五秒。","w":"H"},{"en":"Nice of you to join us.","zh":"您肯来，我们不胜荣幸（反讽）。","w":"H"},{"en":"Tell me it's not over.","zh":"告诉我还有救。","w":"H"},{"en":"What are you even doing there?","zh":"你去那儿干嘛？","w":"H"},{"en":"That's not a plan, that's a wish.","zh":"那不是计划，那叫许愿。","w":"H"},{"en":"You owe me a story.","zh":"你欠我一个故事。","w":"H"},{"en":"This might actually work.","zh":"这次可能真行。","w":"H"},{"en":"The watch look.","zh":"看一眼手表（的那一下）。","w":"H"},{"en":"The oldest one in the book.","zh":"最老套的那种。","w":"H"},{"en":"Lesson learned.","zh":"教训记住了。","w":"H"},{"en":"Your turn: in English, explain to someone why you were late — but this time, tell the truth, in three sentences.","zh":"轮到你了：用英语向别人解释你为什么迟到——但这次，说真话，用三句话。","w":"H"},{"en":"Tomorrow, the classroom gets rearranged, and suddenly everyone has an opinion about where to sit. See you on the next walk!","zh":"明天，教室要重新排座位，突然之间人人都对坐哪儿有自己的看法。下次散步见！","w":"H"},{"en":"All right — one more time, slower. Listen and repeat after me.","zh":"好——再放一遍，这次更慢。听着，跟着一起说。","w":"H"}],"cues":[{"t":0.0,"i":0},{"t":6.65,"i":1},{"t":10.89,"i":2},{"t":16.84,"i":3},{"t":27.57,"i":4},{"t":31.65,"i":5},{"t":36.64,"i":6},{"t":42.55,"i":7},{"t":45.83,"i":8},{"t":48.9,"i":9},{"t":54.4,"i":10},{"t":61.76,"i":11},{"t"
